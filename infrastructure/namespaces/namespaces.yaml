# SecForge Local Edition — Namespace inventory
#
# Every namespace carries:
#   - Labels declaring its component and edition
#   - A ResourceQuota capping CPU / memory / pod count
#   - A LimitRange providing default requests/limits so untagged pods
#     cannot evade the quota
#
# Apply with:
#   kubectl apply -f infrastructure/namespaces/namespaces.yaml
#
# See docs/06-reference/namespaces.md for the rationale behind each sizing.

---
# ============================================================================
# cert-manager
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    secforge.platform/component: cert-manager
    secforge.platform/edition: local
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: cert-manager
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: cert-manager
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi

