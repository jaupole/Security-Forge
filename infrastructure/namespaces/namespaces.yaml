# ============================================================================
# observability (Prometheus, Grafana, Loki, Tempo, OTel)
# ============================================================================
# PSA: `privileged` because node-exporter binds hostNetwork+hostPort and
# mounts /proc, /sys, / via hostPath — the same exemption pattern used by
# `ingress-nginx`. The remaining observability components (Grafana,
# Prometheus, Alertmanager, Loki, Tempo, OTel, kube-state-metrics) set
# their own restricted-compliant securityContext via chart values; the
# Kyverno cluster policy `enforce-pod-security-restricted` excludes this
# namespace (see infrastructure/kyverno/policies/pod-security.yaml) so
# only the node-exporter exemption is the practical effect.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    secforge.platform/component: observability
    secforge.platform/edition: local
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: observability
spec:
  hard:
    # Bumped Phase 7.3 — full obs stack (Prometheus + Grafana + Alertmanager
    # + Loki + Tempo + OTel + node-exporter + kube-state-metrics + chart
    # admission hooks) doesn't fit in 6Gi limit / 4Gi request. Bumped
    # again in 7.5 — Tempo+OTel push CPU limits over 6.
    requests.cpu: "3"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 10Gi
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: observability
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi

