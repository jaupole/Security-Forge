    # Sized for: Keycloak (1 CPU / 1Gi limit), Keycloak Operator (700m / 450Mi),
    # Postgres primary (~500m / 512Mi), and headroom for two concurrent
    # KeycloakRealmImport Jobs (operator inherits Keycloak's pod template,
    # so each import requests ~1700Mi memory). Bumped from 2Gi/4Gi after
    # Phase 3.4 imports were quota-blocked.
    requests.cpu: "2"
    requests.memory: 6Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: keycloak
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 200m
        memory: 512Mi

