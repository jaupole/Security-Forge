# Phase 7.6 — SpiceDB ServiceMonitor.
#
# SpiceDB exposes /metrics on port 9090 when metricsEnabled: true is set on
# the SpiceDBCluster CR (already configured).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spicedb
  namespace: spicedb
  labels:
    release: kps
    app.kubernetes.io/name: spicedb
    app.kubernetes.io/part-of: secforge-platform
spec:
  selector:
    matchLabels:
      authzed.com/cluster: spicedb
  namespaceSelector:
    matchNames:
      - spicedb
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
