# Phase 4.4 — seed test relationships into the running SpiceDB.
#
# Format: zed import-compatible YAML.
# Apply: bash infrastructure/spicedb/seed-test-data.sh
#
# Topology:
#   tenant:helloworld
#     admin:  user:jason
#     member: user:alice
#   app:helloworld-app
#     tenant: tenant:helloworld
#     user:   user:alice
#   document:welcome
#     app:    app:helloworld-app
#     owner:  user:jason
#     viewer: user:alice
#
# Expected check outcomes (tested by check-permissions.sh in Phase 4.5):
#   user:jason  document:welcome  view    → ALLOWED  (owner)
#   user:jason  document:welcome  edit    → ALLOWED  (owner)
#   user:jason  document:welcome  delete  → ALLOWED  (owner + tenant admin cascade)
#   user:alice  document:welcome  view    → ALLOWED  (explicit viewer + tenant member cascade)
#   user:alice  document:welcome  edit    → DENIED   (not editor/owner; not tenant admin)
#   user:bob    document:welcome  view    → DENIED   (no relationship)

schema: |
  definition user {}

  definition tenant {
      relation admin: user
      relation member: user
      permission administer = admin
      permission view = admin + member
  }

  definition app {
      relation tenant: tenant
      relation admin: user
      relation user: user
      permission administer = admin + tenant->admin
      permission use = admin + user + tenant->member
  }

  definition document {
      relation app: app
      relation owner: user
      relation editor: user
      relation viewer: user
      permission edit = owner + editor + app->administer
      permission view = owner + editor + viewer + app->administer + app->use
      permission delete = owner + app->administer
  }

relationships: |
  tenant:helloworld#admin@user:jason
  tenant:helloworld#member@user:alice
  app:helloworld-app#tenant@tenant:helloworld
  app:helloworld-app#user@user:alice
  document:welcome#app@app:helloworld-app
  document:welcome#owner@user:jason
  document:welcome#viewer@user:alice
