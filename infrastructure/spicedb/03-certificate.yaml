# cert-manager Certificate for SpiceDB's gRPC server. Issued by the
# mkcert ClusterIssuer (Phase 1).
#
# DNS names cover the in-cluster Service short-names that callers use:
#   spicedb.spicedb.svc, spicedb.spicedb.svc.cluster.local
# (the Service name is `spicedb` after the SpiceDB Operator generates
# it from the SpiceDBCluster CR named `spicedb`)
#
# The cert is mounted into the SpiceDB pod via spec.patches in the CR
# at /tls/{tls.crt,tls.key}. We don't put cluster-external DNS names
# in this cert because SpiceDB is not exposed via Ingress.

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spicedb-grpc-tls
  namespace: spicedb
  labels:
    app.kubernetes.io/name: spicedb
    secforge.platform/component: spicedb
spec:
  secretName: spicedb-grpc-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: spicedb
      secforge.platform/component: spicedb
  duration: 8760h     # 1 year
  renewBefore: 720h   # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  commonName: spicedb.spicedb.svc.cluster.local
  dnsNames:
    - spicedb
    - spicedb.spicedb
    - spicedb.spicedb.svc
    - spicedb.spicedb.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: mkcert-issuer
    kind: ClusterIssuer
    group: cert-manager.io
