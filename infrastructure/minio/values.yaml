# MinIO — Helm values for SecForge Local Edition (local S3 substitute)
#
# Chart:    minio/minio  (https://charts.min.io)
# Pinned:   5.4.0
#
# Apply with:
#   helm install minio minio/minio \
#     --namespace minio --version 5.4.0 \
#     --values infrastructure/minio/values.yaml
#
# Pre-req Secret (created in the apply sequence — NOT committed):
#   kubectl -n minio create secret generic minio-root-credentials \
#     --from-literal=rootUser=secforge-admin \
#     --from-literal=rootPassword=$(openssl rand -base64 32)
#
# Object Lock note: S3 Object Lock provides WORM immutability for
# `audit-logs`. MinIO supports Object Lock but only on buckets created
# WITH versioning + lock at create time. We document the gap in
# docs/06-reference/cluster-services.md (#minio) — Phase 7 may revisit.

mode: standalone
replicas: 1

# Single-namespace consumer of root creds.
existingSecret: minio-root-credentials

# Persistence
persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce

# Resource sizing — fits within the minio namespace quota.
resources:
  requests: { cpu: 200m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# Pod security — chart defaults run as non-root user 1000.
securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: false   # MinIO writes to /data; root FS itself is RO via PSA
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Service exposure — ClusterIP; expose via Ingress below.
service:
  type: ClusterIP
  port: 9000
consoleService:
  type: ClusterIP
  port: 9001

# Ingress — S3 API on s3.secforge.local, console on minio.secforge.local.
# Both served with the wildcard mkcert (default-ssl-certificate from
# ingress-nginx) — no per-Ingress TLS block needed, but we declare the
# host so HSTS and policy enforcement match production.
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - s3.secforge.local
  tls:
    - hosts:
        - s3.secforge.local
      secretName: wildcard-secforge-local-tls   # synced into minio ns by 1.6 step

consoleIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - minio.secforge.local
  tls:
    - hosts:
        - minio.secforge.local
      secretName: wildcard-secforge-local-tls

# Bucket auto-creation: DISABLED in the chart.
# Reason: the upstream chart's post-install Job (`minio-make-bucket` /
# `minio-make-user`) does not expose container-level securityContext fields,
# so it cannot satisfy the namespace's PSA `restricted` enforce label.
# We create the buckets ourselves via the manifest at
# infrastructure/minio/bucket-bootstrap-job.yaml — same outcome, our
# securityContext.
buckets: []
users: []
policies: []
svcaccts: []

metrics:
  serviceMonitor:
    enabled: false   # Phase 7

# No anonymous access from outside the namespace — we'll mint per-app
# service accounts in Phase 5 (OpenBao integration) and grant scoped
# bucket policies then.
networkPolicy:
  enabled: true
  allowExternal: false
