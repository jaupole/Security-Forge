# MinIO bucket bootstrap Job.
#
# Replaces the upstream chart's `makeBucketJob` / `makeUserJob`, which can't
# satisfy `restricted` Pod Security because they don't expose container-level
# securityContext. This Job DOES — same end result, our hardening.
#
# What it creates:
#   - audit-logs            (versioned + Object Lock + 365d governance retention)
#   - backups               (versioned)
#   - wazuh-archive         (versioned)
#   - teleport-recordings   (versioned + Object Lock + 90d governance retention)
#
# Idempotent: rerun whenever values change. `mb --ignore-existing` and
# repeated `version enable` are safe.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-bootstrap
  namespace: minio
  labels:
    secforge.platform/component: minio
    secforge.platform/edition: local
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bucket-bootstrap
        # Required by the chart's NetworkPolicy (PodSelector: minio-client=true)
        minio-client: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_HOST_local
              valueFrom:
                # Composes "http://USER:PASS@minio.minio.svc.cluster.local:9000"
                # via downward env injection — see initContainer below.
                configMapKeyRef:
                  name: minio-bucket-bootstrap-script
                  key: dummy
                  optional: true
            - name: ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootUser
            - name: ROOT_PASS
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootPassword
          command: ["/bin/sh"]
          args:
            - -c
            - |
              set -eu
              export MC_HOST_local="http://${ROOT_USER}:${ROOT_PASS}@minio.minio.svc.cluster.local:9000"
              echo "Waiting for MinIO to be reachable..."
              for i in $(seq 1 60); do
                if mc --quiet ready local 2>/dev/null; then
                  echo "MinIO ready"
                  break
                fi
                sleep 2
              done

              # ---- audit-logs: versioned + Object Lock (WORM) ----
              mc mb --with-lock --ignore-existing local/audit-logs
              mc retention set --default GOVERNANCE 365d local/audit-logs
              mc version enable local/audit-logs

              # ---- backups: versioned ----
              mc mb --ignore-existing local/backups
              mc version enable local/backups

              # ---- wazuh-archive: versioned ----
              mc mb --ignore-existing local/wazuh-archive
              mc version enable local/wazuh-archive

              # ---- teleport-recordings: versioned + Object Lock ----
              mc mb --with-lock --ignore-existing local/teleport-recordings
              mc retention set --default GOVERNANCE 90d local/teleport-recordings
              mc version enable local/teleport-recordings

              # ---- loki-chunks (Phase 7.4): plain bucket, no Object Lock ----
              # Loki rotates its own chunks; versioning would inflate storage
              # without value. 14-day retention is enforced by Loki itself.
              mc mb --ignore-existing local/loki-chunks

              # ---- tempo-traces (Phase 7.5): plain bucket, no Object Lock ----
              # Tempo enforces its own 7-day retention; same rationale as Loki.
              mc mb --ignore-existing local/tempo-traces

              echo "--- buckets ---"
              mc ls local/
              echo "Bootstrap complete."
          volumeMounts:
            - name: mc-config
              mountPath: /.mc
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mc-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
