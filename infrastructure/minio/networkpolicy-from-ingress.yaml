# Additional NetworkPolicy: allow ingress-nginx controller pods to reach
# MinIO API (9000) and Console (9001).
#
# The chart-managed NetworkPolicy `minio` only allows pods carrying
# `minio-client=true`. ingress-nginx controller pods are in a different
# namespace and we don't want to label them with a MinIO-specific label.
# NetworkPolicies are additive — this rule complements the chart's.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-allow-from-ingress-nginx
  namespace: minio
  labels:
    secforge.platform/component: minio
    secforge.platform/edition: local
spec:
  podSelector:
    matchLabels:
      app: minio
      release: minio
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
