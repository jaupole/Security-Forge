# Allow MinIO ingress from `teleport` namespace pods carrying the
# `minio-client=true` label. Phase 8b — the Teleport auth pod uploads
# session recordings to the `teleport-recordings` bucket via the S3 API.
# Same shape as the observability rule, scoped to the teleport ns.
#
# The auth Deployment is labelled with minio-client=true via the
# teleport-cluster chart values (auth.extraLabels.pod). Other pods in
# the teleport ns (proxy, operator, kube-agent) don't reach MinIO and
# therefore stay denied.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-allow-from-teleport
  namespace: minio
  labels:
    secforge.platform/component: minio
    secforge.platform/edition: local
spec:
  podSelector:
    matchLabels:
      app: minio
      release: minio
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: teleport
          podSelector:
            matchLabels:
              minio-client: "true"
      ports:
        - protocol: TCP
          port: 9000
