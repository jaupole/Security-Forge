# Allow MinIO ingress from `observability` namespace pods carrying the
# `minio-client=true` label. Phase 7.4 / 7.5 — Loki, Tempo, OTel
# Collector all run in the observability namespace and need to PUT/GET
# objects on the MinIO S3 API. The chart-managed `minio` NetworkPolicy's
# default `podSelector: minio-client=true` source assumes the same
# namespace as the policy (i.e., `minio`), so cross-namespace clients
# are denied without an explicit allow rule. NetworkPolicies are
# additive; this rule complements the chart's defaults rather than
# replacing them.
#
# Why namespaceSelector AND podSelector both: defense in depth — a pod
# in observability without the label still can't reach MinIO; a pod
# with the label in some other namespace also can't.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-allow-from-observability
  namespace: minio
  labels:
    secforge.platform/component: minio
    secforge.platform/edition: local
spec:
  podSelector:
    matchLabels:
      app: minio
      release: minio
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              minio-client: "true"
      ports:
        - protocol: TCP
          port: 9000
