# Phase 1.8 verification — minimal HTTPS endpoint for browser smoke test.
#
# - Tiny nginx-unprivileged pod serving a static page
# - Service in front of it
# - Ingress for https://test.secforge.local using the cert issued by
#   the mkcert ClusterIssuer (see infrastructure/cert-manager/test-certificate.yaml)
#
# Lives in `app` namespace alongside the test Certificate.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-page
  namespace: app
data:
  index.html: |
    <!doctype html>
    <html>
    <head><title>SecForge — TLS test</title></head>
    <body style="font-family: ui-sans-serif, system-ui; padding: 2rem;">
      <h1>SecForge Local Edition</h1>
      <p>If you see a green padlock, mkcert + cert-manager + ingress-nginx are wired up correctly.</p>
      <p>Issued by: SecForge mkcert local CA</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-page
  namespace: app
  labels:
    app.kubernetes.io/name: test-page
    secforge.platform/component: verification
    secforge.platform/edition: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-page
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            - name: pid
              mountPath: /var/run
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          livenessProbe:
            httpGet: { path: /, port: 8080 }
      volumes:
        - name: html
          configMap:
            name: test-page
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: pid
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: test-page
  namespace: app
spec:
  selector:
    app.kubernetes.io/name: test-page
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-page
  namespace: app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - test.secforge.local
      secretName: test-secforge-local-tls   # issued by ClusterIssuer mkcert-issuer
  rules:
    - host: test.secforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-page
                port:
                  number: 80
