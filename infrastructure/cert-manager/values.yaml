# cert-manager — Helm values for SecForge Local Edition
#
# Chart:    https://charts.jetstack.io
# Pinned:   v1.16.2
#
# Apply with:
#   helm install cert-manager jetstack/cert-manager \
#     --namespace cert-manager --version v1.16.2 \
#     --values infrastructure/cert-manager/values.yaml

crds:
  enabled: true
  keep: true

replicaCount: 1

# Resource sizing — fits within the cert-manager namespace quota
# (req 500m / 512Mi, lim 1 / 1Gi).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

webhook:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }

cainjector:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# Cluster resource namespace — where ClusterIssuers look up Secrets like
# `mkcert-ca-key-pair`. We accept the default explicitly to make it visible.
clusterResourceNamespace: cert-manager

# Modest log level; bump to 4 when debugging issuance failures.
global:
  logLevel: 2
  leaderElection:
    namespace: cert-manager

prometheus:
  enabled: false   # Phase 7 wires this up
