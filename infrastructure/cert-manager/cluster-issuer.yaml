# ClusterIssuer for the mkcert local root CA.
#
# Pre-req: Secret `mkcert-ca-key-pair` exists in the cert-manager namespace,
# created from $(mkcert -CAROOT)/rootCA.pem and rootCA-key.pem. See the
# apply sequence in docs/06-reference/cluster-services.md.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mkcert-issuer
  labels:
    secforge.platform/component: cert-manager
    secforge.platform/edition: local
spec:
  ca:
    secretName: mkcert-ca-key-pair
