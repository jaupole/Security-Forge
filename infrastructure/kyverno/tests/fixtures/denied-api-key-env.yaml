# DENIED: env name contains KEY → no-secret-shaped-env-vars regex.
#
# securityContext is set to PodSecurity-restricted-compliant values so
# `kubectl apply --dry-run=server` (verify-03 LIVE) reaches the Kyverno
# admission stage rather than being short-circuited by built-in
# PodSecurity. kyverno-test (offline) ignores securityContext.
apiVersion: v1
kind: Pod
metadata:
  name: denied-api-key-env
  namespace: app
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: example.com/app:1
      env:
        - name: STRIPE_API_KEY
          value: "sk_live_REDACTED"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
