# ALLOWED: env names contain neither KEY/SECRET/TOKEN/PASSWORD/CREDENTIAL.
apiVersion: v1
kind: Pod
metadata:
  name: allowed-no-secret-env
  namespace: app
spec:
  containers:
    - name: app
      image: example.com/app:1
      env:
        - name: LOG_LEVEL
          value: info
        - name: PORT
          value: "8080"
