# DENIED: initContainer env name contains PASSWORD.
apiVersion: v1
kind: Pod
metadata:
  name: denied-password-initcontainer
  namespace: app
spec:
  initContainers:
    - name: bootstrap
      image: example.com/bootstrap:1
      env:
        - name: DB_PASSWORD
          value: "redacted"
  containers:
    - name: app
      image: example.com/app:1
