# Postgres cluster for Teleport (Phase 8a — foundation; Phase 8b deploys
# Teleport itself).
#
# Bundles the Namespace + quota because `teleport` is not in
# infrastructure/namespaces/namespaces.yaml — it lives here so the
# whole stack can be skipped if a future operator chooses not to
# deploy Teleport (per ADR-0024 § Re-evaluation criteria; the prompt
# doc references "0006-skip-teleport-locally.md" but that slot is
# taken — a future skip ADR would claim the next available slot).
---
apiVersion: v1
kind: Namespace
metadata:
  name: teleport
  labels:
    secforge.platform/component: teleport
    secforge.platform/edition: local
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: teleport
spec:
  hard:
    # Sized for Phase 8b's full footprint:
    #   - secforge-teleport-db (CNPG, reserved for HA promotion): 500m / 512Mi
    #   - teleport-auth:    500m / 768Mi
    #   - teleport-proxy:   500m / 768Mi (chart default is 1000m/768Mi;
    #                       tightened in 03-helm-values.yaml proxy.resources)
    #   - teleport-operator: 200m / 256Mi
    #   - teleport-kube-agent (8b.3, pending): ~200m / 256Mi
    # Total ceiling ≈ 1900m / 2560Mi. Headroom rounded to 3 / 3Gi.
    requests.cpu: "1500m"
    requests.memory: 1500Mi
    # 4 cpu (not 3) to absorb the rolling-restart peak: the proxy pod's
    # init container `wait-auth-update` has chart-default limits.cpu=1
    # which counts toward the quota concurrently with the steady-state
    # main container during a rollout. Steady-state footprint is well
    # under 2 cpu; this only matters during `kubectl rollout restart`.
    limits.cpu: "4"
    limits.memory: 3Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: teleport
spec:
  limits:
    - type: Container
      default: { cpu: 300m, memory: 384Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: secforge-teleport-db
  namespace: teleport
  labels:
    secforge.platform/component: teleport
    secforge.platform/edition: local
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4-bookworm
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: teleport
      owner: teleport
      encoding: UTF8
      localeCollate: C
      localeCType: C
  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  monitoring:
    enablePodMonitor: false
