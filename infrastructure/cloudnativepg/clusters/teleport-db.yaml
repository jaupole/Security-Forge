# Postgres cluster for Teleport (Phase 8, OPTIONAL locally).
#
# Apply only if you intend to deploy Teleport. Bundles the Namespace + quota
# because `teleport` is not in infrastructure/namespaces/namespaces.yaml —
# it lives here so it can be skipped wholesale per ADR 0006 if you opt out.
---
apiVersion: v1
kind: Namespace
metadata:
  name: teleport
  labels:
    secforge.platform/component: teleport
    secforge.platform/edition: local
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: teleport
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: teleport
spec:
  limits:
    - type: Container
      default: { cpu: 300m, memory: 384Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: secforge-teleport-db
  namespace: teleport
  labels:
    secforge.platform/component: teleport
    secforge.platform/edition: local
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4-bookworm
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: teleport
      owner: teleport
      encoding: UTF8
      localeCollate: C
      localeCType: C
  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  monitoring:
    enablePodMonitor: false
