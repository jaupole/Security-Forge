# Phase 7d Item 5 — Wazuh agent DaemonSet (hardened, standalone).
#
# Why standalone (not chart-managed):
#   - The vendored chart bundles the agent in the same Helm release as
#     manager+indexer+dashboard. Putting the agent in a different ns
#     than the chart's release ns would require either two Helm
#     releases or a meaningful chart fork. Standalone manifest is
#     simpler to maintain and gives full operator control over the
#     hardening surface.
#
# Hardening trade-offs:
#   - hostPath mounts of /etc, /var/log, /proc, /usr/{bin,sbin} mounted
#     at /host/* — required for FIM + log collection. Forbidden at
#     PSS=baseline; this ns is PSS=privileged.
#   - hostPID DROPPED — agent only sees its own PID namespace. FIM
#     and log collection (which only need file access) work; ptrace-
#     based introspection + host-process monitoring DO NOT.
#   - privileged: false. capabilities.add: [DAC_OVERRIDE, SETUID,
#     SETGID]. SETUID + SETGID are needed because the wazuh-agent
#     image's s6-init runs as root and switches to the `wazuh` user
#     for the agent's daemon processes. DAC_OVERRIDE allows reading
#     hostPath-mounted files regardless of ownership.
#   - Image pinned by SHA256 digest.
#   - seccompProfile: RuntimeDefault.
#
# Init container strategy (handles the chart's image-side init quirks):
#   The wazuh-agent image's container init scripts (`/etc/cont-init.d/
#   0-wazuh-init`) run `sed -i` on /var/ossec/etc/ossec.conf to
#   substitute env-var values. `sed -i` uses tempfile-rename, which
#   fails on subPath-mounted ConfigMaps (Device or resource busy).
#   To work around, the init container:
#     1. Copies /var/ossec/etc/ from the wazuh-agent image into a
#        shared EmptyDir (writable).
#     2. Customizes ossec.conf in the EmptyDir (host-path syscheck
#        dirs, pod-log localfile blocks for Phase 7d Item 6).
#   The main container mounts the EmptyDir at /var/ossec/etc/, so its
#   image-side init scripts can sed -i happily.

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  namespace: wazuh-agent
  labels:
    app.kubernetes.io/name: wazuh-agent
    app.kubernetes.io/component: agent
    secforge.platform/component: wazuh-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-agent
        app.kubernetes.io/component: agent
        secforge.platform/component: wazuh-agent
    spec:
      serviceAccountName: wazuh-agent
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      securityContext:
        # fsGroup: 999 → kubelet chown-recursively any EmptyDir/Secret/
        # ConfigMap volume mount to GID 999. The wazuh-agent image's
        # `wazuh` user is UID 999 GID 999; this makes the etc-overlay
        # writable + readable by the daemons.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/pid-pressure
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Init container: copy /var/ossec/etc/ from the wazuh-agent
        # image to /etc-overlay (EmptyDir), customize ossec.conf with
        # our host-path syscheck dirs + pod-log localfile blocks.
        # Uses the SAME wazuh-agent image (already cached on the node)
        # so the cp source is available.
        - name: customize-ossec-conf
          image: "wazuh/wazuh-agent@sha256:085aac688d372f6243a679b87ca98135be37b12bb7733c7b5f92041517e6800e"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              # /var/ossec/etc files are wazuh:wazuh-owned in the image;
              # root needs DAC_OVERRIDE to cp them when running with
              # restricted caps (cp follows the kernel's permission
              # checks even for UID 0 unless CAP_DAC_OVERRIDE is set).
              add: ["DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              # Copy /var/ossec/etc/ tree without preserving ownership
              # (we lack CAP_CHOWN; pod-level fsGroup=999 chowns the
              # EmptyDir afterwards to match the image's wazuh user).
              cp -r --preserve=mode,timestamps /var/ossec/etc/. /etc-overlay/

              # Append our customizations to ossec.conf. Wazuh's parser
              # accepts multiple top-level <ossec_config> blocks
              # additively — no merge logic needed.
              cat /custom-conf/ossec-supplements.xml >> /etc-overlay/ossec.conf

              # Phase 7d.5 (operator-backlog #17 fix): inject the
              # pre-registered agent key from the K8s Secret so the
              # agent doesn't auto-enroll on every pod restart. The
              # Secret is created once by bootstrap-agent-key.sh and
              # contains the manager-issued client.keys content.
              # Without this injection, EmptyDir-mounted client.keys
              # is empty on every restart → agent re-enrolls →
              # manager rejects with "Duplicate agent name".
              if [ -s /registered-key/client.keys ]; then
                  cp /registered-key/client.keys /etc-overlay/client.keys
                  echo "==registered key injected=="
                  awk '{ printf "id=%s name=%s ip=%s key=<redacted>\n", $1, $2, $3 }' /etc-overlay/client.keys
              else
                  echo "==no registered key — agent will auto-enroll=="
              fi

              # Widen group-write so agentd (running as wazuh user, GID
              # 999) can update runtime state files. CAP_DAC_OVERRIDE
              # on this init container lets root chmod regardless of
              # ownership.
              chmod -R g+w /etc-overlay/
              chmod 0660 /etc-overlay/client.keys
          volumeMounts:
            - name: etc-overlay
              mountPath: /etc-overlay
            - name: custom-conf
              mountPath: /custom-conf
              readOnly: true
            - name: registered-key
              mountPath: /registered-key
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      containers:
        - name: wazuh-agent
          image: "wazuh/wazuh-agent@sha256:085aac688d372f6243a679b87ca98135be37b12bb7733c7b5f92041517e6800e"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              # DAC_OVERRIDE: read hostPath-mounted files regardless of
              # ownership. SETUID + SETGID: image's s6-init switches
              # from root to the `wazuh` user for daemon processes.
              add: ["DAC_OVERRIDE", "SETUID", "SETGID"]
            seccompProfile:
              type: RuntimeDefault
          env:
            # Phase 7d.5 (operator-backlog #17 fix): WAZUH_REGISTRATION_*
            # env vars REMOVED. The init container injects a
            # pre-registered key into client.keys (sourced from the K8s
            # Secret `wazuh-agent-key`); the agent uses that key
            # directly and never auto-enrolls. WAZUH_MANAGER_SERVER
            # remains so the agent knows where to connect.
            - name: WAZUH_MANAGER_SERVER
              value: "wazuh-manager-agents.wazuh.svc.cluster.local"
            - name: WAZUH_MANAGER_PORT
              value: "1514"
            - name: WAZUH_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WAZUH_AGENT_GROUPS
              value: "default,k8s"
          # Phase 7d.5: the wazuh-agent image's cont-init.d/1-agent
          # script runs `wazuh-control start` exactly once at container
          # creation. In our environment that reliably starts execd +
          # agentd but exits with status 1 BEFORE it gets to
          # logcollector / syscheckd / modulesd. Without those, Item 6
          # pod-log tailing doesn't happen. The postStart hook waits
          # for the cont-init sequence to settle (~25s for s6-init +
          # cont-init.d to run), then re-runs wazuh-control start to
          # bring the missing daemons online. wazuh-control start is
          # idempotent — it skips daemons that are already running.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Wait for the image's cont-init.d sequence to settle
                    # (it starts execd + agentd; the others fail silently).
                    sleep 25
                    # Start ONLY the daemons the image's init missed.
                    # `wazuh-control start` is not safely idempotent on
                    # this image — re-running it spawns a second agentd
                    # that fights the first for the manager connection,
                    # triggering the enrollment-rejection loop.
                    pgrep -x wazuh-logcollector >/dev/null || /var/ossec/bin/wazuh-logcollector
                    pgrep -x wazuh-syscheckd    >/dev/null || /var/ossec/bin/wazuh-syscheckd
                    pgrep -x wazuh-modulesd     >/dev/null || /var/ossec/bin/wazuh-modulesd
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            # Overlay our customized /var/ossec/etc/ on top of the image.
            # /var/ossec/queue + /var/ossec/logs use the image's
            # writable layer (wazuh-owned by default); pod-restart
            # wipes them, which is fine for local-edition.
            - name: etc-overlay
              mountPath: /var/ossec/etc
            # Host paths the agent reads (FIM + log collection).
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            - name: host-var-log
              mountPath: /host/var/log
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-usr-bin
              mountPath: /host/usr/bin
              readOnly: true
            - name: host-usr-sbin
              mountPath: /host/usr/sbin
              readOnly: true
      volumes:
        - name: etc-overlay
          emptyDir: {}
        - name: custom-conf
          configMap:
            name: wazuh-agent-ossec-conf
        - name: registered-key
          secret:
            secretName: wazuh-agent-key
            optional: true   # If missing, init container falls back to
                             # the image's empty client.keys (agent will
                             # try auto-enrollment — Phase 7d.5 path
                             # not bootstrapped yet).
        - name: host-etc
          hostPath: { path: /etc }
        - name: host-var-log
          hostPath: { path: /var/log }
        - name: host-proc
          hostPath: { path: /proc }
        - name: host-usr-bin
          hostPath: { path: /usr/bin }
        - name: host-usr-sbin
          hostPath: { path: /usr/sbin }
