# Phase 9.7 — let helloworld-backend reach secforge-app-db.
# The default-deny in the DB's ns blocks app-internal traffic; the
# existing allow-openbao-to-secforge-app-db only opens openbao→DB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helloworld-backend-to-secforge-app-db
  namespace: app
  labels:
    app.kubernetes.io/part-of: helloworld
    secforge.platform/component: helloworld-backend
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: secforge-app-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: helloworld-backend
      ports:
        # 5432 for direct (non-ambient) access; 15008 for ambient HBONE
        # tunneled access (Istio Ambient ztunnel inbound listener). Both
        # are required because the source ztunnel may HBONE-encapsulate
        # the connection when both peers are in ambient namespaces.
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 15008
