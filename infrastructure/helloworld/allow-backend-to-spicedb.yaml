# Phase 9.7 — let the helloworld-backend (in app ns) reach SpiceDB.
#
# Mirrors the existing allow-authzen-facade-to-spicedb policy — same
# target (SpiceDB pods on port 50051), different source app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helloworld-backend-to-spicedb
  namespace: spicedb
  labels:
    app.kubernetes.io/part-of: helloworld
    secforge.platform/component: helloworld-backend
spec:
  podSelector:
    matchLabels:
      authzed.com/cluster: spicedb
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: helloworld-backend
      ports:
        - protocol: TCP
          port: 50051
