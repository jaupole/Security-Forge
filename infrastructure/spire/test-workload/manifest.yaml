# Phase 2.5 — test workload identity sanity check.
#
# Deploys a tiny pod that opts into a SPIFFE identity, mounts the SPIFFE
# Workload API socket via the CSI driver, fetches its X.509-SVID and a
# JWT-SVID, and verifies the chain against the trust bundle.
#
# Prerequisites:
#   1. SPIRE deployed (see infrastructure/spire/values.yaml).
#   2. Image built and accessible from Docker Desktop's daemon:
#        docker build -t secforge/spiffe-test:v1 infrastructure/spire/test-workload
#
# Apply with:
#   kubectl apply -f infrastructure/spire/test-workload/manifest.yaml
#   kubectl logs -n test-spire -l app=spiffe-test -f
#
# CLEANUP after verification (Fix-after-07 §B.3, F-CLU-4): the Job is
# one-shot (ttlSecondsAfterFinished:600) but the namespace persists.
# Leaving an empty `test-spire` ns is the F-CLU-4 audit finding. Run:
#   kubectl delete ns test-spire
# once the smoke test prints what you needed to see.

---
apiVersion: v1
kind: Namespace
metadata:
  name: test-spire
  labels:
    secforge.platform/component: test-spire
    secforge.platform/edition: local
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-app
  namespace: test-spire

---
# We rely on the chart's "default" ClusterSPIFFEID (label-based, opt-in) to
# match this pod. The expected SPIFFE ID is:
#   spiffe://secforge.local/ns/test-spire/sa/test-app
#
# Run as a Job (not a Deployment) — the program is a one-shot smoke test that
# fetches its identity, prints it, sleeps 30s, then exits. A Deployment would
# CrashLoopBackOff forever, which is just noise.
apiVersion: batch/v1
kind: Job
metadata:
  name: spiffe-test
  namespace: test-spire
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: spiffe-test
        # Opt-in to the default SPIRE registration.
        spiffe.io/spire-managed-identity: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: test-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spiffe-test
          image: secforge/spiffe-test:v2
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
