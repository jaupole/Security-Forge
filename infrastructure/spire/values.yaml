# SPIRE — SecForge Local Edition Helm values
#
# Chart:   spiffe/spire     0.28.4   (SPIRE 1.14.5)
# CRDs:    spiffe/spire-crds 0.5.0   (installed separately, ahead of this release)
# Source:  https://github.com/spiffe/helm-charts-hardened
#
# Apply with:
#
#   helm install spire-crds spiffe/spire-crds \
#       --version 0.5.0 \
#       --namespace spire \
#       --create-namespace=false
#
#   helm install spire spiffe/spire \
#       --version 0.28.4 \
#       --namespace spire \
#       -f infrastructure/spire/values.yaml
#
# See:
#   - docs/01-architecture/06-workload-identity.md
#   - docs/02-decisions/0005-spire-architecture-local.md
#   - docs/05-claude-code-prompts/phase-02-spire.md

# ============================================================================
# Global parameters — apply across spire-server, spire-agent, controller-manager
# ============================================================================
global:
  k8s:
    # Default DNS suffix for Docker Desktop K8s.
    clusterDomain: cluster.local

  spire:
    # The single trust domain for the local edition.
    # In cloud, this becomes spiffe://{env}.secforge.internal per environment.
    trustDomain: secforge.local

    # Cluster name advertised to the k8s_psat node attestor. Has to match
    # between server and agent. "docker-desktop" matches the kubectl context.
    clusterName: docker-desktop

    # The chart creates this ConfigMap to hold the public trust bundle.
    bundleConfigMap: spire-bundle

    # Public CA subject baked into the spire-server intermediate CA.
    # The upstream root has its own subject ("SecForge Local SPIRE Root CA").
    caSubject:
      country: US
      organization: SecForge
      commonName: secforge.local

    # We're not using the chart's "create namespace" helpers — the namespace
    # already exists with our resource quotas (infrastructure/namespaces/).
    namespaces:
      create: false

    # We override the chart's default "spire-system" / "spire-server" namespace
    # split and put everything in our pre-existing `spire` namespace.

    # We're a single-node local cluster; do not enable production
    # recommendations (they assume 3+ replicas, anti-affinity, etc.).
    recommendations:
      enabled: false

    # Strict mode would enforce production-only constraints (e.g., reject
    # the .local trust domain). Off for local; cloud edition turns this on.
    strictMode: false

  # The chart auto-runs install/upgrade hooks (kubectl-based jobs) to fix
  # common transition issues. They run with the chart's default kubectl
  # image (which runs as root) and conflict with our `runAsNonRoot` pod
  # security context. We manage installs/upgrades manually, so disable them.
  installAndUpgradeHooks:
    enabled: false

# ============================================================================
# spire-server
# ============================================================================
spire-server:
  enabled: true
  nameOverride: server

  # StatefulSet — the SQLite datastore lives on a PVC and we need a stable
  # identity / consistent volume mount.
  kind: statefulset
  replicaCount: 1

  # Force single-namespace install: server + agent + controller-manager + CSI
  # all live in the `spire` namespace.
  namespaceOverride: spire

  serviceAccount:
    create: true
    name: spire-server

  # Audit logging is critical security telemetry — emit JSON to STDOUT, where
  # Promtail/Wazuh will pick it up in Phase 7.
  auditLogEnabled: true
  logFormat: json
  logLevel: info

  # SQLite for the Local Edition. Cloud → Postgres (RDS).
  dataStore:
    sql:
      databaseType: sqlite3
      file: /run/spire/data/datastore.sqlite3

  persistence:
    type: pvc
    accessMode: ReadWriteOnce
    size: 1Gi
    # Use whatever default storage class Docker Desktop provides (hostpath).
    storageClass: null

  # Upstream signing authority. The `disk` plugin reads cert+key from a Secret
  # mounted at /run/spire/upstream_ca/. The Secret was created in Phase 2.2
  # from material generated with openssl (Ed25519, 10y validity); the local
  # copy was shredded immediately after import.
  upstreamAuthority:
    disk:
      enabled: true
      secret:
        # We created the Secret externally (Phase 2.2). Don't have the chart
        # try to create it from values — that would put the private key in
        # this YAML.
        create: false
        name: spire-upstream-ca

  # Node attestor — k8s_psat is the only attestor that works on Docker Desktop.
  # The agent sends a projected SA token; the server validates it against the
  # K8s API for the audience "spire-server".
  nodeAttestor:
    k8sPSAT:
      enabled: true
      serviceAccountAllowList:
        - spire:spire-agent
      audience:
        - spire-server
    # No external clusters; no AWS in local edition.
    externalK8sPSAT:
      enabled: false
    awsIID:
      enabled: false
    joinToken:
      enabled: false

  # Controller manager is enabled; this is what reconciles ClusterSPIFFEID
  # CRDs into spire-server registrations.
  controllerManager:
    enabled: true
    logLevel: info
    logEncoding: json
    # Default class name; we'll only ever have one SPIRE install on this cluster.
    className: ""
    # We want the controller to also reconcile any ClusterSPIFFEID we apply
    # *without* a className — so the registrations in cluster-spiffe-ids.yaml
    # don't have to specify the chart-internal class name.
    watchClassless: true

    # Override the chart-managed default registration to require the explicit
    # opt-in label. The chart's out-of-box default issues an SVID to every pod
    # in any non-SPIRE namespace; we want consent. ADR-0005 §"Identity opt-in".
    identities:
      clusterSPIFFEIDs:
        default:
          enabled: true
          spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
          podSelector:
            matchLabels:
              spiffe.io/spire-managed-identity: "true"
          # Exclude the SPIRE namespace itself so spire-server / spire-agent
          # don't accidentally register themselves as workload identities.
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values: ["spire", "kube-system", "kube-public", "kube-node-lease"]
          ttl: "1h"
          jwtTTL: "5m"
          fallback: true
          autoPopulateDNSNames: false

        # We do not deploy the SPIKE / OIDC / test-keys subcharts — disable
        # the identities they would otherwise register.
        oidc-discovery-provider:
          enabled: false
        test-keys:
          enabled: false
        spike-keeper:
          enabled: false
        spike-nexus:
          enabled: false
        spike-bootstrap:
          enabled: false
        spike-pilot:
          enabled: false

  # No external controller managers / no nested SPIRE.
  externalControllerManagers:
    enabled: false

  # SVID TTLs (the chart defaults are 4h X.509 / 1h JWT; ADR-0005 calls for
  # 1h X.509 / 5m JWT). Short TTL = revocation latency bounded by rotation.
  defaultX509SvidTTL: 1h
  defaultJwtSvidTTL: 5m
  caTTL: 24h
  # ec-p256 is faster + smaller than rsa-2048 and works everywhere we're
  # going to use the SVID locally (Istio, OpenBao, our test workload).
  caKeyType: ec-p256

  # The chart's logic in spire-server/templates/server-resource.yaml triggers
  # a busybox `chown` init container whenever runAsUser is not present in the
  # raw user-supplied podSecurityContext — even though the chart's
  # spire-server.podSecurityContext helper force-injects 1000 anyway. So we
  # set runAsUser/runAsGroup explicitly to match what the helper would inject
  # and suppress the chown init container (which depends on a flaky
  # busybox:1.37.0-uclibc Docker Hub pull).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true

  # No Tornjak UI; no extra ingress.
  service:
    type: ClusterIP

  # Modest resources for local.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Federation is off (no other trust domains to federate with locally).
  federation:
    enabled: false

# ============================================================================
# spire-agent (DaemonSet)
# ============================================================================
spire-agent:
  enabled: true
  nameOverride: agent
  namespaceOverride: spire

  serviceAccount:
    create: true
    name: spire-agent

  logLevel: info
  logFormat: json

  # The spire-agent DaemonSet has a chart-level `fsgroupfix` init container
  # that runs as root (UID 0) to chown the agent socket directory and the
  # /var/lib/spire workdir to the agent's UID. We need it — without it the
  # main agent container can't bind its UDS. So pod-level runAsNonRoot is
  # NOT enforced; the main agent container's own securityContext (below)
  # handles non-root for the workload.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  nodeAttestor:
    k8sPSAT:
      enabled: true

  workloadAttestors:
    k8s:
      enabled: true
    unix:
      enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ============================================================================
# SPIFFE CSI driver (DaemonSet)
# Mounts the spire-agent's Workload API socket into workload pods.
# ============================================================================
spiffe-csi-driver:
  enabled: true
  namespaceOverride: spire

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ============================================================================
# Disabled subcharts — local edition does not use these
# ============================================================================

# OIDC discovery is enabled in Phase 5 to expose SPIRE's JWKS over HTTP for
# OpenBao's `auth/jwt` method. The provider runs as a sidecar to spire-server
# and exposes /keys + /.well-known/openid-configuration on a ClusterIP.
spiffe-oidc-discovery-provider:
  enabled: true
  # Default exposes via Ingress (with Let's Encrypt). Locally we don't need
  # external access — disable Ingress and use ClusterIP for in-cluster auth.
  config:
    acme:
      tosAccepted: false
    insecureScheme:
      enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  # Resources for the discovery provider (small).
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Tornjak UI — optional dashboard, skip locally.
tornjak-frontend:
  enabled: false

# SPIKE secret store — alternative to OpenBao; we use OpenBao instead.
spike-keeper:
  enabled: false
spike-nexus:
  enabled: false
spike-pilot:
  enabled: false

# Upstream-nested SPIRE — not used.
upstream:
  enabled: false
