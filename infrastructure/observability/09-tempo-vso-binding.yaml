# VSO binding for Tempo MinIO credentials — Phase 7.5.
#
# Same shape as 05-loki-vso-binding.yaml. apply-tempo.sh provisions a
# MinIO scoped user `tempo-user` with bucket-only access to tempo-traces,
# stages the keys at OpenBao secret/data/minio/tempo/credentials, and
# this VSO binding renders them into the K8s Secret consumed by Tempo's
# extraEnvFrom (07-tempo-values.yaml).

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tempo-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: tempo-vso
    serviceAccount: tempo-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tempo-minio-credentials-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: tempo-vso
  mount: secret
  type: kv-v2
  path: minio/tempo/credentials
  refreshAfter: 60s
  destination:
    name: tempo-minio-credentials
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ACCESS_KEY:
          text: '{{ .Secrets.access_key }}'
        SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'
