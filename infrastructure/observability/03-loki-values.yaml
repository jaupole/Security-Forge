# Loki single-binary Helm values — Phase 7.4.
#
# Architecture: docs/01-architecture/08-observability.md (§Loki + Promtail)
# Chart: grafana/loki (single-binary deployment mode)
#
# Storage: chunks live in MinIO `loki-chunks` bucket; index uses BoltDB-
# shipper backed by the same bucket. Retention: 14d (the Loki compactor
# enforces it; we don't rely on bucket lifecycle).
#
# Authentication: Loki has no UI — queries arrive only via Grafana's
# datasource, which uses an in-cluster ClusterIP Service. NetworkPolicy
# restricts to observability ns + Grafana pods.

deploymentMode: SingleBinary

loki:
  auth_enabled: false   # single-tenant locally; cloud edition switches on
  schemaConfig:
    configs:
      - from: 2026-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-chunks
      admin: loki-chunks
    s3:
      endpoint: minio.minio.svc.cluster.local:9000
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true   # in-cluster MinIO uses HTTP on the cluster fabric
      # access_key_id + secret_access_key come from the
      # `loki-minio-credentials` Secret rendered by VSO; chart wires them
      # via env (see env section below).

  limits_config:
    # Global retention: 14d. Most app/system streams cap here.
    retention_period: 336h     # 14 days
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_length: 721h
    split_queries_by_interval: 15m

    # Phase 7b.2 — per-stream retention override for the secrets-
    # guardrail audit trail. ADR-0013 § Audit trail requires bypass
    # events to be queryable for at least 90 days (regulators tend to
    # ask for 90d minimum on security-relevant logs). The match selector
    # mirrors the Promtail job label set in
    # 04-promtail-values.yaml § extraScrapeConfigs.
    #
    # NOTE: per-stream retention only takes effect when
    # `compactor.retention_enabled: true`. We keep retention_enabled
    # false today (see compactor block below for the fresh-bucket
    # boot-loop diagnostic that triggered the off setting) — meaning
    # 90d is *aspirational*: streams remain in the bucket up to the
    # global 14d cap, then get garbage-collected via TSDB index expiry
    # without the compactor's per-stream pass running. Phase 7b
    # accepts this gap rather than re-trigger the boot loop. Tracked
    # in operator-backlog #4-style follow-up work; flip
    # retention_enabled to true once the bucket has at least one
    # delete request and verify Loki still reaches /ready post-restart.
    retention_stream:
      - selector: '{job="secrets-guardrails"}'
        priority: 1
        period: 2160h           # 90 days

  # DIAGNOSTIC: retention_enabled forces the compactor to read
  # delete_requests.gz from S3 on startup; on a fresh bucket that
  # object doesn't exist and the compactor blocks indefinitely while
  # retrying, which holds the dskit services framework — no HTTP
  # responses, no /ready, no /metrics. Disable retention until the
  # bucket has at least one delete request so the compactor's startup
  # path can complete cleanly. Phase 7b.2 leaves this as-is and
  # documents the aspirational-90d posture in limits_config above.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: false

  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  rulerConfig:
    storage:
      type: local
      local:
        directory: /var/loki/rules

singleBinary:
  replicas: 1

  # MinIO ingress NetworkPolicy in `minio` namespace allows only from
  # pods labeled `minio-client: "true"` (see infrastructure/minio/values.yaml).
  # Without this label, Loki's S3 client gets i/o timeouts on connect to
  # the MinIO Service ClusterIP — which masquerades as "S3 backend slow"
  # in error logs. Same label needed on Promtail-no (it doesn't talk to
  # MinIO directly) and Tempo (yes, it does — already added there).
  podLabels:
    minio-client: "true"

  # The chart's 1s readiness timeout is tighter than Loki's actual
  # response time during cold start (especially with the S3 backend).
  # Bumping to 5s prevents probe failures from holding the pod NotReady
  # indefinitely.
  readinessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 5

  persistence:
    enabled: true
    storageClass: hostpath
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  # Loki reads its S3 access keys from env vars set on the container.
  # The chart's `extraEnvFrom` wires the VSO-rendered Secret in.
  extraEnvFrom:
    - secretRef:
        name: loki-minio-credentials
        optional: false

# We don't expose Loki externally; Grafana reaches it via in-cluster Service.
gateway:
  enabled: false

# Fresh-deploy fix: the loki-memberlist headless Service must publish
# not-ready addresses so DNS resolves to the (still-bootstrapping) pod
# IP, otherwise readiness deadlocks (memberlist join needs DNS, DNS
# needs Ready endpoints, Ready needs memberlist join). Single-binary
# replicas=1 means memberlist trivially joins itself.
memberlist:
  service:
    publishNotReadyAddresses: true

# Disable the chart's bundled MinIO; we use the platform's own MinIO.
minio:
  enabled: false

# Disable the chart's bundled cache (chunks_cache + results_cache); they
# require memcached which is overkill for 1 replica + local storage.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# We don't need separate read/write components in single-binary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Test pods off — chart's bundled smoke tests aren't applicable locally.
test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false       # avoid recursive log shipping
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: true        # platform Prometheus picks this up
    labels:
      release: kps
  lokiCanary:
    enabled: false
