# Grafana ingress — Phase 7.3.
#
# Three resources:
#   1. Certificate — mkcert-issued TLS for grafana.secforge.local
#   2. Ingress — routes https://grafana.secforge.local → grafana Service
#   3. NetworkPolicies:
#        - default-deny ingress for the observability namespace
#        - allow ingress-nginx → grafana on port 3000
#        - allow Prometheus / Alertmanager scrape from anywhere with the
#          standard prometheus-stack release labels
#
# Companion: 01-kube-prometheus-stack-values.yaml (chart values disable
# the chart's own Ingress so we own this surface).

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: observability
  labels:
    secforge.platform/component: observability
spec:
  secretName: grafana-tls
  issuerRef:
    name: mkcert-issuer
    kind: ClusterIssuer
  commonName: grafana.secforge.local
  dnsNames:
    - grafana.secforge.local
  duration: 2160h    # 90 days
  renewBefore: 720h  # 30 days

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  labels:
    secforge.platform/component: observability
  annotations:
    # Security headers (HSTS, X-Content-Type-Options, X-XSS-Protection)
    # are emitted by Grafana itself via grafana.ini settings configured
    # in 01-kube-prometheus-stack-values.yaml. Cluster-wide CSP /
    # Referrer-Policy / Permissions-Policy belong on the ingress-nginx
    # controller ConfigMap (`add-headers`) once we tighten that
    # cluster-wide — Phase 7d or beyond. Snippet directives are disabled
    # on the controller so per-Ingress overrides aren't available.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Grafana 13 uses WebSockets at /api/live/ws for live updates;
    # without long timeouts ingress-nginx tears them down before they
    # establish, which makes UI pages hang waiting for live data.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [grafana.secforge.local]
      secretName: grafana-tls
  rules:
    - host: grafana.secforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kps-grafana
                port:
                  number: 80

---
# Default-deny ingress for observability namespace. Subsequent allow
# policies whitelist specific flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: observability
  labels:
    secforge.platform/component: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow ingress-nginx to reach Grafana on port 3000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-grafana
  namespace: observability
  labels:
    secforge.platform/component: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

---
# Allow Prometheus to scrape its own pods + Alertmanager + node-exporter
# pods + kube-state-metrics. Within the observability namespace, allow
# all pod-to-pod traffic on the standard scrape ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-observability-scrape
  namespace: observability
  labels:
    secforge.platform/component: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability

---
# Allow VSO controller (cross-ns) to mount the rendered Secret. Pod
# mounting is NOT subject to NetworkPolicy, but VSO's webhook /
# reconcile loop reaches the K8s API; that path is governed by the API
# server, not pod networking. No additional ingress rule needed for VSO
# itself. (This comment exists so a future reader doesn't re-add a
# spurious allow-vso rule.)

---
# Allow kubelet probes (CNI exempts these on most CNIs, but we declare
# explicitly for portability — cloud edition uses Calico which does
# enforce kubelet ingress unless allow-listed).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probes
  namespace: observability
  labels:
    secforge.platform/component: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            # Docker Desktop kubelet probes come from the node's host
            # network namespace; we allow the broad 10.0.0.0/8 + 127.x
            # which covers Docker Desktop's bridge.
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 3000     # Grafana
        - protocol: TCP
          port: 9090     # Prometheus
        - protocol: TCP
          port: 9093     # Alertmanager
        - protocol: TCP
          port: 9100     # node-exporter
        - protocol: TCP
          port: 8080     # kube-state-metrics
        - protocol: TCP
          port: 3100     # Loki HTTP
        - protocol: TCP
          port: 9095     # Loki gRPC
        - protocol: TCP
          port: 3200     # Tempo HTTP
        - protocol: TCP
          port: 4317     # Tempo / OTel OTLP gRPC
        - protocol: TCP
          port: 4318     # OTel OTLP HTTP
        - protocol: TCP
          port: 3500     # loki-canary
        - protocol: TCP
          port: 8888     # otel-collector metrics
