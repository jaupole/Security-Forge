# Phase 7.8 — SecForge platform alerting rules.
#
# Alertmanager receiver is `null` for the local edition (kps values), so
# alerts fire into the Alertmanager UI / Prometheus but don't paginate
# anyone. View at https://grafana.secforge.local → Alerting, or via
# kubectl port-forward to alertmanager:9093.
#
# Each alert has a corresponding entry in docs/03-runbooks/alerts.md
# with diagnosis + remediation steps.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secforge-platform
  namespace: observability
  labels:
    release: kps
    secforge.platform/component: observability
spec:
  groups:
    - name: secforge.platform
      rules:
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"app|keycloak|spicedb|openbao|istio-system|spire|observability|valkey"}[15m]) >= 5
          for: 5m
          labels:
            severity: warning
            component: platform
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarting >=5x in 15m"
            description: "Pod has restarted {{ $value }} times in the last 15 min. Check `kubectl logs -p` and `kubectl describe pod`. Runbook: alerts.md#podcrashlooping"

        - alert: OpenBaoSealed
          expr: |
            max by (namespace) (vault_core_unsealed{namespace="openbao"}) == 0
          for: 2m
          labels:
            severity: critical
            component: openbao
          annotations:
            summary: "OpenBao is sealed"
            description: "vault_core_unsealed=0. Run `bash infrastructure/openbao/unseal-seal.sh` (3 of 5 Shamir keys). If 403 errors after seal-bao unseal, rotate Transit token (openbao-recovery.md). Runbook: alerts.md#openbaosealed"

        - alert: NamespaceMemoryHigh
          expr: |
            sum by (namespace) (container_memory_working_set_bytes{namespace=~"app|keycloak|spicedb|openbao|observability"})
              / on(namespace) group_left
                sum by (namespace) (kube_resourcequota{type="hard",resource="limits.memory",namespace=~"app|keycloak|spicedb|openbao|observability"})
              > 0.85
          for: 10m
          labels:
            severity: warning
            component: platform
          annotations:
            summary: "{{ $labels.namespace }} memory >85% of quota"
            description: "Working-set memory exceeds 85% of namespace memory quota for 10m. Risk of OOM kills. Runbook: alerts.md#namespacememoryhigh"

    - name: secforge.auth
      rules:
        - alert: KeycloakHTTP5xxRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="keycloak",outcome="SERVER_ERROR"}[5m]))
              / clamp_min(sum(rate(http_server_requests_seconds_count{namespace="keycloak"}[5m])), 1) > 0.05
          for: 10m
          labels:
            severity: warning
            component: keycloak
          annotations:
            summary: "Keycloak 5xx rate >5%"
            description: "{{ $value | humanizePercentage }} of Keycloak HTTP requests returned 5xx for 10m. Check Postgres (Agroal pool), realm config, JVM heap. Runbook: alerts.md#keycloakhttp5xxrate"

        - alert: KeycloakDBPoolExhausted
          expr: |
            agroal_available_count{namespace="keycloak"} == 0
          for: 5m
          labels:
            severity: warning
            component: keycloak
          annotations:
            summary: "Keycloak DB pool fully checked out"
            description: "Agroal available_count=0 for 5m. Inflight requests are queueing. Check Postgres latency. Runbook: alerts.md#keycloakdbpoolexhausted"

    - name: secforge.authz
      rules:
        - alert: SpiceDBCheckLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(grpc_server_handling_seconds_bucket{namespace="spicedb",grpc_method="CheckPermission"}[5m]))
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            component: spicedb
          annotations:
            summary: "SpiceDB CheckPermission p99 >500ms"
            description: "p99 CheckPermission latency is {{ $value | humanizeDuration }} over 10m. Check cache hit rate, Postgres, dispatch cluster health. Runbook: alerts.md#spicedbchecklatencyhigh"

        - alert: SpiceDBGRPCErrorRate
          expr: |
            sum(rate(grpc_server_handled_total{namespace="spicedb",grpc_code!="OK"}[5m]))
              / clamp_min(sum(rate(grpc_server_handled_total{namespace="spicedb"}[5m])), 1) > 0.05
          for: 10m
          labels:
            severity: warning
            component: spicedb
          annotations:
            summary: "SpiceDB gRPC error rate >5%"
            description: "{{ $value | humanizePercentage }} non-OK gRPC for 10m. Check schema, datastore, AuthZEN façade. Runbook: alerts.md#spicedbgrpcerrorrate"

    - name: secforge.secrets
      rules:
        - alert: OpenBaoLockedUsers
          expr: |
            max(vault_core_locked_users{namespace="openbao"}) > 0
          for: 1m
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "OpenBao has {{ $value }} locked user(s)"
            description: "User-lockout floor breached after repeated bad logins. Investigate which auth method + identity. Runbook: alerts.md#openbaolockedusers"

        - alert: OpenBaoAuditFailures
          expr: |
            sum(rate(vault_audit_log_request_failure{namespace="openbao"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
            component: openbao
          annotations:
            summary: "OpenBao audit log writes failing"
            description: "Audit failures are CRITICAL — OpenBao refuses operations when audit can't write. Check stdout/ device, container disk pressure. Runbook: alerts.md#openbaoauditfailures"

    - name: secforge.mesh
      rules:
        - alert: IstioTCPConnectionFailureSpike
          expr: |
            sum(rate(istio_tcp_connections_failed_total[5m]))
              / clamp_min(sum(rate(istio_tcp_connections_opened_total[5m])), 1) > 0.1
          for: 10m
          labels:
            severity: warning
            component: istio
          annotations:
            summary: "ztunnel TCP failure rate >10%"
            description: "{{ $value | humanizePercentage }} of mesh TCP connections fail for 10m. Check AuthorizationPolicies, ztunnel logs, target workload health. Runbook: alerts.md#istiotcpconnectionfailurespike"

    # Phase 7b.4 — Secrets-guardrails alert rules. Source metric:
    # `secrets_guardrail_bypass_total` is emitted by Promtail's
    # metrics-pipeline-stage on the `secrets-guardrails` job (see
    # 04-promtail-values.yaml § extraScrapeConfigs); labels are the
    # closed-enum dimensions {severity, layer, outcome, actor, rule}.
    # The metric is a counter; alerts use rate() / increase() not
    # absolute value.
    #
    # Routing posture: the local-edition Alertmanager receiver is
    # `null` (no paging configured). These rules establish the
    # severity ladder so when the cloud-edition Alertmanager wires
    # PagerDuty/Slack/email receivers, the rules already fire at the
    # correct severities. Local operators view via Alertmanager UI
    # at /alerts and via the Grafana "Secrets Guardrails" dashboard.
    - name: secforge.secrets-guardrails
      rules:
        - alert: SecretsGuardrailBypassCritical
          expr: |
            sum(increase(secrets_guardrail_bypass_total{severity="critical"}[5m])) > 0
          for: 0m
          labels:
            severity: critical
            component: secrets-guardrails
          annotations:
            summary: "secrets.guardrail.bypass severity=critical event(s) seen in 5m"
            description: "{{ $value }} critical bypass event(s) in last 5m. ADR-0013 § severity ladder: critical means the failure mode is not recoverable with the existing escape-hatch (e.g., a leaked image artifact, a `.dockerignore` regression). Page immediately. Inspect via Loki: `{job=\"secrets-guardrails\", severity=\"critical\"}`. Runbook: alerts.md#secretsguardrailbypasscritical"

        - alert: SecretsGuardrailBypassHigh
          expr: |
            sum(increase(secrets_guardrail_bypass_total{severity="high"}[5m])) > 0
          for: 1m
          labels:
            severity: high
            component: secrets-guardrails
          annotations:
            summary: "secrets.guardrail.bypass severity=high event(s) seen"
            description: "{{ $value }} high-severity bypass event(s) in 5m. Examples: Kyverno denial of secret-shaped env without escape hatch, library hardened-mode disabled at startup, scrubber rule fired. Slack/email within 1h. Inspect via Loki: `{job=\"secrets-guardrails\", severity=\"high\"}`. Runbook: alerts.md#secretsguardrailbypasshigh"

        - alert: SecretsGuardrailAnnotatedBypassActiveOver30d
          expr: |
            (
              max by (actor, rule, annotation_ref)
                (timestamp(secrets_guardrail_bypass_total{outcome="annotated-bypass"}))
              - on(actor, rule, annotation_ref)
              min by (actor, rule, annotation_ref)
                (timestamp(secrets_guardrail_bypass_total{outcome="annotated-bypass"}))
            ) > 30 * 24 * 3600
          for: 1h
          labels:
            severity: medium
            component: secrets-guardrails
          annotations:
            summary: "Annotated-bypass active >30d without ticket resolution: {{ $labels.annotation_ref }}"
            description: "An escape-hatch annotation has been emitting events for >30d. Either the underlying ticket ({{ $labels.annotation_ref }}) is stalled or the escape hatch is being used as a permanent backdoor. Weekly digest. Re-evaluate per ADR-0013 § Time-bounded escape hatch. Runbook: alerts.md#secretsguardrailannotatedbypassactiveover30d"

        - alert: SecretsGuardrailBypassRateAnomaly
          expr: |
            (
              sum(rate(secrets_guardrail_bypass_total[1h]))
            )
            >
            (
              avg_over_time(sum(rate(secrets_guardrail_bypass_total[1h]))[7d:1h])
              + 2 * stddev_over_time(sum(rate(secrets_guardrail_bypass_total[1h]))[7d:1h])
            )
          for: 30m
          labels:
            severity: medium
            component: secrets-guardrails
          annotations:
            summary: "Bypass-event rate exceeds 7-day rolling baseline by >2σ"
            description: "Current 1h rate is more than 2 standard deviations above the 7-day rolling average. Either a guardrail layer regressed (something newly emits events) or an attacker is probing. Slack/email within 4h. Cross-reference with the Grafana 'Secrets Guardrails' dashboard's bypass-rate-by-layer panel. Runbook: alerts.md#secretsguardrailbypassrateanomaly"
