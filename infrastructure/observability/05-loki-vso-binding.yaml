# VSO binding for Loki MinIO credentials — Phase 7.4.
#
# Renders OpenBao's secret/data/minio/loki/credentials into a K8s Secret
# the Loki chart consumes via extraEnvFrom (03-loki-values.yaml).
#
# Setup order:
#   1. apply-loki.sh creates a scoped MinIO user `loki-user` with policy
#      allowing s3:GetObject/PutObject/DeleteObject/ListBucket against
#      the `loki-chunks` bucket only.
#   2. apply-loki.sh writes the resulting access_key + secret_key into
#      OpenBao at secret/data/minio/loki/credentials.
#   3. VSO renders this VaultStaticSecret into the K8s Secret consumed
#      by Loki.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: loki-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: loki-vso
    serviceAccount: loki-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: loki-minio-credentials-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: loki-vso
  mount: secret
  type: kv-v2
  path: minio/loki/credentials
  refreshAfter: 60s
  destination:
    name: loki-minio-credentials
    create: true
    type: Opaque
    # Loki's S3 client reads these env vars (chart's extraEnvFrom wires
    # them to the container). Map KV keys → env-var names.
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        AWS_ACCESS_KEY_ID:
          text: '{{ .Secrets.access_key }}'
        AWS_SECRET_ACCESS_KEY:
          text: '{{ .Secrets.secret_key }}'
