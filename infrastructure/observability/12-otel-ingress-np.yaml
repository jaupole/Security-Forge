# Phase 7.6 — allow OTLP traces into the in-cluster collector.
#
# observability ns has default-deny-ingress; this opens 4317/4318 on
# otel-collector pods to the namespaces that are wired to emit traces:
# app (BFF, AuthZEN), keycloak, spicedb, istio-system (mesh tracing).
# Cluster-wide tracing fan-in deliberately doesn't use a wildcard — the
# allow list grows per-component as new tracing producers come online.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-ingress-to-otel-collector
  namespace: observability
  labels:
    secforge.platform/component: otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spicedb
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
