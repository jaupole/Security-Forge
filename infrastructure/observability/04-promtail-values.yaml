# Promtail Helm values — Phase 7.4.
#
# DaemonSet — one Promtail pod per node, scraping every container's
# STDOUT log via the kubelet log directory.

fullnameOverride: promtail

config:
  clients:
    - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    # Pipeline stages run on every log line. The JSON stage attempts to
    # parse the line; if the line isn't JSON the stage simply produces
    # no extracted fields (no error). The labels stage then attaches
    # whatever was extracted.
    pipelineStages:
      - cri: {}
      - json:
          expressions:
            level: level
            trace_id: trace_id
            span_id: span_id
            msg: msg
      - labels:
          level:
          # trace_id is intentionally NOT a label (high cardinality);
          # leave it as a queryable structured field.
    # Do NOT override `common:` — the chart's default common block
    # contains the critical `__path__` relabel that maps each discovered
    # pod to its kubelet log file path under /var/log/pods. Replacing
    # `common` drops that mapping and Promtail records "no_path" for
    # every target. The ambient-mesh / istio-proxy filter we'd want here
    # is moot anyway: ambient deploys no sidecars.

    # Phase 7b.1 — dedicated scrape job for security-events-collector
    # stdout. Per-event JSON-line schema is defined in ADR-0013 § 8 and
    # apps/security-events-collector/event.go. We promote the closed-
    # enum fields (severity, layer, outcome) plus actor and rule to
    # indexed labels per phase-07b prompt § 7b.1; that's wider than
    # Loki best-practice usually wants but is bounded in practice
    # (severity ∈ {warn, high, critical}, layer ∈ 7 closed-enum values,
    # outcome ∈ 4 closed-enum values, actor is a SPIFFE-ID or kc:<sub>
    # which clusters per workload, rule is per-policy and grows slowly).
    # The metrics stage emits a Prometheus counter per accepted event;
    # Phase 7b.4 PrometheusRule alerts target that counter.
    extraScrapeConfigs: |
      - job_name: secrets-guardrails
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Restrict to security-events-collector pods (any namespace).
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: security-events-collector
          # Drop the istio-proxy sidecar log if one ever appears
          # (ambient mode shouldn't inject one, defensive only).
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: collector
          # Set canonical job + namespace + pod labels.
          - action: replace
            replacement: secrets-guardrails
            target_label: job
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Map kubelet log path. Same template every Promtail uses;
          # without this the file-tail sd-discovers nothing.
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                ts: ts
                event: event
                layer: layer
                severity: severity
                outcome: outcome
                actor: actor
                rule: rule
                annotation_ref: annotation_ref
                request_id: request_id
          # Drop log lines that aren't the canonical bypass event
          # (collector startup logs etc. fall through to default).
          - match:
              selector: '{job="secrets-guardrails"} !~ ".*\"event\":\"secrets.guardrail.bypass\".*"'
              action: drop
          - labels:
              severity:
              layer:
              rule:
              outcome:
              actor:
          # Phase 7b.4 — emit a Prometheus counter per accepted event so
          # the PrometheusRule alerts in 13-alerting-rules.yaml have
          # something to evaluate. The counter is exposed on Promtail's
          # /metrics endpoint and scraped by the Promtail ServiceMonitor.
          - metrics:
              secrets_guardrail_bypass_total:
                type: Counter
                description: "Count of secrets.guardrail.bypass events Promtail has shipped to Loki, by closed-enum dimensions."
                source: event
                config:
                  match_all: true
                  action: inc

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceMonitor:
  enabled: true
  labels:
    release: kps

# Default DaemonSet tolerations cover the control-plane node (this is a
# single-node cluster, so the control-plane node IS the worker).
tolerations:
  - effect: NoSchedule
    operator: Exists
