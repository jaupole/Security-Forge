# Platform Health dashboard ConfigMap — Phase 7.7 (advance-landed in
# Phase 7 first session per user caveat: must precede 7.2 Wazuh
# deployment so we can observe Wazuh's boot).
#
# Picked up by Grafana's `sidecar.dashboards` provisioner via the
# `grafana_dashboard: "1"` label. Source-of-truth JSON is at
