# Tempo single-binary Helm values — Phase 7.5.
#
# Architecture: docs/01-architecture/08-observability.md (§Tempo + OTel)
# Chart: grafana/tempo (single-binary mode, NOT tempo-distributed)
#
# Storage: traces in MinIO `tempo-traces`. Retention: 168h (7d), enforced
# by Tempo's compactor.
#
# Schema gotcha (Phase 7.5 first install): the chart's `tempo:` block holds
# Tempo binary config (storage/receivers/ingester/server/extraEnv etc.).
# K8s pod-spec stuff (podLabels/persistence/serviceMonitor/ingress) lives
# at ROOT level. Mis-indenting tempo-config under root makes it leak into
# pod-template labels via the chart's podLabels rendering and breaks the
# StatefulSet schema. This file's structure is correct; do not flatten.

tempo:
  retention: 168h    # 7 days
  reportingEnabled: false

  # Tempo's config file uses ${ACCESS_KEY} / ${SECRET_KEY} substitution
  # for the S3 credentials; without expand-env, Tempo reads the literal
  # `${ACCESS_KEY}` string and MinIO returns "Access Key Id does not exist".
  extraArgs:
    config.expand-env: true

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi  # bumped 2026-05-04 — Grafana search OOMed at 1Gi

  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo-traces
        endpoint: minio.minio.svc.cluster.local:9000
        access_key: ${ACCESS_KEY}      # injected via env from VSO-rendered Secret
        secret_key: ${SECRET_KEY}
        insecure: true                 # in-cluster MinIO uses HTTP
        forcepathstyle: true
      pool:
        max_workers: 100
        queue_depth: 10000

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # Tempo reads access keys via env-var substitution in tempo.yaml; the
  # chart's `extraEnvFrom` wires the rendered Secret into the container.
  extraEnvFrom:
    - secretRef:
        name: tempo-minio-credentials
        optional: false
  # Reuse the access_key/secret_key env names from the VSO-rendered
  # Secret (see 09-tempo-vso-binding.yaml transformation).
  extraEnv:
    - name: ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: tempo-minio-credentials
          key: ACCESS_KEY
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: tempo-minio-credentials
          key: SECRET_KEY

# ─── Root-level (StatefulSet pod-spec / chart-level) values ──────────

# MinIO ingress NetworkPolicy gates on `minio-client: "true"` label.
podLabels:
  minio-client: "true"

# Tempo is queried only in-cluster (Grafana datasource); no Ingress.
ingress:
  enabled: false

persistence:
  enabled: true
  storageClassName: hostpath
  size: 10Gi
  accessModes: [ReadWriteOnce]

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kps
