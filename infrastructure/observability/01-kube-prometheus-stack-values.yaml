# kube-prometheus-stack Helm values — Phase 7.3.
#
# Architecture: docs/01-architecture/08-observability.md
# Chart: prometheus-community/kube-prometheus-stack
#
# Local Edition sizing: single-replica everything, 14-day Prometheus
# retention, OIDC-federated Grafana auth, cross-namespace ServiceMonitor
# selection so platform components can ship metrics without per-monitor
# allowlisting.

fullnameOverride: kps

# ─── Cluster-wide selector relaxation ──────────────────────────────────
# By default, the chart's Prometheus only watches ServiceMonitors with
# release={chartRelease}. We want any ServiceMonitor in any namespace
# scraped — platform components (Keycloak, SpiceDB, OpenBao) ship their
# own ServiceMonitor manifests; opting in to the chart's selector would
# couple them to this release name.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector: {}

    retention: 14d
    retentionSize: "18GB"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: hostpath
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        cpu: 1
        memory: 2Gi

  # We provide our own Ingress (02-grafana-ingress.yaml exposes Grafana,
  # not Prometheus directly — Prometheus is internal-only).
  ingress:
    enabled: false

# ─── Alertmanager ──────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: hostpath
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  ingress:
    enabled: false

  # Local-edition receiver: 'null' (no-op). The chart's default config
  # has internal subroutes referring to a 'null' receiver; we keep that
  # name. Phase 7.8 will add real receivers (PagerDuty/Slack equivalents
  # — local edition routes to STDOUT via webhook_configs).
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - matchers: [alertname="Watchdog"]
          receiver: 'null'
    receivers:
      - name: 'null'

# ─── Grafana ───────────────────────────────────────────────────────────
grafana:
  replicas: 1
  defaultDashboardsTimezone: browser

  # The chart's default initChownData runs as root with CHOWN cap to set
  # ownership on the persistent volume. Modern K8s (1.20+) handles this
  # via fsGroup + fsGroupChangePolicy=OnRootMismatch; the init container
  # is unnecessary and violates restricted PSS. Disabled here so the
  # observability namespace can stay restricted-compliant for everything
  # except node-exporter.
  initChownData:
    enabled: false

  persistence:
    enabled: true
    storageClassName: hostpath
    size: 5Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  # Resolve auth.secforge.local to ingress-nginx clusterIP so the OIDC
  # token endpoint is reachable from inside the pod. Same pattern as
  # OpenBao (infrastructure/openbao/04-openbao-values.yaml).
  hostAliases:
    - ip: "10.96.97.16"
      hostnames:
        - auth.secforge.local

  # OIDC client_secret comes from VSO-rendered Secret. The K8s Secret
  # is shaped (via VSO transformation in 00-grafana-vso-binding.yaml)
  # to expose the value under env-var name
  # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
  envFromSecrets:
    - name: grafana-oidc-client-secret
      optional: false

  # Mount the mkcert CA so Grafana can verify Keycloak's TLS cert during
  # the OIDC handshake. Use `extraSecretMounts` (the grafana subchart's
  # canonical key for Secret-sourced volumes); plain `extraVolumes` with
  # a `secret:` block silently degrades to emptyDir on this chart version.
  extraSecretMounts:
    - name: mkcert-ca
      mountPath: /etc/grafana/keycloak-ca
      secretName: mkcert-ca-bundle
      readOnly: true
      defaultMode: 0400

  grafana.ini:
    server:
      root_url: "https://grafana.secforge.local"
      domain: "grafana.secforge.local"
      enforce_domain: true
    security:
      cookie_secure: true
      cookie_samesite: "lax"
      strict_transport_security: true
      strict_transport_security_max_age_seconds: 63072000   # 2y to match platform HSTS
      strict_transport_security_preload: true
      x_content_type_options: true
      x_xss_protection: true
    auth:
      disable_login_form: true            # OIDC only; no local username/password
      disable_signout_menu: false
      oauth_auto_login: false             # let user click button — no silent SSO
    "auth.generic_oauth":
      enabled: true
      name: "Keycloak"
      allow_sign_up: true                  # auto-provision Grafana users on first OIDC login
      client_id: "grafana"
      # client_secret comes from envFromSecrets above (GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET)
      scopes: "openid profile email"
      auth_url: "https://auth.secforge.local/realms/platform/protocol/openid-connect/auth"
      token_url: "https://auth.secforge.local/realms/platform/protocol/openid-connect/token"
      api_url: "https://auth.secforge.local/realms/platform/protocol/openid-connect/userinfo"
      tls_client_ca: "/etc/grafana/keycloak-ca/ca.crt"
      tls_skip_verify_insecure: false
      use_pkce: true
      # WORKAROUND (7.0.b carry-in): same plumbing issue as OpenBao —
      # Keycloak's userinfo response doesn't surface `realm_access.roles`
      # despite the `roles` default scope being attached. Until 7.0.b
      # debugs and fixes the claim path, bind on preferred_username as a
      # single-user workaround. Mirrors infrastructure/openbao/configure-
      # auth-oidc.sh's bound_claims pattern. See PLAN.md follow-up #1
      # (90-day fallback escalation 2026-07-29).
      role_attribute_path: "preferred_username == 'jason.upole' && 'Admin' || 'Viewer'"
      role_attribute_strict: true
    log:
      mode: "console"
      level: "info"

  # Datasources are provisioned via ConfigMap. Prometheus is built-in
  # to the chart; Loki and Tempo land in 7.4 / 7.5 and append here.
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true     # auto-creates Prometheus DS pointing at the chart's Prom
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      provider:
        allowUiUpdates: false            # dashboards are git-source-of-truth

  # We provide our own Ingress (02-grafana-ingress.yaml).
  ingress:
    enabled: false

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

# ─── kube-state-metrics ────────────────────────────────────────────────
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ─── prometheus-node-exporter ──────────────────────────────────────────
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ─── windows-exporter / kube-controller-manager / etcd / kube-scheduler / kube-proxy ──
# Not relevant on Docker Desktop K8s — disable the scrapers / exporters
# the chart tries to spin up for upstream-K8s control planes.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
windowsMonitoring:
  enabled: false
