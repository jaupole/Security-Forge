# VSO binding for Grafana — Phase 7.3.
#
# Renders the OIDC client_secret from OpenBao's secret/data/grafana/oidc
# into a K8s Secret in the observability namespace. The kube-prometheus-
# stack Helm chart's grafana subchart references this Secret via
# envFromSecret in 01-kube-prometheus-stack-values.yaml.
#
# Per ADR-0015, Grafana is operator-shaped (the chart owns the
# Deployment), so it consumes secrets through VSO rather than the
# direct-API path that first-class apps use.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: grafana-vso
    serviceAccount: grafana-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-oidc-client-secret-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: default
  mount: secret
  type: kv-v2
  path: grafana/oidc
  refreshAfter: 60s
  destination:
    name: grafana-oidc-client-secret
    create: true
    type: Opaque
    # Chart consumes the env var GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
    # The KV entry stores the secret under key `client_secret`; remap
    # via transformation so the K8s Secret has the env-var-shaped key.
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          text: '{{ .Secrets.client_secret }}'
