# Phase 7d Item 7 — VSO binding for the Wazuh dashboard's OIDC config.
#
# Renders K8s Secret `wazuh-oidc-vso` in the `wazuh` namespace from the
# OpenBao path `secret/data/wazuh/oidc`. Keys: client_id, client_secret,
# issuer, redirect_uri, source. The dashboard pod consumes the rendered
# Secret either via `envFrom` (operator-shaped, like AuthZEN's preshared-
# key binding) OR by mounting selected keys into the OIDC config block
# of opensearch_dashboards.yml (see configure-wazuh-oidc.sh).
#
# Bootstrap:
#   1. infrastructure/keycloak/clients/wazuh.sh — provisions the
#      Keycloak client + writes secret/data/wazuh/oidc.
#   2. infrastructure/openbao/policies/vso.hcl — adds the wazuh/oidc
#      paths.
#   3. infrastructure/vault-secrets-operator/configure-openbao-role.sh
#      — adds the wazuh-vso K8s auth role.
#   4. kubectl apply -f infrastructure/wazuh/03-vso-binding.yaml — this
#      file.
#   5. infrastructure/wazuh/configure-wazuh-oidc.sh — wires the rendered
#      Secret into the dashboard pod + indexer security plugin.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-vso
  namespace: wazuh
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: wazuh-oidc
  namespace: wazuh
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: wazuh-vso
    serviceAccount: wazuh-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: wazuh-oidc
  namespace: wazuh
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: wazuh-oidc
  mount: secret
  type: kv-v2
  path: wazuh/oidc
  refreshAfter: 60s
  destination:
    name: wazuh-oidc-vso
    create: true
    type: Opaque
