# Allow OpenBao (in `openbao` ns) → secforge-app-db (in `app` ns) on
# port 5432, for the database secrets engine. Lives in `app` ns because
# NetworkPolicy ingress rules apply to the destination's namespace.
#
# This sits alongside the future BFF → Postgres rules; the namespace
# selector matches `kubernetes.io/metadata.name: openbao` for any pod
# in the openbao namespace (the OpenBao Helm chart's labels vary by
# release name, so a ns-level match is more robust than a label-level).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openbao-to-secforge-app-db
  namespace: app
  labels:
    secforge.platform/component: openbao
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: secforge-app-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 5432
