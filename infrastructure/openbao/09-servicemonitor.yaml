# Phase 7.6 — OpenBao ServiceMonitor.
#
# Phase 7d Item 4 (2026-05-02): /v1/sys/metrics now requires bearer-token
# authentication via the metrics-policy-bound periodic token rendered
# into the K8s Secret `openbao-metrics-token` by
# infrastructure/openbao/configure-metrics-auth.sh. Belt-and-suspenders
# on top of the existing `allow-prometheus-to-openbao-metrics`
# NetworkPolicy.
#
# Local-edition still uses insecureSkipVerify because openbao serves
# with the cert-manager-issued `openbao-tls` cert valid for the
# in-cluster Service DNS names — but Prometheus discovers pods by IP
# and connects via https://<pod-IP>:8200, which doesn't match the SAN
# list. Cloud migration drops insecureSkipVerify after fixing the
# Prometheus discovery to use Service DNS (or adding pod-IP SANs).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openbao
  namespace: openbao
  labels:
    release: kps
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: secforge-platform
spec:
  # Scoping rationale:
  #   - app.kubernetes.io/instance: openbao  → excludes seal-OpenBao (which has
  #     instance=openbao-seal and does not have the unauth-metrics listener block).
  #   - openbao-internal: "true"             → picks the single headless Service
  #     that lists all 3 main pods exactly once (avoids duplicate scrapes from
  #     openbao, openbao-active, openbao-standby).
  #   - port: https                          → 8200 only; skips the cluster port 8201.
  selector:
    matchLabels:
      app.kubernetes.io/instance: openbao
      openbao-internal: "true"
  namespaceSelector:
    matchNames:
      - openbao
  endpoints:
    - port: https
      path: /v1/sys/metrics
      params:
        format: ["prometheus"]
      interval: 30s
      scrapeTimeout: 10s
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      # Phase 7d Item 4 — bearer-token auth (replaces
      # unauthenticated_metrics_access=true on the listener). Periodic
      # token (period=720h) auto-refreshes on every scrape; cold-pause
      # >30d expires it (re-run configure-metrics-auth.sh to recover).
      bearerTokenSecret:
        name: openbao-metrics-token
        key: token
