# Phase 7.6 — OpenBao ServiceMonitor.
#
# /v1/sys/metrics is gated by the listener's
# `telemetry { unauthenticated_metrics_access = true }` block; the security
# boundary is the `allow-prometheus-to-openbao-metrics` NetworkPolicy.
#
# Local-edition uses insecureSkipVerify because openbao serves with the
# cert-manager-issued `openbao-tls` cert valid for the in-cluster Service
# DNS names — but Prometheus discovers pods by IP and connects via
# https://<pod-IP>:8200, which doesn't match the SAN list. Trade-off
# documented in the listener block of 04-openbao-values.yaml; cloud
# migration switches to token-auth + proper SAN.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openbao
  namespace: openbao
  labels:
    release: kps
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: secforge-platform
spec:
  # Scoping rationale:
  #   - app.kubernetes.io/instance: openbao  → excludes seal-OpenBao (which has
  #     instance=openbao-seal and does not have the unauth-metrics listener block).
  #   - openbao-internal: "true"             → picks the single headless Service
  #     that lists all 3 main pods exactly once (avoids duplicate scrapes from
  #     openbao, openbao-active, openbao-standby).
  #   - port: https                          → 8200 only; skips the cluster port 8201.
  selector:
    matchLabels:
      app.kubernetes.io/instance: openbao
      openbao-internal: "true"
  namespaceSelector:
    matchNames:
      - openbao
  endpoints:
    - port: https
      path: /v1/sys/metrics
      params:
        format: ["prometheus"]
      interval: 30s
      scrapeTimeout: 10s
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
