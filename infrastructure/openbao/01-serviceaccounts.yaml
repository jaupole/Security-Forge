# ServiceAccounts so SPIFFE IDs are stable:
#   spiffe://secforge.local/ns/openbao/sa/openbao-seal
#   spiffe://secforge.local/ns/openbao/sa/openbao
#
# The Helm chart can create its own SA, but using our own keeps the
# SPIFFE ID predictable across chart upgrades.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-seal
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-seal
    app.kubernetes.io/component: seal-trusted-root
    app.kubernetes.io/part-of: secforge-platform
    secforge.platform/component: openbao-seal
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: secrets-management
    app.kubernetes.io/part-of: secforge-platform
    secforge.platform/component: openbao
automountServiceAccountToken: true
