# Phase 5.9 test workload — exercises the SPIRE → JWT → OpenBao flow.
#
# Pod runs in `app` namespace under the `helloworld-bff` ServiceAccount,
# which the existing `secforge-app` ClusterSPIFFEID covers — so SPIRE
# auto-issues an SVID with ID
#   spiffe://secforge.local/ns/app/sa/helloworld-bff
#
# Init container (spiffe-helper) fetches a JWT-SVID with audience=openbao
# and writes it to a shared emptyDir.
#
# Main container reads that JWT, authenticates to OpenBao via the
# `helloworld-bff` JWT role, and exercises both:
#   - secret/data/apps/helloworld/test  (static KV)
#   - database/creds/helloworld-app-readwrite  (dynamic Postgres cred)
#
# The pod runs to completion; check logs to verify.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helloworld-bff
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-bff
    secforge.platform/component: test-workload
automountServiceAccountToken: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-conf
  namespace: app
  labels:
    secforge.platform/component: test-workload
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/socket"
    daemon_mode = false
    jwt_svids = [
      {
        jwt_audience       = "openbao"
        jwt_svid_file_name = "/shared/openbao.jwt"
      }
    ]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-jwt-test-script
  namespace: app
  labels:
    secforge.platform/component: test-workload
data:
  run.py: |
    #!/usr/bin/env python3
    """Phase 5.9 test — SPIRE → JWT → OpenBao end-to-end.

    Reads the JWT-SVID written by spiffe-helper, authenticates to
    OpenBao via auth/jwt/login (role=helloworld-bff), then exercises
    a static KV read + a dynamic Postgres credential mint.
    """
    import json, ssl, sys, urllib.request

    OPENBAO = "https://openbao.openbao.svc.cluster.local:8200"
    ctx = ssl.create_default_context()
    ctx.check_hostname = False
    ctx.verify_mode = ssl.CERT_NONE  # local cert; mkcert CA not installed in image

    def call(method, path, body=None, token=None):
        h = {"Content-Type": "application/json"}
        if token: h["X-Vault-Token"] = token
        data = json.dumps(body).encode() if body else None
        req = urllib.request.Request(OPENBAO + path, data=data, headers=h, method=method)
        with urllib.request.urlopen(req, context=ctx, timeout=10) as r:
            return json.loads(r.read())

    with open("/shared/openbao.jwt") as f:
        jwt = f.read().strip()
    print(f"==> JWT-SVID fetched ({len(jwt)} chars)")

    # 1. JWT login → OpenBao token
    auth = call("POST", "/v1/auth/jwt/login", {"jwt": jwt, "role": "helloworld-bff"})
    token = auth["auth"]["client_token"]
    print(f"==> OpenBao token issued; policies={auth['auth']['token_policies']}")

    # 2. Static KV read
    kv = call("GET", "/v1/secret/data/apps/helloworld/test", token=token)
    msg = kv["data"]["data"].get("message", "")
    if msg != "hello from openbao":
        print(f"FAIL: KV message wrong: {kv!r}", file=sys.stderr); sys.exit(1)
    print(f"==> static KV OK: message='{msg}'")

    # 3. Dynamic Postgres cred
    db = call("GET", "/v1/database/creds/helloworld-app-readwrite", token=token)
    user = db["data"]["username"]
    pwlen = len(db["data"]["password"])
    lease = db["lease_duration"]
    print(f"==> dynamic Postgres cred OK: user={user} pwlen={pwlen} lease={lease}s")

    print("\n==> ALL CHECKS PASSED")

---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-jwt-test
  namespace: app
  labels:
    app.kubernetes.io/name: openbao-jwt-test
    secforge.platform/component: test-workload
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-jwt-test
        spiffe.io/spire-managed-identity: "true"
        secforge.platform/component: test-workload
    spec:
      serviceAccountName: helloworld-bff
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }

      initContainers:
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0
          args: ["-config", "/etc/spiffe/helper.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: helper-conf
              mountPath: /etc/spiffe
              readOnly: true
            - name: shared
              mountPath: /shared

      containers:
        - name: test
          image: docker.io/python:3.12-alpine
          command: ["python3", "/script/run.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: script
              mountPath: /script
              readOnly: true

      volumes:
        - name: spiffe-workload-api
          csi: { driver: csi.spiffe.io, readOnly: true }
        - name: helper-conf
          configMap: { name: spiffe-helper-conf }
        - name: script
          configMap: { name: openbao-jwt-test-script, defaultMode: 0444 }
        - name: shared
          emptyDir: {}
