# Phase 8a — VSO bindings for the Teleport pod's secrets.
#
# Two VSO consumers in the `teleport` ns:
#   - `teleport-vso` SA → renders `teleport-oidc-vso` (Keycloak client_secret
#     etc., from secret/data/teleport/oidc) for the Teleport auth pod.
#   - Same SA also renders `teleport-minio-vso` (scoped MinIO user creds,
#     from secret/data/minio/teleport/credentials) for session recording.
#
# The cross-ns VaultConnection `vault-secrets-operator/openbao` is reused
# (created in Phase 6.10b). Each VaultStaticSecret references the local
# VaultAuth `default`.
#
# Bootstrap order:
#   1. infrastructure/openbao/policies/vso.hcl extended (adds the two
#      teleport paths) → bash infrastructure/openbao/load-policies.sh.
#   2. infrastructure/vault-secrets-operator/configure-openbao-role.sh
#      adds the `teleport-vso` K8s auth role → re-run.
#   3. kubectl apply -f infrastructure/teleport/01-vso-binding.yaml.
#   4. infrastructure/keycloak/clients/teleport.sh writes
#      secret/data/teleport/oidc; infrastructure/teleport/apply-minio-user.sh
#      writes secret/data/minio/teleport/credentials.
#   5. VSO reconciles → both K8s Secrets render in `teleport` ns.
#
# 8b's Helm release of teleport-cluster references both Secrets via
# secretKeyRef in the chart values.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teleport-vso
  namespace: teleport
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: teleport
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: teleport-vso
    serviceAccount: teleport-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: teleport-oidc
  namespace: teleport
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: default
  mount: secret
  type: kv-v2
  path: teleport/oidc
  refreshAfter: 60s
  destination:
    name: teleport-oidc-vso
    create: true
    type: Opaque

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: teleport-minio
  namespace: teleport
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: default
  mount: secret
  type: kv-v2
  path: minio/teleport/credentials
  refreshAfter: 60s
  destination:
    name: teleport-minio-vso
    create: true
    type: Opaque
