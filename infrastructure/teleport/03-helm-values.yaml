# Phase 8b — Helm values for teleport-cluster (chart 18.7.6).
#
# chartMode: standalone — single-pod auth+proxy with PVC storage.
# Local-edition tradeoff: the CNPG `secforge-teleport-db` cluster
# provisioned in 8a is kept on disk as "reserved for HA promotion"
# but unused at this single-replica hardening level. Postgres
# backend would require chartMode=scratch + custom auth.teleportConfig
# + plaintext password in the chart config (or extra Secret-rendering
# init containers) — disproportionate complexity for single-replica.
# Cloud edition uses cloud-managed Postgres or DynamoDB anyway, so
# this is not a cloud-migration regression. See ADR-0024 § Backend
# choice for the trade-off.
#
# Authentication:
#   - OIDC connector applied separately as a CRD (8b.2) — references
#     the teleport-oidc-vso K8s Secret rendered by VSO from
#     secret/data/teleport/oidc.
#
# TLS:
#   - existingSecretName: cert-manager mkcert-issued cert for
#     tp.secforge.local + in-cluster Service DNS SANs.
#   - existingCASecretName: mkcert local CA bundle, copied into
#     the teleport ns by apply-helm.sh. Setting this auto-injects
#     SSL_CERT_FILE into the proxy + auth pods so they trust the
#     mkcert CA when validating their own cert chain (and the
#     OIDC discovery URL to Keycloak, which is also mkcert-signed).
#     DANGER per chart docs: this DROPS the distroless container's
#     default Mozilla CA bundle — Teleport will only trust mkcert.
#     For local edition this is intentional; every TLS endpoint
#     Teleport reaches is mkcert-signed (Keycloak) or in-cluster
#     plaintext (MinIO via insecure=true in audit_sessions_uri).
#
# Session recording: the audit_sessions_uri override under
# auth.teleportConfig.teleport.storage tells Teleport to upload
# recordings to MinIO via the S3-compatible API. AWS_* env vars
# below feed the MinIO creds.

chartMode: standalone

# Cluster identity. tsh users see this name; Teleport persists it
# across pod restarts via the PVC.
clusterName: secforge-local

# Public hostname users hit in the browser + tsh.
#
# Port 8443 (not 443) for the local-edition prototype: ingress-nginx
# does not have --enable-ssl-passthrough, and Teleport's TLS routing
# (single-port SNI/ALPN multiplex for web + kube-proxy + db-proxy)
# is incompatible with L7 ingress termination. Operator port-forwards
# `kubectl port-forward -n teleport svc/teleport 8443:443` on demand.
# Cloud-edition uses a real LoadBalancer or SSL-passthrough ingress
# on 443 — see ADR-0024 § Local-edition exposure.
publicAddr: ["tp.secforge.local:8443"]

# OIDC is the only sign-in option (no local users, no GitHub).
authentication:
  type: oidc

  # secondFactors is the modern (preferred) form — accepts a list
  # of "otp" / "sso" / "webauthn". Setting it satisfies Teleport's
  # "MFA framework must be configured" precondition that rejects
  # `secondFactor: optional`/`off` with "cannot disable
  # multi-factor authentication".
  #
  # Local-edition posture (per ADR-0024 § MFA posture and ADR-0007
  # amendment): users authenticate via Keycloak OIDC SSO, which
  # already enforces TOTP at the realm. The "sso" entry tells
  # Teleport that an OIDC-asserted identity counts as MFA-equivalent
  # so users get no Teleport-native per-session MFA prompt. The
  # "otp" entry is included to satisfy the framework precondition
  # and is unused in practice — there are no Teleport-local users
  # to enroll a TOTP for.
  #
  # Cloud-edition values overlay swaps this to ["webauthn", "sso"]
  # at the production-hardening trigger, with `require_session_mfa:
  # hardware_key_touch` re-added on the admin role.
  secondFactors: ["otp", "sso"]

  # webauthn rp_id pinned to the public hostname so a future
  # cloud-edition cutover to hardware FIDO2 doesn't invalidate
  # existing registrations.
  webauthn:
    rp_id: "tp.secforge.local"

# TLS: existing mkcert cert from Phase 8a Certificate.
# CA bundle staged into the ns by apply-helm.sh (key: ca.pem,
# matching the chart default `tls.existingCASecretKeyName`).
tls:
  existingSecretName: tp-secforge-local-tls
  existingCASecretName: mkcert-ca-bundle

# ACME OFF (we use mkcert).
acme: false

# Persistence: PVC-backed sqlite-style backend for cluster state.
# Per-pod single-AZ; cloud-promotion swaps to cloud-managed Postgres
# (chart values switch to "aws"/"gcp"/"azure" mode at that time).
persistence:
  enabled: true
  volumeSize: 5Gi

# Single replica everywhere (local edition has one node + a small
# ResourceQuota). The chart docs warn that the proxy defaults to 2
# replicas even when highAvailability.replicaCount=1; the explicit
# proxy.highAvailability.replicaCount: 1 below forces a single proxy.
highAvailability:
  replicaCount: 1

# Resource budget: small for local edition. Top-level `resources`
# applies to the auth pod; `proxy.resources` is its own knob and
# defaults to limits.cpu=1 — too large for our quota. Tightened
# here to match auth.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi
proxy:
  highAvailability:
    replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# PSS=restricted compliance — teleport ns enforces this label.
# Chart's default pod template lacks the required securityContext;
# we provide the full restricted-tier set here.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 9807     # Teleport image's "teleport" UID (per upstream docs)
  runAsGroup: 9807
  fsGroup: 9807
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 9807
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Namespace-scoped service account (chart creates by default).
# SPIFFE-CSI mount via extraVolumes/extraVolumeMounts so the auth
# pod can present a SPIFFE-ID for OpenBao reads in the future
# (currently unused but matches platform pattern).
extraLabels:
  pod:
    spiffe.io/spire-managed-identity: "true"
    # MinIO ingress NetworkPolicy in the minio ns selects on this
    # label (see infrastructure/minio/networkpolicy-from-teleport.yaml).
    # Auth uploads session recordings; proxy + operator do not reach
    # MinIO but the chart's extraLabels.pod applies cluster-wide,
    # which is fine — the NetworkPolicy is scoped by namespace + label.
    minio-client: "true"

extraVolumes:
  - name: spiffe-workload-api
    csi:
      driver: csi.spiffe.io
      readOnly: true

extraVolumeMounts:
  - name: spiffe-workload-api
    mountPath: /spiffe-workload-api
    readOnly: true

# Auth-pod config overrides — the chart auto-generates the
# auth_service.authentication block from the top-level
# `authentication.*` values above. We only inject what the chart
# does NOT cover:
#   - audit_sessions_uri pointing at MinIO (S3-compatible)
#   - structured JSON logs to STDOUT (Promtail + Wazuh ingest from there)
auth:
  teleportConfig:
    # TLS routing (single-port ALPN/SNI multiplex). Without this the
    # auth server defaults to proxy_listener_mode=separate, which makes
    # tsh CLI try to dial individual proxy ports (3023 SSH proxy, 3024
    # reverse tunnel, 3026 kube, 3036 mysql). The local-edition
    # operator port-forward only exposes 443→8443, so separate-mode
    # CLI flows fail with "dial tcp 127.0.0.1:3023: connection refused"
    # even though browser SSO works. multiplex mode routes everything
    # through the single 8443 port. Phase 8b prototype B verified
    # 2026-05-03; see ADR-0024.
    auth_service:
      proxy_listener_mode: multiplex
    teleport:
      log:
        output: stdout
        severity: INFO
        format:
          output: json
      cache:
        enabled: true
      # Session recording → MinIO (S3-compatible). audit_sessions_uri
      # belongs under teleport.storage per Teleport config schema.
      storage:
        type: dir
        path: /var/lib/teleport
        audit_sessions_uri: "s3://teleport-recordings?endpoint=minio.minio.svc.cluster.local:9000&disablesse=true&insecure=true&use_fips_endpoint=false"

  # Inject MinIO credentials as AWS_* env vars so Teleport's S3
  # client picks them up for session recording uploads. The Secret
  # is rendered by VSO from secret/data/minio/teleport/credentials.
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: teleport-minio-vso
          key: access_key
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: teleport-minio-vso
          key: secret_key
    - name: AWS_REGION
      value: "us-east-1"

# Image: Community Edition (open source). Pinned to chart's app version.
image: public.ecr.aws/gravitational/teleport-distroless

# Operator: deploy alongside (lets us manage Roles + OIDCConnector
# via TeleportRole / TeleportOIDCConnector CRDs). Saves us writing
# tctl-driven apply scripts.
operator:
  enabled: true
  image: public.ecr.aws/gravitational/teleport-operator
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
