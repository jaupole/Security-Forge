# Phase 8b prototype B — GitHub OAuth connector for Teleport CE.
#
# Why this exists (and 04-oidc-connector.yaml is shelved):
#   Teleport Community Edition does NOT support OIDC connectors —
#   that feature is gated to Teleport Enterprise (verified in operator
#   logs: "OIDC connectors are only available in Teleport Enterprise
#   edition. TeleportOIDCConnector resources won't be reconciled" and
#   in https://goteleport.com/docs/feature-matrix/ — CE's SSO row
#   lists only "GitHub"). So local-edition Teleport uses a GitHub
#   OAuth App against real github.com instead of Keycloak SSO.
#
# Cloud-edition cutover trigger: when migrating to VPS we promote
# Teleport CE → Enterprise; at that point the planned Keycloak OIDC
# connector (04-oidc-connector.yaml, kept on disk for reference)
# replaces this file. Mapping is identity-equivalent
# (admin/developer/viewer roles unchanged).
#
# What Jason did at github.com to bootstrap this:
#   1. Settings → Developer settings → OAuth Apps → New OAuth App
#      - Application name: SecForge Local Teleport
#      - Homepage URL: https://tp.secforge.local
#      - Authorization callback URL:
#        https://tp.secforge.local/v1/webapi/github/callback
#   2. After creation, generated a client secret (one-time display).
#   3. Created/used a GitHub org with a team containing his account
#      (Teleport CE GithubConnector requires teams_to_roles — there
#      is NO direct user mapping in the V3 connector schema).
#   4. Ran apply-github-connector.sh with the values, which writes
#      them to OpenBao at secret/data/teleport/github and applies
#      this CR with the org/team substituted in.
#
# The operator's secret-lookup syntax `secret://<secret>/<key>` pulls
# client_secret from the VSO-rendered teleport-github-vso Secret
# without baking it into the CR.

apiVersion: resources.teleport.dev/v3
kind: TeleportGithubConnector
metadata:
  name: github
  namespace: teleport
  labels:
    secforge.platform/component: teleport
spec:
  # client_id is non-secret (visible in any GitHub OAuth callback URL),
  # so apply-github-connector.sh substitutes the literal value in here
  # at apply time via envsubst. client_secret is fetched from OpenBao.
  client_id: __GITHUB_CLIENT_ID__
  client_secret: secret://teleport-github-vso/client_secret
  # Port :8443 matches the operator's `kubectl port-forward` on
  # svc/teleport 8443:443 (local-edition exposure). Must match the
  # callback URL registered in the GitHub OAuth App exactly.
  redirect_url: https://tp.secforge.local:8443/v1/webapi/github/callback
  display: GitHub
  teams_to_roles:
    # Jason's GitHub org + team → Teleport admin role.
    # Substituted at apply time; org and team values come from
    # apply-github-connector.sh args.
    - organization: __GITHUB_ORG__
      team: __GITHUB_TEAM__
      roles:
        - admin
