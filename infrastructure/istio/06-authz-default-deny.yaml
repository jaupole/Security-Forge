# Phase 6.3 — Opt-in default-deny + explicit ALLOWs in `app` namespace.
#
# Design (interim, Phase 6.2 → 6.2b):
# - AuthorizationPolicies coexist with — and do NOT replace — pre-existing
#   NetworkPolicies. Defense in depth.
# - default-deny is OPT-IN via the label `secforge.platform/mesh-authz: enforce`.
#   Only workloads carrying that label are subject to "deny by default; explicit
#   allow required". Workloads without the label fall back to ztunnel's
#   permit-when-no-policies behavior; NetworkPolicy still gates them at L3-L4.
#
# Why opt-in?
#   `from.namespaces` (and `principals`) in AuthorizationPolicy match only
#   MESH peer identities — sources with an SVID. Non-mesh sources like the
#   openbao pods (the `openbao` namespace is not ambient in Phase 6) have no
#   peer identity, so they cannot satisfy a `from.namespaces` ALLOW. Putting
#   the Postgres pods under default-deny would block the OpenBao→Postgres
#   dynamic-cred path. Until 6.2b brings the rest of the platform into the
#   mesh and unifies the trust domain, infrastructure pods that have non-mesh
#   callers stay out of mesh-level default-deny and rely on NetworkPolicy.
#
# Workloads carrying `secforge.platform/mesh-authz: enforce` today:
#   - authzen-facade (Phase 4 — set by Phase 6.3 patch below)
#   - helloworld-bff (Phase 6.8 — applied at deploy time)
#
# Workloads explicitly NOT opted in (relying on NetworkPolicy as the floor):
#   - secforge-app-db (CNPG cluster) — has non-mesh openbao caller
#   - test-page (Phase 1 leftover) — no security-sensitive function
#
# When 6.2b lands and openbao moves into the mesh, we revisit and broaden
# the opt-in to cover Postgres and the rest of `app`.

# Default-deny — applies ONLY to workloads carrying the opt-in label.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: app
  labels:
    secforge.platform/component: istio-authz
spec:
  selector:
    matchLabels:
      secforge.platform/mesh-authz: enforce
---
# Explicit allow: in-namespace mesh callers reach AuthZEN façade :8080.
# Future BFF (Phase 6.8) inherits this since it'll live in `app`.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-app-to-authzen-facade
  namespace: app
  labels:
    secforge.platform/component: authzen-facade
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authzen-facade
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["app"]
    to:
    - operation:
        ports: ["8080"]
---
# Phase 7.6 — Prometheus scraping. observability ns is NOT in the mesh, so
# its callers have no SPIFFE peer identity and a `from.namespaces` rule
# would never match. We omit `from` (any source) and rely on the
# `allow-app-ns-to-authzen-facade` NetworkPolicy in 04-networkpolicies.yaml
# to restrict L4 ingress to observability ns. Ambient ztunnel is L4-only
# without a Waypoint, so we can't path-restrict to /metrics here either —
# the in-process route registration is what scopes what's served.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-to-authzen-metrics
  namespace: app
  labels:
    secforge.platform/component: authzen-facade
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authzen-facade
  action: ALLOW
  rules:
  - to:
    - operation:
        ports: ["8080"]
