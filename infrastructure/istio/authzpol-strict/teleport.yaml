# Phase 7c (DRAFT, not applied) — `teleport` namespace AuthZ policies
# under STRICT (Style A: ns is mesh-enrolled in the same window).
#
# Teleport ns has two mesh pods: teleport-auth and teleport-proxy.
# External SSO + tsh/kubectl access flows through teleport-proxy via
# ingress (teleport.secforge.local). teleport-auth is internal-only;
# the proxy is its primary client.

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: teleport
spec: {}

---
# External traffic (browser SSO, tsh, kubectl-via-teleport) enters via
# ingress-nginx → teleport-proxy. Multiplex listener on 443 carries
# all teleport protocols (SSH/web/kube) over the same TLS.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-nginx-to-teleport-proxy
  namespace: teleport
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["ingress-nginx"]
      to:
        - operation:
            ports: ["443", "3080", "3023", "3024", "3025", "3026"]

---
# teleport-proxy talks to teleport-auth on its gRPC API. Both are
# mesh-enrolled, so this is mTLS-attested via SPIFFE-ID.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-proxy-to-auth
  namespace: teleport
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: auth
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "secforge.local/ns/teleport/sa/teleport-proxy"
      to:
        - operation:
            ports: ["3025"]
