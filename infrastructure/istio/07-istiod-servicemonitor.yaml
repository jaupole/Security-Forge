# Phase 7.6 — istiod ServiceMonitor.
#
# istiod exposes /metrics on http-monitoring (15014). ztunnel is a DaemonSet
# without a Service and needs a PodMonitor — tracked separately in Phase 7.6
# follow-ups (next session).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod
  namespace: istio-system
  labels:
    release: kps
    app.kubernetes.io/name: istiod
    app.kubernetes.io/part-of: secforge-platform
spec:
  selector:
    matchLabels:
      app: istiod
  namespaceSelector:
    matchNames:
      - istio-system
  endpoints:
    - port: http-monitoring
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
