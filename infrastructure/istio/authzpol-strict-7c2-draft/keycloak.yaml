# Phase 7c (DRAFT, not applied) — `keycloak` namespace AuthZ policies
# under STRICT (Style A: ns is mesh-enrolled in the same window).
#
# Trust domain: secforge.local. Pre-cutover, principals would be
# spiffe://cluster.local/...; post-cutover they become spiffe://secforge.local/...

# ─── default-deny ────────────────────────────────────────────────────
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: keycloak
spec: {}

---
# ─── allow-ingress-nginx-to-keycloak ─────────────────────────────────
# External traffic for auth.secforge.local enters via ingress-nginx (NOT
# mesh-enrolled). Allow on source.namespaces under STRICT.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-nginx-to-keycloak
  namespace: keycloak
spec:
  selector:
    matchLabels:
      app: keycloak
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["ingress-nginx"]
      to:
        - operation:
            ports: ["8443"]

---
# ─── allow-prometheus-to-keycloak-metrics ─────────────────────────────
# kube-prometheus-stack scrapes Keycloak's management /metrics endpoint
# on 9000 (the chart's default management port).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-to-keycloak-metrics
  namespace: keycloak
spec:
  selector:
    matchLabels:
      app: keycloak
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["observability"]
      to:
        - operation:
            ports: ["9000"]
            paths: ["/metrics"]

---
# ─── allow-bff-to-keycloak ───────────────────────────────────────────
# In-cluster BFFs reach Keycloak directly on the Service VIP for OIDC
# token exchanges (PAR + token). Allow any in-mesh `app` workload.
# Under STRICT this is mTLS-attested via the BFF's SPIFFE-ID.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-bff-to-keycloak
  namespace: keycloak
spec:
  selector:
    matchLabels:
      app: keycloak
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/app/sa/*"     # transition
              - "secforge.local/ns/app/sa/*"   # post-SPIRE-as-CA
      to:
        - operation:
            ports: ["8080", "8443"]
