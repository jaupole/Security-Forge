# Phase 7c (DRAFT, not applied) — `openbao` namespace AuthZ policies
# under STRICT (Style A: ns is mesh-enrolled in the same window).
#
# Style A trade-off: openbao joins the mesh for the cutover. SPIRE
# already issues a SPIFFE-ID for openbao pods (the
# `secforge-openbao` ClusterSPIFFEID covers this); SPIRE-as-CA makes
# that identity the one ztunnel uses for mTLS.

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: openbao
spec: {}

---
# In-cluster callers reaching openbao:8200 for KV reads, dynamic
# credential mints, transit operations, etc. Allow any in-mesh
# `app` or `spicedb` workload — the per-token policy on openbao's
# side enforces role-level authorization, this rule only governs
# transport-level admit/deny.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-clients-to-openbao
  namespace: openbao
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/app/sa/*"        # transition
              - "secforge.local/ns/app/sa/*"      # post-SPIRE-as-CA
              - "cluster.local/ns/spicedb/sa/*"    # transition
              - "secforge.local/ns/spicedb/sa/*"  # post-SPIRE-as-CA
      to:
        - operation:
            ports: ["8200"]

---
# Vault Secrets Operator (vso) and security-events-collector run in
# observability + app respectively and need openbao access. VSO is in
# `vault-secrets-operator` ns (NOT mesh-enrolled today). If we
# mesh-enroll it in Style A, the principal is
# `secforge.local/ns/vault-secrets-operator/sa/vault-secrets-operator-controller-manager`.
# Until then, allow on source.namespaces — TODO: verify the actual ns
# at cutover-time and tighten to a principal match.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-vso-to-openbao
  namespace: openbao
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["vault-secrets-operator"]
      to:
        - operation:
            ports: ["8200"]

---
# bao.secforge.local ingress (admin UI). External traffic via
# ingress-nginx (NOT mesh-enrolled).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-nginx-to-openbao
  namespace: openbao
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["ingress-nginx"]
      to:
        - operation:
            ports: ["8200"]

---
# Prometheus metrics scrape. OpenBao's /sys/metrics requires bearer
# token auth (see Phase 7d Item 4); the AuthorizationPolicy here only
# admits the connection — Prometheus's bearerTokenSecret handles auth.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-to-openbao-metrics
  namespace: openbao
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["observability"]
      to:
        - operation:
            ports: ["8200"]
            paths: ["/v1/sys/metrics"]
