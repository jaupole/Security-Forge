# ingress-nginx — Helm values for SecForge Local Edition
#
# Chart:    https://kubernetes.github.io/ingress-nginx
# Pinned:   4.11.3 (controller image v1.11.3)
#
# Apply with:
#   helm install ingress-nginx ingress-nginx/ingress-nginx \
#     --namespace ingress-nginx --version 4.11.3 \
#     --values infrastructure/ingress-nginx/values.yaml
#
# Pre-req: the wildcard TLS secret `ingress-nginx/wildcard-secforge-local-tls`
# must exist before this install — see the apply sequence in
# docs/06-reference/cluster-services.md.

controller:
  # ----- replica + resources ------------------------------------------------
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # ----- service ------------------------------------------------------------
  # Docker Desktop binds LoadBalancer services to localhost:80 / :443.
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    ipFamilyPolicy: SingleStack
    ipFamilies:
      - IPv4

  # ----- default certificate -----------------------------------------------
  # `--default-ssl-certificate=<ns>/<secret>`: served for any host that has
  # no per-Ingress tls block. Our wildcard mkcert covers *.secforge.local.
  extraArgs:
    default-ssl-certificate: "ingress-nginx/wildcard-secforge-local-tls"

  # ----- security hardening -------------------------------------------------
  # `allowSnippetAnnotations=false` is the chart default since 4.10. We pin
  # it explicitly because annotation-injected snippets are the path most
  # ingress-nginx CVEs have used.
  allowSnippetAnnotations: false

  config:
    # Strict path validation — rejects ambiguous Ingress paths.
    strict-validate-path-type: "true"
    # Trust X-Forwarded-* only from the loopback chain (Docker Desktop).
    use-forwarded-headers: "false"
    # Modern TLS only.
    ssl-protocols: "TLSv1.3 TLSv1.2"
    ssl-ciphers: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
    # HSTS — production parity per CLAUDE.md (2y preload). Local browsers
    # will pin secforge.local; tear down by clearing the host's HSTS state
    # if you ever serve plain HTTP on it.
    hsts: "true"
    hsts-max-age: "63072000"
    hsts-include-subdomains: "true"
    hsts-preload: "true"
    # Proxy buffer sizes large enough for Keycloak's redirect URLs.
    proxy-buffer-size: "16k"
    # HTTP/2 is on by default; flip to "false" here if we hit issues.
    use-http2: "true"
    # Server tokens off — don't leak the controller version.
    server-tokens: "false"

  # ----- admission webhook --------------------------------------------------
  admissionWebhooks:
    enabled: true
    failurePolicy: Fail
    patch:
      enabled: true

  # ----- pod security -------------------------------------------------------
  # readOnlyRootFilesystem is intentionally FALSE: the upstream chart
  # rewrites /etc/nginx/nginx.conf, /etc/ingress-controller/ssl/*,
  # /etc/ingress-controller/telemetry/* etc. on every reload, with no
  # documented exhaustive list of write paths. We compensate with the
  # other restricted-tier controls (non-root user, drop-all-caps except
  # NET_BIND_SERVICE, no priv-esc, RuntimeDefault seccomp) and rely on
  # the `privileged` PSA label being scoped to this namespace alone.
  # Documented gap: docs/06-reference/cluster-services.md#ingress-nginx
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
      drop: [ALL]
      add: [NET_BIND_SERVICE]
    seccompProfile:
      type: RuntimeDefault

  # ----- metrics ------------------------------------------------------------
  # Phase 7 wires Prometheus; until then we expose the endpoint but don't
  # create a ServiceMonitor.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

  # ----- ingressClass -------------------------------------------------------
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  watchIngressWithoutClass: false

# ----- default backend (404 page) -------------------------------------------
defaultBackend:
  enabled: false

# ----- Pod Disruption Budget ------------------------------------------------
# Single-replica locally; a PDB would just block node drains.
controller_pdb:
  enabled: false
