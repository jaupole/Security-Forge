# Public OIDC/SAML endpoints. Admin console traffic to /admin is NOT
# served from this Ingress — Keycloak's `hostname.admin` setting causes
# the application to refuse to render the admin console under this
# hostname, even if a request slips through.
#
# Backend service `keycloak-service` is generated by the Keycloak
# Operator from the `Keycloak` CR named `keycloak`. Port 8080 is the
# user-facing Keycloak port (HTTP; TLS terminates here at ingress-nginx).

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-public
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    secforge.platform/component: keycloak
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    # Keycloak listens on HTTP; ingress-nginx terminates TLS.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # NOTE on /admin defense-in-depth: ingress-nginx server-snippet is
    # disabled cluster-wide (known privesc vector). The admin console
    # is gated by Keycloak's hostname.admin setting in the Keycloak CR,
    # which causes the application to refuse to render the admin UI on
    # the public hostname even if a request reaches it. The dedicated
    # admin Ingress (Phase 3.6) carries the second layer at the network.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.secforge.local
      secretName: auth-public-tls
  rules:
    - host: auth.secforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
