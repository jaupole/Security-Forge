# NetworkPolicies for the keycloak namespace.
#
# Strategy: default-deny ingress, allow only what's needed:
#   - ingress-nginx → keycloak-service (port 8080)
#   - keycloak-operator → keycloak management port (9000) for health checks
#   - prometheus (ns: observability) → keycloak management port (9000) for /metrics scrape
#
# Egress is controlled per-pod-set:
#   - keycloak pods need: DNS (kube-system), Postgres (5432 in same ns)
#   - import-job pods need: same as keycloak (they're spawned from the
#     same pod template and run their own embedded Keycloak that connects
#     to Postgres directly)
#   - operator pods need: K8s API only — implicit, controller-runtime
#     handles in-cluster API access via the SA token on a different path
#     than NetworkPolicy can govern (ServiceAccount tokens are L7).

# ──────────────────────────────────────────────────────────────────────
# Default-deny ingress for the namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# ──────────────────────────────────────────────────────────────────────
# Allow ingress-nginx → keycloak-service:8080.
# Selects keycloak pods (the StatefulSet pods carry app=keycloak).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-keycloak
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

# ──────────────────────────────────────────────────────────────────────
# Allow Keycloak Operator → keycloak management port (9000) for the
# operator's health/readiness checks against the StatefulSet pods.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-to-keycloak
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-operator
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9000

# ──────────────────────────────────────────────────────────────────────
# Allow Prometheus (Phase 7, namespace observability) → keycloak:9000
# for /metrics scraping. Pre-creating this rule means Phase 7 gets to
# ship its scrape config without re-touching the keycloak ns.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-keycloak-metrics
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9000

# ──────────────────────────────────────────────────────────────────────
# Allow Postgres (CNPG cluster `secforge-keycloak-db`) ingress from:
#   - Keycloak pods (app=keycloak)              — main DB traffic
#   - realm-import job pods (app=keycloak-realm-import) — they spin up
#       their own embedded Keycloak that connects to the same DB
#   - postgres-operator ns                       — CNPG operator manages
#       the cluster (probes, failover, backups)
#   - same-pod replication on 5432 (replicas talk to primary; 1 replica
#       today but we keep this allow rule for HA-readiness)
#
# Without this rule, `default-deny-ingress` (which selects all pods in
# the namespace, Postgres included) blocks every connection. The pod
# stays up because CNPG's healthchecks come over the kubelet, but
# external clients (= Keycloak) cannot connect.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: secforge-keycloak-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: keycloak
        - podSelector:
            matchLabels:
              app: keycloak-realm-import
        - podSelector:
            matchLabels:
              cnpg.io/cluster: secforge-keycloak-db
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres-operator
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000   # CNPG operator metrics/health from sidecar

# ──────────────────────────────────────────────────────────────────────
# Egress for keycloak pods — DNS + Postgres only.
# (Egress to the Workload API socket is over a Unix socket, mounted via
# CSI; no L3/L4 egress involved.)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-egress
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Egress
  egress:
    # DNS to kube-system kube-dns/coredns.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres in same namespace.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: secforge-keycloak-db
      ports:
        - protocol: TCP
          port: 5432
    # JGroups discovery (single-replica today; HA-ready).
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 7800
        - protocol: TCP
          port: 7900
    # Phase 7.6 — OpenTelemetry collector (OTLP gRPC).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317

# ──────────────────────────────────────────────────────────────────────
# Egress for the operator — K8s API access is via the in-cluster
# kubernetes.default.svc, which lives in the default ns; we allow that.
# The operator does NOT speak directly to keycloak HTTP (it watches CRDs
# via the API), so no other egress is required.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-egress
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-operator
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API via service IP (10.96.0.1 typically). We don't pin the
    # IP here — `to: []` for the API server is implicit when egress
    # policy excludes it; instead we allow all egress to TCP/443 to
    # the kube-system ns where kube-apiserver lives.
    - ports:
        - protocol: TCP
          port: 443

# ──────────────────────────────────────────────────────────────────────
# Egress for realm-import job pods (which inherit Keycloak's pod
# template). They need Postgres and DNS, just like the main StatefulSet.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-realm-import-egress
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak-realm-import
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: secforge-keycloak-db
      ports:
        - protocol: TCP
          port: 5432
