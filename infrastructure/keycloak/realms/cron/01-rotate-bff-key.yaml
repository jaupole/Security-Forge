# Phase 7d.1.b — BFF private_key_jwt rotation CronJobs.
#
# What this manifest defines:
#   - ServiceAccount `bff-key-rotator` in `app` ns (SPIFFE-ID
#     spiffe://secforge.local/ns/app/sa/bff-key-rotator). Bound to the
#     OpenBao JWT role of the same name (configured by
#     ./configure-openbao-role.sh) which grants the policy
#     bff-key-rotator (loaded from
#     infrastructure/openbao/policies/bff-key-rotator.hcl).
#   - ConfigMap `bff-key-rotator-spiffe-helper` — helper.conf for the
#     spiffe-helper init container (writes JWT-SVID, audience=openbao).
#   - ConfigMap `bff-key-rotator-scripts` — the wrapper.sh +
#     rotate-bff-key.sh + kcadm-auth.sh files. Apply this manifest via
#     ./apply.sh which rebuilds the ConfigMap from on-disk sources so
#     the scripts in `infrastructure/keycloak/realms/` and the in-pod
#     copies stay in sync.
#   - Three RBAC tuples (Role + RoleBinding pairs) granting the rotator:
#       * pods/exec on openbao-0 (openbao ns) — for `bao kv put` on the
#         OpenBao API via in-pod CLI.
#       * pods/exec on keycloak-0 (keycloak ns) — for kcadm.sh.
#       * get/list/watch/patch on deployments + get/list/watch on
#         replicasets and pods in `app` ns — for `kubectl rollout
#         restart` and `kubectl rollout status` of the BFF Deployment.
#   - Four CronJobs, one per BFF client, staggered across a 90-day
#     window. Only `bff-key-rotator-helloworld-bff` is enabled
#     (suspend:false); the other three are pre-provisioned `suspend:
#     true` because their target Deployments don't exist until Phase 9+.
#     Operators unsuspend each one when its BFF lands.
#
# Auth inside the CronJob pod (no kcadm-admin K8s Secret in `app` ns):
#   1. spiffe-helper init container writes the JWT-SVID to
#      /shared/openbao.jwt (audience=openbao).
#   2. wrapper.sh reads the JWT, POSTs to OpenBao auth/jwt/login (role
#      bff-key-rotator), captures the client_token as BAO_TOKEN.
#   3. wrapper.sh execs rotate-bff-key.sh; the script's existing
#      kcadm-auth.sh helper reads kcadm-admin's client_secret from
#      OpenBao at secret/data/keycloak/clients/kcadm-admin (allowed by
#      the rotator's policy) and authenticates kcadm.sh against the
#      master realm.
#
# On failure: the script's non-zero exit produces a Failed CronJob
# condition. kube-state-metrics' upstream `KubeJobFailed` rule (already
# wired by Phase 7) fires Alertmanager. Failure JSON also lands in Loki
# via Promtail's pod-log scrape (event=bff.key.rotation.failed); a Loki-
# based alert is a follow-up if the kube-state-metrics signal isn't
# precise enough in practice.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff-key-rotator
  namespace: app
  labels:
    app.kubernetes.io/name: bff-key-rotator
    secforge.platform/component: bff-key-rotator
automountServiceAccountToken: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bff-key-rotator-spiffe-helper
  namespace: app
  labels:
    app.kubernetes.io/name: bff-key-rotator
    secforge.platform/component: bff-key-rotator
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/socket"
    daemon_mode = false
    jwt_svids = [
      {
        jwt_audience       = "openbao"
        jwt_svid_file_name = "/shared/openbao.jwt"
      }
    ]

# ─── RBAC: pods/exec on openbao-0 ───────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bff-key-rotator-openbao-exec
  namespace: openbao
rules:
  # Tight scope: exec on the specific named pod only. resourceNames
  # works for sub-resources like pods/exec — verb scoped to "create"
  # because exec sessions are created via POST.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
    resourceNames: ["openbao-0"]
  # GET on the parent pod is required to discover its existence before
  # exec; without this, kubectl exec returns "pods 'openbao-0' is
  # forbidden" even if pods/exec is granted.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
    resourceNames: ["openbao-0"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bff-key-rotator-openbao-exec
  namespace: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bff-key-rotator-openbao-exec
subjects:
  - kind: ServiceAccount
    name: bff-key-rotator
    namespace: app

# ─── RBAC: pods/exec on keycloak-0 ──────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bff-key-rotator-keycloak-exec
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
    resourceNames: ["keycloak-0"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
    resourceNames: ["keycloak-0"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bff-key-rotator-keycloak-exec
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bff-key-rotator-keycloak-exec
subjects:
  - kind: ServiceAccount
    name: bff-key-rotator
    namespace: app

# ─── RBAC: rollout restart + status on the BFF Deployments ──────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bff-key-rotator-deploy-rollout
  namespace: app
rules:
  # patch is required for `kubectl rollout restart` (it patches a
  # restartedAt annotation on spec.template.metadata.annotations).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
    resourceNames:
      - "helloworld-bff"
      - "proposal-forge-bff"
      - "project-tracker-bff"
      - "pm-bff"
  # `kubectl rollout status` walks deployments → replicasets → pods to
  # report progress. resourceNames doesn't compose cleanly for the
  # children, so these are namespace-scoped get/list/watch.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bff-key-rotator-deploy-rollout
  namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bff-key-rotator-deploy-rollout
subjects:
  - kind: ServiceAccount
    name: bff-key-rotator
    namespace: app

# ─── CronJobs (one per BFF, staggered across 90-day window) ─────────────
# Stagger pattern (per Phase 7d prompt): day 0 / 22 / 45 / 67 of each
# 90-day window. Cron expressions encode this as month-step + day-of-
# month — coarse but predictable. Operators unsuspend each one when its
# BFF Deployment lands (Phase 9 for helloworld; Phase 10 onward for
# the other three).

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bff-key-rotator-helloworld-bff
  namespace: app
  labels:
    app.kubernetes.io/name: bff-key-rotator
    secforge.platform/component: bff-key-rotator
    secforge.platform/bff-client: helloworld-bff
spec:
  # Day 0 of each 90-day window: 02:00 UTC on the 1st of every 3rd month
  # (Jan, Apr, Jul, Oct). Approximately 90 days between fires.
  schedule: "0 2 1 1,4,7,10 *"
  suspend: false   # only helloworld-bff is enabled — its BFF is live
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bff-key-rotator
            secforge.platform/bff-client: helloworld-bff
            spiffe.io/spire-managed-identity: "true"
        spec:
          serviceAccountName: bff-key-rotator
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: spiffe-helper
              image: ghcr.io/spiffe/spiffe-helper:0.11.0
              args: ["-config", "/etc/spiffe/helper.conf"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 64Mi }
              volumeMounts:
                - name: spiffe-workload-api
                  mountPath: /spiffe-workload-api
                  readOnly: true
                - name: helper-conf
                  mountPath: /etc/spiffe
                  readOnly: true
                - name: shared
                  mountPath: /shared
          containers:
            - name: rotator
              # alpine/k8s bundles bash + kubectl + jq + wget + busybox
              # in one image. We add openssl via apk; on this image
              # openssl is already present (apk info openssl confirms).
              # Same image as legacy-env-warner / weekly-guardrail-verify
              # so containerd cache is shared.
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: BFF_CLIENT_ID
                  value: "helloworld-bff"
                - name: KCADM_AUTH_HELPER
                  value: "/scripts/kcadm-auth.sh"
                - name: BAO_ADDR
                  value: "https://openbao.openbao.svc.cluster.local:8200"
                - name: BAO_JWT_PATH
                  value: "/shared/openbao.jwt"
                - name: BAO_ROLE
                  value: "bff-key-rotator"
                - name: BAO_CACERT
                  value: "/etc/ssl/openbao/ca.crt"
              command: ["/bin/bash", "/scripts/wrapper.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: shared
                  mountPath: /shared
                  readOnly: true
                - name: openbao-ca
                  mountPath: /etc/ssl/openbao
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
          volumes:
            - name: spiffe-workload-api
              csi: { driver: csi.spiffe.io, readOnly: true }
            - name: helper-conf
              configMap:
                name: bff-key-rotator-spiffe-helper
            - name: scripts
              configMap:
                name: bff-key-rotator-scripts
                defaultMode: 0755
            - name: shared
              emptyDir: {}
            - name: openbao-ca
              secret:
                secretName: openbao-ca-bundle
            - name: tmp
              emptyDir: {}

# ─── Suspended placeholders for the other three BFFs ────────────────────
# Each one identical to the helloworld variant except:
#   - metadata.name + metadata.labels (component-specific)
#   - spec.suspend: true
#   - spec.schedule: shifted to day-22/45/67 of the 90-day window
#   - env BFF_CLIENT_ID
#   - pod label secforge.platform/bff-client
# Unsuspend (kubectl patch cronjob ... --type=merge -p '{"spec":{"suspend":false}}')
# when the corresponding BFF Deployment lands in Phase 9+.

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bff-key-rotator-proposal-forge-bff
  namespace: app
  labels:
    app.kubernetes.io/name: bff-key-rotator
    secforge.platform/component: bff-key-rotator
    secforge.platform/bff-client: proposal-forge-bff
spec:
  # Day ~22: 02:00 UTC on the 23rd of every 3rd month.
  schedule: "0 2 23 1,4,7,10 *"
  suspend: true   # unsuspend when proposal-forge-bff Deployment lands (Phase 10+)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bff-key-rotator
            secforge.platform/bff-client: proposal-forge-bff
            spiffe.io/spire-managed-identity: "true"
        spec:
          serviceAccountName: bff-key-rotator
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: spiffe-helper
              image: ghcr.io/spiffe/spiffe-helper:0.11.0
              args: ["-config", "/etc/spiffe/helper.conf"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 64Mi }
              volumeMounts:
                - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
                - { name: helper-conf, mountPath: /etc/spiffe, readOnly: true }
                - { name: shared, mountPath: /shared }
          containers:
            - name: rotator
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities: { drop: ["ALL"] }
                seccompProfile:
                  type: RuntimeDefault
              env:
                - { name: BFF_CLIENT_ID, value: "proposal-forge-bff" }
                - { name: KCADM_AUTH_HELPER, value: "/scripts/kcadm-auth.sh" }
                - { name: BAO_ADDR, value: "https://openbao.openbao.svc.cluster.local:8200" }
                - { name: BAO_JWT_PATH, value: "/shared/openbao.jwt" }
                - { name: BAO_ROLE, value: "bff-key-rotator" }
                - { name: BAO_CACERT, value: "/etc/ssl/openbao/ca.crt" }
              command: ["/bin/bash", "/scripts/wrapper.sh"]
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: shared, mountPath: /shared, readOnly: true }
                - { name: openbao-ca, mountPath: /etc/ssl/openbao, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
          volumes:
            - { name: spiffe-workload-api, csi: { driver: csi.spiffe.io, readOnly: true } }
            - { name: helper-conf, configMap: { name: bff-key-rotator-spiffe-helper } }
            - { name: scripts, configMap: { name: bff-key-rotator-scripts, defaultMode: 0755 } }
            - { name: shared, emptyDir: {} }
            - { name: openbao-ca, secret: { secretName: openbao-ca-bundle } }
            - { name: tmp, emptyDir: {} }

