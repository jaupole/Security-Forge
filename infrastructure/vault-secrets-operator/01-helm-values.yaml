# Vault Secrets Operator (VSO) Helm values.
# Phase 6.10b — Step 2. See ADR-0015.
#
# Chart: hashicorp/vault-secrets-operator from
#   https://helm.releases.hashicorp.com
#
# Why HashiCorp's VSO works against OpenBao: VSO talks the standard
# Vault HTTP API surface (sys/health, auth/kubernetes/login,
# sys/internal/ui/mounts, sys/wrapping/wrap, KV v2). OpenBao maintains
# API compatibility for these endpoints. No fork or patched chart needed.
#
# Defaults we override (and why):
#
#   defaultVaultConnection.enabled: false
#     We declare the connection explicitly in 02-vault-connection.yaml so
#     the address / TLS bundle / namespace are reviewable in source.
#
#   defaultAuthMethod.enabled: false
#     Same rationale — auth role binding lives in 03-vault-auth.yaml.
#
#   controller.manager.resources
#     Within the namespace's ResourceQuota (500m CPU / 512Mi memory).
#
# Values NOT set (using chart defaults):
#   - controller.replicas (default: 1) — single replica is correct locally;
#     leader election would require coordination overhead VSO does not need
#     for our scale.
#   - controller.kubeRbacProxy (default: enabled) — keeps :8443 metrics
#     endpoint behind RBAC, matches kyverno's posture.

defaultVaultConnection:
  enabled: false

defaultAuthMethod:
  enabled: false

controller:
  # PodSecurity "restricted" compliance.
  # The chart's defaults (runAsNonRoot at pod level, allowPrivilegeEscalation:
  # false at container level) are NOT enough — restricted PSS additionally
  # requires capabilities.drop=[ALL] + seccompProfile.type=RuntimeDefault.
  # Without these overrides, Kyverno's autogen-restricted policy blocks the
  # Deployment in the vault-secrets-operator namespace (PSS enforce label).
  #
  # NOTE: A chart override replaces the default map wholesale, so the
  # original keys must be re-stated alongside the new ones.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true

  manager:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
