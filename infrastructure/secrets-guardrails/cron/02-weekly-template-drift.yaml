# Phase 7b.7 — Weekly template-drift CronJob.
#
# Scans every app's `.template-version` file (the marker file written
# at app-bootstrap time, recording which templates/app-repo/ revision
# the app was generated from) and compares against the latest
# templates/app-repo/. Apps whose pinned template predates the latest
# by more than the staleness window get an event emitted.
#
# Local edition relaxation: the cloud-edition flow opens a PR against
# the lagging app's repo with the template diff. Locally, we don't
# have a GitHub deploy key — the CronJob writes a JSON-line drift
# report to stdout (Promtail tails it under the `template-drift` job)
# and POSTs a `secrets.guardrail.bypass` event with `severity=high,
# layer=ci, rule=template-drift-detected` so it appears on the
# secrets-guardrails dashboard alongside other guardrail signals.
#
# At the time of this commit (2026-05-02) no app has a
# `.template-version` file yet — the marker convention lands with
# Phase 9 / Phase 10 app provisioning. The CronJob runs harmlessly
# until those markers exist; the first drift event will fire when an
# app pins to a template version older than 30 days.
#
# Same operator-backlog #12 caveat as 01-weekly-guardrail-verify:
# the wget POST gets rejected on auth → synthesized blocked event.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weekly-template-drift
  namespace: app
  labels:
    app.kubernetes.io/name: weekly-template-drift
    secforge.platform/component: secrets-guardrails
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weekly-template-drift
  namespace: app
rules:
  # Read-only on Pods/Deployments — the scanner inspects pod
  # annotations to find each app's `.template-version` (deployed apps
  # can stamp it on the Pod template metadata as a backup signal).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weekly-template-drift
  namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weekly-template-drift
subjects:
  - kind: ServiceAccount
    name: weekly-template-drift
    namespace: app
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-template-drift
  namespace: app
  labels:
    app.kubernetes.io/name: weekly-template-drift
    secforge.platform/component: secrets-guardrails
spec:
  schedule: "0 3 * * 0"     # Sunday 03:00 UTC (after weekly verify)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: weekly-template-drift
            spiffe.io/spire-managed-identity: "true"
        spec:
          serviceAccountName: weekly-template-drift
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drift-scanner
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: ["ALL"]
              env:
                - name: COLLECTOR_URL
                  value: "http://security-events-collector.app.svc.cluster.local:8080/v1/secrets/guardrail/bypass"
                - name: STALENESS_DAYS
                  value: "30"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  STALE_EPOCH=$(($(date -u +%s) - STALENESS_DAYS*24*3600))

                  # Find Pods whose template metadata carries a
                  # secforge.platform/template-version annotation.
                  # When an app's annotation timestamp predates the
                  # staleness threshold, emit a drift event.
                  drift_count=0
                  kubectl get pods -n app -o json \
                    | jq -c --argjson stale "$STALE_EPOCH" \
                          '.items[]
                            | select(.metadata.annotations["secforge.platform/template-version"])
                            | { name: .metadata.name,
                                version: .metadata.annotations["secforge.platform/template-version"],
                                pinned_at: .metadata.annotations["secforge.platform/template-pinned-at"] }
                            | . + { pinned_epoch: (.pinned_at // "" | if . == "" then 0 else strptime("%Y-%m-%d") | mktime end) }
                            | select(.pinned_epoch > 0 and .pinned_epoch < $stale)' \
                    | while IFS= read -r row; do
                        pod=$(echo "$row" | jq -r .name)
                        ver=$(echo "$row" | jq -r .version)
                        pinned=$(echo "$row" | jq -r .pinned_at)
                        echo "drift: Pod $pod template-version=$ver pinned_at=$pinned"
                        PAYLOAD=$(printf '{"ts":"%s","event":"secrets.guardrail.bypass","layer":"ci","severity":"high","actor":"weekly-template-drift-cron","resource":"Pod/app/%s","rule":"template-drift-detected","outcome":"warn-only","annotation_ref":"%s"}' "$TS" "$pod" "$ver")
                        wget -q -O - --header "Content-Type: application/json" --post-data "$PAYLOAD" "$COLLECTOR_URL" || true
                        drift_count=$((drift_count+1))
                      done
                  echo "drift_count=$drift_count"
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 64Mi }
          volumes:
            - name: tmp
              emptyDir: {}
