# nginx server block for helloworld-frontend.
#
# WHY THIS FILE EXISTS: the BFF emits a per-request CSP `script-src 'self'
# 'nonce-XXX' 'strict-dynamic'`. Under `strict-dynamic`, the host source
# `'self'` is IGNORED — only nonce-tagged scripts execute. The BFF
# forwards its per-request nonce to the frontend via the `X-CSP-Nonce`
# request header, but static nginx doesn't templated HTML by default.
#
# `sub_filter` replaces the literal string `__CSP_NONCE__` in served HTML
# with the value of $http_x_csp_nonce. The placeholder appears in
# index.html on the script + style tags so the per-request nonce flows
# through to the browser without ever being computed in the static asset.

server {
    listen 8080;
    server_name _;

    # Pin the page-encoding so sub_filter's text matching is deterministic.
    charset utf-8;

    # Don't 302 — the BFF reverse-proxies us with its upstream hostname
    # in the Host header (`req.Host = target.Host` in proxyToFrontend),
    # so any nginx-issued absolute redirect points the browser at the
    # internal Service DNS name (DNS_PROBE_FINISHED_NXDOMAIN). Belt: keep
    # absolute_redirect off; suspenders: use try_files (internal-only
    # path resolution; no Location header emitted).
    absolute_redirect off;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/index.html /index.html =404;
        sub_filter '__CSP_NONCE__' $http_x_csp_nonce;
        sub_filter_once off;
        sub_filter_types text/html;
        # HTML carries the per-request nonce — must not be cached.
        # Static JS/CSS could be cached but for the local demo no-store
        # is fine and avoids the operator chasing stale assets.
        add_header Cache-Control "no-store" always;
    }
}
