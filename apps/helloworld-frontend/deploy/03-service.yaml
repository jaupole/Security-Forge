apiVersion: v1
kind: Service
metadata:
  name: helloworld-frontend
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-frontend
    app.kubernetes.io/part-of: helloworld
    secforge.platform/component: helloworld-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helloworld-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# NetworkPolicy: only the BFF can reach the frontend Service. The frontend
# itself has no egress (it serves static files only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helloworld-bff-to-helloworld-frontend
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-frontend
    app.kubernetes.io/part-of: helloworld
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: helloworld-frontend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: helloworld-bff
      ports:
        # 8080 (direct) + 15008 (Istio Ambient HBONE inbound)
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
