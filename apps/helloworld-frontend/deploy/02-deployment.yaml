apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-frontend
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-frontend
    app.kubernetes.io/part-of: helloworld
    secforge.platform/component: helloworld-frontend
  annotations:
    # The Phase 9 prompt called for the BFF to serve static files directly.
    # The local edition deviates: a separate nginx pod serves them and the
    # BFF reverse-proxies via BFF_FRONTEND_URL. Cleaner separation of
    # concerns; matches the cloud-edition CDN pattern more closely. See
    # docs/01-architecture/10-helloworld-demo.md § Components for context.
    secforge.platform/phase: "9.5+9.7"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helloworld-frontend
        app.kubernetes.io/part-of: helloworld
        secforge.platform/component: helloworld-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            - name: pid
              mountPath: /var/run
      volumes:
        - name: html
          configMap:
            name: helloworld-frontend
        - name: nginx-conf
          configMap:
            name: helloworld-frontend-nginx-conf
            items:
              - key: default.conf
                path: default.conf
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: pid
          emptyDir: {}
