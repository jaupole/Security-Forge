# spiffe-helper config for the helloworld-backend init container.
# Writes a JWT-SVID with audience=openbao to /shared/openbao.jwt and exits.
# The backend reads it on startup to mint dynamic Postgres credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: helloworld-backend-spiffe-helper
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-backend
    secforge.platform/component: helloworld-backend
    app.kubernetes.io/part-of: helloworld
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/socket"
    daemon_mode = false
    jwt_svids = [
      {
        jwt_audience       = "openbao"
        jwt_svid_file_name = "/shared/openbao.jwt"
      }
    ]
