# NetworkPolicies for helloworld-backend — defense-in-depth at L4.
#
# Ingress: from helloworld-bff pods only (port 8080).
# Egress:  SpiceDB gRPC, secforge-app-db Postgres, OpenBao, Keycloak via
#          ingress-nginx, OTel collector, kube-dns.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helloworld-bff-to-helloworld-backend
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-backend
    app.kubernetes.io/part-of: helloworld
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: helloworld-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: helloworld-bff
      ports:
        # 8080 (direct) + 15008 (Istio Ambient HBONE inbound)
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
    # Prometheus scrape from kube-prometheus-stack in observability ns.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helloworld-backend-egress
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-backend
    app.kubernetes.io/part-of: helloworld
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: helloworld-backend
  policyTypes: ["Egress"]
  egress:
    # DNS — kube-dns / coredns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # SpiceDB gRPC
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spicedb
          podSelector:
            matchLabels:
              authzed.com/cluster: spicedb
      ports:
        - protocol: TCP
          port: 50051
    # OpenBao API (any of the three replicas)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # secforge-app-db (CNPG cluster RW endpoint pods). Both 5432 (direct)
    # and 15008 (Istio Ambient HBONE inbound) so the connection works
    # whether ztunnel chooses to encapsulate or not.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: secforge-app-db
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 15008
    # Keycloak via ingress-nginx (auth.secforge.local for JWKS)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 443
    # OTel collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4317
