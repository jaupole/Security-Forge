apiVersion: v1
kind: ServiceAccount
metadata:
  name: helloworld-backend
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-backend
    secforge.platform/component: helloworld-backend
    app.kubernetes.io/part-of: helloworld
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-backend
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-backend
    secforge.platform/component: helloworld-backend
    app.kubernetes.io/part-of: helloworld
spec:
  # 1 replica for the local demo (CPU quota in app ns is 2000m and the
  # other apps + initContainers have already consumed the bulk). Phase
  # 9.10's negative-test #4 (jti replay across pods) loses some teeth
  # at 1 replica — the design doc § Key design decisions #6 already
  # acknowledged the in-memory replay cache is per-pod for the demo.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helloworld-backend
        app.kubernetes.io/component: api-backend
        app.kubernetes.io/part-of: helloworld
        secforge.platform/component: helloworld-backend
        spiffe.io/spire-managed-identity: "true"
    spec:
      serviceAccountName: helloworld-backend
      automountServiceAccountToken: true
      # Same Docker Desktop DNS gotcha as the BFF: pods inherit the host
      # /etc/hosts where *.secforge.local → 127.0.0.1, which is wrong for
      # in-pod resolution. Route auth.secforge.local at ingress-nginx so
      # the backend's JWKS fetch resolves.
      hostAliases:
        - ip: "10.96.97.16"
          hostnames:
            - "auth.secforge.local"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0
          args: ["-config", "/etc/spiffe/helper.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: helper-conf
              mountPath: /etc/spiffe
              readOnly: true
            - name: shared
              mountPath: /shared

      containers:
        - name: backend
          image: local/helloworld-backend:0.1.0
          imagePullPolicy: Never  # Image lives in Docker Desktop's image store.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: BACKEND_PUBLIC_ORIGIN
              value: "https://app.secforge.local"
            - name: BACKEND_KEYCLOAK_ISSUER
              value: "https://auth.secforge.local/realms/secforge-tenants"
            - name: BACKEND_KEYCLOAK_JWKS_URL
              value: "https://auth.secforge.local/realms/secforge-tenants/protocol/openid-connect/certs"
            - name: BACKEND_EXPECTED_AUDIENCE
              value: "helloworld-api"
            - name: BACKEND_WORKLOAD_ID
              value: "spiffe://secforge.local/ns/app/sa/helloworld-backend"

            - name: SPICEDB_ENDPOINT
              value: "spicedb.spicedb.svc.cluster.local:50051"
            - name: SPICEDB_PSK_PATH
              value: "/etc/spicedb/preshared_key"
            - name: SPICEDB_CA_PATH
              value: "/etc/spicedb/ca.crt"

            - name: BACKEND_OPENBAO_ADDR
              value: "https://openbao.openbao.svc.cluster.local:8200"
            - name: BACKEND_OPENBAO_ROLE
              value: "helloworld-backend"
            - name: BACKEND_OPENBAO_SVID_PATH
              value: "/shared/openbao.jwt"
            - name: BACKEND_OPENBAO_DB_ROLE
              value: "readwrite"

            - name: BACKEND_DB_HOST
              value: "secforge-app-db-rw.app.svc.cluster.local"
            - name: BACKEND_DB_PORT
              value: "5432"
            - name: BACKEND_DB_NAME
              value: "secforge_app"
            - name: BACKEND_DB_SSLMODE
              # CNPG's pg_hba.conf only has hostssl entries, so disable=>RST.
              # Keep require; the 30s ping timeout in db.go absorbs any
              # cold-start TLS handshake delays via Istio Ambient ztunnel.
              value: "require"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "helloworld-backend"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Phase 7.0.a — SPIFFE-CSI cold-boot race grace.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
            - name: spicedb-creds
              mountPath: /etc/spicedb
              readOnly: true
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true

      volumes:
        - name: helper-conf
          configMap:
            name: helloworld-backend-spiffe-helper
        - name: shared
          emptyDir: {}
        - name: spicedb-creds
          projected:
            sources:
              # PSK rendered into the spicedb-creds Secret by VSO when the
              # cutover script ran (infrastructure/vault-secrets-operator/cutover.sh).
              # We share the same Secret as authzen-facade — the PSK is the
              # SpiceDB-cluster-wide pre-shared key, not per-app.
              - secret:
                  name: authzen-facade-spicedb-creds-vso
                  items:
                    - key: preshared_key
                      path: preshared_key
                      mode: 0400
              - configMap:
                  name: spicedb-ca-bundle
                  items:
                    - key: ca.crt
                      path: ca.crt
                      mode: 0444
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
