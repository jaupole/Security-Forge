# NetworkPolicies for the AuthZEN façade.
#
# Allowed flows (egress side covered by spicedb's allow-authzen-facade-
# to-spicedb in infrastructure/spicedb/05-networkpolicies.yaml):
#   any pod in `app` ns      → authzen-facade:8080
#   authzen-facade           → spicedb.spicedb.svc:50051
#   authzen-facade           → DNS

# ──────────────────────────────────────────────────────────────────────
# Allow same-namespace clients (BFFs etc.) → authzen-facade:8080.
# Phase 9 (Hello World) and Phase 10 BFFs will live in `app` ns and
# call this service.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-ns-to-authzen-facade
  namespace: app
  labels:
    secforge.platform/component: authzen-facade
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authzen-facade
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}    # anything in same ns
      ports:
        - protocol: TCP
          port: 8080
    # Phase 7.6: Prometheus scrapes /metrics on the same :8080 port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080

# ──────────────────────────────────────────────────────────────────────
# Egress for the façade — DNS + SpiceDB only.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authzen-facade-egress
  namespace: app
  labels:
    secforge.platform/component: authzen-facade
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authzen-facade
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # SpiceDB gRPC in spicedb namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spicedb
          podSelector:
            matchLabels:
              authzed.com/cluster: spicedb
      ports:
        - protocol: TCP
          port: 50051
    # Phase 7.6 — OpenTelemetry collector (OTLP gRPC for trace export).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317
