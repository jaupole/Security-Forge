# VSO binding for AuthZEN façade — Phase 6.10b Step 3.
# See ADR-0015 and docs/05-claude-code-prompts/phase-06.10b-vso-and-secret-cleanup.md.
#
# Four resources:
#   1. ServiceAccount `authzen-facade-vso` — VSO-binding identity in
#      app namespace. Distinct from the `authzen-facade` SA that the
#      AuthZEN pod runs as.
#   2. VaultAuth `default` — references the cross-ns VaultConnection
#      `vault-secrets-operator/openbao` + the local SA.
#   3. VaultStaticSecret `authzen-facade-spicedb-creds-vso` — renders
#      K8s Secret with ONLY the preshared_key (sourced from
#      secret/data/spicedb/preshared-key, NOT secret/data/spicedb/config —
#      AuthZEN has no business reading the Postgres password).
#   4. ConfigMap `spicedb-ca-bundle` — holds the mkcert CA cert so
#      AuthZEN can verify SpiceDB's gRPC TLS. Was previously bundled
#      into the same Secret as the PSK; now split because the CA cert
#      is public and shouldn't sit in a Secret.
#
# The ConfigMap is populated at apply time by cutover.sh (which copies
# tls.crt → ca.crt from cert-manager/mkcert-ca-key-pair, same dry-run-
# apply pattern as infrastructure/vault-secrets-operator/apply.sh).
# This file declares the ConfigMap shape; the script writes the data.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authzen-facade-vso
  namespace: app
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: app
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: authzen-facade-vso
    serviceAccount: authzen-facade-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authzen-facade-spicedb-creds-vso
  namespace: app
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: default
  mount: secret
  type: kv-v2
  path: spicedb/preshared-key
  refreshAfter: 60s
  destination:
    name: authzen-facade-spicedb-creds-vso
    create: true
    type: Opaque
