# AuthZEN façade — translates OpenID AuthZEN 1.0 evaluation requests
# to SpiceDB CheckPermission RPCs.
#
# 2 replicas for L4 redundancy. SpiceDB-side gRPC is one-shot per
# request; the façade is stateless.
#
# Image: local/authzen-facade:0.1.0 (built from apps/authzen-facade/).
# Built locally with `docker build`. imagePullPolicy: Never so K8s
# uses the daemon-resident copy without trying to pull from a registry
# that doesn't exist (we have no in-cluster registry yet — see Phase 4
# deviations in PLAN.md).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: authzen-facade
  namespace: app
  labels:
    app.kubernetes.io/name: authzen-facade
    secforge.platform/component: authzen-facade
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: authzen-facade
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authzen-facade
        app.kubernetes.io/component: authorization-facade
        secforge.platform/component: authzen-facade
        spiffe.io/spire-managed-identity: "true"
    spec:
      serviceAccountName: authzen-facade
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authzen-facade
          # IMPORTANT — image distribution on Docker Desktop.
          #
          # `docker build` writes images to docker daemon's image store
          # by default, which is SEPARATE from the containerd image
          # store that Docker Desktop K8s uses. So `imagePullPolicy:
          # Never` against `local/authzen-facade:0.1.0` fails with
          # ErrImageNeverPull: containerd doesn't see the image.
          #
          # The proper fix is a ONE-TIME Docker Desktop setup step:
          #   Settings → General → "Use containerd for pulling and
          #   storing images" → enable, restart Docker Desktop.
          # After that, `docker build` writes to containerd's K8s-
          # visible store and the manifest below works as-is.
          #
          # An in-cluster `registry:2` (namespace `registry`) is also
          # deployed for cross-pod image distribution (skopeo copy from
          # a docker-save tarball pushes there). It does not solve THIS
          # pod's pull, however, because Docker Desktop's containerd
          # routes ALL image pulls through an internal `registry-mirror`
          # service which cannot reach in-cluster Services. The
          # in-cluster registry stays in place for future use once the
          # mirror is bypassed in Docker Desktop config.
          image: local/authzen-facade:0.1.0
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: SPICEDB_ENDPOINT
              value: "spicedb.spicedb.svc.cluster.local:50051"
            - name: SPICEDB_TOKEN_FILE
              value: "/etc/spicedb/preshared_key"
            - name: SPICEDB_CA_FILE
              value: "/etc/spicedb/ca.crt"
            - name: LISTEN_ADDR
              value: ":8080"
            # Phase 7.6 — OpenTelemetry tracing.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "authzen-facade"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Phase 7.0.a — SPIFFE-CSI cold-boot race grace. 30×10s = 5min
          # window during which liveness is suppressed. See PLAN.md
          # Phase 5 follow-up #6 + spire-rotation.md.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: spicedb-creds
              mountPath: /etc/spicedb
              readOnly: true
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        # AuthZEN's mountPath /etc/spicedb is a `projected` volume
        # combining two upstream sources:
        #   - PSK: from `authzen-facade-spicedb-creds-vso` (VSO-rendered,
        #     sourced from OpenBao secret/data/spicedb/preshared-key).
        #   - CA cert: from `spicedb-ca-bundle` ConfigMap (mkcert CA;
        #     public, doesn't belong in a Secret). Populated by
        #     infrastructure/vault-secrets-operator/cutover.sh.
        # See ADR-0015 + Phase 6.10b Step 3.
        - name: spicedb-creds
          projected:
            sources:
              - secret:
                  name: authzen-facade-spicedb-creds-vso
                  items:
                    - key: preshared_key
                      path: preshared_key
                      mode: 0400
              - configMap:
                  name: spicedb-ca-bundle
                  items:
                    - key: ca.crt
                      path: ca.crt
                      mode: 0444
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
