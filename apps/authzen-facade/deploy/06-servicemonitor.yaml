# Phase 7.6 — authzen-facade ServiceMonitor.
#
# /metrics is served on the same port as user traffic (:8080) by the stdlib
# promhttp.Handler() registered alongside the AuthZEN routes.
# NetworkPolicy in 04-networkpolicies.yaml gates ingress from observability ns.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: authzen-facade
  namespace: app
  labels:
    release: kps
    app.kubernetes.io/name: authzen-facade
    secforge.platform/component: authzen-facade
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authzen-facade
  namespaceSelector:
    matchNames:
      - app
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
