# CronJob: scan Pods carrying the legacy-secret-env annotation pair and
# emit a `secrets.guardrail.bypass` event for any expiring within 14
# days. ADR-0013 § Self-expiring escape hatch — gives operators advance
# warning before the Kyverno admission rule starts denying renewals.
#
# Auth model: the CronJob uses its own ServiceAccount (with a SPIFFE-ID
# in the `app` ns), authenticates inbound to the collector via that
# SVID, and the collector's `verifiedActor` returns the SPIFFE-ID.
#
# Schedule: 06:00 UTC daily — early enough that warnings reach operators
# before they queue the day's deploys, late enough that the previous
# day's expirations are settled.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legacy-env-warner
  namespace: app
  labels:
    app.kubernetes.io/name: legacy-env-warner
    secforge.platform/component: security-events-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: legacy-env-warner-pods-list
  namespace: app
rules:
  # List/get only — no write surface. Scoped to `app` ns since that's the
  # only ns where the legacy-secret-env annotation pattern is honored.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: legacy-env-warner-pods-list
  namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: legacy-env-warner-pods-list
subjects:
  - kind: ServiceAccount
    name: legacy-env-warner
    namespace: app
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: legacy-env-warner
  namespace: app
  labels:
    app.kubernetes.io/name: legacy-env-warner
    secforge.platform/component: security-events-collector
spec:
  schedule: "0 6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: legacy-env-warner
            app.kubernetes.io/component: legacy-env-warner
            spiffe.io/spire-managed-identity: "true"
        spec:
          serviceAccountName: legacy-env-warner
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: warner
              # alpine/k8s bundles kubectl + jq + wget + busybox-date in a
              # single ~50MB image. The legacy-env-warner needs all four:
              # kubectl to list Pods, jq to parse + filter by date, wget
              # to POST to the collector. busybox `date -d` accepts the
              # ISO date format we receive from the annotation.
              image: alpine/k8s:1.31.0@sha256:66dd3f7db6c4cf152b688d83aad11ceed9eb2da0c4e7de1034c7d4ccea1b55ef
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: ["ALL"]
              # The script lists Pods carrying the legacy-secret-env
              # annotation pair and POSTs one event per pod whose expiry
              # falls within 14 days. The collector's verifiedActor()
              # rewrites the actor field to this CronJob's SPIFFE-ID, so
              # the script's "actor": "legacy-env-warner-cron" is treated
              # as a hint only.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  TODAY_EPOCH=$(date -u +%s)
                  WARN_HORIZON=$((TODAY_EPOCH + 14*24*3600))
                  COLLECTOR_URL="http://security-events-collector.app.svc.cluster.local:8080/v1/secrets/guardrail/bypass"

                  # List pods with the expires annotation set; jq filters
                  # to those whose expiry lands within the 14-day window.
                  kubectl get pods -n app -o json \
                    | jq -c --argjson horizon "$WARN_HORIZON" \
                          '.items[]
                            | select(.metadata.annotations["secforge.local/legacy-secret-env-expires"])
                            | { name: .metadata.name,
                                ticket: .metadata.annotations["secforge.local/legacy-secret-env"],
                                expires: .metadata.annotations["secforge.local/legacy-secret-env-expires"] }
                            | . + { expires_epoch: (.expires | strptime("%Y-%m-%d") | mktime) }
                            | select(.expires_epoch <= $horizon)' \
                    | while IFS= read -r row; do
                        pod=$(echo "$row" | jq -r .name)
                        ticket=$(echo "$row" | jq -r .ticket)
                        expires=$(echo "$row" | jq -r .expires)
                        ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                        echo "warning Pod $pod expires=$expires ticket=$ticket"
                        # Best-effort POST. Auth is via the workload's
                        # SPIFFE-SVID over Istio Ambient mTLS; no Bearer
                        # token plumbing on the script side. If the
                        # collector is unreachable, the next run retries.
                        wget -q -O - --header "Content-Type: application/json" \
                          --post-data "{\"ts\":\"$ts\",\"event\":\"secrets.guardrail.bypass\",\"layer\":\"kyverno\",\"severity\":\"high\",\"actor\":\"legacy-env-warner-cron\",\"resource\":\"Pod/app/$pod\",\"rule\":\"legacy-secret-env-expiry-warning-14d\",\"outcome\":\"annotated-bypass\",\"annotation_ref\":\"$ticket\"}" \
                          "$COLLECTOR_URL" || true
                      done
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits:   { cpu: 200m, memory: 64Mi }
