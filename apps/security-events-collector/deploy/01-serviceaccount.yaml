# ServiceAccount for security-events-collector.
#
# Lives in `app` ns alongside other first-class workloads. The
# namespace-scoped ClusterSPIFFEID covering `app` (Phase 2) issues
# `spiffe://secforge.local/ns/app/sa/security-events-collector` to this
# SA — that ID is what the collector presents in audit lines as
# `caller_workload_id` and what in-cluster callers (Kyverno adapter,
# library hygiene checks, image-build pipeline) target via mTLS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-events-collector
  namespace: app
  labels:
    app.kubernetes.io/name: security-events-collector
    secforge.platform/component: security-events-collector
