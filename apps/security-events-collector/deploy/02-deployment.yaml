# security-events-collector Deployment.
#
# Single replica is sufficient — events are append-only and the JSON-line
# stdout sink is operationally idempotent. Phase 7b's Promtail tails the
# container logs.
#
# This service does NOT auth TO OpenBao (it has no outbound credential
# needs at 6b-2 — JWKS fetches are unauthenticated reads). Therefore no
# spiffe-helper init container, no OpenBao bootstrap, no Valkey session
# store — much simpler than helloworld-bff. If/when the collector grows
# outbound credential needs, mirror the helloworld-bff init pattern.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-events-collector
  namespace: app
  labels:
    app.kubernetes.io/name: security-events-collector
    secforge.platform/component: security-events-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: security-events-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-events-collector
        app.kubernetes.io/component: collector
        secforge.platform/component: security-events-collector
        spiffe.io/spire-managed-identity: "true"
    spec:
      serviceAccountName: security-events-collector
      automountServiceAccountToken: true
      # Same Docker Desktop /etc/hosts override as helloworld-bff so the
      # collector can resolve auth.secforge.local for JWKS fetches.
      hostAliases:
        - ip: "10.96.97.16"
          hostnames:
            - "auth.secforge.local"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: local/security-events-collector:0.1.0
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: COLLECTOR_LISTEN_ADDR
              value: ":8080"
            - name: COLLECTOR_ISSUER
              value: "https://auth.secforge.local/realms/secforge-tenants"
            - name: COLLECTOR_AUDIENCE
              value: "security-events-collector"
            - name: COLLECTOR_JWKS_ENDPOINT
              value: "https://auth.secforge.local/realms/secforge-tenants/protocol/openid-connect/certs"
            - name: COLLECTOR_WORKLOAD_ID
              value: "spiffe://secforge.local/ns/app/sa/security-events-collector"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
