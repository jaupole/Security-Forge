# spiffe-helper config for the BFF init container.
# Writes a JWT-SVID with audience=openbao to /shared/openbao.jwt and exits.
# The BFF reads it on startup, exchanges for an OpenBao token, and pulls
# its private_key_jwt PEM. See `apps/helloworld-bff/openbao.go`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: helloworld-bff-spiffe-helper
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-bff
    secforge.platform/component: helloworld-bff
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/socket"
    daemon_mode = false
    jwt_svids = [
      {
        jwt_audience       = "openbao"
        jwt_svid_file_name = "/shared/openbao.jwt"
      }
    ]
