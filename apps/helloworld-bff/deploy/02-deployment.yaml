# Phase 6.8 — helloworld-bff Deployment.
#
# Replicas: 1 (load-bearing — see ADR-0011 and 04-bff-pattern.md).
# DPoP keypair is per-pod, in-memory only; multi-replica would require
# per-session keys persisted in Valkey, which is a pre-migration task.
#
# Init container:
#   spiffe-helper writes a JWT-SVID (aud=openbao) to a shared emptyDir.
#   Main container reads it on startup and exchanges for an OpenBao
#   token via auth/jwt/login (role=helloworld-bff), then fetches the
#   private_key_jwt PEM from secret/data/keycloak/clients/helloworld-bff.
#
# Identity:
#   ServiceAccount `helloworld-bff` (already exists, created in Phase 5.9).
#   SPIFFE ID `spiffe://secforge.local/ns/app/sa/helloworld-bff` is
#   issued by the namespace-scoped ClusterSPIFFEID covering `app`
#   (Phase 2). The label `spiffe.io/spire-managed-identity: "true"`
#   is set explicitly for documentary clarity.
#
# Mesh authz:
#   The BFF is intentionally NOT opted into the `mesh-authz: enforce`
#   default-deny — its primary inbound caller (ingress-nginx) is
#   non-mesh until Phase 6.2b. Inbound is gated by NetworkPolicy
#   (05-networkpolicies.yaml). Outbound to AuthZEN/backend is in-mesh
#   and gated by AuthZEN's existing allow-app-to-authzen-facade policy.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-bff
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-bff
    secforge.platform/component: helloworld-bff
spec:
  replicas: 1
  strategy:
    type: Recreate    # Per-pod DPoP key + replicas:1 → no rolling overlap.
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helloworld-bff
        app.kubernetes.io/component: bff
        secforge.platform/component: helloworld-bff
        spiffe.io/spire-managed-identity: "true"
        # Required by valkey ns NetworkPolicy to allow ingress from this pod.
        valkey-client: "true"
    spec:
      serviceAccountName: helloworld-bff
      automountServiceAccountToken: true
      # Docker Desktop DNS gotcha (same as Phase 5 OpenBao):
      # pods inherit host /etc/hosts, so `auth.secforge.local` resolves
      # to 127.0.0.1 inside the pod. Override to ingress-nginx ClusterIP
      # so the BFF's OIDC discovery + Keycloak token calls succeed.
      hostAliases:
        - ip: "10.96.97.16"
          hostnames:
            - "auth.secforge.local"
            - "app.secforge.local"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0
          args: ["-config", "/etc/spiffe/helper.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: helper-conf
              mountPath: /etc/spiffe
              readOnly: true
            - name: shared
              mountPath: /shared

      containers:
        - name: bff
          image: local/helloworld-bff:0.1.0
          imagePullPolicy: Never    # Image lives in Docker Desktop's containerd store.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BFF_PUBLIC_ORIGIN
              value: "https://app.secforge.local"
            - name: BFF_KEYCLOAK_ISSUER
              value: "https://auth.secforge.local/realms/secforge-tenants"
            - name: BFF_KEYCLOAK_CLIENT_ID
              value: "helloworld-bff"
            - name: BFF_VALKEY_ADDR
              value: "valkey-primary.valkey.svc.cluster.local:6379"
            # Operator-backlog #13 (closed 2026-05-05): the Valkey AUTH
            # password is no longer an env var. It's fetched at startup
            # from OpenBao at secret/data/apps/helloworld-bff/valkey
            # via apps/lib/secrets/ (see main.go after newOutboundSecretsClient).
            # The legacy-secret-env annotation is gone — Kyverno's
            # no-secret-shaped-env-vars policy admits this manifest cleanly.
            - name: BFF_OPENBAO_ADDR
              value: "https://openbao.openbao.svc.cluster.local:8200"
            - name: BFF_OPENBAO_ROLE
              value: "helloworld-bff"
            - name: BFF_OPENBAO_SVID_PATH
              value: "/shared/openbao.jwt"
            - name: BFF_OPENBAO_KV_PATH
              value: "secret/data/keycloak/clients/helloworld-bff"
            # Phase 7.6 — OpenTelemetry tracing. Empty/unset = no-op
            # exporter; this points at the in-cluster collector which
            # forwards to Tempo.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "helloworld-bff"
            - name: BFF_LISTEN_ADDR
              value: ":3000"
            # Phase 6b-1 — apps/lib/api-auth wiring.
            # BFF_AUDIENCE_LIST: comma-separated allow-list. Q2 (ADR-0014)
            # makes this static config the source of truth — runtime MUST
            # NOT bypass. Adding a new downstream API audience is a 2-step
            # PR'd workflow (see runbook docs/03-runbooks/api-auth-library.md).
            - name: BFF_AUDIENCE_LIST
              value: "authzen-facade,helloworld-api"
            # BFF_BACKEND_AUDIENCE: the audience the /api/* route mints
            # tokens for. Must appear in BFF_AUDIENCE_LIST or the BFF
            # refuses to start.
            - name: BFF_BACKEND_AUDIENCE
              value: "helloworld-api"
            # BFF_WORKLOAD_ID: the SPIFFE-SVID this BFF presents in audit
            # lines as `caller_workload_id`. SPIRE-CSI plumbing of the
            # actual SVID into the process is Phase 7c work; for now we
            # mirror the SPIRE-managed identity name explicitly.
            - name: BFF_WORKLOAD_ID
              value: "spiffe://secforge.local/ns/app/sa/helloworld-bff"
            # Phase 9.6 — backend + frontend wired. Both services live in
            # the `app` namespace alongside the BFF. The BFF's existing
            # proxyToBackend / proxyToFrontend (proxy.go) handles routing
            # once these are non-empty.
            - name: BFF_BACKEND_URL
              value: "http://helloworld-backend.app.svc.cluster.local:8080"
            - name: BFF_FRONTEND_URL
              value: "http://helloworld-frontend.app.svc.cluster.local:8080"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # Phase 7.0.a — SPIFFE-CSI cold-boot race grace. 30×10s = 5min
          # window during which liveness is suppressed; lets the app
          # re-fetch a fresh SVID after the spiffe-helper init's TTL
          # has burned through the kubelet mount-retry backoff. See
          # PLAN.md Phase 5 follow-up #6 + spire-rotation.md.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true

      volumes:
        - name: spiffe-workload-api
          csi: { driver: csi.spiffe.io, readOnly: true }
        - name: helper-conf
          configMap:
            name: helloworld-bff-spiffe-helper
        - name: shared
          emptyDir: {}
