# Phase 7.6 — helloworld-bff ServiceMonitor.
#
# /metrics is served on the same port as the user traffic (:3000) by the
# stdlib promhttp.Handler() registered alongside the OIDC routes.
# NetworkPolicy in 05-networkpolicies.yaml gates ingress from observability ns.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: helloworld-bff
  namespace: app
  labels:
    release: kps
    app.kubernetes.io/name: helloworld-bff
    secforge.platform/component: helloworld-bff
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld-bff
  namespaceSelector:
    matchNames:
      - app
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
