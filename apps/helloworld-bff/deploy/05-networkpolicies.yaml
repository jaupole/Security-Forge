# Phase 6.8 — NetworkPolicies for helloworld-bff.
# Defense in depth alongside Istio AuthorizationPolicy (where applicable).
# The BFF is intentionally NOT under mesh-authz: enforce (ingress-nginx
# is non-mesh until 6.2b) — these NetworkPolicies are the inbound gate.

# Inbound: only ingress-nginx may reach the BFF on :3000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-helloworld-bff
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-bff
    secforge.platform/component: helloworld-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: helloworld-bff
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
    # Same-ns mesh callers via HBONE :15008 — for in-mesh traffic from
    # other app-ns workloads (none today; future BFF callbacks).
    - from:
        - podSelector: {}
      ports:
        - port: 15008
          protocol: TCP
    # Phase 7.6: Prometheus scrapes /metrics on the same :3000 port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 3000
          protocol: TCP
---
# Outbound: BFF needs DNS, Keycloak, OpenBao, Valkey, AuthZEN, and
# (future) backend. Broad enough to support ztunnel's transparent
# proxy redirect (Ambient mode); narrowed by AuthorizationPolicy at
# the destination side where possible.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helloworld-bff-egress
  namespace: app
  labels:
    app.kubernetes.io/name: helloworld-bff
    secforge.platform/component: helloworld-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: helloworld-bff
  policyTypes: [Egress]
  egress:
    # DNS (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Keycloak — token endpoint, JWKS, end-session, revoke
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
      ports:
        - port: 8443
          protocol: TCP
    # ingress-nginx — KC issuer URL resolves to https://auth.secforge.local
    # which goes via the ingress for in-cluster requests too (the BFF
    # treats the issuer URL identically to a browser).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 443
          protocol: TCP
    # OpenBao
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - port: 8200
          protocol: TCP
    # Valkey
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: valkey
      ports:
        - port: 6379
          protocol: TCP
    # Phase 7.6 — OpenTelemetry collector (OTLP gRPC for trace export).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4317
          protocol: TCP
    # In-app: AuthZEN façade (already opted into mesh-authz; allowed)
    # plus future backend. Ambient outbound exits via local ztunnel; we
    # broaden the egress here so ztunnel intercept doesn't get blocked
    # by the CNI policy enforcement layer.
    - to:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 8080
          protocol: TCP
        - port: 15001
          protocol: TCP
        - port: 15008
          protocol: TCP
