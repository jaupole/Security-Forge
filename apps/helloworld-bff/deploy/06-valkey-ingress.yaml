# Cross-namespace NetworkPolicy: allow `app/helloworld-bff` to reach
# Valkey on :6379. Lives in the `valkey` namespace because that's where
# the destination's NetworkPolicy enforcement happens.
#
# The chart-shipped `valkey/valkey` policy uses a bare `podSelector`
# (no namespaceSelector), which is namespace-scoped — same-ns callers
# only. This policy adds a cross-ns allow without modifying the
# chart-managed resource.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-bff-to-valkey
  namespace: valkey
  labels:
    secforge.platform/component: helloworld-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: helloworld-bff
      ports:
        - port: 6379
          protocol: TCP
