# Pre-commit hooks for the SecForge platform.
#
# Activate once with:  pre-commit install
# Run manually:        pre-commit run --all-files
#
# SAST coverage:
#   Local commits  — handled by Claude `/gates` (semgrep via WSL bridge)
#   Push / PR / merge — handled by .github/workflows/pr-fast-gates.yml etc.
#   We do NOT run semgrep here because semgrep-core ships no Windows binary
#   and a Docker-based local hook adds 30+ seconds per commit. Real SAST is
#   the CI's job, with Claude's WSL bridge as the local fast path.

repos:
  # Secrets on staged content. Upstream entry handles staged scan — do NOT
  # override args (pre-commit's args append rather than replace and would
  # corrupt the invocation).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Common-sense lint — file modes, large files, line endings, etc.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: ['--allow-multiple-documents']
        # Skip vendored Helm charts (intentional templating that breaks check-yaml)
        exclude: '^(infrastructure/wazuh/vendor/|platform/manifests/.*/vendor-chart/)'
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
        # Exclude SBOM files (known-large by design; supply-chain audit artifacts)
        exclude: '^apps/.*/sbom/'
      - id: mixed-line-ending
        args: ['--fix=lf']
