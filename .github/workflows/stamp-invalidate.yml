# Stamp invalidation on force-push or rebase (v2 §1.4).
#
# A previously-signed attestation is bound to a specific subject digest.
# If the tree is rewritten (force-push, rebase, amend), the digest no longer
# matches and the attestation is invalid. This workflow detects that and posts
# a `stamp/invalid` check on the PR so the deploy pipeline can refuse to ship.
#
# Copy to `.github/workflows/stamp-invalidate.yml`.

name: Stamp invalidation

on:
  push:
    branches: ['**']    # all branches, including force-push
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  check-stamp:
    # sec(audit Wave 0): fork PRs must not execute on the self-hosted prod runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, secforge]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - name: Detect rewrite
        id: detect
        run: |
          # If the push event is a force-push, GitHub marks it. Otherwise we
          # compare the digest of the current tree against the most recent
          # attestation, if one exists.
          # A force-push only invalidates an attestation if the ref was actually
          # stamped. Stamps are produced on merge-to-main (merge-slow-gates-and-stamp);
          # PR branches — e.g. Renovate's digest-bump rebases — are never stamped, so a
          # force-push there invalidates nothing. Posting stamp/invalid=red on those was
          # a false positive that silently blocked the entire CVE digest-patch
          # auto-merge stream (pentest 2026-06-10). Only the default branch is stamped.
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            forced="${{ github.event.forced || 'false' }}"
          else
            forced="false"
          fi
          echo "forced=$forced" >> "$GITHUB_OUTPUT"

          # Always re-check the tree digest vs any present .attestation.json
          # on the bundle. Real prod uses container-image digest comparison.
          if [[ -f bundle.tar && -f bundle.tar.attestation.json ]]; then
            current=$(sha256sum bundle.tar | awk '{print $1}')
            attested=$(jq -r '.subject[0].digest.sha256' bundle.tar.attestation.json)
            if [[ "$current" != "$attested" ]]; then
              echo "digest_mismatch=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Post stamp/invalid check (red)
        if: steps.detect.outputs.forced == 'true' || steps.detect.outputs.digest_mismatch == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const conclusion = 'failure';
            const reason = ${{ toJSON(steps.detect.outputs) }};
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'stamp/invalid',
              head_sha: context.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: 'Attestation invalidated by tree rewrite',
                summary: 'Re-run the merge workflow to produce a fresh stamp before deploying.',
                text: JSON.stringify(reason, null, 2),
              },
            });

      - name: Post stamp/ok check (green)
        if: steps.detect.outputs.forced != 'true' && steps.detect.outputs.digest_mismatch != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'stamp/invalid',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'No tree rewrite detected',
                summary: 'Attestation, if any, remains binding.',
              },
            });
