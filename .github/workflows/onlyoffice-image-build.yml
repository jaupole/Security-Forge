# Build + CVE-scan + Cosign-keyless-sign the SecForge ONLYOFFICE Document
# Server image (DOCENG Phase 1).
#
# A THIN derivative of upstream onlyoffice/documentserver
# (platform/manifests/onlyoffice/image/Dockerfile): same Document Server,
# upstream pinned by digest, Ubuntu base apt-upgraded to current security
# patches. The wrapper exists so the image ships from ghcr.io/jaupole/* with a
# keyless signature — Kyverno's registry allowlist has no docker.io/onlyoffice
# entry. Same pattern as gotenberg-image-build.yml.
#
# DEVIATION from the gotenberg workflow: the Trivy scan here is REPORT-ONLY
# (no --exit-code gate). The DS is a huge Ubuntu-based all-in-one vendor image
# (nginx + postgres + rabbitmq + Node services); unfixable/vendor-pinned
# CRITICALs in that closure would permanently block the build even though
# `apt-get upgrade` has already taken every fix Ubuntu ships. The scan output
# still lands in the job summary + JSON artifact for the SBOM/triage loop —
# review it on every build.
#
# ONE-TIME: after the first run, set the ghcr.io/jaupole/onlyoffice-documentserver
# package visibility to PUBLIC (GitHub → Packages → settings → change
# visibility). The deployment then needs no imagePullSecret and the onlyoffice
# namespace stays free of pull secrets.
#
# Cosign pinned to v2.x: writes the legacy sha256-<digest>.sig tag the cluster's
# Kyverno verifies (v3 defaults to OCI 1.1 referrers the cluster can't find —
# operator-backlog #48/#90).

name: onlyoffice-image-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream Document Server base version (must match the digest pinned in the Dockerfile)
        required: true
        default: "9.4.0.1"
      reason:
        description: Why running (e.g. CVE refresh, base bump)
        required: false
        default: manual build
  push:
    branches: [main, master]
    paths:
      - platform/manifests/onlyoffice/image/**
      - .github/workflows/onlyoffice-image-build.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/onlyoffice-documentserver

jobs:
  build-sign-push:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, secforge]
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless OIDC
    env:
      # The box runs every repo's runner under ONE OS account. docker/login-action
      # writes GHCR creds to $HOME/.docker/config.json, and any OTHER repo's
      # job finishing runs `docker logout` in its post step — wiping this job's
      # auth mid-run. GHCR then answers anonymous requests on the private
      # package with MANIFEST_UNKNOWN (the "propagation race" that wasn't).
      # An isolated per-job DOCKER_CONFIG ends the cross-runner clobbering;
      # login, buildx, manifest inspect, Trivy, and cosign all honor it.
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-isolated
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: image=moby/buildkit:v0.18.2

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'   # legacy .sig tag the cluster verifies (backlog #90)

      - name: Resolve Document Server version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Default for push-triggered runs (no dispatch input). The version is
          # a TAG label only — the actual upstream base is digest-pinned in the
          # Dockerfile; keep the two in sync.
          VERSION="${INPUT_VERSION:-9.4.0.1}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building onlyoffice-documentserver base ${VERSION}"

      - name: Resolve image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}-secforge
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=SecForge ONLYOFFICE Document Server
            org.opencontainers.image.description=ONLYOFFICE Docs ${{ steps.ver.outputs.version }} with the Ubuntu base security-patched
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=SecForge
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build (+ push)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # Always re-resolve FROM tags at build time. Default pull:false lets a
          # persistent self-hosted runner serve a stale cached base for floating
          # tags (e.g. distroless :nonroot) - audited 2026-07-19 during the
          # control libssl3 CVE chase (that build WAS fresh, but only by luck of
          # cache GC; make it deterministic).
          pull: true
          context: platform/manifests/onlyoffice/image
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # GHCR propagates a pushed manifest asynchronously; fetching by digest
      # immediately after push intermittently 404s (MANIFEST_UNKNOWN) and a
      # rerun rebuilds with a new created-timestamp → new digest → same race.
      # Poll until the manifest is fetchable before scanning/signing.
      - name: Wait for GHCR manifest propagation
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          for i in $(seq 1 30); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "manifest available after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::manifest still unavailable after 150s"
          exit 1

      - name: Scan built image for CVEs (Trivy — REPORT-ONLY, see header)
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          # Host /tmp is a 4G tmpfs; trivy copies multi-GB layers into $TMPDIR
          # and ENOSPCs there (see gotenberg run 28765004461). runner.temp is on disk.
          TMPDIR: ${{ runner.temp }}
        run: |
          ./.claude/scripts/install-verify.sh trivy
          export PATH="$HOME/.local/bin:$PATH"
          {
            echo "## Trivy CVE scan — \`${REF}\` (report-only for the vendor AIO base)"
            echo '```'
            trivy image --quiet --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL "${REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          trivy image --quiet --scanners vuln --format json --output trivy-onlyoffice.json "${REF}"
          # NO blocking gate here (deviation from gotenberg — header). Review
          # the summary above on every build; fixable CRITICALs in packages
          # Ubuntu has patched should not appear (apt-get upgrade takes them).

      - name: Upload Trivy CVE report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-onlyoffice-cve-report
          path: trivy-onlyoffice.json
          if-no-files-found: ignore

      - name: Cosign keyless sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Verify signature (smoke test)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Output deploy instructions
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Built + signed"
            echo ""
            echo "**Image:** \`${REGISTRY}/${IMAGE_NAME}:${VERSION}-secforge@${DIGEST}\`"
            echo ""
            echo "### To deploy"
            echo "Set the container \`image:\` in \`platform/manifests/onlyoffice/09-deployment.yaml\` to:"
            echo '```yaml'
            echo "  image: ${REGISTRY}/${IMAGE_NAME}:${VERSION}-secforge@${DIGEST}"
            echo '```'
            echo ""
            echo "If this is the FIRST run: set the GHCR package visibility to **public**."
          } >> "$GITHUB_STEP_SUMMARY"
