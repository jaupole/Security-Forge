# Build + CVE-scan + Cosign-keyless-sign the SecForge Gotenberg image.
#
# A THIN derivative of upstream Gotenberg (platform/manifests/document-render/
# image/Dockerfile): same Gotenberg, Debian base + Chromium/LibreOffice deps
# apt-upgraded to current security patches. A pure mirror can't be patched, so
# to deliver "one image to CVE-patch" (ADR-0037) we build + re-sign this thin
# layer — same pattern as keycloak-image-build.yml.
#
# ONE-TIME: after the first run, set the ghcr.io/jaupole/gotenberg package
# visibility to PUBLIC (GitHub → Packages → gotenberg → settings → change
# visibility). The deployment then needs no imagePullSecret and document-render
# stays secret-free. See docs/03-runbooks/gotenberg-mirror-and-deploy.md.
#
# Cosign pinned to v2.x: writes the legacy sha256-<digest>.sig tag the cluster's
# Kyverno verifies (v3 defaults to OCI 1.1 referrers the cluster can't find —
# operator-backlog #48).

name: gotenberg-image-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream Gotenberg base version (e.g. 8.33.0)
        required: true
        default: "8.33.0"
      reason:
        description: Why running (e.g. CVE refresh, base bump)
        required: false
        default: manual build
  push:
    branches: [main, master]
    paths:
      - platform/manifests/document-render/image/**
      - .github/workflows/gotenberg-image-build.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gotenberg

jobs:
  build-sign-push:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, secforge]
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless OIDC
    env:
      # The box runs every repo's runner under ONE OS account. docker/login-action
      # writes GHCR creds to $HOME/.docker/config.json, and any OTHER repo's
      # job finishing runs `docker logout` in its post step — wiping this job's
      # auth mid-run. GHCR then answers anonymous requests on the private
      # package with MANIFEST_UNKNOWN (the "propagation race" that wasn't).
      # An isolated per-job DOCKER_CONFIG ends the cross-runner clobbering;
      # login, buildx, manifest inspect, Trivy, and cosign all honor it.
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-isolated
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver-opts: image=moby/buildkit:v0.18.2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'   # legacy .sig tag the cluster verifies (backlog #90)

      - name: Resolve Gotenberg version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Default for push-triggered runs (no dispatch input).
          VERSION="${INPUT_VERSION:-8.33.0}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building gotenberg base ${VERSION}"

      - name: Resolve image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}-secforge
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=SecForge Gotenberg
            org.opencontainers.image.description=Gotenberg ${{ steps.ver.outputs.version }} with base + Chromium/LibreOffice deps security-patched
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=SecForge
            org.opencontainers.image.licenses=MIT

      - name: Build (+ push)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: platform/manifests/document-render/image
          build-args: |
            GOTENBERG_VERSION=${{ steps.ver.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # GHCR propagates a pushed manifest asynchronously; fetching by digest
      # immediately after push intermittently 404s (MANIFEST_UNKNOWN) and a
      # rerun rebuilds with a new created-timestamp → new digest → same race.
      # Poll until the manifest is fetchable before scanning/signing.
      - name: Wait for GHCR manifest propagation
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          for i in $(seq 1 30); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "manifest available after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::manifest still unavailable after 150s"
          exit 1

      - name: Scan built image for CVEs (Trivy)
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          ./.claude/scripts/install-verify.sh trivy
          export PATH="$HOME/.local/bin:$PATH"
          {
            echo "## Trivy CVE scan — \`${REF}\`"
            echo '```'
            trivy image --quiet --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL "${REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          trivy image --quiet --scanners vuln --format json --output trivy-gotenberg.json "${REF}"
          # GATE: refuse to sign/ship the renderer image with a FIXABLE CRITICAL.
          # The whole point of building (vs mirroring) is that apt upgrade pulls
          # Debian's patched Chromium/base, so this should pass clean.
          trivy image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "${REF}"

      - name: Upload Trivy CVE report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-gotenberg-cve-report
          path: trivy-gotenberg.json
          if-no-files-found: ignore

      - name: Cosign keyless sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Verify signature (smoke test)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Output deploy instructions
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Built + signed"
            echo ""
            echo "**Image:** \`${REGISTRY}/${IMAGE_NAME}:${VERSION}-secforge@${DIGEST}\`"
            echo ""
            echo "### To deploy"
            echo "Set the container \`image:\` in \`platform/manifests/document-render/09-deployment.yaml\` to:"
            echo '```yaml'
            echo "  image: ${REGISTRY}/${IMAGE_NAME}:${VERSION}-secforge@${DIGEST}"
            echo '```'
            echo ""
            echo "If this is the FIRST run: set the GHCR package visibility to **public**."
          } >> "$GITHUB_STEP_SUMMARY"
