# Build, push, and Cosign-keyless-sign the SecForge custom Keycloak image.
#
# Triggers:
#   - push to main/master if anything under platform/manifests/keycloak/image/ changes
#   - manual (workflow_dispatch) for ad-hoc rebuild
#   - PR (build-only, no push, no sign) for review feedback
#
# OIDC identity for the Cosign signature is automatic from the
# permissions.id-token: write claim. The cluster's Kyverno
# verify-image-signature ClusterPolicy enforces that ghcr.io/jaupole/keycloak
# images carry a Cosign signature whose subject regex matches this repo —
# update the policy if you fork this repo to a different owner.
#
# Cosign is pinned to the v2 line: v2.x stores the signature on the legacy
# sha256-<digest>.sig tag that the cluster's Kyverno reads. Cosign v3 defaults
# to OCI 1.1 referrer-stored signatures the cluster cannot find. See
# operator-backlog #48.

name: keycloak-image-build

on:
  push:
    branches: [main, master]
    paths:
      - platform/manifests/keycloak/image/**
      - .github/workflows/keycloak-image-build.yml
  pull_request:
    paths:
      - platform/manifests/keycloak/image/**
      - .github/workflows/keycloak-image-build.yml
  workflow_dispatch:
    inputs:
      reason:
        description: Why running manually (e.g. blacklist refresh, base bump)
        required: false
        default: manual rebuild

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/keycloak

jobs:
  build-sign-push:
    # sec(audit Wave 0): fork PRs must not execute on the self-hosted prod runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, secforge]
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver-opts: image=moby/buildkit:v0.18.2

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign binary to the v2 line (the installer action stays
          # current). v2.6.0 is the final v2 release; it signs to the legacy
          # sha256-<digest>.sig tag the cluster's Kyverno verifies. Revisit
          # when the cluster can verify OCI 1.1 referrer signatures.
          cosign-release: 'v2.6.0'

      - name: Resolve image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=26.3.3-secforge,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=SecForge Keycloak
            org.opencontainers.image.description=Keycloak with HIBP password blacklist + recovery-codes,dpop pre-built
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=SecForge
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build (+ push on non-PR)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: platform/manifests/keycloak/image
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Cosign keyless sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Verify signature (smoke test)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Output deploy instructions
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "## Built + signed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## To deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bump \`platform/manifests/keycloak/04-keycloak-cr.yaml\` \`spec.image\` to:" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Then \`kubectl apply -f\` it. Operator handles the rollout." >> "$GITHUB_STEP_SUMMARY"
