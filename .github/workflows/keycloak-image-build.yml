# Build, push, and Cosign-keyless-sign the SecForge custom Keycloak image.
#
# Triggers:
#   - push to main/master if anything under platform/manifests/keycloak/image/ changes
#   - manual (workflow_dispatch) for ad-hoc rebuild
#   - PR (build-only, no push, no sign) for review feedback
#
# OIDC identity for the Cosign signature is automatic from the
# permissions.id-token: write claim. The cluster's Kyverno
# verify-image-signature ClusterPolicy enforces that ghcr.io/jaupole/keycloak
# images carry a Cosign signature whose subject regex matches this repo —
# update the policy if you fork this repo to a different owner.
#
# Cosign is pinned to the v2 line: v2.x stores the signature on the legacy
# sha256-<digest>.sig tag that the cluster's Kyverno reads. Cosign v3 defaults
# to OCI 1.1 referrer-stored signatures the cluster cannot find. See
# operator-backlog #48.

name: keycloak-image-build

on:
  push:
    branches: [main, master]
    paths:
      - platform/manifests/keycloak/image/**
      - .github/workflows/keycloak-image-build.yml
  pull_request:
    paths:
      - platform/manifests/keycloak/image/**
      - .github/workflows/keycloak-image-build.yml
  workflow_dispatch:
    inputs:
      reason:
        description: Why running manually (e.g. blacklist refresh, base bump)
        required: false
        default: manual rebuild

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/keycloak

jobs:
  build-sign-push:
    # sec(audit Wave 0): fork PRs must not execute on the self-hosted prod runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, secforge]
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless OIDC
    env:
      # The box runs every repo's runner under ONE OS account. docker/login-action
      # writes GHCR creds to $HOME/.docker/config.json, and any OTHER repo's
      # job finishing runs `docker logout` in its post step — wiping this job's
      # auth mid-run. GHCR then answers anonymous requests on the private
      # package with MANIFEST_UNKNOWN (the "propagation race" that wasn't).
      # An isolated per-job DOCKER_CONFIG ends the cross-runner clobbering;
      # login, buildx, manifest inspect, Trivy, and cosign all honor it.
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-isolated
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver-opts: image=moby/buildkit:v0.18.2

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign binary to the v2 line (the installer action stays
          # current). v2 signs to the legacy sha256-<digest>.sig tag the
          # cluster's Kyverno verifies; v3's bundle format is unverifiable on
          # GHCR (artifactType lost in the tag-fallback referrers index).
          # v2.6.3 carries the GHSA-whqx-f9j3-ch6m verify-path fix. See
          # operator-backlog #90.
          cosign-release: 'v2.6.3'

      - name: Resolve image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=26.3.3-secforge,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=SecForge Keycloak
            org.opencontainers.image.description=Keycloak with HIBP password blacklist + recovery-codes,dpop pre-built
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=SecForge
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build (+ push on non-PR)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: platform/manifests/keycloak/image
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # GHCR propagates a pushed manifest asynchronously; fetching by digest
      # immediately after push intermittently 404s (MANIFEST_UNKNOWN) and a
      # rerun rebuilds with a new created-timestamp → new digest → same race.
      # Poll until the manifest is fetchable before scanning/signing.
      - name: Wait for GHCR manifest propagation
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          for i in $(seq 1 30); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "manifest available after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::manifest still unavailable after 150s"
          exit 1

      # CVE-scan the built image. The cluster's trivy-operator cannot scan this
      # private image: the Keycloak operator strips podTemplate imagePullSecrets,
      # so keycloak pulls via its ServiceAccount secret, which trivy-operator does
      # not use for cross-namespace scan jobs (confirmed 2026-06-02). Scanning at
      # build time closes that CVE-visibility gap for the IdP image. Runs before
      # the cosign signature so a future gate can refuse to sign a vulnerable image.
      - name: Scan image for CVEs (Trivy)
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          # Host /tmp is a 4G tmpfs; trivy copies multi-GB layers into $TMPDIR
          # and ENOSPCs there (see gotenberg run 28765004461). runner.temp is on disk.
          TMPDIR: ${{ runner.temp }}
        run: |
          ./.claude/scripts/install-verify.sh trivy
          # install-verify appends ~/.local/bin to $GITHUB_PATH (for *later* steps);
          # this is the same step, so put it on PATH explicitly.
          export PATH="$HOME/.local/bin:$PATH"
          # No `|| true`: trivy exits non-zero only on ERRORS (can't pull/run), not on
          # findings (no --exit-code below), so this surfaces broken scanning while
          # staying report-only for CVEs.
          {
            echo "## Trivy CVE scan — \`${REF}\`"
            echo '```'
            trivy image --quiet --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL "${REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          trivy image --quiet --scanners vuln --format json --output trivy-keycloak.json "${REF}"
          # GATE: refuse to sign/ship a keycloak image with a FIXABLE CRITICAL CVE.
          # Baseline 2026-06-02 was 0 CRITICAL, so this does not block today; it fails
          # closed if a fixable CRITICAL ever lands on the IdP image. HIGH stays
          # report-only for now (the current fixable HIGHs are java-21-openjdk CVEs
          # that need a keycloak minor upgrade to clear — tracked separately).
          # --ignore-unfixed limits the gate to actionable (patchable) CVEs.
          trivy image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "${REF}"

      - name: Upload Trivy CVE report
        if: ${{ github.event_name != 'pull_request' && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-keycloak-cve-report
          path: trivy-keycloak.json
          if-no-files-found: ignore

      - name: Cosign keyless sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Verify signature (smoke test)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Output deploy instructions
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "## Built + signed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## To deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bump \`platform/manifests/keycloak/04-keycloak-cr.yaml\` \`spec.image\` to:" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Then \`kubectl apply -f\` it. Operator handles the rollout." >> "$GITHUB_STEP_SUMMARY"
