# Mirror + CVE-scan + Cosign-keyless-sign the upstream Gotenberg image into GHCR.
#
# WHY MIRROR: the cluster's Kyverno restrict-image-registries (Enforce) only
# admits a fixed allowlist, and verify-image-signature-secforge (Enforce)
# requires ghcr.io/{secforge,jaupole}/* to carry a cosign signature whose
# subject is this repo. docker.io/gotenberg/gotenberg is neither allow-listed
# nor signed by us. Mirroring it to ghcr.io/jaupole/gotenberg and signing it
# here makes the renderer image satisfy BOTH policies WITHOUT loosening the
# allowlist or dropping to Audit — and gives us ONE Chromium/LibreOffice image
# to CVE-patch for the whole ecosystem (ADR-0037).
#
# This is a MIRROR, not a build: we copy the upstream manifest by digest (so the
# bytes are exactly upstream's), then sign the GHCR copy. The digest is
# preserved by crane copy, so the signed ref == the upstream digest.
#
# ONE-TIME: after the first run, set the ghcr.io/jaupole/gotenberg package
# visibility to PUBLIC (GitHub → Packages → gotenberg → Package settings →
# Change visibility → Public). The deployment then needs no imagePullSecret and
# document-render stays secret-free. See docs/03-runbooks/gotenberg-mirror-and-deploy.md.
#
# Cosign is pinned to v2.x: it writes the legacy sha256-<digest>.sig tag the
# cluster's Kyverno reads (v3 defaults to OCI 1.1 referrers the cluster can't
# find — same constraint as keycloak-image-build.yml; operator-backlog #48).

name: gotenberg-mirror

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream Gotenberg version to mirror (e.g. 8.32.0)
        required: true
        default: "8.32.0"
      reason:
        description: Why running (e.g. CVE refresh, version bump)
        required: false
        default: manual mirror

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gotenberg
  UPSTREAM: docker.io/gotenberg/gotenberg

jobs:
  mirror-sign:
    runs-on: [self-hosted, secforge]
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless OIDC
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          CRANE_VERSION=v0.20.2
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp crane
          sudo mv /tmp/crane /usr/local/bin/crane
          crane version

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.0'   # legacy .sig tag the cluster verifies

      - name: Resolve upstream digest (pin the mirror by digest)
        id: upstream
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          DIGEST=$(crane digest "${UPSTREAM}:${VERSION}")
          echo "Upstream ${UPSTREAM}:${VERSION} -> ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Mirror upstream -> GHCR (by digest)
        env:
          VERSION: ${{ github.event.inputs.version }}
          UPSTREAM_DIGEST: ${{ steps.upstream.outputs.digest }}
        run: |
          # Copy the exact upstream bytes; tag the GHCR copy with the version.
          # crane copy preserves the manifest, so the GHCR digest == upstream's.
          crane copy "${UPSTREAM}@${UPSTREAM_DIGEST}" "${REGISTRY}/${IMAGE_NAME}:${VERSION}"

      - name: Scan mirrored image for CVEs (Trivy)
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.upstream.outputs.digest }}
        run: |
          ./.claude/scripts/install-verify.sh trivy
          export PATH="$HOME/.local/bin:$PATH"
          {
            echo "## Trivy CVE scan — \`${REF}\`"
            echo '```'
            trivy image --quiet --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL "${REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          trivy image --quiet --scanners vuln --format json --output trivy-gotenberg.json "${REF}"
          # GATE: refuse to sign/ship the renderer image with a FIXABLE CRITICAL.
          # Chromium/LibreOffice carry a large dependency closure — this is the
          # single chokepoint where we keep it clean for the whole ecosystem.
          # --ignore-unfixed limits the gate to actionable CVEs.
          trivy image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "${REF}"

      - name: Upload Trivy CVE report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-gotenberg-cve-report
          path: trivy-gotenberg.json
          if-no-files-found: ignore

      - name: Cosign keyless sign
        env:
          DIGEST: ${{ steps.upstream.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Verify signature (smoke test)
        env:
          DIGEST: ${{ steps.upstream.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Output deploy instructions
        env:
          VERSION: ${{ github.event.inputs.version }}
          DIGEST: ${{ steps.upstream.outputs.digest }}
        run: |
          {
            echo "## Mirrored + signed"
            echo ""
            echo "**Image:** \`${REGISTRY}/${IMAGE_NAME}:${VERSION}@${DIGEST}\`"
            echo ""
            echo "### To deploy"
            echo "Set \`spec...image\` in \`platform/manifests/document-render/09-deployment.yaml\` to:"
            echo '```yaml'
            echo "  image: ${REGISTRY}/${IMAGE_NAME}:${VERSION}@${DIGEST}"
            echo '```'
            echo ""
            echo "If this is the FIRST run: set the GHCR package visibility to **public**."
          } >> "$GITHUB_STEP_SUMMARY"
