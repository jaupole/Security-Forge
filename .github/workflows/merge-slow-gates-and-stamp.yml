# Merge-to-main: slow gates + stamp.
# Fires on push-to-main. Produces the cosign-keyless attestation that the
# deploy pipeline verifies before shipping.
#
# Copy to `.github/workflows/merge-slow-gates-and-stamp.yml`.

name: Merge slow gates + stamp

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  id-token: write       # required for Sigstore keyless via OIDC
  packages: write       # if attestation is attached to a GH-published artifact

jobs:
  slow-gates-and-stamp:
    runs-on: [self-hosted, secforge]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '20' }

      - name: Install pinned scanners
        run: ./.claude/scripts/install-verify.sh

      - name: Run merge-tier gates (full SAST + full Trivy + license + tests)
        id: gates
        run: |
          ./.claude/scripts/run-gates.sh --tier merge > gate-run.json
          jq '{tier, gates_in_tier, summary: (.gate_results | map({gate, findings: (.findings|length // 0)}))}' gate-run.json

      - name: Diagnose
        run: |
          jq '.' gate-run.json | python3 .claude/scripts/diagnose.py > diagnose.json
          jq '.summary' diagnose.json

      - name: Upload gate + diagnose output (always — the stamp refusal is only useful with the findings)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-run
          path: |
            gate-run.json
            diagnose.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Refuse to stamp if anything outstanding
        # Outstanding = anything not fixed and not deliberately accepted:
        # auto-patch, human-review AND unclassified (an unclassified finding is
        # still a finding), plus expired acceptances and a malformed acceptance
        # file. Reviewed findings live in .claude/findings-accepted.json.
        run: |
          auto=$(jq -r '.summary.by_routing["auto-patch"] // 0' diagnose.json)
          human=$(jq -r '.summary.by_routing["human-review"] // 0' diagnose.json)
          uncl=$(jq -r '.summary.by_routing["unclassified"] // 0' diagnose.json)
          expired=$(jq -r '.summary.accepted_expired // [] | length' diagnose.json)
          problems=$(jq -r '.summary.acceptance_problems // [] | length' diagnose.json)
          accepted=$(jq -r '.summary.accepted // 0' diagnose.json)
          stale=$(jq -r '.summary.accepted_stale // [] | length' diagnose.json)
          echo "outstanding: auto-patch=$auto human-review=$human unclassified=$uncl expired-acceptances=$expired acceptance-file-problems=$problems | accepted=$accepted stale-acceptances=$stale"
          if [[ "$stale" -gt 0 ]]; then
            echo "::warning::$stale acceptance(s) no longer match a finding — prune .claude/findings-accepted.json"
            jq -r '.summary.accepted_stale[]' diagnose.json | sed 's/^/  stale: /'
          fi
          if [[ "$auto" -gt 0 || "$human" -gt 0 || "$uncl" -gt 0 || "$expired" -gt 0 || "$problems" -gt 0 ]]; then
            echo "::error::merge tier has unresolved findings — refusing to stamp"
            echo "--- outstanding findings (count routing | rule | file:line)"
            jq -r '.categorized[] | select(.routing != "accepted")
                   | "\(.routing) | \(.original.id // .original.rule_id // "?") | \(.original.file // "?"):\(.original.line_start // "?")"' diagnose.json \
              | sort | uniq -c | sort -rn | head -80
            jq -r '.summary.accepted_expired[]? | "expired acceptance: \(.)"' diagnose.json
            jq -r '.summary.acceptance_problems[]? | "acceptance file problem: \(.)"' diagnose.json
            exit 1
          fi

      - name: Build artifact bundle (source as tar)
        id: bundle
        run: |
          bundle="$RUNNER_TEMP/bundle.tar"
          git archive HEAD -o "$bundle"
          digest=$(sha256sum "$bundle" | awk '{print $1}')
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Stamp (cosign keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          ./.claude/scripts/stamp.sh "${{ steps.bundle.outputs.bundle }}" \
            --from-gate-run gate-run.json \
            --from-diagnose diagnose.json \
            --mode keyless

      - name: Upload artifacts + attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-bundle
          path: |
            ${{ steps.bundle.outputs.bundle }}*
            gate-run.json
            diagnose.json
          retention-days: 90
