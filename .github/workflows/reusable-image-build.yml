# Reusable image build → push → (optional Trivy gate) → cosign-sign → verify.
#
# THE fleet image pipeline. Every first-party app repo calls this via
# `uses: jaupole/Security-Forge/.github/workflows/reusable-image-build.yml@main`
# instead of carrying its own copy — a fleet-wide CI fix is ONE edit here
# (2026-06-11 motivation: the cosign-pin and DOCKER_CONFIG fixes each took
# eight hand-synced edits across drifting copies).
#
# Callers keep their own app-specific `test` job and gate this with
# `needs: test`. Callers MUST also keep the fork-PR guard on the calling
# job (self-hosted prod runner — never execute untrusted fork code):
#   if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
#
# Ref pinning: callers reference @main deliberately. SHA-pinning would
# re-introduce the eight-edit problem on every change here; the trust
# boundary is this repo itself, which also holds the cluster manifests.
#
# OIDC identity for the cosign signature comes from the caller's
# permissions (contents: read, packages: write, id-token: write — set them
# on the calling job). The cluster's Kyverno verify-image-signature-secforge
# policy (Enforce) verifies the signature subject against ^https://github.com/(secforge|jaupole)/.

name: reusable-image-build

on:
  workflow_call:
    inputs:
      image:
        description: GHCR package short name (ghcr.io/<owner>/<image>)
        required: true
        type: string
      title:
        description: org.opencontainers.image.title label
        required: true
        type: string
      description:
        description: org.opencontainers.image.description label
        required: true
        type: string
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      build-args:
        description: Newline-separated build args passed to docker/build-push-action
        required: false
        type: string
        default: ""
      trivy-gate:
        description: Fail the run (leaving the image unsigned) on a FIXABLE CRITICAL CVE
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: Content digest of the pushed image (sha256:…)
        value: ${{ jobs.build-sign-push.outputs.digest }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.image }}

jobs:
  build-sign-push:
    runs-on: [self-hosted, secforge]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write    # push to ghcr.io
      id-token: write    # cosign keyless OIDC
    env:
      # The box runs every repo's runner under ONE OS account. docker/login-action
      # writes GHCR creds to $HOME/.docker/config.json, and any OTHER repo's
      # job finishing runs `docker logout` in its post step — wiping this job's
      # auth mid-run. GHCR then answers anonymous requests on the private
      # package with MANIFEST_UNKNOWN (the "propagation race" that wasn't).
      # An isolated per-job DOCKER_CONFIG ends the cross-runner clobbering;
      # login, buildx, manifest inspect, Trivy, and cosign all honor it.
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-isolated
      # The box runs ROOTLESS docker (ADR-0039; per-user socket). Runner .env
      # DOCKER_HOST injection has been unreliable on at least one runner
      # (project-manager) — set it at the job level so buildx always targets
      # the rootless socket instead of root's /var/run/docker.sock.
      DOCKER_HOST: unix:///run/user/1001/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver-opts: image=moby/buildkit:v0.18.2

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Per-job install dir — the default $HOME/.cosign is SHARED across
          # all the box's runners (one OS account), and concurrent caller
          # builds race on it (curl exit 23 write error; hit on member-hub's
          # first fleet build 2026-06-11). Same hazard family as the
          # DOCKER_CONFIG isolation above.
          install-dir: ${{ github.workspace }}/.cosign-bin
          # Pin the cosign BINARY to the v2 line (the installer action can
          # stay current — bots bump the action, not this input). cosign v3
          # signs in the sigstore bundle format via OCI referrers and pushes
          # no legacy sha256-<digest>.sig tag; on GHCR (tag-fallback, no
          # native referrers API) the bundle's artifactType is also lost
          # from the fallback index, so the cluster's Kyverno (1.18, Enforce)
          # cannot verify it AT ALL — every image is denied with "no
          # signatures found" (hit 2026-06-11, dependabot PR #30). Revisit
          # when cosign's fallback index propagates artifactType AND the
          # cluster policy migrates to type: SigstoreBundle (backlog #90).
          cosign-release: 'v2.6.3'

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=SecForge
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build (+ push on non-PR)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          build-args: ${{ inputs.build-args }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # GHCR propagates a pushed manifest asynchronously; fetching by digest
      # immediately after push intermittently 404s (MANIFEST_UNKNOWN) and a
      # rerun rebuilds with a new created-timestamp → new digest → same race.
      # Poll until the manifest is fetchable before scanning/signing.
      - name: Wait for GHCR manifest propagation
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          for i in $(seq 1 30); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "manifest available after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::manifest still unavailable after 150s"
          exit 1

      # Optional image vuln gate before signing — a CRITICAL (fixable)
      # base-image or OS-package finding leaves the image unsigned, so
      # Kyverno refuses to admit it. Unfixed CVEs don't block.
      - name: Trivy image scan (gate)
        if: ${{ inputs.trivy-gate && github.event_name != 'pull_request' }}
        # The image is PRIVATE and Trivy runs in the action's own container,
        # which can't reach the rootless docker daemon, so it pulls from GHCR
        # over the network. Without explicit creds that pull is anonymous →
        # UNAUTHORIZED. Give Trivy the same GHCR token cosign uses.
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          timeout: "20m"

      - name: Cosign keyless sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
          # Docker 29 changed credential storage; docker login's auth
          # no longer lands in config.json in a way cosign's keychain
          # picks up. Pass GHCR creds explicitly via cosign's own
          # registry flags so we don't depend on docker auth.
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Verify signature (smoke test)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keyless identity inside a REUSABLE workflow is the reusable
          # workflow's own ref (Fulcio SAN = job_workflow_ref), not the
          # caller repo — every fleet image now signs as exactly this
          # file. Kyverno's subjectRegExp (^…/(secforge|jaupole)/) still
          # matches; tightening the cluster policy to this single
          # identity is a follow-up hardening option.
          cosign verify \
            --registry-username "${REGISTRY_USERNAME}" \
            --registry-password "${REGISTRY_PASSWORD}" \
            --certificate-identity-regexp "^https://github\\.com/jaupole/Security-Forge/\\.github/workflows/reusable-image-build\\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Build summary + deploy hint
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Built + signed"
            echo ""
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}\`"
            echo ""
            echo "## Deploy"
            echo ""
            echo '```sh'
            echo "gh workflow run deploy-app.yml -R jaupole/Security-Forge \\"
            echo "  -f app=${{ inputs.image }} -f digest=${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
