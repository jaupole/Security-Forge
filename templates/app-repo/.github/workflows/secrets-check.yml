# SecForge app-repo template — secrets-check CI workflow.
#
# Layer 2 of ADR-0013's six-layer guardrail stack. Mirrors every
# pre-commit hook in .pre-commit-config.yaml so that `git commit --no-verify`
# cannot merge a PR. Required check on the default branch via branch
# protection (set up at app-onboarding time per
# docs/03-runbooks/ci-secrets-check.md on the platform repo).

name: secrets-check

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  block-env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Reject staged .env files (except .env.example)
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::ADR-0013 violation: .env file(s) tracked in repo:"
            echo "$bad"
            echo "Outbound secrets must come from apps/lib/secrets/ — see README-secrets.md."
            exit 1
          fi

  block-secret-shaped-vars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Reject os.Getenv("...KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL...")
        run: |
          set -euo pipefail
          files=$(git ls-files '*.go' || true)
          if [ -z "$files" ]; then exit 0; fi
          bad=$(grep -nE 'os\.Getenv\("[^"]*(KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)[^"]*"\)' $files || true)
          if [ -n "$bad" ]; then
            echo "::error::ADR-0013 violation: secret-shaped env-var read in Go source:"
            echo "$bad"
            echo "Use apps/lib/secrets/ Client.GetField instead — see README-secrets.md."
            exit 1
          fi

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: hadolint Dockerfile(s)
        run: |
          set -euo pipefail
          files=$(git ls-files | grep -E '(^|/)Dockerfile(\..+)?$' || true)
          if [ -z "$files" ]; then exit 0; fi
          for f in $files; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < "$f"
          done

  dockerfile-no-env-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Reject COPY .env* and ENV with secret-shaped names
        run: |
          set -euo pipefail
          files=$(git ls-files | grep -E '(^|/)Dockerfile(\..+)?$' || true)
          if [ -z "$files" ]; then exit 0; fi
          bad=""
          for f in $files; do
            # COPY .env* — directly stages a secret carrier into the image.
            hits=$(grep -nE '^[[:space:]]*COPY[[:space:]]+[^[:space:]]*\.env' "$f" || true)
            if [ -n "$hits" ]; then bad="$bad\n$f:\n$hits"; fi
            # ENV NAME=value with secret-shaped names — bakes a literal into the image layer.
            hits=$(grep -nE '^[[:space:]]*ENV[[:space:]]+[^[:space:]]*(KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)[^[:space:]]*=' "$f" || true)
            if [ -n "$hits" ]; then bad="$bad\n$f:\n$hits"; fi
          done
          if [ -n "$bad" ]; then
            echo "::error::ADR-0013 violation: secret-carrying Dockerfile pattern:"
            printf '%b\n' "$bad"
            echo "See README-secrets.md."
            exit 1
          fi

  artifact-upload-guard:
    # Last-resort check: if a future workflow uploads a build artifact
    # that includes any .env* file, fail. This catches the case where
    # someone adds an upload step without a matching exclude glob.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Inspect workflow artifact-upload globs
        run: |
          set -euo pipefail
          if [ ! -d .github/workflows ]; then exit 0; fi
          bad=$(grep -RnE 'upload-artifact|upload-pages-artifact' .github/workflows/ || true)
          if [ -z "$bad" ]; then exit 0; fi
          # Surface every upload-artifact site for human review; fail if
          # any site lacks an explicit exclude for .env*.
          while IFS= read -r line; do
            f=$(echo "$line" | cut -d: -f1)
            if ! grep -qE '\.env|exclude:' "$f"; then
              echo "::error::artifact upload in $f has no .env exclude — see README-secrets.md."
              exit 1
            fi
          done <<< "$bad"
