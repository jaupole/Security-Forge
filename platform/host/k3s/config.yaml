# k3s config — read automatically from /etc/rancher/k3s/config.yaml on
# k3s start. Cleaner than editing the systemd unit's ExecStart args.
#
# ⚠️ SOURCE OF TRUTH. 00-host-bootstrap.sh installs THIS file to
# /etc/rancher/k3s/config.yaml (cmp + install, restart-on-diff) and WILL
# OVERWRITE the host copy on its next run. Never hand-edit the host file
# alone — mirror every change here and commit, or the next bootstrap run
# silently reverts it (write-kubeconfig-mode drifted exactly this way,
# caught 2026-06-07). Detect drift any time with:
#   sudo platform/scripts/host-config-drift-check.sh
#
# Existing flags (from install): --disable traefik (set by installer at
# k3s install time). Don't restate those here — they're already on
# ExecStart in the systemd unit.

# ─── kube-apiserver audit logging ─────────────────────────────────────
# Routes audit events through the API server's filter chain (defined in
# /etc/rancher/k3s/audit-policy.yaml) and writes JSON-Lines to
# /var/log/k3s-audit.log. Wazuh agent picks that up via <localfile>.
kube-apiserver-arg:
  - "audit-policy-file=/etc/rancher/k3s/audit-policy.yaml"
  - "audit-log-path=/var/log/k3s-audit.log"
  - "audit-log-maxage=30"             # keep audit log entries 30 days
  - "audit-log-maxbackup=10"          # rotate, keep 10 backups
  - "audit-log-maxsize=100"           # 100 MB per file before rotation
  - "audit-log-format=json"           # one JSON object per line

# ─── kubelet hardening (kube-bench 4.2.6, added 2026-05-14) ──────────
# With --protect-kernel-defaults the kubelet refuses to start if any of
# its expected sysctls differ from the values it would set. We've
# hardened sysctls deliberately (kptr_restrict=2, dmesg_restrict=1,
# unprivileged_bpf_disabled=1, etc.) — this flag tells kubelet to leave
# them alone rather than reset them on start.
kubelet-arg:
  - "protect-kernel-defaults=true"
  # ─── image garbage collection (added 2026-06-07) ──────────────────
  # Default thresholds are 85/80, which let the containerd image store
  # creep to 85% of /var/lib/rancher before GC kicks in — too close to
  # full on a 100G volume (hit 83% / 304 images from digest-pinned
  # redeploy churn before a manual prune). Start GC at 70%, reclaim
  # unused images down to 55%, so it self-manages well clear of full.
  - "image-gc-high-threshold=70"
  - "image-gc-low-threshold=55"


# ─── etcd Secrets encryption-at-rest (added 2026-05-28) ──────────────
# Closes the offline-disk attack where MinIO SSE master key + Velero
# kopia passphrase + OpenBao seal token were recoverable via
# strings /var/lib/rancher/k3s/server/db/state.db.
# k3s generates an AES-CBC key, writes an encryption-provider-config,
# and passes it to kube-apiserver as --encryption-provider-config.
# After enable, run: sudo k3s secrets-encrypt reencrypt --force
# to rewrite existing Secrets with the new key.
# CAVEAT: the AES key sits in /var/lib/rancher/k3s/server/cred/ on the
# same disk. Real disk-theft protection still needs LUKS on vg0-*.
# Historical plaintext from kine MVCC remains in state.db until the
# previously-leaked Secret values are rotated.
secrets-encryption: true  # RE-ENABLED 2026-06-05: datastore-bootstrap clean-slate (#79)

# kubeconfig hardened 2026-05-29 (audit Wave 0): root-only, durable across k3s restarts
write-kubeconfig-mode: "0600"
