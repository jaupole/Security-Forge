# SecForge production host kernel hardening.
#
# Drop in at /etc/sysctl.d/99-secforge-hardening.conf and reload via
# `sysctl --system`.
#
# Rationale per setting documented inline. CIS / OWASP / NIST-aligned
# where reasonable. Conservative — chose stability over absolute hardening
# (e.g., didn't set kernel.unprivileged_userns_clone=0 because k3s
# legitimately uses user namespaces).

# ─── Information leak prevention ──────────────────────────────────────

# Restrict access to kernel log buffer (dmesg). Without this, any user
# can read kernel pointers, recent kernel events, etc.
kernel.dmesg_restrict = 1

# Hide kernel pointers from /proc/kallsyms and similar — defeats common
# exploit-prep techniques that need to know kernel symbol addresses.
kernel.kptr_restrict = 2

# Restrict ptrace() — non-root processes can only ptrace their direct
# children, not arbitrary processes. Common privilege-escalation gadget.
kernel.yama.ptrace_scope = 1

# Disable core dumps for setuid programs (could leak sensitive memory).
fs.suid_dumpable = 0

# ─── Network hardening ────────────────────────────────────────────────

# Reverse-path filtering: drop packets whose source IP isn't reachable
# via the interface they arrived on. Mitigates IP spoofing.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Don't accept ICMP redirects (router-redirect attacks).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Don't send ICMP redirects (we're not a router).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Don't accept source-routed packets (rare legitimate use; common attack
# vector for bypassing routing-based ACLs).
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log packets with impossible source addresses (martians). Routes them
# into auditd → Wazuh.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# SYN cookies on — protects against SYN-flood DoS.
net.ipv4.tcp_syncookies = 1

# Ignore broadcast ICMP echo requests (smurf-attack defense).
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses (some buggy routers).
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ─── BPF hardening ────────────────────────────────────────────────────

# Disable unprivileged BPF entirely. Without this, any user can load
# eBPF programs, which is a known kernel-exploit vector. K3s uses BPF
# via privileged paths so this doesn't break us.
kernel.unprivileged_bpf_disabled = 1

# Harden the BPF JIT (constant blinding, etc.) against JIT spraying.
net.core.bpf_jit_harden = 2

# ─── Memory protection ────────────────────────────────────────────────

# Higher-order memory allocations are sometimes a sign of attack
# attempts. Default: 64 KB; we leave it (changing breaks some workloads).

# Address space layout randomization for stack/mmap (already on by
# default in modern kernels, but explicit > implicit).
kernel.randomize_va_space = 2

# ─── Filesystem ────────────────────────────────────────────────────

# Restrict hardlinks/symlinks in world-writable directories — defeats
# CVE-style symlink races.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
