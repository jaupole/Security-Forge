# k3s kubelet requires these sysctls when `--protect-kernel-defaults=true`
# (which is the default on hardened images). The new Ubuntu HWE kernel resets
# them on every kernel upgrade reboot; persisting them here keeps k3s booting.
#
# Drop in at /etc/sysctl.d/91-k3s-kubelet.conf and reload via `sysctl --system`.
#
# Discovered 2026-05-19 when kernel 6.17.0-23 → 29 reboot left k3s in
# crash-loop with:
#   "Failed to start ContainerManager" err="[invalid kernel flag:
#    vm/overcommit_memory, expected value: 1, actual value: 0, ...]"

# Required for kubelet memory accounting. Linux default is 0 (heuristic),
# kubelet wants 1 (always overcommit) for predictable pod-level OOM behaviour.
vm.overcommit_memory = 1

# Reboot N seconds after a kernel panic. Default 0 = hang indefinitely.
# kubelet wants 10 so the node self-recovers instead of staying wedged.
kernel.panic = 10

# Treat oops as a panic (so kernel.panic above triggers). Default 0 = continue
# with a poisoned kernel. kubelet wants 1.
kernel.panic_on_oops = 1
