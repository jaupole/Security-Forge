# SecForge tailnet split-DNS — authoritative for secforge.dev (no forwarding).
#
# Install to /etc/dnsmasq.d/secforge-tailnet.conf on the node. See the runbook
# docs/03-runbooks/tailnet-split-dns.md for the full procedure + the Tailscale
# admin-console step that points `secforge.dev` queries here.
#
# WHY THIS EXISTS: operator surfaces (admin, control, kc, bao, grafana, wazuh,
# pf) answer ONLY on the secforge-gateway-tailnet Istio gateway (Kyverno
# admin-ingress-must-be-tailnet-only). Public DNS resolves them to the PUBLIC
# node IP, where the public gateway has no route → a bare 404 that mobile
# browsers SAVE AS A FILE. A laptop works via /etc/hosts; a phone can't, so it
# needs DNS. This resolver, fronted by Tailscale split-DNS, gives every tailnet
# device the tailnet IP for the operator hosts with no per-device hosts file.
#
# WHY AUTHORITATIVE (no upstream `server=`): Tailscale split-DNS routes ALL
# *.secforge.dev to this dnsmasq — INCLUDING this node's own systemd-resolved,
# which carries a `~secforge.dev` interface route to the Tailscale resolver
# (100.100.100.100). If dnsmasq forwarded the public hosts to a resolver, that
# resolver would route secforge.dev back to Tailscale → back to dnsmasq → an
# infinite loop: public hosts like auth.secforge.dev time out, which breaks the
# admin-console login redirect (admin → auth.secforge.dev). So dnsmasq answers
# EVERY secforge.dev name itself and forwards nothing. (First cut used
# server=127.0.0.53 and hit exactly this loop — do not reintroduce a forwarder.)
#
# Reachable ONLY on the tailnet IP (100.77.117.112) — NOT a public open
# resolver. `address=` is authoritative, so AAAA returns NODATA (devices use the
# A record; no public-IPv6 fallback).
#
# Host list = Istio VirtualServices bound ONLY to secforge-gateway-tailnet
# (`kubectl get virtualservice -A | grep tailnet`). 65.21.25.40 is the single
# node's public IP. Update both if the node IP / host set changes.

listen-address=100.77.117.112
bind-dynamic
no-resolv
no-poll
domain-needed
bogus-priv
cache-size=1000

# Default for every *.secforge.dev → public node IP (public gateway).
address=/secforge.dev/65.21.25.40
# Operator (tailnet-only) hosts → node tailnet IP (longest-match overrides).
address=/admin.secforge.dev/100.77.117.112
address=/control.secforge.dev/100.77.117.112
address=/grafana.secforge.dev/100.77.117.112
address=/kc.secforge.dev/100.77.117.112
address=/bao.secforge.dev/100.77.117.112
address=/pf.secforge.dev/100.77.117.112
address=/wazuh.secforge.dev/100.77.117.112
