# SecForge tailnet split-DNS — operator (tailnet-only) hosts → tailnet gateway.
#
# Install to /etc/dnsmasq.d/secforge-tailnet.conf on the node. See the runbook
# docs/03-runbooks/tailnet-split-dns.md for the full procedure + the Tailscale
# admin-console step that points `secforge.dev` queries here.
#
# WHY: admin/operator surfaces (admin, control, kc, bao, grafana, wazuh, pf)
# answer ONLY on the secforge-gateway-tailnet Istio gateway (Kyverno
# admin-ingress-must-be-tailnet-only). Public DNS resolves those names to the
# PUBLIC node IP, where the public gateway has no route → a bare 404 that
# mobile browsers SAVE AS A FILE. A laptop works via an /etc/hosts entry; a
# phone can't, so without tailnet split-DNS it hits the public 404. This
# resolver, fronted by Tailscale split-DNS, gives every tailnet device the
# tailnet IP for the operator hosts without any per-device hosts file.
#
# Reachable ONLY on the tailnet IP (100.77.117.112) — NOT a public open
# resolver. `address=` is authoritative, so AAAA for an operator host returns
# NODATA (no public-IPv6 fallback); phones use the tailnet A over Tailscale.
# Non-operator *.secforge.dev (portal/auth/members/billing/qbo/stripe-connect)
# is forwarded to the host's systemd-resolved stub and keeps its public IP.
#
# Upstream = 127.0.0.53 (resolved): the node's egress filter blocks arbitrary
# public :53 (1.1.1.1 times out), but the loopback stub is always reachable.
#
# Host list = Istio VirtualServices bound ONLY to secforge-gateway-tailnet
# (`kubectl get virtualservice -A`). Keep in sync when an operator host is
# added/removed.

listen-address=100.77.117.112
bind-dynamic
no-resolv
no-poll
server=127.0.0.53
domain-needed
bogus-priv
cache-size=1000

address=/admin.secforge.dev/100.77.117.112
address=/control.secforge.dev/100.77.117.112
address=/grafana.secforge.dev/100.77.117.112
address=/kc.secforge.dev/100.77.117.112
address=/bao.secforge.dev/100.77.117.112
address=/pf.secforge.dev/100.77.117.112
address=/wazuh.secforge.dev/100.77.117.112
