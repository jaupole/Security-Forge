# SecForge kernel module blacklist.
#
# Disables kernel subsystems this server doesn't use. Reduces attack surface:
# even when CVEs land in these subsystems and Canonical hasn't backported the
# fix yet, the vulnerable code can't be reached because the module won't load.
#
# Each entry uses BOTH `install ... /bin/false` (blocks explicit modprobe)
# AND `blacklist` (blocks auto-load via aliases). Either alone is bypassable
# under certain conditions.
#
# Reload with: `update-initramfs -u && modprobe -r <module>` (if loaded).
# New boots pick up the blacklist automatically.
#
# To re-enable a module, remove its lines and re-run update-initramfs -u.

# ─── SMB (Server Message Block) ───────────────────────────────────────
# in-kernel SMB server (CVE-2025-68263 ipc_msg_send_request UAF).
# We don't serve SMB. The userspace alternative (samba) isn't installed.
install ksmbd /bin/false
blacklist ksmbd

# SMB client. We don't mount SMB shares.
install cifs /bin/false
blacklist cifs
install smbfs_common /bin/false
blacklist smbfs_common

# ─── Other filesystem modules with known CVEs (CIS 1.1.1.10) ──────────
# Distributed / cluster / niche filesystems. Server uses ext4 + xfs only.
install afs /bin/false
blacklist afs
install ceph /bin/false
blacklist ceph
install exfat /bin/false
blacklist exfat
install fscache /bin/false
blacklist fscache
install gfs2 /bin/false
blacklist gfs2
install nfs_common /bin/false
blacklist nfs_common

# ─── NFS server ───────────────────────────────────────────────────────
# CVE-2026-31402 nfsd4 LOCK replay heap overflow + many others.
# We don't serve NFS. Container PVs use local-path-provisioner, not NFS.
install nfsd /bin/false
blacklist nfsd
install nfsv4 /bin/false
blacklist nfsv4
install nfsv3 /bin/false
blacklist nfsv3
install nfs /bin/false
blacklist nfs
install lockd /bin/false
blacklist lockd
install nfs_acl /bin/false
blacklist nfs_acl
install rpcsec_gss_krb5 /bin/false
blacklist rpcsec_gss_krb5

# ─── NVMe over Fabrics ────────────────────────────────────────────────
# CVE-2026-23112 nvmet_tcp_build_pdu_iovec OOB.
# Server has direct local NVMe (mdadm RAID1) — never NVMe-over-fabric.
# Note: do NOT blacklist `nvme` itself (that's the local NVMe driver).
install nvmet /bin/false
blacklist nvmet
install nvmet_tcp /bin/false
blacklist nvmet_tcp
install nvmet_fc /bin/false
blacklist nvmet_fc
install nvmet_rdma /bin/false
blacklist nvmet_rdma
install nvme_tcp /bin/false
blacklist nvme_tcp
install nvme_fc /bin/false
blacklist nvme_fc
install nvme_rdma /bin/false
blacklist nvme_rdma
install nvme_fabrics /bin/false
blacklist nvme_fabrics

# ─── DVB (Digital Video Broadcasting) ─────────────────────────────────
# CVE-2026-31405 dvb-net OOB in ULE extension header tables.
# Bare metal server has no DVB tuner card. The whole DVB stack can go.
install dvb_core /bin/false
blacklist dvb_core
install dvb_net /bin/false
blacklist dvb_net
install dvb_usb /bin/false
blacklist dvb_usb
install dvb_usb_v2 /bin/false
blacklist dvb_usb_v2
install dvb_pll /bin/false
blacklist dvb_pll

# ─── SMC (Shared Memory Communications) ───────────────────────────────
# CVE-2026-23450 smc_tcp_syn_recv_sock NULL deref + UAF.
# IBM mainframe / RDMA tech. Never used here.
install smc /bin/false
blacklist smc
install smc_diag /bin/false
blacklist smc_diag

# ─── netfilter helpers we don't need ──────────────────────────────────
# CVE-2026-23455 nf_conntrack_h323 OOB read in DecodeQ931().
# H.323 = obsolete VoIP signaling. SANE = scanner-over-network helper.
# These are only loaded if iptables explicitly references them, which it
# doesn't on a server doing only HTTPS / k3s networking.
install nf_conntrack_h323 /bin/false
blacklist nf_conntrack_h323
install nf_conntrack_sane /bin/false
blacklist nf_conntrack_sane
install nf_conntrack_amanda /bin/false
blacklist nf_conntrack_amanda
install nf_conntrack_irc /bin/false
blacklist nf_conntrack_irc
install nf_conntrack_netbios_ns /bin/false
blacklist nf_conntrack_netbios_ns
install nf_conntrack_pptp /bin/false
blacklist nf_conntrack_pptp
install nf_conntrack_snmp /bin/false
blacklist nf_conntrack_snmp
install nf_conntrack_tftp /bin/false
blacklist nf_conntrack_tftp

# ─── Niche / legacy transport protocols ───────────────────────────────
# CIS benchmark recommendations + general hardening. None of these are
# used by k3s, Linux desktop traffic, or modern server workloads.
install sctp /bin/false
blacklist sctp
install dccp /bin/false
blacklist dccp
install rds /bin/false
blacklist rds
install rds_tcp /bin/false
blacklist rds_tcp
install rds_rdma /bin/false
blacklist rds_rdma
install tipc /bin/false
blacklist tipc

# ─── Legacy / amateur networking ──────────────────────────────────────
install ax25 /bin/false
blacklist ax25
install netrom /bin/false
blacklist netrom
install rose /bin/false
blacklist rose
install decnet /bin/false
blacklist decnet
install x25 /bin/false
blacklist x25
install appletalk /bin/false
blacklist appletalk
install ipx /bin/false
blacklist ipx
install n_hdlc /bin/false
blacklist n_hdlc
install p8022 /bin/false
blacklist p8022
install p8023 /bin/false
blacklist p8023
install psnap /bin/false
blacklist psnap

# ─── Niche filesystems ────────────────────────────────────────────────
# We use ext4 (root) + xfs (data LVs). No legacy / specialty filesystems.
# (Squashfs intentionally NOT blacklisted — snapd uses it.)
install cramfs /bin/false
blacklist cramfs
install freevxfs /bin/false
blacklist freevxfs
install jffs2 /bin/false
blacklist jffs2
install hfs /bin/false
blacklist hfs
install hfsplus /bin/false
blacklist hfsplus
install udf /bin/false
blacklist udf
install 9p /bin/false
blacklist 9p

# ─── Physical attack surface ──────────────────────────────────────────
# Hetzner Robot has remote console (no physical USB attack vector here),
# but unattended-upgrades + supply-chain compromise of a USB-tooling
# package are still in scope. Block USB mass storage + Firewire DMA.
install usb_storage /bin/false
blacklist usb_storage
install firewire_core /bin/false
blacklist firewire_core
install firewire_ohci /bin/false
blacklist firewire_ohci
