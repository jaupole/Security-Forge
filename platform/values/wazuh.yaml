# Wazuh values overlay — chart values for the bare-metal platform deployment.
#
# Differences from local:
#   - dashboard.ingress.host: wazuh.${DOMAIN}        (was wazuh.secforge.local)
#   - cluster-issuer: ${LE_ISSUER}                   (was mkcert-issuer)
#   - storage class: local-path                      (k3s built-in. The wazuh
#     manager/indexer PVCs were created against the wazuh-local static PVs
#     during the 2026-05-14 partition migration and are immutable once bound,
#     so this value only affects fresh PVC creation. See
#     platform/manifests/k3s/storageclass-wazuh-local.yaml and
#     platform/manifests/wazuh/static-pvs.yaml.)
#   - OIDC: indexer + dashboard federate to Keycloak — chart-native since
#     2026-05-13 (see indexer.security / dashboard.security below).
#
# Chart: ileonelperea/wazuh-helm v1.2.10 (App 4.14.5) — vendored.

storageClass:
  create: false

# adminPassword + others NOT here — apply.sh creates 4 Secrets with random
# passwords, chart consumes via existingSecrets.
security:
  existingSecrets:
    indexer:   wazuh-indexer-creds
    api:       wazuh-api-creds
    dashboard: wazuh-dashboard-creds
    filebeat:  wazuh-filebeat-creds

vault:
  enabled: false
  bootstrap:
    enabled: false

credentialRotation:
  enabled: false

s3:
  enabled: false

indexer:
  replicas: 1
  # JVM truststore flags: the indexer's OpenSearch security plugin federates
  # to Keycloak (OIDC) and must trust the platform internal CA — the CA is
  # supplied via indexer.security.trustedCa below and mounted as the JVM
  # truststore at /jvm-truststore/cacerts.
  javaOpts: "-Xms1536m -Xmx1536m -Djavax.net.ssl.trustStore=/jvm-truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    # 3Gi (was 2Gi): the indexer JVM uses ~1.85Gi at steady state; running
    # `securityadmin.sh` (needed by 07j to push OIDC auth config into the
    # .opendistro_security index) starts a second JVM in the same container
    # and OOMKills the indexer at 2Gi. 3Gi gives ~1Gi headroom.
    limits:   { cpu: 1,    memory: 3Gi }
  storage:
    storageClass: local-path
    size: 10Gi  # request only; bound PV size is 30Gi (see static-pvs.yaml)
  driftDetection:
    enabled: false
  watchdog:
    enabled: false
  metrics:
    enabled: true
  # OIDC federation for the OpenSearch security plugin (chart-native 2026-05-13).
  security:
    openid:
      enabled: true
      connectUrl: https://auth.${DOMAIN}/realms/platform/.well-known/openid-configuration
      order: 1
      subjectKey: preferred_username
      rolesKey: roles
      adminUsers:
        - jason.upole
    trustedCa:
      configMapName: secforge-internal-ca
      key: ca.pem

manager:
  replicas: 1
  podAnnotations:
    # wazuh-manager-data lives on a dedicated partition; exclude it from
    # Velero volume (kopia) backups.
    backup.velero.io/backup-volumes-excludes: wazuh-manager-data
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits:   { cpu: 1,    memory: 1500Mi }
  storage:
    storageClass: local-path
    size: 10Gi  # request only; bound PV size is 50Gi (see static-pvs.yaml)
  cluster:
    enabled: false
  agentGroups: {}
  metrics:
    enabled: true

dashboard:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 500m, memory: 768Mi }
  ingress:
    enabled: true
    ingressClassName: nginx
    host: wazuh.${DOMAIN}
    annotations:
      cert-manager.io/cluster-issuer: ${LE_ISSUER}
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # Restrict the dashboard to the tailnet + in-cluster pod CIDR + host IP.
      nginx.ingress.kubernetes.io/whitelist-source-range: "100.64.0.0/10,10.42.0.0/16,65.21.25.40/32"
    tls:
      - secretName: wazuh-dashboard-tls
        hosts:
          - wazuh.${DOMAIN}
  ssl:
    enabled: false
  metrics:
    enabled: true
  # OIDC login for the dashboard (chart-native 2026-05-13). client_secret +
  # cookie_password are injected at pod start from the wazuh-oidc-vso Secret.
  security:
    openid:
      enabled: true
      connectUrl: https://auth.${DOMAIN}/realms/platform/.well-known/openid-configuration
      clientId: wazuh-dashboard
      scope: "openid profile email roles"
      baseRedirectUrl: https://wazuh.${DOMAIN}
      secretName: wazuh-oidc-vso
      trustedCa:
        configMapName: secforge-internal-ca
        key: ca.pem

# Chart's agent DaemonSet stays disabled; we deploy a hardened standalone
# DaemonSet in the wazuh-agent namespace (PSS=privileged for hostPath).
agent:
  enabled: false

networkPolicy:
  enabled: false

cleanup:
  enabled: true

certs:
  rotation:
    enabled: false
