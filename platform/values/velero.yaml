# Velero — K8s resource + PV backups to in-cluster MinIO `backups` bucket.
#
# Architecture:
#   - Deployment: velero server (controller, schedule reconciler).
#   - DaemonSet: node-agent (kopia-based PV backup; reads /var/lib/kubelet/pods).
#   - BackupStorageLocation: minio.minio.svc.cluster.local:9000, bucket `backups`,
#     prefix `velero/` (separates from CNPG's `cnpg/` prefix).
#   - VolumeSnapshotLocation: NONE — local-path-provisioner doesn't support
#     CSI snapshots; node-agent (kopia) handles PV backups via filesystem.
#
# Restore semantics:
#   - K8s resources: created in target namespace from backup manifest.
#   - PVs: kopia restores files into a fresh PVC, then mounts.
#
# Trade-off note (in-cluster only): MinIO `backups` bucket lives on the
# same RAID1 mirror as everything else. This protects against accidental
# delete / Helm misadventures / ransomware-targeting-cluster-volumes,
# but NOT against full disk loss or data-center incident. Off-site
# replication (e.g., to B2 via `mc mirror`) can be added later.

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.10.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    # Required by Kyverno require-resource-limits (Enforce). The init
    # container just `cp`s the plugin binary into /target then exits,
    # so it needs tiny resources. Added 2026-05-14.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# Disable the upgrade-CRDs Job hook — its image reference
# `docker.io/bitnami/kubectl:1.31` was removed from Docker Hub
# (Bitnami restructured their public images). The chart still installs
# CRDs from `templates/crds/` on fresh install, so we don't need the hook.
# If we need to upgrade CRDs later, run `kubectl apply -f` manually
# against the chart's CRD manifests.
upgradeCRDs: false
cleanUpCRDs: false

configuration:
  # Logging
  logLevel: info
  logFormat: json

  # MinIO target (S3-compatible).
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: backups
      prefix: velero
      default: true
      credential:
        name: velero-minio-credentials
        key: cloud
      config:
        region: us-east-1            # required by AWS SDK; MinIO ignores
        s3ForcePathStyle: "true"
        s3Url: http://minio.minio.svc.cluster.local:9000
        publicUrl: http://minio.minio.svc.cluster.local:9000
        insecureSkipTLSVerify: "false"

  # No volume snapshot location (local-path doesn't support CSI snapshots).
  # PV backups go through kopia (node-agent DaemonSet) instead.
  volumeSnapshotLocation: []

  # Default fs backup driver: kopia (recommended over restic in 1.10+).
  uploaderType: kopia

  # Default PV backup behaviour: opt-out via annotation
  # `backup.velero.io/backup-volumes-excludes`. (Opt-in mode would require
  # annotating every Pod with `backup.velero.io/backup-volumes`.)
  defaultVolumesToFsBackup: true

# DaemonSet for filesystem-based PV backups.
deployNodeAgent: true
nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  privileged: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1Gi }
  tolerations:
    - effect: NoSchedule
      operator: Exists

# Pod label so MinIO chart's NetworkPolicy + our cross-ns NP allow access.
podLabels:
  minio-client: "true"

# Schedules baked in via separate manifest (03-schedules.yaml) so we can
# tune retention without re-rendering the helm values.
schedules: {}

# ServiceMonitor for Prometheus (kube-prometheus-stack picks it up).
metrics:
  enabled: true
  serviceMonitor:
    enabled: false   # enable with kube-prometheus-stack; set release: kps label
