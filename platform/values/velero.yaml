# Velero — K8s resource + PV backups to in-cluster MinIO `backups` bucket.
#
# Chart 12.0.1 / app v1.18.0 (bumped 2026-05-16 from chart 8.2.0 / app 1.15.1).
# Chart breaking changes since 8.2.0 — quick map:
#   - `configuration.repositoryMaintenanceJob.{requests,limits,latestJobsCount}`
#     REMOVED. Maintenance Job sizing + retention now go in the
#     `velero-repo-maintenance` ConfigMap (see
#     platform/manifests/velero/07-repo-maintenance-cm.yaml). Reference is
#     `configuration.repositoryMaintenanceJob.repositoryConfigData.name`.
#   - `serviceAccount.server.automountServiceAccountToken` — now required.
#   - `upgradeCRDsJob` — new block; needs `automountServiceAccountToken` +
#     `extraEnvVars: []` even when the Job is disabled via top-level
#     `upgradeCRDs: false`.
#   - `extraEnvVars` shape changed `{}` → `[]` in three places
#     (configuration, nodeAgent, upgradeCRDsJob).
#   - velero-plugin-for-aws bumped v1.10.0 → v1.13.1 (the chart's
#     commented example pairs v1.13.1 with Velero 1.18.0 — upstream-tested).
#
# Architecture (unchanged):
#   - Deployment: velero server (controller, schedule reconciler).
#   - DaemonSet: node-agent (kopia-based PV backup; reads /var/lib/kubelet/pods).
#   - BackupStorageLocation: minio.minio.svc.cluster.local:9000, bucket `backups`,
#     prefix `velero/` (separates from CNPG's `cnpg/` prefix).
#   - VolumeSnapshotLocation: NONE — local-path-provisioner doesn't support
#     CSI snapshots; node-agent (kopia) handles PV backups via filesystem.
#
# Restore semantics:
#   - K8s resources: created in target namespace from backup manifest.
#   - PVs: kopia restores files into a fresh PVC, then mounts.
#
# Trade-off note (in-cluster only): MinIO `backups` bucket lives on the
# same RAID1 mirror as everything else. This protects against accidental
# delete / Helm misadventures / ransomware-targeting-cluster-volumes,
# but NOT against full disk loss or data-center incident. Off-site
# replication (e.g., to B2 via `mc mirror`) can be added later.

# Velero image — chart 12.0.1's default is velero/velero:v1.18.0. Don't
# override unless we need a specific patch.

initContainers:
  - name: velero-plugin-for-aws
    # Bumped 2026-05-16: 1.10.0 → 1.13.1 to match chart-maintainer's
    # tested pairing for Velero 1.18.x.
    image: velero/velero-plugin-for-aws:v1.13.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    # Required by Kyverno require-resource-limits (Enforce).
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

resources:
  # 2Gi limit: Velero v1.18 OOMs at 512Mi during restore on this cluster
  # (observed 2026-05-19 during openbao admin recovery from #34).
  requests: { cpu: 200m, memory: 512Mi }
  limits:   { cpu: 1,    memory: 2Gi }

# Enable the upgrade-CRDs Job. Required when bumping across CRD-changing
# Velero versions (e.g. 1.15 → 1.18 introduced the "Queued" status.phase
# value — controller will throw "Unsupported value: Queued" on EVERY
# backup until CRDs match the binary). Chart 12+ uses
# registry.k8s.io/kubectl (no longer the removed bitnami/kubectl image),
# so re-enabling is safe.
upgradeCRDs: true
cleanUpCRDs: false   # cleanup is destructive — only for CI / fresh test clusters

# upgradeCRDsJob block — schema-required even when upgradeCRDs: false
# because chart 12 validates the full values shape. Just satisfy the
# schema with defaults that document intent.
upgradeCRDsJob:
  automountServiceAccountToken: true
  extraEnvVars: []
  extraVolumes: []
  extraVolumeMounts: []

# RBAC — replace the chart-default cluster-admin binding (audit H-4.12).
# With clusterAdministrator:false the chart renders NO ClusterRoleBinding, so
# the operator-owned ClusterRole + binding in
# manifests/velero/07-rbac-leastprivilege.yaml take over (applied by
# 09a-velero.sh AFTER the Helm step, so a Helm upgrade first prunes any old
# chart-managed velero-server -> cluster-admin binding). clusterAdministratorName
# is kept aligned with that ClusterRole's name for clarity even though no chart
# binding renders. NOTE: automount is read ONLY from serviceAccount.server below
# (a rbac.serviceAccount.* key would be silently ignored), so it stays there.
rbac:
  create: true
  clusterAdministrator: false
  clusterAdministratorName: velero-least-privilege

# Server ServiceAccount — explicit even though default is true,
# to document that the API credential IS automounted (required by
# the controller's in-cluster API access pattern).
serviceAccount:
  server:
    automountServiceAccountToken: true

configuration:
  logLevel: info
  logFormat: json

  # MinIO target (S3-compatible).
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: backups
      prefix: velero
      default: true
      credential:
        name: velero-minio-credentials
        key: cloud
      config:
        region: us-east-1            # required by AWS SDK; MinIO ignores
        s3ForcePathStyle: "true"
        s3Url: http://minio.minio.svc.cluster.local:9000
        publicUrl: http://minio.minio.svc.cluster.local:9000
        insecureSkipTLSVerify: "false"

  # No volume snapshot location (local-path doesn't support CSI snapshots).
  # PV backups go through kopia (node-agent DaemonSet) instead.
  volumeSnapshotLocation: []

  # Default fs backup driver: kopia (recommended over restic in 1.10+).
  uploaderType: kopia

  # Default PV backup behaviour: opt-out via annotation
  # `backup.velero.io/backup-volumes-excludes`. (Opt-in mode would require
  # annotating every Pod with `backup.velero.io/backup-volumes`.)
  defaultVolumesToFsBackup: true

  # Enable CSI snapshot integration (built into velero binary 1.16+).
  # Required for VolumeSnapshot-based backup/restore as an alternative
  # to FSB/PVR. FSB has a known limitation: PVR is bound to backup-time
  # pod UIDs and does not match new pods after delete+recreate, which
  # breaks restore for StatefulSet-owned PVs. CSI snapshot path is
  # PVC-bound (UID-independent) and works correctly for STSs IF the
  # storage class's CSI driver supports VolumeSnapshot.
  #
  # NOTE: enabling this alone does NOT make all PVs CSI-snapshottable.
  # The storage class's CSI driver must implement CSI Snapshotter spec
  # (e.g., TopoLVM thick LVs do NOT — only thin pool does). Per-backup
  # opt-in via `spec.snapshotMoveData: true` lets you choose CSI per
  # backup rather than for all.
  features: EnableCSI
  defaultSnapshotMoveData: true

  # Schema-required: chart 12 expects an array (was {} in chart 8).
  extraEnvVars: []

  # Repository maintenance Job config — chart 12 removed the inline
  # `requests`/`limits`/`latestJobsCount` fields. Sizing + retention now
  # live in a ConfigMap that the chart RENDERS from these values
  # (chart-managed; do NOT pre-create the CM externally — Helm ownership
  # check rejects pre-existing CMs without its annotations).
  # Values preserve chart-8.2.0 inline config exactly:
  #   keepLatestMaintenanceJobs = old latestJobsCount: 3
  #   podResources cpu/memory   = old requests/limits
  repositoryMaintenanceJob:
    repositoryConfigData:
      name: "velero-repo-maintenance"
      global:
        keepLatestMaintenanceJobs: 3
        podResources:
          cpuRequest: "100m"
          cpuLimit: "500m"
          memoryRequest: "128Mi"
          memoryLimit: "1Gi"
      repositories: {}

# DaemonSet for filesystem-based PV backups.
deployNodeAgent: true
nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  privileged: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1Gi }
  tolerations:
    - effect: NoSchedule
      operator: Exists
  # Schema-required: chart 12 expects an array.
  extraEnvVars: []

# Pod label so MinIO chart's NetworkPolicy + our cross-ns NP allow access.
podLabels:
  minio-client: "true"

# Schedules baked in via separate manifest (03-schedules.yaml) so we can
# tune retention without re-rendering the helm values.
schedules: {}

# ServiceMonitor for Prometheus (kube-prometheus-stack picks it up).
metrics:
  enabled: true
  serviceMonitor:
    enabled: false   # enable with kube-prometheus-stack; set release: kps label
