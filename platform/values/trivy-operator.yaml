# Trivy Operator — cluster-wide CVE + misconfig + exposed-secret scanning.
#
# Chart: aquasecurity/trivy-operator
# Source: https://aquasecurity.github.io/helm-charts
#
# What it scans (per running workload):
#   - VulnerabilityReport       — CVEs in container images
#   - ConfigAuditReport         — workload yaml against best-practice checks
#   - ExposedSecretReport       — leaked credentials in container filesystems
#   - RbacAssessmentReport      — over-privileged ClusterRoles / RoleBindings
#   - InfraAssessmentReport     — Node/Cluster security posture
#
# Reports land as CRs in each workload's namespace. Promtail can ship
# them to Loki for Grafana viewing; PrometheusRule fires alerts for
# critical CVEs (added in Phase C follow-up).

# Single-replica controller (single-node cluster — HA wouldn't help).
# Reduces base load + fits nicely in our resource budget.
operator:
  replicas: 1
  # 1536Mi limit (2026-05-30): the live deploy had drifted to 512Mi and was
  # OOMKilling (working set ~450Mi) — it kicked off the alert-email storm.
  # trivy-operator's footprint scales with #workloads × #images during scan
  # orchestration; 1.5Gi is a sane ceiling for ~17 namespaces. If it climbs
  # monotonically across a week of constant workload count, treat as a leak
  # (pin the image + upstream issue) rather than bumping further.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1536Mi }
  scanJobsConcurrentLimit: 5
  scanJobsRetryDeleteAfterSeconds: 600
  # Run scans in ClientServer mode against a built-in trivy-server (see the
  # trivy.mode note below + ADR-0033). The chart renders the trivy-server
  # StatefulSet + Service (:4954) ONLY when this is true, and auto-wires the
  # operator's trivy.serverURL to it. This is the switch that kills the
  # multi-image cache-lock race behind the KubeJobFailed flapping.
  builtInTrivyServer: true
  # What to scan + how often
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  exposedSecretScannerEnabled: true
  metricsVulnIdEnabled: true         # exposes CVE IDs in Prometheus metrics
  # Re-scan interval; default 6h. Bumping to 12h cuts CPU at the cost of
  # detection lag. 6h is fine.
  scanJobTimeout: 5m
  scanJobTTL: 30m

# Skip Kubernetes infrastructure scanning at first — focus on workload
# CVEs. Node-collector requires hostPath + privileged which complicates
# the security posture; enable later if we want CIS-Kubernetes-Benchmark
# style reports.
nodeCollector:
  enabled: false
infraAssessmentScannerEnabled: false

# Trivy itself
trivy:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 2Gi }
  # ImagePullSecrets — none for now; future: trust ghcr.io/secforge/* via
  # a deploy-key Secret + trivy.imagePullSecrets reference.
  imagePullSecrets: []
  # ── ClientServer mode (2026-06-03, ADR-0033) ────────────────────────────
  # Standalone ran one `trivy image` container PER image inside EACH scan Job,
  # all sharing one emptyDir cache dir. Multi-image pods — every CNPG DB pod is
  # 3 images (postgres + cloudnative-pg + barman sidecar); topolvm-controller is
  # many — made those sibling containers race on the trivy BoltDB cache lock:
  #   FATAL ... unable to initialize cache: cache may be in use by another
  #   process: timeout
  # → the Job failed → KubeJobFailed flapped ~every 30m all night (it's a RACE,
  # so it's intermittent — some intervals win). ClientServer moves the vuln DB
  # into ONE long-lived `trivy-server` StatefulSet; scan Jobs become thin
  # clients holding NO local DB cache, so the lock contention is structurally
  # gone. Set here for self-documentation; operator.builtInTrivyServer above is
  # what makes the chart deploy the server and wire it up.
  mode: ClientServer
  # The server keeps the ~1GB vuln DB on a 5Gi PVC (chart default; default SC =
  # local-path) so a server restart doesn't re-download the DB — a re-download
  # window would leave scans failing and could itself flap KubeJobFailed.
  # Revert cleanup: delete StatefulSet/trivy-server + PVC data-trivy-server-0.
  storageClassEnabled: true
  storageSize: 5Gi
  # trivy-server pod resources (chart defaults are sane; pinned for visibility).
  # The pod runs nonroot:65534, readOnlyRootFilesystem, automountSAToken:false.
  server:
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 1,    memory: 1Gi }
  # Skip vulnerability scanning of certain registries that don't host
  # CVE-relevant content (NONE for us — leave default).
  ignoreUnfixed: false               # report CVEs even without fix
  severity: "CRITICAL,HIGH,MEDIUM"   # Report C/H/M; skip LOW/UNKNOWN noise

# Service Monitor for kube-prometheus-stack
serviceMonitor:
  enabled: true
  labels:
    release: kps

# Don't watch system namespaces (kyverno, kube-system) — too noisy +
# we're not in control of their image versions anyway.
excludeNamespaces: "kube-system,kube-public,kube-node-lease,kyverno"

# Workload kinds to scan — chart default MINUS `job`. Velero spawns a constant
# churn of ephemeral bare Jobs (one `*-default-kopia-maintain-job-*` per backup
# repo per hour, ~50 live at any time). Trivy raced to scan each, and the scan
# Jobs FAILED when Velero deleted the target mid-scan — tripping KubeJobFailed
# repeatedly (2026-06-01/02 flapping) for zero security value: those Jobs run the
# velero/velero image, already scanned via the Velero Deployment. Bare one-off
# Jobs elsewhere (e.g. control-db-migrate) run images already covered by their
# owning Deployment; scheduled jobs are covered via `cronjob`. Dropping `job`
# loses no real image coverage.
targetWorkloads: "pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob"
