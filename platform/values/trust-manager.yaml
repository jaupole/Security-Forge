# trust-manager — distributes the internal CA trust bundle to app namespaces
# so a CA rotation can never leave a stale hardcoded CA behind (the root
# cause of the 2026-06-04 incident tail; operator-backlog #78).
#
# trust namespace = cert-manager: Bundle *sources* are read only from here,
# which is where the internal root CA secret (secforge-internal-ca-tls)
# already lives. The OpenBao CA is reflected in by 06-trust-manager.sh.
crds:
  enabled: true
app:
  trust:
    namespace: cert-manager
  logLevel: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
# Digest-pinned (Gap B / require-image-digest). The trust-manager chart exposes
# dedicated digest fields; tag defaults to the chart appVersion (trust-manager)
# and the build default (trust-pkg), which match the running versions, so the
# digest alone pins them. Renovate keeps tag+digest in lockstep on refresh.
image:
  digest: sha256:23e2ab0711d77c3d25a7297d480883e8d037659db88dcdc0dab788a08a1b2097
defaultPackageImage:
  digest: sha256:06fe54a72d1ddb268d64a022d0d9f031aa93204136a8e9a131913fc968a3889d
