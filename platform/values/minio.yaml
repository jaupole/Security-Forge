# MinIO — S3-compatible object store for SecForge platform.
#
# Production (single-node bare-metal) consumers:
#   - Tempo (tempo-traces bucket)
#   - Loki  (loki-chunks bucket, Phase 7-rest)
#   - Velero / CNPG (backups bucket — when off-box B2 isn't desired)
#   - Wazuh archive (wazuh-archive — Phase 7-rest)
#
# Buckets are NOT created by the chart's makeBucketJob (it doesn't expose
# container-level securityContext, so it can't satisfy a `restricted` PSA
# enforce label). Bucket creation is a separate Job we own; see
# manifests/minio/02-bucket-bootstrap-job.yaml.
#
# Console + S3 API are NOT exposed via Ingress in production — admin access
# goes through `kubectl port-forward` (no public surface to defend). All
# in-cluster consumers use the ClusterIP Service.

mode: standalone
replicas: 1

# Pre-created Secret with rootUser + rootPassword. Created by 07a-minio.sh
# before the helm install, never committed.
existingSecret: minio-root-credentials

# Image override — pinned tag + digest so the cluster always pulls a
# verified bit-for-bit copy. Renovate's MinIO customManager (renovate.json)
# tracks the chart; image bumps follow the runbook at
# docs/03-runbooks/minio-version-upgrade.md (snapshot first; the Velero
# kopia repo lives inside MinIO, so there is no Velero rollback target).
# 2026-05-22: bumped from RELEASE.2024-12-18T13-15-44Z (~17 months stale)
# to the last public-OSS release. Operator-backlog #55 / #56.
image:
  repository: quay.io/minio/minio
  tag: RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  # minio-local SC = no-provisioner, statically bound to /var/lib/minio
  # (dedicated 250G partition). See:
  #   platform/manifests/k3s/storageclass-minio-local.yaml
  #   platform/manifests/minio/static-pv.yaml
  # Apply via 00e-minio-storage.sh BEFORE this chart on fresh installs.
  storageClass: minio-local
  size: 200Gi  # matches the live PVC (auto-resized to the bound PV's 200Gi capacity); shrinking is forbidden by Kubernetes — keep this in sync with `static-pv.yaml` spec.capacity.storage
  accessMode: ReadWriteOnce

resources:
  # requests.memory tracks observed steady state (~1.9Gi after the 2026-07-06
  # wazuh-archive tenant landed) so MinIO is not first in eviction ordering
  # (infra-sweep opt-9); limit raised 2Gi -> 3Gi after the working set parked
  # at GOMEMLIMIT (95% of the old cap) and ContainerMemoryNearLimit re-fired.
  requests: { cpu: 200m, memory: 1536Mi }
  limits:   { cpu: 1,    memory: 3Gi }
# Recreate (not RollingUpdate): single replica on a RWO volume — a surge pod
# cannot mount the PVC and would hang the rollout. Recreate stops the old pod
# first. A brief (~seconds) MinIO blip on each upgrade is unavoidable here.
deploymentUpdate:
  type: Recreate
# Go runtime soft memory limit so MinIO GC is cgroup-aware and reclaims before
# pressing the hard limit. Added 2026-06-14 after recurring
# ContainerMemoryNearLimit alerts (working set parked >90% of the old 1Gi cap).
environment:
  GOMEMLIMIT: "2700MiB"  # ~90% of the 3Gi hard cap (raised with it 2026-07-06)

securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: false  # MinIO writes to /data; root FS RO via PSA
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 9000
consoleService:
  type: ClusterIP
  port: 9001

# No public ingress — internal only.
ingress:
  enabled: false
consoleIngress:
  enabled: false

# Bucket auto-creation: DISABLED (see file header).
buckets: []
users: []
policies: []
svcaccts: []

metrics:
  serviceMonitor:
    enabled: false   # enable in Phase 7-rest when kube-prometheus-stack lands

# In-cluster only; no anonymous external access.
networkPolicy:
  enabled: true
  allowExternal: false
