# kube-prometheus-stack — Prometheus + Alertmanager + node-exporter +
# kube-state-metrics + Grafana with OIDC-federated login.
#
# Single-node bare metal sizing: 14d Prom retention, 1 Grafana replica.
# Cross-namespace ServiceMonitor selection ON so platform components
# (Tempo, Loki, OTel collector, etc.) ship metrics without per-monitor
# allowlisting.
#
# Grafana production deltas vs local edition:
#   - real Let's Encrypt cert via cert-manager Certificate (no mkcert)
#   - hostAliases: auth.${DOMAIN} → ingress-nginx ClusterIP (same hairpin
#     fix we use on OpenBao). HARDCODED IP — re-update if ingress-nginx
#     is reinstalled.
#   - root_url / domain: grafana.${DOMAIN}
#   - tls_client_ca dropped — Let's Encrypt is in the system CA bundle
#   - Grafana password lookup auto-provisioned by chart; Admin role
#     mapped from preferred_username (same single-user workaround as the
#     local edition pending the role_attribute_path proper fix)

fullnameOverride: kps

# ─── Prometheus ────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector: {}

    # Exclude the live Prometheus TSDB volume from Velero fs-backup (2026-05-30).
    # The data-mover can't get a consistent read of the constantly-mmap-rewritten
    # 20Gi TSDB (empty error, progress stuck at one 64KB block), so EVERY backup
    # landed PartiallyFailed on this one PVB and kept VeleroBackupFailed/TooOld
    # firing. The TSDB is rebuildable (14d of dev-cluster metrics; ~nil recovery
    # value). Velero runs opt-out (defaultVolumesToFsBackup=true), so this
    # annotation removes ONLY this volume; everything else is still backed up.
    podMetadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: prometheus-kps-prometheus-db

    retention: 14d
    retentionSize: "18GB"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ${STORAGE_CLASS}
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        cpu: 1
        memory: 2Gi

    # Override the operator-injected config-reloader sidecar to set
    # explicit resource limits. Without this, the require-resource-limits
    # Kyverno policy (Enforce) blocks pod admission. Added 2026-05-14
    # after a STS-template re-apply triggered pod recreate + admission failure.
    containers:
      - name: config-reloader
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi

  ingress:
    enabled: false   # internal only; Grafana is the user-facing surface

# ─── Alertmanager ──────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    # secforge(2026-05-30): route namespaced AlertmanagerConfig CRs WITHOUT
    # forcing a per-namespace matcher, so observability/13-alertmanager-email
    # is a true catch-all (otherwise email would only cover alerts whose
    # `namespace` label == observability). Required for the email receiver.
    alertmanagerConfigMatcherStrategy:
      type: None
    replicas: 1
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ${STORAGE_CLASS}
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  ingress:
    enabled: false
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - matchers: [alertname="Watchdog"]
          receiver: 'null'
    receivers:
      - name: 'null'

# ─── Grafana ───────────────────────────────────────────────────────────
grafana:
  replicas: 1
  defaultDashboardsTimezone: browser

  # Modern K8s handles PV ownership via fsGroup; chart's initChownData
  # init container is unnecessary and violates restricted PSS.
  initChownData:
    enabled: false

  persistence:
    enabled: true
    storageClassName: ${STORAGE_CLASS}
    size: 5Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  # Resolve auth.${DOMAIN} (OIDC token endpoint) AND grafana.${DOMAIN}
  # (sidecar's reload-datasources call gets 302-redirected to public host
  # because enforce_domain=true) to the Istio public ingress-gateway ClusterIP.
  # Same hairpin fix as OpenBao. Two-plane gateway migration (2026-06-03) moved
  # this off ingress-nginx onto the Istio gateway. ClusterIP is NOT pinned — if
  # the istio-ingress Service is recreated, update to the new
  # `kubectl -n istio-ingress get svc istio-ingress` ClusterIP.
  hostAliases:
    - ip: "10.43.24.153"   # istio-ingress (public gateway) ClusterIP
      hostnames:
        - auth.${DOMAIN}
        - grafana.${DOMAIN}

  # OIDC client_secret rendered by VSO (manifests/observability/05-grafana-vso-binding.yaml)
  # into Secret `grafana-oidc-client-secret`. The Secret's key
  # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET is read directly via envFrom.
  envFromSecrets:
    - name: grafana-oidc-client-secret
      optional: false

  grafana.ini:
    server:
      root_url: "https://grafana.${DOMAIN}"
      domain: "grafana.${DOMAIN}"
      enforce_domain: true
    security:
      cookie_secure: true
      cookie_samesite: "lax"
      strict_transport_security: true
      strict_transport_security_max_age_seconds: 63072000   # 2y to match platform HSTS
      strict_transport_security_preload: true
      x_content_type_options: true
      x_xss_protection: true
    auth:
      disable_login_form: true            # OIDC only; no local username/password
      disable_signout_menu: false
      oauth_auto_login: false             # let user click; no silent SSO
    "auth.generic_oauth":
      enabled: true
      name: "Keycloak"
      allow_sign_up: true                  # auto-provision Grafana users on first OIDC login
      client_id: "grafana"
      # client_secret comes from envFromSecrets above (GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET)
      scopes: "openid profile email"
      auth_url: "https://auth.${DOMAIN}/realms/platform/protocol/openid-connect/auth"
      token_url: "https://auth.${DOMAIN}/realms/platform/protocol/openid-connect/token"
      api_url: "https://auth.${DOMAIN}/realms/platform/protocol/openid-connect/userinfo"
      tls_skip_verify_insecure: false
      use_pkce: true
      # Same single-user workaround as OpenBao until the realm_access.roles
      # claim path is debugged (Phase 7d follow-up). Bind on preferred_username.
      role_attribute_path: "preferred_username == 'jason.upole' && 'Admin' || 'Viewer'"
      role_attribute_strict: true
    log:
      mode: "console"
      level: "info"

  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true     # auto-creates Prometheus DS pointing at the chart's Prom
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      provider:
        allowUiUpdates: false            # dashboards are git-source-of-truth

  # We provide our own Ingress (manifests/observability/06-grafana-ingress.yaml).
  ingress:
    enabled: false

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

# ─── kube-state-metrics ────────────────────────────────────────────────
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ─── prometheus-node-exporter ──────────────────────────────────────────
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 1               # 100m→200m (2026-06-05) still throttled 24/7; give burst headroom
      memory: 256Mi        # DO NOT bump again: the 64Mi/128Mi trips (07-10/14/17) were reclaimable kernel
                           # slab (dentry cache from walking /proc,/sys,/host/root) charged to the cgroup,
                           # NOT the process — anon RSS is steady ~13Mi and slab is reclaimed at the limit,
                           # so OOM is impossible. Alerts now use RSS (NodeExporterAnonMemoryHigh,
                           # 09-platform-alerts, RCA 2026-07-27); working_set alerts exclude node-exporter.

  extraArgs:
    # Read host textfile collector written by /usr/local/sbin/mount-count-exporter.sh
    # (systemd timer, every 60s). Exposes node_mount_count + node_mount_max_limit.
    # /host/root is the hostPath mount of / in the node-exporter DaemonSet.
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
    # kernel 7.0 (2026-07-19 reboot) changed the /proc/fs/xfs/stat layout; this
    # node-exporter's procfs parser misaligns and the whole xfs collector fails
    # every scrape ('parsing "xpc": invalid syntax'). Disabled until a
    # node-exporter release parses it - re-test on each kps chart bump.
    # NodeExporterCollectorFailed (09-platform-alerts) now guards this class.
    - --no-collector.xfs

# ─── apiserver histogram-bucket cardinality (infra-sweep opt-6) ─────────
# ~95k of ~307k head series were apiserver/etcd(kine) duration + size
# histogram buckets. Nothing on this box consumes them: the kps apiserver
# SLO/burn-rate default rules that would are disabled below (single-node
# k3s — apiserver latency SLOs are noise; up/down + resource alerts carry
# the signal). Dropping at scrape time saves ~100k series / a few hundred
# MiB of Prometheus RSS under its 2Gi limit.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: '(apiserver|etcd)_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket'
        action: drop

defaultRules:
  rules:
    # Consume the buckets dropped above — disabled deliberately with them.
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false

# ─── k3s control-plane scrapers off ────────────────────────────────────
# k3s embeds controller-manager, scheduler, etcd into a single process and
# doesn't expose them on the conventional ports the chart tries to scrape.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
windowsMonitoring:
  enabled: false
