# Promtail — DaemonSet log shipper. One pod per node tailing
# /var/log/pods/* and forwarding to Loki.
#
# Production posture: simple JSON-extraction pipeline, no per-app
# extraScrapeConfigs (the local edition's secrets-guardrails scrape is
# tied to apps that haven't deployed yet — re-add when the `app` ns and
# security-events-collector land).

fullnameOverride: promtail

config:
  clients:
    - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    pipelineStages:
      - cri: {}
      # ── Capability-token redaction (token-in-URL access-log leak) ──────────
      # The Istio gateway's default JSON access log records the full request
      # path, and Proposal Forge's capability tokens ride URL path segments
      # (public-fill invite tokens, ONLYOFFICE plugin/file tokens). Scrub them
      # at ingest so no live credential persists in Loki. The app-layer fix
      # moves tokens out of URLs (proposal-forge sec/token-url-transport);
      # these stages are defense-in-depth for the transition tail, stale
      # links, and any future app that regresses to token-in-path.
      # Anchor-safe: lines are rewritten BEFORE ingestion, so the Loki audit
      # anchor (21-loki-audit-anchor.yaml) commits the already-redacted
      # content — nothing in-store is ever mutated.
      - replace:
          # Any JWT: blank its SIGNATURE only. header.claims stay readable for
          # debugging; the logged token is cryptographically unusable.
          expression: 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.([A-Za-z0-9_-]{16,})'
          replace: 'REDACTED'
      - replace:
          # Token path segment on PF's capability routes (64-hex invite/file
          # tokens; plugin JWTs while deprecated token-in-path routes linger).
          expression: '(?:/forms/fill/|/onlyoffice/(?:fields|library|ai|files)/)([A-Za-z0-9._~%-]{16,})'
          replace: 'REDACTED'
      - json:
          expressions:
            level: level
            trace_id: trace_id
            span_id: span_id
            msg: msg
      - labels:
          level:
          # trace_id intentionally NOT a label (high cardinality);
          # leave it as a queryable structured field used by the Tempo
          # → Loki correlation in grafana-datasources-extra.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceMonitor:
  enabled: true
  labels:
    release: kps

# Single-node k3s: tolerate the control-plane node taint.
tolerations:
  - effect: NoSchedule
    operator: Exists
