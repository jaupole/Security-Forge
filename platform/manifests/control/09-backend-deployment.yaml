# Control API backend (Fastify + TS, distroless nodejs22).
#
# Image is built from the Ecosystem Control repo's Dockerfile and tagged
# `ghcr.io/secforge/control:${CONTROL_TAG}`. Signed with the cluster's
# cosign key before being importable into k3s.
#
# Listens on :4000. Reverse-proxied by ingress-nginx via the
# control-service ClusterIP (11-services.yaml). Same-origin cookie
# pattern: portal at /, /api/* → here, so the @fastify/secure-session
# HttpOnly cookie flows on every request without cross-origin gymnastics.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  namespace: control
  annotations:
    # The `api` container is fully probed; only the spiffe-helper sidecar
    # (a token-refresher daemon) lacks probes — it exposes no HTTP health
    # surface, and pod liveness is governed by the api container.
    checkov.io/skip1: "CKV_K8S_8=spiffe-helper sidecar has no HTTP liveness endpoint; the api container is probed"
    checkov.io/skip2: "CKV_K8S_9=spiffe-helper sidecar has no HTTP readiness endpoint; the api container is probed"
  labels:
    app.kubernetes.io/name: control
    app.kubernetes.io/component: api
    secforge.platform/component: control
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: control
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control
        app.kubernetes.io/component: api
        secforge.platform/component: control
        spiffe.io/spire-managed-identity: "true"
    spec:
      serviceAccountName: control
      automountServiceAccountToken: false
      # GHCR is private — pull via VSO-rendered dockerconfigjson Secret
      # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Digest-pinned (cosign signs digests, not tags). Bump via the
          # GHA image-build run output; Renovate or a CI bot can later
          # automate the bump.
          image: ghcr.io/jaupole/control@sha256:1be06adc6662f9fc585f064255bba4f86beb21c367e89ecb99363b05ad239646
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 4000, name: http, protocol: TCP }
          env:
            # Static config
            - { name: NODE_ENV, value: production }
            - { name: API_PORT, value: "4000" }
            - { name: API_HOST, value: "0.0.0.0" }
            - { name: TRUST_PROXY, value: "1" }
            - { name: PORTAL_ORIGIN, value: "https://control.${DOMAIN}" }
            # In-cluster DNS rewrites auth.${DOMAIN} → keycloak ClusterIP,
            # which presents its INTERNAL cert (signed by secforge-internal-ca,
            # not Let's Encrypt). Point NODE_EXTRA_CA_CERTS at the
            # internal CA so jose's createRemoteJWKSet (and any other
            # global-fetch caller) can verify the chain. Node's built-in
            # Mozilla CA bundle is still loaded — NODE_EXTRA_CA_CERTS is
            # additive, not a replacement.
            - { name: NODE_EXTRA_CA_CERTS, value: "/etc/secforge/openbao-ca.crt" }
            # Keycloak — config.ts wants KEYCLOAK_URL (the base; it builds
            # /realms/<realm> internally), KEYCLOAK_REALM, and a SEPARATE
            # admin-API client (NOT the OIDC user-login client).
            #
            # KEYCLOAK_TENANTS_REALM (Shape B) — when set, the auth
            # middleware accepts tokens from BOTH realms. The same
            # clientIds are registered in both realms (the realm is
            # the issuer-layer discriminator). See
            # docs/01-architecture/01a-realm-to-app-matrix.md.
            - { name: KEYCLOAK_URL, value: "https://auth.${DOMAIN}" }
            - { name: KEYCLOAK_REALM, value: platform }
            - { name: KEYCLOAK_TENANTS_REALM, value: secforge-tenants }
            # Admin-API client (created 2026-05-15). Service-account-only,
            # confidential, with realm-management roles: manage-users,
            # view-users, query-users, view-clients, view-realm.
            # KEYCLOAK_ADMIN_CLIENT_SECRET comes from VSO-rendered
            # control-app-secrets via envFrom below.
            - { name: KEYCLOAK_ADMIN_CLIENT_ID, value: control-admin }
            # Tenants-realm admin-API client (signup wizard). Same
            # clientId as KEYCLOAK_ADMIN_CLIENT_ID but the service
            # account is in the secforge-tenants realm and adds
            # manage-organizations + view-organizations realm-management
            # roles. KEYCLOAK_TENANTS_ADMIN_CLIENT_SECRET comes from
            # VSO-rendered control-app-secrets (the `tenants_admin_client_secret`
            # key in OpenBao at secret/apps/control/runtime).
            - { name: KEYCLOAK_TENANTS_ADMIN_CLIENT_ID, value: control-admin }
            # SpiceDB — in-cluster Service.
            - { name: SPICEDB_ENDPOINT, value: "spicedb.spicedb.svc.cluster.local:50051" }
            # CNPG-rendered DB credentials. The control-db-app Secret has
            # discrete fields per CNPG convention; config.ts wants them
            # as discrete env vars rather than a single URL.
            - { name: PGHOST, valueFrom: { secretKeyRef: { name: control-db-app, key: host } } }
            - { name: PGPORT, valueFrom: { secretKeyRef: { name: control-db-app, key: port } } }
            - { name: PGUSER, valueFrom: { secretKeyRef: { name: control-db-app, key: username } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: control-db-app, key: password } } }
            - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: control-db-app, key: dbname } } }
            # OTLP exporter (Wazuh / Tempo collection point).
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://opentelemetry-collector.observability.svc.cluster.local:4318" }
            - { name: OTEL_SERVICE_NAME, value: control }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=control,deployment.environment=prod" }
            # PII encryption (rule 38). Transit client uses SPIFFE
            # JWT-SVID written by the spiffe-helper sidecar to a shared
            # tmpfs volume, exchanges it for an OpenBao token via
            # auth/jwt/login (role: control), then encrypts/decrypts via
            # transit/pii-encryption.
            - { name: OPENBAO_ADDR, value: "https://openbao.openbao.svc.cluster.local:8200" }
            - { name: OPENBAO_CA_CERT_PATH, value: "/etc/secforge/openbao-ca.crt" }
            - { name: OPENBAO_JWT_AUTH_ROLE, value: control }
            # TRANSIT_KEYNAME (no underscore before NAME) is deliberate: the
            # no-secret-shaped-env Kyverno policy flags a bare `_KEY_` token,
            # and this holds a Transit key *name*, not key material.
            - { name: TRANSIT_KEYNAME, value: pii-encryption }
            - { name: SPIFFE_JWT_SVID_PATH, value: "/run/spiffe/jwt-svid.token" }
            # QuickBooks Online — non-secret config. The QBO OAuth
            # callback runs on a dedicated PUBLIC host (qbo.${DOMAIN}) —
            # control.${DOMAIN} is tailnet-only and Intuit can't reach it.
            # QBO_REDIRECT_URI is the value to register in the Intuit app,
            # exactly; the qbo.${DOMAIN} ingress (13-qbo-ingress.yaml)
            # rewrites /callback to the real API route. The OAuth state
            # cookie is set during connect (on control.${DOMAIN}) and read
            # on the callback (qbo.${DOMAIN}) — different subdomains — so
            # QBO_STATE_COOKIE_DOMAIN scopes it to the shared parent.
            # QBO_CLIENT_ID / QBO_CLIENT_SECRET arrive via the optional
            # control-qbo-secrets envFrom below. Flip QBO_ENVIRONMENT to
            # `production` when going live. See
            # docs/03-runbooks/quickbooks-online-setup.md.
            - { name: QBO_REDIRECT_URI, value: "https://qbo.${DOMAIN}/callback" }
            - { name: QBO_STATE_COOKIE_DOMAIN, value: "${DOMAIN}" }
            - { name: QBO_ENVIRONMENT, value: sandbox }
          envFrom:
            # Adds OIDC_CLIENT_SECRET, KEYCLOAK_ADMIN_CLIENT_SECRET,
            # SPICEDB_PRESHARED_KEY, SESSION_KEY, EMAIL_HMAC_KEY from
            # the VSO-rendered Secret. All five come from
            # secret/apps/control/runtime in OpenBao via the
            # VaultStaticSecret in 04-vso-bindings.yaml.
            - secretRef:
                name: control-app-secrets
            # QBO_CLIENT_ID + QBO_CLIENT_SECRET — the ecosystem QBO app's
            # OAuth credentials. optional:true so the pod starts cleanly
            # before the operator writes secret/apps/control/qbo to
            # OpenBao; until then the QBO connect routes return a clean
            # "not configured" 503. See 04-vso-bindings.yaml + the runbook.
            - secretRef:
                name: control-qbo-secrets
                optional: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            # Distroless nodejs22 needs /tmp writable for sourcemaps + V8
            # cache; everything else stays read-only.
            - { name: tmp, mountPath: /tmp }
            # OpenBao internal CA cert (signed by secforge-internal-ca).
            # Used by Transit client for HTTPS verification — see CLAUDE.md
            # bright-line on no-cert-bypass.
            - { name: openbao-ca, mountPath: /etc/secforge, readOnly: true }
            # JWT-SVID written by the spiffe-helper sidecar; Transit
            # client reads from /run/spiffe/jwt-svid.token.
            - { name: spiffe-jwt, mountPath: /run/spiffe, readOnly: true }
        # spiffe-helper sidecar — fetches a JWT-SVID via the SPIFFE
        # workload API every TTL/2 seconds and writes it to the shared
        # spiffe-jwt volume. Audience: openbao (matches the OpenBao
        # JWT auth role's bound_audiences). Sidecar runs in daemon
        # mode; on cert/SVID expiry it re-fetches and overwrites the file.
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0@sha256:1c92e5998ad3621e3323f25aabe40f5a88ba730ee0edb248aa8c943ca504e8a2
          imagePullPolicy: IfNotPresent
          args:
            - "-config"
            - "/etc/spiffe-helper/helper.conf"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /etc/spiffe-helper, readOnly: true }
            - { name: spiffe-jwt, mountPath: /run/spiffe }
            - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: openbao-ca
          configMap:
            name: openbao-internal-ca-cert
            items:
              - key: ca.crt
                path: openbao-ca.crt
        - name: spiffe-jwt
          emptyDir:
            sizeLimit: 1Mi
            medium: Memory
        - name: spiffe-helper-config
          configMap:
            name: control-spiffe-helper-config
            items:
              - key: helper.conf
                path: helper.conf
        # SPIFFE workload API — provided by the SPIRE CSI driver
        # (spire-spiffe-csi-driver DaemonSet). Mounts the spire-agent
        # unix socket so the spiffe-helper can request JWT-SVIDs.
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
      # Spread across nodes is moot on a single-node cluster, but the
      # podAntiAffinity reads correctly once we add a second node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: control
              app.kubernetes.io/component: api
