# Control API backend (Fastify + TS, distroless nodejs22).
#
# Image is built from the Ecosystem Control repo's Dockerfile and tagged
# `ghcr.io/secforge/control:${CONTROL_TAG}`. Signed with the cluster's
# cosign key before being importable into k3s.
#
# Listens on :4000. Reverse-proxied by ingress-nginx via the
# control-service ClusterIP (11-services.yaml). Same-origin cookie
# pattern: portal at /, /api/* → here, so the @fastify/secure-session
# HttpOnly cookie flows on every request without cross-origin gymnastics.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  namespace: control
  annotations:
    # The `api` container is fully probed; only the spiffe-helper sidecar
    # (a token-refresher daemon) lacks probes — it exposes no HTTP health
    # surface, and pod liveness is governed by the api container.
    checkov.io/skip1: "CKV_K8S_8=spiffe-helper sidecar has no HTTP liveness endpoint; the api container is probed"
    checkov.io/skip2: "CKV_K8S_9=spiffe-helper sidecar has no HTTP readiness endpoint; the api container is probed"
  labels:
    app.kubernetes.io/name: control
    app.kubernetes.io/component: api
    secforge.platform/component: control
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: control
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        # Exclude ephemeral scratch/socket volumes from Velero fs-backup — no
        # recoverable data, and they race the pod lifecycle (a pod replaced
        # mid-backup fails the PodVolumeBackup -> PartiallyFailed -> trips
        # VeleroBackupTooOld). The DB PVC and other real volumes still back up.
        backup.velero.io/backup-volumes-excludes: tmp,spiffe-jwt,spiffe-workload-api
      labels:
        app.kubernetes.io/name: control
        app.kubernetes.io/component: api
        secforge.platform/component: control
        spiffe.io/spire-managed-identity: "true"
        # Required by the MinIO chart's cross-ns NetworkPolicy
        # (minio/03-allow-cross-ns-clients.yaml) — gates ingress on
        # the `minio-client=true` source label. Used by Control's
        # graphics CRUD endpoints to read/write the ecosystem-graphics
        # bucket (ADR-0001 Phase A).
        minio-client: "true"
    spec:
      serviceAccountName: control
      automountServiceAccountToken: false
      # GHCR is private — pull via VSO-rendered dockerconfigjson Secret
      # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Digest-pinned (cosign signs digests, not tags). Bump via the
          # GHA image-build run output; Renovate or a CI bot can later
          # automate the bump. bda20d70 = Remove-from-Organization endpoint
          # (DELETE /orgs/:id/members/:userId — cascades membership +
          # positions + manager refs + SpiceDB tuples; clears orphaned
          # "(deleted user)" rows). Also carries the prior dead-cookie auth
          # cleanup already on master.
          # 682fd0ac = per-(org × app) branding: GET /me?app=<slug> overlays
          # the org's per-app accent; branding GET/PATCH carry the appBranding
          # map (#49). 2026-06-08: DELETE /orgs/:id/email-config (remove all org
          # email settings); invitation record-remove endpoint
          # (DELETE /orgs/:id/invitations/:id/record) + accountExists on the
          # members list (#54, commit 0655aa1). 2026-06-08: ticket archive
          # system — archived_at + archived filter + archive/unarchive
          # endpoints + tickets:archive-closed CLI (#55, commit 668742f).
          # 2026-06-09: move per-org admin endpoints (administrators roster +
          # create-user) from /api/v1/admin/orgs/:id to /api/v1/orgs/:id so
          # the istio edge can fail-closed deny /api/v1/admin/* on the public
          # portal host. canAdministerOrg unchanged; no new migrations
          # (commit fce0bb3).
          # 2026-06-11: org users always provision into the tenants realm
          # (founder-derived realm removed) + KC Organization existence
          # check/self-heal in the provisioning core; migration 073 adds
          # organizations.kc_org_id (commit b447727; image rebuilt as
          # 0875911 after pinning CI back to cosign v2 — v3 bundle-format
          # signatures are invisible to Kyverno).
          image: ghcr.io/jaupole/control@sha256:10d0e63e5060c995d18c9406827634b16f2a6d4836c474893cc67baf7b221a76
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 4000, name: http, protocol: TCP }
          env:
            # Static config
            - { name: NODE_ENV, value: production }
            - { name: API_PORT, value: "4000" }
            - { name: API_HOST, value: "0.0.0.0" }
            - { name: TRUST_PROXY, value: "1" }
            # Public TENANT front-door origin. Used for the post-OAuth
            # redirect back to the Portal (QBO/accounting connect), emailed
            # invite acceptUrls, and the CORS allow-origin. MUST be the
            # public host the tenant's browser actually uses — NOT
            # control.${DOMAIN}, which is tailnet-only (Shape B split):
            # redirecting there 302s the browser to an unreachable host at
            # the last hop of the QBO connect flow. Integrations is a
            # tenant-face page served at portal.${DOMAIN} (lib/shell.ts).
            - { name: PORTAL_ORIGIN, value: "https://portal.${DOMAIN}" }
            # Cross-app theme cookie: scope `secforge_theme` to the shared
            # parent domain so portal/admin/members/... all read one account
            # theme before first paint (written by the login BFF + on save).
            - { name: THEME_COOKIE_DOMAIN, value: "${DOMAIN}" }
            # In-cluster DNS rewrites auth.${DOMAIN} → keycloak ClusterIP,
            # which presents its INTERNAL cert (signed by secforge-internal-ca,
            # not Let's Encrypt). Point NODE_EXTRA_CA_CERTS at the
            # internal CA so jose's createRemoteJWKSet (and any other
            # global-fetch caller) can verify the chain. Node's built-in
            # Mozilla CA bundle is still loaded — NODE_EXTRA_CA_CERTS is
            # additive, not a replacement.
            - { name: NODE_EXTRA_CA_CERTS, value: "/etc/secforge/openbao-ca.crt" }
            # Keycloak — config.ts wants KEYCLOAK_URL (the base; it builds
            # /realms/<realm> internally), KEYCLOAK_REALM, and a SEPARATE
            # admin-API client (NOT the OIDC user-login client).
            #
            # KEYCLOAK_TENANTS_REALM (Shape B) — when set, the auth
            # middleware accepts tokens from BOTH realms. The same
            # clientIds are registered in both realms (the realm is
            # the issuer-layer discriminator). See
            # docs/01-architecture/01a-realm-to-app-matrix.md.
            - { name: KEYCLOAK_URL, value: "https://auth.${DOMAIN}" }
            - { name: KEYCLOAK_REALM, value: platform }
            - { name: KEYCLOAK_TENANTS_REALM, value: secforge-tenants }
            # CTRL-06 (retire shared-audience trust): app-client callers MUST
            # present an RFC-8693 token exchanged for aud=control. `require`
            # rejects raw app tokens (401 token_exchange_required); the apps
            # exchange via @jaupole/ecosystem-auth (controlAudience=control +
            # controlExchangeScope=control-aud). Went live 2026-06-18 — see
            # the KC `control-aud` optional client scope + per-app cutover.
            # NOTE: do NOT drop this to the `off` default — off stops accepting
            # exchanged aud=control tokens and would 401 every app. Rollback is
            # `accept` (tolerates both), never `off`, while apps are on the
            # exchanging build.
            - { name: CONTROL_EXCHANGE_MODE, value: require }
            - { name: CONTROL_EXCHANGE_AUDIENCE, value: control }
            # Admin-API client (created 2026-05-15). Service-account-only,
            # confidential, with realm-management roles: manage-users,
            # view-users, query-users, view-clients, view-realm.
            # KEYCLOAK_ADMIN_CLIENT_SECRET comes from VSO-rendered
            # control-app-secrets via envFrom below.
            - { name: KEYCLOAK_ADMIN_CLIENT_ID, value: control-admin }
            # Tenants-realm admin-API client (signup wizard). Same
            # clientId as KEYCLOAK_ADMIN_CLIENT_ID but the service
            # account is in the secforge-tenants realm and adds
            # manage-organizations + view-organizations realm-management
            # roles. KEYCLOAK_TENANTS_ADMIN_CLIENT_SECRET comes from
            # VSO-rendered control-app-secrets (the `tenants_admin_client_secret`
            # key in OpenBao at secret/apps/control/runtime).
            - { name: KEYCLOAK_TENANTS_ADMIN_CLIENT_ID, value: control-admin }
            # SpiceDB — in-cluster Service.
            - { name: SPICEDB_ENDPOINT, value: "spicedb.spicedb.svc.cluster.local:50051" }
            # CNPG-rendered DB credentials. The control-db-app Secret has
            # discrete fields per CNPG convention; config.ts wants them
            # as discrete env vars rather than a single URL.
            - { name: PGHOST, valueFrom: { secretKeyRef: { name: control-db-app, key: host } } }
            - { name: PGPORT, valueFrom: { secretKeyRef: { name: control-db-app, key: port } } }
            - { name: PGUSER, valueFrom: { secretKeyRef: { name: control-db-app, key: username } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: control-db-app, key: password } } }
            - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: control-db-app, key: dbname } } }
            # NOTE: the cross-org READ role (control_reader, withExemptRead,
            # FORCE-RLS audit EC-003) is NOT injected via env — db-exempt.ts
            # fetches its credentials from OpenBao at runtime (ADR-0013), using
            # the same SPIFFE JWT-SVID + OpenBao CA this pod already mounts for
            # Transit. That also keeps no `_PASSWORD`-shaped env on this pod
            # (no-secret-shaped-env Kyverno policy). The control-db-reader VSO
            # Secret still exists — CNPG reads it to SET the role's password.
            # OTLP exporter (Wazuh / Tempo collection point). Service is named
            # `otel-collector` (the pod label is `opentelemetry-collector`); the
            # earlier value used the pod-label name and silently failed at DNS.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318" }
            - { name: OTEL_SERVICE_NAME, value: control }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=control,deployment.environment=prod" }
            # PII encryption (rule 38). Transit client uses SPIFFE
            # JWT-SVID written by the spiffe-helper sidecar to a shared
            # tmpfs volume, exchanges it for an OpenBao token via
            # auth/jwt/login (role: control), then encrypts/decrypts via
            # transit/pii-encryption.
            - { name: OPENBAO_ADDR, value: "https://openbao.openbao.svc.cluster.local:8200" }
            - { name: OPENBAO_CA_CERT_PATH, value: "/etc/secforge/openbao-ca.crt" }
            - { name: OPENBAO_JWT_AUTH_ROLE, value: control }
            # TRANSIT_KEYNAME (no underscore before NAME) is deliberate: the
            # no-secret-shaped-env Kyverno policy flags a bare `_KEY_` token,
            # and this holds a Transit key *name*, not key material.
            - { name: TRANSIT_KEYNAME, value: pii-encryption }
            - { name: SPIFFE_JWT_SVID_PATH, value: "/run/spiffe/jwt-svid.token" }
            # QuickBooks Online — non-secret config. The QBO OAuth
            # callback runs on a dedicated PUBLIC host (qbo.${DOMAIN}) —
            # control.${DOMAIN} is tailnet-only and Intuit can't reach it.
            # QBO_REDIRECT_URI is the value to register in the Intuit app,
            # exactly; the qbo.${DOMAIN} `qbo` VirtualService (istio-ingress/
            # 20-virtualservices.yaml) rewrites /callback to the real API
            # route. The OAuth state cookie is set during connect (on the
            # tenant's front door, portal.${DOMAIN}) and read on the
            # callback (qbo.${DOMAIN}) — different subdomains — so
            # QBO_STATE_COOKIE_DOMAIN scopes it to the shared parent.
            # QBO_CLIENT_ID / QBO_CLIENT_SECRET arrive via the optional
            # control-qbo-secrets envFrom below. Flip QBO_ENVIRONMENT to
            # `production` when going live. See
            # docs/03-runbooks/quickbooks-online-setup.md.
            - { name: QBO_REDIRECT_URI, value: "https://qbo.${DOMAIN}/callback" }
            - { name: QBO_STATE_COOKIE_DOMAIN, value: "${DOMAIN}" }
            - { name: QBO_ENVIRONMENT, value: sandbox }
            # Stripe Connect (OAuth, Standard accounts) — per-org tenant
            # payments (ADR-0034). STRIPE_CONNECT_CLIENT_ID is the ecosystem's
            # Connect OAuth app id (ca_…): PUBLIC (it rides in the authorize
            # URL), so a plain literal here — NOT a Secret. This is the TEST
            # client_id; swap to the live ca_… to go live (re-register the live
            # redirect URI + re-link orgs — see the stripe-connect migration
            # plan). The OAuth token exchange + deauthorize auth with the
            # PLATFORM Stripe key (platform_billing_config), so there is no
            # Stripe secret to inject here. The callback runs on the public
            # stripe-connect.${DOMAIN} host (istio-ingress/20-virtualservices.yaml
            # `stripe-connect` VS) — control.${DOMAIN} is tailnet-only.
            - { name: STRIPE_CONNECT_CLIENT_ID, value: "ca_UXvEIRtTACe2dfQqFeB4yXl5BXtb3f2Q" }
            - { name: STRIPE_CONNECT_REDIRECT_URI, value: "https://stripe-connect.${DOMAIN}/callback" }
            - { name: STRIPE_CONNECT_STATE_COOKIE_DOMAIN, value: "${DOMAIN}" }
            # ─── Object storage (ecosystem-graphics bucket, ADR-0001) ─
            # In-cluster MinIO; HTTP. SSE-S3 encryption-at-rest set on the
            # bucket itself. MINIO_ACCESS_KEY + MINIO_SECRET_KEY arrive
            # via the optional ecosystem-graphics-minio envFrom below —
            # until the operator writes the OpenBao path, the graphics
            # routes return a clean 503 instead of crashing.
            - { name: MINIO_ENDPOINT,         value: "minio.minio.svc.cluster.local" }
            - { name: MINIO_PORT,             value: "9000" }
            - { name: MINIO_USE_SSL,          value: "false" }
            - { name: MINIO_GRAPHICS_BUCKET,  value: ecosystem-graphics }
            # Brand-kit fonts bucket (ADR-0002). brand-kit-store.ts reuses the
            # SAME MINIO_ACCESS_KEY/SECRET as graphics; the ecosystem-graphics-control
            # MinIO svc account was widened (2026-05-30) to grant rw on
            # ecosystem-brand-kit as well. See BRAND_KIT_DEPLOY_HANDOFF.md.
            - { name: MINIO_BRAND_KIT_BUCKET, value: ecosystem-brand-kit }
          envFrom:
            # Adds KEYCLOAK_ADMIN_CLIENT_SECRET, SPICEDB_PRESHARED_KEY,
            # SESSION_KEY, EMAIL_HMAC_KEY from the VSO-rendered Secret. All
            # come from secret/apps/control/runtime in OpenBao via the
            # VaultStaticSecret in 04-vso-bindings.yaml. (The Portal BFF's
            # confidential CONTROL_PORTAL_CLIENT_SECRET[_TENANTS] are templated
            # separately there too.)
            - secretRef:
                name: control-app-secrets
            # QBO_CLIENT_ID + QBO_CLIENT_SECRET — the ecosystem QBO app's
            # OAuth credentials. optional:true so the pod starts cleanly
            # before the operator writes secret/apps/control/qbo to
            # OpenBao; until then the QBO connect routes return a clean
            # "not configured" 503. See 04-vso-bindings.yaml + the runbook.
            - secretRef:
                name: control-qbo-secrets
                optional: true
            # MINIO_ACCESS_KEY + MINIO_SECRET_KEY — rendered from
            # secret/minio/ecosystem-graphics (bucket-scoped svc account;
            # rw on ecosystem-graphics only). optional:true so the pod
            # starts cleanly before the operator provisions the MinIO
            # credentials; graphics routes return 503 until then.
            - secretRef:
                name: ecosystem-graphics-minio
                optional: true
            # TURNSTILE_SECRET — Cloudflare Turnstile siteverify secret for
            # the public signup bot-check. optional:true so the pod starts
            # before the operator writes secret/apps/control/turnstile; the
            # signup Turnstile check stays dark until the env var is present.
            - secretRef:
                name: control-turnstile-secret
                optional: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            # Distroless nodejs22 needs /tmp writable for sourcemaps + V8
            # cache; everything else stays read-only.
            - { name: tmp, mountPath: /tmp }
            # OpenBao internal CA cert (signed by secforge-internal-ca).
            # Used by Transit client for HTTPS verification — see CLAUDE.md
            # bright-line on no-cert-bypass.
            - { name: openbao-ca, mountPath: /etc/secforge, readOnly: true }
            # JWT-SVID written by the spiffe-helper sidecar; Transit
            # client reads from /run/spiffe/jwt-svid.token.
            - { name: spiffe-jwt, mountPath: /run/spiffe, readOnly: true }
        # spiffe-helper sidecar — fetches a JWT-SVID via the SPIFFE
        # workload API every TTL/2 seconds and writes it to the shared
        # spiffe-jwt volume. Audience: openbao (matches the OpenBao
        # JWT auth role's bound_audiences). Sidecar runs in daemon
        # mode; on cert/SVID expiry it re-fetches and overwrites the file.
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0@sha256:1c92e5998ad3621e3323f25aabe40f5a88ba730ee0edb248aa8c943ca504e8a2
          imagePullPolicy: IfNotPresent
          args:
            - "-config"
            - "/etc/spiffe-helper/helper.conf"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /etc/spiffe-helper, readOnly: true }
            - { name: spiffe-jwt, mountPath: /run/spiffe }
            - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: openbao-ca
          configMap:
            name: openbao-internal-ca-cert
            items:
              - key: ca.crt
                path: openbao-ca.crt
        - name: spiffe-jwt
          emptyDir:
            sizeLimit: 1Mi
            medium: Memory
        - name: spiffe-helper-config
          configMap:
            name: control-spiffe-helper-config
            items:
              - key: helper.conf
                path: helper.conf
        # SPIFFE workload API — provided by the SPIRE CSI driver
        # (spire-spiffe-csi-driver DaemonSet). Mounts the spire-agent
        # unix socket so the spiffe-helper can request JWT-SVIDs.
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
      # Spread across nodes is moot on a single-node cluster, but the
      # podAntiAffinity reads correctly once we add a second node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: control
              app.kubernetes.io/component: api
