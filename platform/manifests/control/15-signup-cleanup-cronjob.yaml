# Hourly CronJob that deletes tenant signups stuck in the "temp
# password emailed but never used" state for >24h. Iterates Keycloak
# users in the secforge-tenants realm that still carry the
# `signup_pending_at` attribute (set by POST /api/v1/signup, cleared
# by the /me handler on the user's first authenticated call) AND
# whose stamp is older than 24h, then deletes the user + their
# Keycloak Organization + the control_db organizations row + every
# SpiceDB tuple where the org is the resource.
#
# Same image + DB env as the API Deployment — only the CLI entrypoint
# differs ("signup:cleanup-stale"). When the backend deployment image
# digest is bumped, this manifest should be bumped to match (the
# billing-usage cron has the same convention).

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: control-signup-cleanup
  namespace: control
  labels:
    app.kubernetes.io/name: control
    secforge.platform/component: control
    secforge.platform/role: signup-cleanup
spec:
  # Hourly at :17. Off the round-hour to avoid the noise band where
  # everything else fires at :00.
  schedule: "17 * * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: control
            secforge.platform/component: control
            secforge.platform/role: signup-cleanup
        spec:
          restartPolicy: Never
          serviceAccountName: control
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: wait-for-db
              image: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  until pg_isready -h ecosystem-db-rw.ecosystem-db.svc.cluster.local -p 5432 -U control -d control -t 3; do
                    echo "waiting for control-db..."
                    sleep 2
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 128Mi }
          containers:
            - name: cleanup
              # Digest-pinned. Same image as the backend Deployment.
              # Bump in lockstep with 09-backend-deployment.yaml.
              image: ghcr.io/jaupole/control@sha256:cfd2235e7a1399661f21ddda6d97820c432f41b6abc8515b98408df5ca276883
              imagePullPolicy: IfNotPresent
              command: ["/nodejs/bin/node", "dist/cli/index.js", "signup:cleanup-stale"]
              env:
                - { name: PORTAL_ORIGIN,                    value: "https://control.${DOMAIN}" }
                - { name: PGHOST,     valueFrom: { secretKeyRef: { name: control-ecodb, key: host } } }
                - { name: PGPORT,     valueFrom: { secretKeyRef: { name: control-ecodb, key: port } } }
                - { name: PGUSER,     valueFrom: { secretKeyRef: { name: control-ecodb, key: username } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: control-ecodb, key: password } } }
                - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: control-ecodb, key: dbname } } }
              envFrom:
                # Shared non-secret runtime config (07-app-config.yaml).
                - configMapRef:
                    name: control-app-config
                - secretRef:
                    name: control-app-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: openbao-ca
                  mountPath: /etc/secforge
                  readOnly: true
          volumes:
            - name: openbao-ca
              configMap:
                name: openbao-internal-ca-cert
                items:
                  - { key: ca.crt, path: openbao-ca.crt }
