# Hourly CronJob that deletes tenant signups stuck in the "temp
# password emailed but never used" state for >24h. Iterates Keycloak
# users in the secforge-tenants realm that still carry the
# `signup_pending_at` attribute (set by POST /api/v1/signup, cleared
# by the /me handler on the user's first authenticated call) AND
# whose stamp is older than 24h, then deletes the user + their
# Keycloak Organization + the control_db organizations row + every
# SpiceDB tuple where the org is the resource.
#
# Same image + DB env as the API Deployment — only the CLI entrypoint
# differs ("signup:cleanup-stale"). When the backend deployment image
# digest is bumped, this manifest should be bumped to match (the
# billing-usage cron has the same convention).

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: control-signup-cleanup
  namespace: control
  labels:
    app.kubernetes.io/name: control
    secforge.platform/component: control
    secforge.platform/role: signup-cleanup
spec:
  # Hourly at :17. Off the round-hour to avoid the noise band where
  # everything else fires at :00.
  schedule: "17 * * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: control
            secforge.platform/component: control
            secforge.platform/role: signup-cleanup
        spec:
          restartPolicy: Never
          serviceAccountName: control
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: wait-for-db
              image: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  until pg_isready -h control-db-rw.control.svc.cluster.local -p 5432 -U control -d control -t 3; do
                    echo "waiting for control-db..."
                    sleep 2
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 128Mi }
          containers:
            - name: cleanup
              # Digest-pinned. Same image as the backend Deployment.
              # Bump in lockstep with 09-backend-deployment.yaml.
              image: ghcr.io/jaupole/control@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e
              imagePullPolicy: IfNotPresent
              command: ["/nodejs/bin/node", "dist/cli/index.js", "signup:cleanup-stale"]
              env:
                - { name: NODE_ENV,                         value: production }
                - { name: API_PORT,                         value: "4000" }
                - { name: API_HOST,                         value: "0.0.0.0" }
                - { name: TRUST_PROXY,                      value: "1" }
                - { name: PORTAL_ORIGIN,                    value: "https://control.${DOMAIN}" }
                # auth.${DOMAIN}'s TLS chain inside the cluster is signed
                # by the internal CA bundled in the openbao-internal-ca-cert
                # ConfigMap (same as the backend Deployment). Without this
                # NODE_EXTRA_CA_CERTS the keycloak-admin-client fails the
                # OAuth login with UNABLE_TO_VERIFY_LEAF_SIGNATURE and the
                # CronJob falls into a retry loop.
                - { name: NODE_EXTRA_CA_CERTS,              value: /etc/secforge/openbao-ca.crt }
                - { name: KEYCLOAK_URL,                     value: "https://auth.${DOMAIN}" }
                # Platform realm context for any platform-admin checks the
                # CLI happens to load on import (the cleanup itself only
                # touches secforge-tenants).
                - { name: KEYCLOAK_REALM,                   value: platform }
                - { name: KEYCLOAK_ADMIN_CLIENT_ID,         value: control-admin }
                # Tenants realm — REQUIRED for this CronJob (the cleanup
                # operates on tenant users). KEYCLOAK_TENANTS_ADMIN_CLIENT_SECRET
                # arrives via VSO-rendered control-app-secrets.
                - { name: KEYCLOAK_TENANTS_REALM,           value: secforge-tenants }
                - { name: KEYCLOAK_TENANTS_ADMIN_CLIENT_ID, value: control-admin }
                - { name: SPICEDB_ENDPOINT,                 value: "spicedb.spicedb.svc.cluster.local:50051" }
                - { name: PGHOST,     valueFrom: { secretKeyRef: { name: control-db-app, key: host } } }
                - { name: PGPORT,     valueFrom: { secretKeyRef: { name: control-db-app, key: port } } }
                - { name: PGUSER,     valueFrom: { secretKeyRef: { name: control-db-app, key: username } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: control-db-app, key: password } } }
                - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: control-db-app, key: dbname } } }
              envFrom:
                - secretRef:
                    name: control-app-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: openbao-ca
                  mountPath: /etc/secforge
                  readOnly: true
          volumes:
            - name: openbao-ca
              configMap:
                name: openbao-internal-ca-cert
                items:
                  - { key: ca.crt, path: openbao-ca.crt }
