# Ingress for the control plane — three hosts, single backing image.
#
# Shape B Track 3 — the Portal SPA now serves TWO shells (tenant +
# operator) from one image, picked by Host header in nginx.conf:
#
#   portal.${DOMAIN}   →  tenant face   (Portal shell,  `secforge-tenants` realm)
#   admin.${DOMAIN}    →  operator face (Admin Console, `platform` realm)
#   control.${DOMAIN}  →  legacy URL,   serves the Admin Console too
#
# TAILNET-ONLY. None of the hostnames have public DNS A/AAAA records
# (deliberately, 2026-05-14 cleanup of wildcards). Operator reaches
# them via the local hosts file:
#   100.77.117.112  control.secforge.dev
#   100.77.117.112  admin.secforge.dev
#   100.77.117.112  portal.secforge.dev
#
# The wildcard cert `secforge-wildcard` (in cert-manager ns) covers
# *.secforge.dev — Kubernetes Ingress can't cross-namespace reference a
# TLS Secret directly, so cert-manager-secret-syncer (or a manual
# CopySecret CR) keeps a copy in the control namespace named
# `control-tls`. The same secret is reused across all three hosts
# because the wildcard covers them all. If you'd prefer per-host LE
# issuance instead, change the cert-manager.io/cluster-issuer
# annotation back on.
#
# Path routing pattern (identical per host): /api/* → control (backend
# API), everything else → portal (static SPA + react-router fallback
# to index.html). The order of rules matters — nginx-ingress chooses
# the longest matching prefix.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control
  namespace: control
  labels:
    app.kubernetes.io/name: control
    secforge.platform/component: control
  annotations:
    # Per-host LE issuance via DNS01 (Cloudflare). Works even though
    # control.${DOMAIN} has no public A record — DNS01 only needs the
    # _acme-challenge TXT record, which cert-manager creates via the
    # Cloudflare API regardless of A-record presence.
    cert-manager.io/cluster-issuer: ${LE_ISSUER}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    # Defense-in-depth: even with the SNAT-bypass bug on the existing
    # whitelist annotation (every external request appears as
    # 10.42.0.1), this annotation kicks in once nginx is flipped to
    # hostNetwork mode (deferred). Until then the DNS-removal is the
    # real gate.
    nginx.ingress.kubernetes.io/whitelist-source-range: "100.64.0.0/10,10.42.0.0/16,65.21.25.40/32"
    # Rate limit — slightly stricter than keycloak (5 rps) because the
    # control API has fewer legitimate burst patterns.
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # CORS handled at the application layer (Fastify @fastify/cors).
    # Setting it here would override the app's per-route policy.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - control.${DOMAIN}
        - admin.${DOMAIN}
        - portal.${DOMAIN}
      secretName: control-tls
  rules:
    # ── control.${DOMAIN} (legacy) — serves the Admin Console shell ──
    - host: control.${DOMAIN}
      http:
        paths:
          # /api/* → control backend (Fastify on :4000). Listed FIRST
          # so its Prefix match beats the catch-all below.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: control
                port:
                  number: 80
          # Everything else → portal (nginx SPA on :8080). react-router
          # handles client-side routing; the in-pod nginx.conf serves
          # the right shell based on Host header.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 80

    # ── admin.${DOMAIN} — operator-facing Admin Console shell ────────
    - host: admin.${DOMAIN}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: control
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 80

    # ── portal.${DOMAIN} — tenant-facing Portal shell ────────────────
    - host: portal.${DOMAIN}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: control
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 80
