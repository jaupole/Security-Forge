# Portal SPA (React 19 + Vite, served by nginx-unprivileged).
#
# Image built from the Ecosystem Portal repo's Dockerfile, tagged
# `ghcr.io/secforge/portal:${PORTAL_TAG}`. Static files baked in; runtime
# config is inferred from the same-origin URL (so the SPA calls
# `fetch("/api/...")` and ingress-nginx routes that to control-service).
#
# nginx-unprivileged listens on 8080 as UID 101 (no root, no CAP_NET_BIND).
# Stateless — no Secret consumption, no DB, no OpenBao.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: control
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: ui
    secforge.platform/component: control
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
      app.kubernetes.io/component: ui
  template:
    metadata:
      annotations:
        # Exclude ephemeral scratch volumes from Velero fs-backup — no
        # recoverable data, and they race the pod lifecycle (a pod replaced
        # mid-backup fails the PodVolumeBackup -> PartiallyFailed -> trips
        # VeleroBackupTooOld).
        backup.velero.io/backup-volumes-excludes: cache,run,tmp
      labels:
        app.kubernetes.io/name: portal
        app.kubernetes.io/component: ui
        secforge.platform/component: control
    spec:
      serviceAccountName: control
      automountServiceAccountToken: false
      # GHCR is private — pull via VSO-rendered dockerconfigjson Secret
      # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Digest-pinned (cosign signs digests, not tags). Bump via the
          # GHA image-build run output; Renovate or a CI bot can later
          # automate the bump. e1e8b628 = honor cross-app theme cookie (PR #43,
          # reads secforge_theme before first paint), on top of the admin nav
          # regroup (#42, 9720208b), Page Settings → Platform View (#41), and
          # the admin Page Settings accent (#40). 2026-06-08: QBO How-It-Works
          # hidden once connected + "Remove all email settings" button (ec56227).
          # 2026-06-08: Remove action for resolved invitations + Account column
          # (Active/Disabled/No account) on Member Roles (#44). 2026-06-08:
          # ticket Archived filter + Archive/Restore actions (#45).
          # 2026-06-08: tickets inbox defaults to Open + status filter reorder
          # + "Archive now" label (#46).
          # 2026-06-09: ecosystem-ui 0.1.8 dashboard polish — centered Ring
          # text, larger KpiStat icons, centered KPI values, hover popout.
          # 2026-06-09: call per-org admin endpoints under /api/v1/orgs/:id
          # (route move; built on top of 861c22c so it includes the polish)
          # — commit 2b3f044.
          # 2026-06-09: dashboard hero title + decluttered header + curated
          # "What's happening" feed (meaningful-only) — commit 07daf30.
          # 2026-06-09: hero rendered centered + larger; redundant top-left
          # nav mark hidden while the hero is on screen — commit 007163d.
          image: ghcr.io/jaupole/portal@sha256:8473e09f7e080af376c30544c798053b1e452ea918894db8549e0ef61416971d
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, name: http, protocol: TCP }
          resources:
            requests: { cpu: 20m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            # nginx-unprivileged needs writable paths for cache + temp +
            # pid file. Defaults baked into the image expect these dirs.
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run,   mountPath: /var/run }
            - { name: tmp,   mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: { sizeLimit: 32Mi } }
        - { name: run,   emptyDir: { sizeLimit: 8Mi } }
        - { name: tmp,   emptyDir: { sizeLimit: 16Mi } }
