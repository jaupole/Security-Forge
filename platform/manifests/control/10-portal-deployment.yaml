# Portal SPA (React 19 + Vite, served by nginx-unprivileged).
#
# Image built from the Ecosystem Portal repo's Dockerfile, tagged
# `ghcr.io/secforge/portal:${PORTAL_TAG}`. Static files baked in; runtime
# config is inferred from the same-origin URL (so the SPA calls
# `fetch("/api/...")` and ingress-nginx routes that to control-service).
#
# nginx-unprivileged listens on 8080 as UID 101 (no root, no CAP_NET_BIND).
# Stateless — no Secret consumption, no DB, no OpenBao.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: control
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: ui
    secforge.platform/component: control
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
        app.kubernetes.io/component: ui
        secforge.platform/component: control
    spec:
      serviceAccountName: control
      automountServiceAccountToken: false
      # GHCR is private — pull via VSO-rendered dockerconfigjson Secret
      # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Digest-pinned (cosign signs digests, not tags). Bump via the
          # GHA image-build run output; Renovate or a CI bot can later
          # automate the bump. 7bc0c072 = nav dropdown active-state respects
          # leaf `end` (fixes two dropdowns highlighting at once, e.g.
          # Organization + Administration on /admin/members/structure).
          # (portal-image-build run 27078060628, commit 8b781b3).
          image: ghcr.io/jaupole/portal@sha256:7bc0c072934f5c7015d7583c8a9296ee4c5ef6dc9b46bdd3c5e5a6b1539a6c6a
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, name: http, protocol: TCP }
          resources:
            requests: { cpu: 20m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            # nginx-unprivileged needs writable paths for cache + temp +
            # pid file. Defaults baked into the image expect these dirs.
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run,   mountPath: /var/run }
            - { name: tmp,   mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: { sizeLimit: 32Mi } }
        - { name: run,   emptyDir: { sizeLimit: 8Mi } }
        - { name: tmp,   emptyDir: { sizeLimit: 16Mi } }
