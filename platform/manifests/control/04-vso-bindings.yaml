# VSO bindings for the control namespace.
#
# Three rendered K8s Secrets:
#   - control-app-secrets       → app-level keys (session-signing,
#                                 SpiceDB PSK, Keycloak client_secret)
#   - control-db-superuser-app  → CNPG application user credentials
#                                 (CNPG operator creates this automatically;
#                                 listed here for the network-policy reference)
#   - cnpg-minio-credentials    → barman-cloud → MinIO bucket credentials
#
# The OpenBao policy that grants reads on these paths lives at
# `platform/manifests/openbao/policies/control.hcl`. The K8s auth role
# binding (k8s SA `control-vso` → policy `control`) is created by the
# openbao bootstrap; ongoing role changes go via kcadm-style direct API.

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: control-vso
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: control-vso
    serviceAccount: control-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
# Aggregates app-level secrets (Keycloak client, SpiceDB, session key)
# into a single K8s Secret consumed via envFrom in the backend Deployment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: control-app-secrets
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: apps/control/runtime
  refreshAfter: 60s
  destination:
    name: control-app-secrets
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        # NOTE: the legacy user-login `control` OIDC client secret
        # (oidc_client_secret -> OIDC_CLIENT_SECRET) was dropped when Control
        # moved to the BFF — config.ts no longer reads it; the Portal BFF uses
        # the confidential control-portal secret (CONTROL_PORTAL_CLIENT_SECRET,
        # templated below). The OpenBao key may still exist but is unused here.
        # Keycloak admin-API client_secret (`control-admin` service-account
        # client — separate from the user-login OIDC client). Used by
        # @keycloak/keycloak-admin-client for member-create / role-mgmt
        # / etc. Realm-management roles assigned to this client's
        # service account: manage-users, view-users, query-users,
        # view-clients, view-realm.
        KEYCLOAK_ADMIN_CLIENT_SECRET:
          text: '{{ .Secrets.admin_client_secret }}'
        # Tenants-realm admin-API client_secret (Shape B Track 3 +
        # tenant signup wizard). Same clientId (`control-admin`) but
        # in the `secforge-tenants` realm — separate service account
        # with manage-organizations + view-organizations in addition
        # to the manage-users / view-* roles. Required by the
        # signup wizard at /api/v1/signup to create the new tenant's
        # Keycloak Organization + first administrator user.
        # When unset, /api/v1/signup returns 503 "signup_not_configured".
        KEYCLOAK_TENANTS_ADMIN_CLIENT_SECRET:
          text: '{{ .Secrets.tenants_admin_client_secret }}'
        # SpiceDB pre-shared key for gRPC auth (same value also rendered
        # into the spicedb pod from its own VSO binding — we just
        # consume it here, not own it).
        SPICEDB_PRESHARED_KEY:
          text: '{{ .Secrets.spicedb_psk }}'
        # @fastify/secure-session signing key (raw 32-byte base64). The
        # bootstrap script generates this once via `openssl rand -base64 32`
        # and stores in OpenBao; rotate via OpenBao + Pod restart.
        SESSION_KEY:
          text: '{{ .Secrets.session_signing_key }}'
        # HMAC-SHA256 key (32 bytes base64) for indexed lookup of
        # encrypted email columns (e.g. pending_invitations.invited_email_hmac).
        # See src/lib/secrets/hmac.ts for rationale on HMAC vs convergent
        # encryption (HMAC chosen so DB readers can't recover plaintext).
        # Rotation: bump the key in OpenBao + rebuild HMAC column for
        # every row that needs to remain searchable.
        EMAIL_HMAC_KEY:
          text: '{{ .Secrets.email_hmac_key }}'
        # control-portal CONFIDENTIAL client secret(s) — Control is the Portal
        # BFF (@jaupole/ecosystem-auth). The browser holds only a sealed
        # __Host-ctrl_sess cookie; Control holds the Portal user's tokens
        # server-side. Two clientIds-in-two-realms (platform = admin shell,
        # secforge-tenants = tenant shell), each its own secret. Conditional so
        # Control boots (BFF dormant) until the operator flips control-portal to
        # confidential and writes the secret — then a Pod restart activates it.
        CONTROL_PORTAL_CLIENT_SECRET:
          text: '{{ if .Secrets.control_portal_client_secret }}{{ .Secrets.control_portal_client_secret }}{{ end }}'
        CONTROL_PORTAL_CLIENT_SECRET_TENANTS:
          text: '{{ if .Secrets.control_portal_client_secret_tenants }}{{ .Secrets.control_portal_client_secret_tenants }}{{ end }}'

---
# GHCR image-pull credential. Renders into a kubernetes.io/dockerconfigjson
# Secret consumed via `imagePullSecrets:` on the control + portal
# Deployments + the migration Job. Token is a fine-grained PAT scoped to
# read:packages on jaupole/ecosystem-{control,portal} only.
#
# OpenBao path: secret/data/apps/control/ghcr-pull
#   - username: GitHub user (jaupole)
#   - password: PAT (rotate via OpenBao + 90-day expiry on the GH token)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull-secret
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: apps/control/ghcr-pull
  refreshAfter: 5m
  destination:
    name: ghcr-pull-secret
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ".dockerconfigjson":
          text: |-
            {"auths":{"ghcr.io":{"username":"{{ .Secrets.username }}","password":"{{ .Secrets.password }}","auth":"{{ printf "%s:%s" .Secrets.username .Secrets.password | b64enc }}"}}}

---
# Cloudflare Turnstile siteverify secret for the public signup bot-check.
# OpenBao path: secret/data/apps/control/turnstile (key: secret_key).
# Rendered as TURNSTILE_SECRET into an Opaque Secret, injected via the
# optional control-turnstile-secret envFrom in 09-backend-deployment.yaml.
# The signup route's Turnstile check is dark until this env var is present,
# so the optional envFrom keeps the pod booting before the secret is written.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: control-turnstile-secret
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: apps/control/turnstile
  refreshAfter: 5m
  destination:
    name: control-turnstile-secret
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        TURNSTILE_SECRET:
          text: '{{ .Secrets.secret_key }}'

---
# barman-cloud → MinIO credentials for CNPG WAL archiving + base backups.
# Same VSO consumer SA, same OpenBao path as keycloak's CNPG cluster.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cnpg-minio-credentials-vso
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: minio/cnpg/credentials
  refreshAfter: 60s
  destination:
    name: cnpg-minio-credentials
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ACCESS_KEY_ID:
          text: '{{ .Secrets.access_key }}'
        ACCESS_SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'

---
# App-level MinIO credentials for the ecosystem-graphics bucket
# (ADR-0001 Phase A in Member Hub/docs/02-decisions/). Distinct from
# the CNPG barman creds above (shared `backups` bucket); this set
# grants rw on the per-app `ecosystem-graphics` bucket only, used by
# Control's graphics CRUD endpoints to store cross-app org branded
# imagery.
#
# OpenBao path: secret/minio/ecosystem-graphics
#   - access_key : MinIO service-account access key (~16 char)
#   - secret_key : matching secret key (40 char)
#
# Operator-provisioned out of band (one-time): see runbook
# docs/03-runbooks/ecosystem-graphics-bucket.md (to be authored).
# Mirrors the pattern used for member-hub-documents-minio.
#
# Until the operator writes the OpenBao path, this VaultStaticSecret
# has no source, the K8s Secret is not created, and Control's
# graphics routes return a clean 503 "object_storage_unconfigured"
# — no crash.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ecosystem-graphics-minio-vso
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: minio/ecosystem-graphics
  refreshAfter: 60s
  destination:
    name: ecosystem-graphics-minio
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        MINIO_ACCESS_KEY:
          text: '{{ .Secrets.access_key }}'
        MINIO_SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'

---
# QuickBooks Online — credentials for the ecosystem's single registered
# QBO app (Intuit OAuth2 client_id + client_secret). Consumed via an
# OPTIONAL envFrom on the control Deployment (09-backend-deployment.yaml):
# until the operator writes the OpenBao path below, this VaultStaticSecret
# has no source, the control-qbo-secrets K8s Secret is not created, and
# Control's QBO connect routes return a clean "not configured" 503 —
# no crash. Activating the integration is a runbook step:
# docs/03-runbooks/quickbooks-online-setup.md.
#
# OpenBao path: secret/data/apps/control/qbo  (covered by control.hcl's
# `secret/data/apps/control/+` grant — no policy change needed)
#   - client_id     : the Intuit app's OAuth2 client id
#   - client_secret : the Intuit app's OAuth2 client secret
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: control-qbo-secrets
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: apps/control/qbo
  refreshAfter: 60s
  destination:
    name: control-qbo-secrets
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        QBO_CLIENT_ID:
          text: '{{ .Secrets.client_id }}'
        QBO_CLIENT_SECRET:
          text: '{{ .Secrets.client_secret }}'

---
# control_migrator login password → CNPG managed role `control_migrator`
# (02-cnpg-cluster.yaml). kubernetes.io/basic-auth Secret (keys: username +
# password) + cnpg.io/reload so CNPG reloads on rotation.
# KEY COUPLING — the rendered keys `username`/`password` are consumed by CNPG
# managed.roles.passwordSecret (02) AND the migration Job PGUSER/PGPASSWORD (08);
# the reader Secret below adds the backend PGREADER_* (09). Do not rename the
# keys or change the Secret type without auditing every consumer.
# OpenBao path: secret/data/apps/control/db-migrator  (covered by control.hcl's
#   secret/data/apps/control/+ grant — no policy change)
#   - username: control_migrator   ← MUST be the exact Postgres role name; the
#                                     value is used verbatim as the connection
#                                     `user=` (a wrong value -> "role does not
#                                     exist" at runtime)
#   - password: <operator-written; rotate via OpenBao, incl. post-cutover>
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: control-db-migrator-vso
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: apps/control/db-migrator
  refreshAfter: 60s
  destination:
    name: control-db-migrator
    create: true
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        username:
          text: '{{ .Secrets.username }}'
        password:
          text: '{{ .Secrets.password }}'

---
# control_reader login password → CNPG managed role `control_reader` AND the
# backend's PGREADER_PASSWORD (09-backend-deployment). Same Secret, consumed
# two ways. OpenBao path: secret/data/apps/control/db-reader
#   - username: control_reader
#   - password: <operator-written>
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: control-db-reader-vso
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: apps/control/db-reader
  refreshAfter: 60s
  destination:
    name: control-db-reader
    create: true
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        username:
          text: '{{ .Secrets.username }}'
        password:
          text: '{{ .Secrets.password }}'
