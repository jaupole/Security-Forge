# VSO bindings for the control namespace.
#
# Three rendered K8s Secrets:
#   - control-app-secrets       → app-level keys (session-signing,
#                                 SpiceDB PSK, Keycloak client_secret)
#   - control-db-superuser-app  → CNPG application user credentials
#                                 (CNPG operator creates this automatically;
#                                 listed here for the network-policy reference)
#   - cnpg-minio-credentials    → barman-cloud → MinIO bucket credentials
#
# The OpenBao policy that grants reads on these paths lives at
# `platform/manifests/openbao/policies/control.hcl`. The K8s auth role
# binding (k8s SA `control-vso` → policy `control`) is created by the
# openbao bootstrap; ongoing role changes go via kcadm-style direct API.

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: control-vso
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: control-vso
    serviceAccount: control-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
# Aggregates app-level secrets (Keycloak client, SpiceDB, session key)
# into a single K8s Secret consumed via envFrom in the backend Deployment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: control-app-secrets
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: apps/control/runtime
  refreshAfter: 60s
  destination:
    name: control-app-secrets
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        # Keycloak OIDC client_secret (user-login `control` client).
        # App reads as OIDC_CLIENT_SECRET.
        OIDC_CLIENT_SECRET:
          text: '{{ .Secrets.oidc_client_secret }}'
        # Keycloak admin-API client_secret (`control-admin` service-account
        # client — separate from the user-login OIDC client). Used by
        # @keycloak/keycloak-admin-client for member-create / role-mgmt
        # / etc. Realm-management roles assigned to this client's
        # service account: manage-users, view-users, query-users,
        # view-clients, view-realm.
        KEYCLOAK_ADMIN_CLIENT_SECRET:
          text: '{{ .Secrets.admin_client_secret }}'
        # SpiceDB pre-shared key for gRPC auth (same value also rendered
        # into the spicedb pod from its own VSO binding — we just
        # consume it here, not own it).
        SPICEDB_PRESHARED_KEY:
          text: '{{ .Secrets.spicedb_psk }}'
        # @fastify/secure-session signing key (raw 32-byte base64). The
        # bootstrap script generates this once via `openssl rand -base64 32`
        # and stores in OpenBao; rotate via OpenBao + Pod restart.
        SESSION_KEY:
          text: '{{ .Secrets.session_signing_key }}'
        # HMAC-SHA256 key (32 bytes base64) for indexed lookup of
        # encrypted email columns (e.g. pending_invitations.invited_email_hmac).
        # See src/lib/secrets/hmac.ts for rationale on HMAC vs convergent
        # encryption (HMAC chosen so DB readers can't recover plaintext).
        # Rotation: bump the key in OpenBao + rebuild HMAC column for
        # every row that needs to remain searchable.
        EMAIL_HMAC_KEY:
          text: '{{ .Secrets.email_hmac_key }}'

---
# GHCR image-pull credential. Renders into a kubernetes.io/dockerconfigjson
# Secret consumed via `imagePullSecrets:` on the control + portal
# Deployments + the migration Job. Token is a fine-grained PAT scoped to
# read:packages on jaupole/ecosystem-{control,portal} only.
#
# OpenBao path: secret/data/apps/control/ghcr-pull
#   - username: GitHub user (jaupole)
#   - password: PAT (rotate via OpenBao + 90-day expiry on the GH token)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull-secret
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: apps/control/ghcr-pull
  refreshAfter: 5m
  destination:
    name: ghcr-pull-secret
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ".dockerconfigjson":
          text: |-
            {"auths":{"ghcr.io":{"username":"{{ .Secrets.username }}","password":"{{ .Secrets.password }}","auth":"{{ printf "%s:%s" .Secrets.username .Secrets.password | b64enc }}"}}}

---
# barman-cloud → MinIO credentials for CNPG WAL archiving + base backups.
# Same VSO consumer SA, same OpenBao path as keycloak's CNPG cluster.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cnpg-minio-credentials-vso
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: minio/cnpg/credentials
  refreshAfter: 60s
  destination:
    name: cnpg-minio-credentials
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ACCESS_KEY_ID:
          text: '{{ .Secrets.access_key }}'
        ACCESS_SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'

---
# QuickBooks Online — credentials for the ecosystem's single registered
# QBO app (Intuit OAuth2 client_id + client_secret). Consumed via an
# OPTIONAL envFrom on the control Deployment (09-backend-deployment.yaml):
# until the operator writes the OpenBao path below, this VaultStaticSecret
# has no source, the control-qbo-secrets K8s Secret is not created, and
# Control's QBO connect routes return a clean "not configured" 503 —
# no crash. Activating the integration is a runbook step:
# docs/03-runbooks/quickbooks-online-setup.md.
#
# OpenBao path: secret/data/apps/control/qbo  (covered by control.hcl's
# `secret/data/apps/control/+` grant — no policy change needed)
#   - client_id     : the Intuit app's OAuth2 client id
#   - client_secret : the Intuit app's OAuth2 client secret
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: control-qbo-secrets
  namespace: control
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: control-vso
  mount: secret
  type: kv-v2
  path: apps/control/qbo
  refreshAfter: 60s
  destination:
    name: control-qbo-secrets
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        QBO_CLIENT_ID:
          text: '{{ .Secrets.client_id }}'
        QBO_CLIENT_SECRET:
          text: '{{ .Secrets.client_secret }}'
