# Weekly CronJob that reconciles SpiceDB org-MEMBERSHIP tuples against
# control_db membership state (CTRL-07). Unlike the org-orphan sweep (18-…),
# which only catches tuples for orgs ABSENT from the DB, this catches
# membership-level drift for orgs that still exist: a phantom
# `organization:<id>#member@user:<sub>` tuple (left behind when a member-add /
# status / system-role tx wrote its SpiceDB TOUCH and then rolled back) grants
# `view` on the org with no backing membership — a silent over-grant that
# nothing else detects. See ecosystem-control src/cli/sweep-membership-drift.ts.
#
# SECURITY POSTURE: this CronJob runs DRY-RUN (no --apply). Deleting authz
# tuples is an irreversible security mutation, so the scheduled run only
# DETECTS + logs drift (structured JSON, `status: drift_detected` for
# alerting); an operator reviews and runs
#   kubectl exec deploy/control -n control -c api -- \
#     /nodejs/bin/node dist/cli/index.js spicedb:sweep-membership-drift --apply
# after confirming the phantoms are genuine. --apply deletes phantoms only,
# re-confirming each is still unbacked immediately before deletion (member-add
# create-race guard).
#
# Needs the SpiceDB read+write client (50051; control pod label is on the
# allow-control-to-spicedb NetworkPolicy) and the control-ecodb DB creds. The
# sweep sets app.org_id per org so the NOBYPASSRLS control role can read each
# org's memberships under RLS. config.ts validates the full env at import, so
# the Keycloak vars must be present even though the sweep doesn't use them.
#
# Same image + DB env as the API Deployment — only the CLI entrypoint differs
# ("spicedb:sweep-membership-drift"). Bump the digest in lockstep with
# 09-backend-deployment.yaml.

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: control-membership-drift-sweep
  namespace: control
  labels:
    app.kubernetes.io/name: control
    secforge.platform/component: control
    secforge.platform/role: membership-drift-sweep
spec:
  # Weekly, Sunday 04:43 UTC — off the round-hour and clear of orphan-sweep
  # (04:13 Sun), grant-sweep (:29 hourly), signup-cleanup (:17 hourly) and
  # tickets-archive (03:41 daily) so they never overlap on the single node.
  schedule: "43 4 * * 0"
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: control
            secforge.platform/component: control
            secforge.platform/role: membership-drift-sweep
        spec:
          restartPolicy: Never
          serviceAccountName: control
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: wait-for-db
              image: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  until pg_isready -h ecosystem-db-rw.ecosystem-db.svc.cluster.local -p 5432 -U control -d control -t 3; do
                    echo "waiting for control-db..."
                    sleep 2
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 128Mi }
          containers:
            - name: sweep
              # Digest-pinned. Same image as the backend Deployment.
              # Bump in lockstep with 09-backend-deployment.yaml.
              image: ghcr.io/jaupole/control@sha256:195f38a7f8bdf46742cc2679f6ad7867a7a16f9a8df74f2eae07f213fe7b53ca
              imagePullPolicy: IfNotPresent
              command: ["/nodejs/bin/node", "dist/cli/index.js", "spicedb:sweep-membership-drift"]
              env:
                - { name: NODE_ENV,                         value: production }
                - { name: API_PORT,                         value: "4000" }
                - { name: API_HOST,                         value: "0.0.0.0" }
                - { name: TRUST_PROXY,                      value: "1" }
                - { name: PORTAL_ORIGIN,                    value: "https://control.${DOMAIN}" }
                - { name: NODE_EXTRA_CA_CERTS,              value: /etc/secforge/openbao-ca.crt }
                - { name: KEYCLOAK_URL,                     value: "https://auth.${DOMAIN}" }
                - { name: KEYCLOAK_REALM,                   value: platform }
                - { name: KEYCLOAK_ADMIN_CLIENT_ID,         value: control-admin }
                - { name: SPICEDB_ENDPOINT,                 value: "spicedb.spicedb.svc.cluster.local:50051" }
                # Runtime `control` role (control-ecodb). The sweep sets
                # app.org_id per org to read memberships under RLS.
                - { name: PGHOST,     valueFrom: { secretKeyRef: { name: control-ecodb, key: host } } }
                - { name: PGPORT,     valueFrom: { secretKeyRef: { name: control-ecodb, key: port } } }
                - { name: PGUSER,     valueFrom: { secretKeyRef: { name: control-ecodb, key: username } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: control-ecodb, key: password } } }
                - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: control-ecodb, key: dbname } } }
              envFrom:
                - secretRef:
                    name: control-app-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: openbao-ca
                  mountPath: /etc/secforge
                  readOnly: true
          volumes:
            - name: openbao-ca
              configMap:
                name: openbao-internal-ca-cert
                items:
                  - { key: ca.crt, path: openbao-ca.crt }
