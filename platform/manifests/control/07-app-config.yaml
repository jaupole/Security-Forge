# Shared non-secret runtime config for EVERY ecosystem-control pod — the API
# Deployment and all CLI CronJobs (billing-usage, signup-cleanup,
# tickets-archive, grant-sweep, orphan-tuple-sweep, membership-drift-sweep,
# onlyoffice-usage, people-sweep, idempotency-purge). Each pod spec mounts it
# via `envFrom: configMapRef` and keeps only its pod-specific keys inline
# (PORTAL_ORIGIN, PG*, feature-specific URLs). An inline `env:` entry wins over
# an envFrom key, so a pod can still override.
#
# Why one map: the CronJobs used to hand-copy the Deployment's env block, and
# one of them (people-sweep) silently lost the two tenant-realm keys — every
# secforge-tenants member then resolved as "(deleted user)" for 90 nights
# (incident 2026-10-05). A new CronJob can no longer miss a key.
#
# Secrets are NOT here: they arrive via the VSO-rendered control-app-secrets
# (and feature-specific) Secrets referenced from each pod's envFrom.
#
# Applied by the rebuild (glob order: 07 < 09) and, for a change here, by
#   bash lib/apply-manifest.sh manifests/control/07-app-config.yaml
# followed by a rollout restart (ConfigMap env is read at pod start).
# deploy-app.sh only re-applies image-bearing manifests, so apply this file
# FIRST when introducing a new key a pod depends on.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-app-config
  namespace: control
  labels:
    app.kubernetes.io/name: control
    secforge.platform/component: control
data:
  NODE_ENV: production
  API_PORT: "4000"
  API_HOST: "0.0.0.0"
  TRUST_PROXY: "1"
  # auth.${DOMAIN}'s TLS chain inside the cluster is signed by the internal CA
  # bundled in the openbao-internal-ca-cert ConfigMap (mounted by every pod at
  # /etc/secforge). Without this the keycloak-admin-client fails the OAuth
  # login with UNABLE_TO_VERIFY_LEAF_SIGNATURE.
  NODE_EXTRA_CA_CERTS: /etc/secforge/openbao-ca.crt
  KEYCLOAK_URL: "https://auth.${DOMAIN}"
  # Platform realm (staff + legacy pre-Shape-B users) — the admin client for
  # getKeycloakAdmin(); KEYCLOAK_ADMIN_CLIENT_SECRET comes from control-app-secrets.
  KEYCLOAK_REALM: platform
  KEYCLOAK_ADMIN_CLIENT_ID: control-admin
  # Tenants realm (Shape B — every signup-wizard user since 2026-05-23). When
  # set, the auth middleware accepts tokens from BOTH realms and the user
  # resolver (lib/users.ts) falls back to this realm after a platform-realm
  # miss. REQUIRED by anything that resolves users: /me, members, invitations,
  # tickets, reports, people-sweep, signup-cleanup.
  # KEYCLOAK_TENANTS_ADMIN_CLIENT_SECRET comes from control-app-secrets.
  KEYCLOAK_TENANTS_REALM: secforge-tenants
  KEYCLOAK_TENANTS_ADMIN_CLIENT_ID: control-admin
  SPICEDB_ENDPOINT: "spicedb.spicedb.svc.cluster.local:50051"
