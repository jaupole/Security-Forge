# Barman Cloud Plugin ObjectStore for control-db.
# Credentials rendered into cnpg-minio-credentials by the VSO binding
# in 04-vso-bindings.yaml.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: minio-backup
  namespace: control
  labels:
    secforge.platform/component: cloudnativepg
    secforge.platform/cluster: control-db
spec:
  configuration:
    destinationPath: s3://backups/cnpg/control
    endpointURL: http://minio.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: cnpg-minio-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-minio-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
