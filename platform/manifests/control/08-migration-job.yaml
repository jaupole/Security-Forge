# One-shot Job that applies all pending migrations to control-db.
#
# Run BEFORE the API Deployment so the schema (incl. RLS at 019, audit-log
# hash chain at 020, idempotency keys at 021) is in place when the first
# server.js starts answering requests.
#
# Re-runs are safe — migrate.ts is idempotent (records applied versions in
# a schema_migrations table; re-applying a migration is a no-op).
#
# CNPG auto-renders the `control-db-app` Secret with:
#   - username, password, dbname, host, port, jdbc-uri, uri, pgpass
# We feed DATABASE_URL from the `uri` key directly (pg connection string).

---
apiVersion: batch/v1
kind: Job
metadata:
  name: control-db-migrate
  namespace: control
  labels:
    app.kubernetes.io/name: control
    secforge.platform/component: control
    secforge.platform/role: db-migration
spec:
  # Don't auto-retry on app errors — a migration failure needs operator
  # eyes, not blind re-runs.
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400     # GC after 24h so the Job artefact persists for inspection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control
        secforge.platform/component: control
        secforge.platform/role: db-migration
    spec:
      restartPolicy: Never
      serviceAccountName: control
      automountServiceAccountToken: false
      # GHCR is private — pull via VSO-rendered dockerconfigjson Secret
      # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Wait for control-db to be Ready before starting the migration
      # container. The CNPG operator marks Ready once the primary is
      # accepting connections.
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h control-db-rw.control.svc.cluster.local -p 5432 -U control -d control -t 3; do
                echo "waiting for control-db..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
      containers:
        - name: migrate
          # Digest-pinned (cosign signs digests, not tags). Bump via the
          # GHA image-build run output; Renovate or a CI bot can later
          # automate the bump.
          # 2026-06-11: bumped to apply migration 073 (organizations.kc_org_id).
          # (4410024c supersedes 36272f7d/0448ea93 — those were signed with
          # cosign v3's bundle format, which Kyverno can't verify.)
          image: ghcr.io/jaupole/control@sha256:e43e1ddc21f52707a8f0f2ef0c118c851f3b7080af307e9715c4bc6b0c54c81a
          imagePullPolicy: IfNotPresent
          # Use the CLI's db:migrate command. dist/db/migrate.js is just an
          # exported module (no top-level call); the runnable entrypoint
          # is the commander-based CLI at dist/cli/index.js.
          command: ["/nodejs/bin/node", "dist/cli/index.js", "db:migrate"]
          # Env mirrors the API Deployment (09-backend-deployment.yaml) because
          # src/api/config.ts validates the full env at import time — the CLI
          # imports the pool which imports config, which throws if any
          # required var is missing. Job-only behavioral envs (eg API_PORT)
          # are still required by the schema even if migrate doesn't use them.
          env:
            - { name: NODE_ENV,                value: production }
            - { name: API_PORT,                value: "4000" }
            - { name: API_HOST,                value: "0.0.0.0" }
            - { name: TRUST_PROXY,             value: "1" }
            - { name: PORTAL_ORIGIN,           value: "https://control.${DOMAIN}" }
            - { name: KEYCLOAK_URL,            value: "https://auth.${DOMAIN}" }
            - { name: KEYCLOAK_REALM,          value: platform }
            - { name: KEYCLOAK_ADMIN_CLIENT_ID, value: control-admin }
            - { name: SPICEDB_ENDPOINT,        value: "spicedb.spicedb.svc.cluster.local:50051" }
            - { name: PGHOST,     valueFrom: { secretKeyRef: { name: control-db-app, key: host } } }
            - { name: PGPORT,     valueFrom: { secretKeyRef: { name: control-db-app, key: port } } }
            # Connect as control_migrator (member of control + control_owner) so
            # migrate.ts can `SET ROLE control_owner` for 061+ ownership under
            # FORCE RLS. host/port/dbname stay on control-db-app (identical).
            # Migration 060 needs the in-pod SUPERUSER (ALTER ROLE/OWNER + FORCE)
            # and is run by hand once in the cutover window BEFORE this Job; the
            # Job applies 061+ as control_migrator. migrate.ts aborts fast if 060
            # is still pending and the role is not superuser (cutover runbook §4).
            - { name: PGUSER,     valueFrom: { secretKeyRef: { name: control-db-migrator, key: username } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: control-db-migrator, key: password } } }
            - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: control-db-app, key: dbname } } }
          envFrom:
            # Pulls EMAIL_HMAC_KEY + KEYCLOAK_ADMIN_CLIENT_SECRET +
            # SPICEDB_PRESHARED_KEY + SESSION_KEY — config.ts requires them
            # all even though migrations don't use them.
            - secretRef:
                name: control-app-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
