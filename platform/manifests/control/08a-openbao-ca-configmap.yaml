# Internal-CA trust bundle consumed by the Control backend
# (09-backend-deployment.yaml mounts this at /etc/secforge/openbao-ca.crt).
#
# Control makes outbound in-cluster TLS calls to two services whose certs
# are issued by SEPARATE internal CAs:
#   - Keycloak  (auth.${DOMAIN} → keycloak ClusterIP)  → "SecForge Internal CA"
#   - OpenBao   (openbao.openbao.svc:8200, Transit)    → "SecForge OpenBao Internal CA"
#
# Both Deployment env vars point at the single rendered file:
#   NODE_EXTRA_CA_CERTS   — jose's createRemoteJWKSet / global fetch (Keycloak)
#   OPENBAO_CA_CERT_PATH  — the Transit client's https.Agent (OpenBao)
# so this ConfigMap must carry BOTH CA certs. It originally held only the
# Keycloak CA; Control's Transit calls failed TLS verification
# (UNABLE_TO_VERIFY_LEAF_SIGNATURE) until the OpenBao CA was added here —
# operator-backlog #34. The ConfigMap was previously created out-of-band;
# this manifest brings it under source control.
#
# Both are 10-year ECDSA roots (the OpenBao CA is defined in
# openbao/03-ca.yaml). On CA rotation, refresh this bundle.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-internal-ca-cert
  namespace: control
  labels:
    secforge.platform/component: control
data:
