# Postgres cluster for the control-plane API.
#
# Migrations 001-021 (incl. RLS at 019, audit-log hash chain at 020,
# idempotency keys at 021) run from the `control` repo via the
# migration Job in 07-migration-job.yaml. CNPG operator manages the
# rest of the lifecycle: failover, WAL archiving, base backups via
# barman-cloud plugin → MinIO.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: control-db
  namespace: control
  labels:
    secforge.platform/component: control
    secforge.platform/edition: prod
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
  primaryUpdateStrategy: unsupervised

  enableSuperuserAccess: false

  storage:
    size: 10Gi
    storageClass: ${STORAGE_CLASS}

  bootstrap:
    initdb:
      database: control
      owner: control
      encoding: UTF8
      localeCollate: C
      localeCType: C

  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
      # RLS uses session-local GUCs (app.user_id, app.org_id). These
      # are set via `SET LOCAL` in src/api/db-tx.ts and propagated by
      # the txnContext() helper. No special postgresql.conf entries
      # needed — `SET LOCAL` works on standard configs.

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1Gi }

  monitoring:
    enablePodMonitor: false

  # WAL archiving + base backups to MinIO via barman-cloud plugin.
  # ObjectStore CR lives in 06-objectstore.yaml; ScheduledBackup CR
  # in 07-cnpg-scheduled-backup.yaml. Plugin install + operator
  # wiring is in component 09h-cnpg-barman-plugin.sh.
  #
  # `parameters.barmanObjectName` is REQUIRED — it links the cluster to
  # the ObjectStore CR by name. Without it, the operator can't load the
  # plugin connection and the instance-manager loops on
  # "Unknown plugin: barman-cloud.cloudnative-pg.io". Discovered the
  # hard way during the 2026-05-14 control rollout.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-backup
        # Archive path separated from the pre-upgrade PG16 backups: a major
        # upgrade resets the WAL timeline, so PG17 archives under a fresh
        # serverName (added with the 2026-05-21 16->17 upgrade).
        serverName: control-db-pg17

  # ── Managed DB roles for the FORCE-RLS cutover (audit EC-003 / SC-3.4) ──
  # CNPG manages ONLY the role objects (LOGIN/password/membership/attrs).
  # Table OWNERSHIP is moved by migration 060 (ALTER ... OWNER TO control_owner)
  # — CNPG has no owner-of-table concept. These roles are inert until 060/061
  # run + the app-side cutover image deploys. control_owner is the schema owner;
  # control_migrator runs migrations; control_reader backs withExemptRead.
  managed:
    roles:
      # Owner of all RLS objects after 060. NOLOGIN — nobody connects as the
      # owner at runtime, which is exactly what makes FORCE ROW LEVEL SECURITY
      # meaningful. No passwordSecret (NULL password). NOBYPASSRLS.
      - name: control_owner
        ensure: present
        comment: "RLS object owner (migration 060); NOLOGIN, never connected at runtime"
        login: false
        superuser: false
        bypassrls: false
        inherit: true
      # Migration role. LOGIN so the migration Job connects as it. Member of
      # `control` (CNPG app role) AND control_owner, so migrate.ts can
      # `SET ROLE control_owner` and own objects for 061+. NOBYPASSRLS.
      # NOTE: migration 060 itself needs the in-pod SUPERUSER (it does
      # ALTER ROLE ... NOBYPASSRLS + ALTER ... OWNER TO control_owner + FORCE
      # ROW LEVEL SECURITY) and is run by hand once during the cutover window;
      # the Job (this role) applies 061+. migrate.ts fail-fast-aborts if 060 is
      # still pending and the effective role is not superuser (cutover §4).
      # SECURITY: this is a HIGH-VALUE standing credential. Via control_owner it
      # can run DDL on the RLS tables (DISABLE RLS / DROP POLICY) — i.e. defeat
      # tenant isolation — and via `control` it can DML the non-RLS operational
      # tables. That power is inherent to a role that applies RLS-policy
      # migrations; mitigate operationally: the OpenBao password is rotated
      # post-cutover and on schedule, the Secret is read only by the migration
      # Job, and every use is the auditable Job artefact. Do NOT reuse it as a
      # runtime/app credential.
      - name: control_migrator
        ensure: present
        comment: "Runs DB migrations; member of control + control_owner; LOGIN for the migration Job"
        login: true
        superuser: false
        bypassrls: false
        inherit: true
        inRoles:
          - control
          - control_owner
        passwordSecret:
          name: control-db-migrator
      # Cross-org READ role (withExemptRead). LOGIN. SELECT-only on the 9
      # exempt tables + exempt_read policies granted by migration 061.
      # Non-owner, NOBYPASSRLS — the USING(true) exemption is read-only.
      - name: control_reader
        ensure: present
        comment: "Cross-org read role for withExemptRead; SELECT-only on the exempt tables (migration 061)"
        login: true
        superuser: false
        bypassrls: false
        inherit: true
        passwordSecret:
          name: control-db-reader
