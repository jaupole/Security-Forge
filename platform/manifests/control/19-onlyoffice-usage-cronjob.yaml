# Every-minute CronJob polling the ONLYOFFICE Document Server command service
# (`{"c":"license"}`) for edit/view connection counts — the DOCENG Phase M
# usage watch. Stores samples (30-day retention) + daily peaks (kept forever),
# raises operator alerts (notifications bell + platform-sender email) when a
# configurable threshold is crossed (default edit=18 — a single-node capacity
# watermark, NOT a license ceiling: DS >= 9.4 Community removed the connection
# limit), and a DS-unreachable alert after 3 consecutive failed polls. See
# ecosystem-control src/cli/onlyoffice-usage.ts; admin surface is the Portal
# admin "Document Server" Oversight card via /api/v1/admin/onlyoffice/*.
#
# Cadence note: 1 minute is the k8s CronJob floor and matches the spec's 60s.
# All cross-poll state (cooldowns, outage episodes, recovery countdown) lives
# in the DB (`onlyoffice_watch_state`), so per-invocation processes are fine
# and `concurrencyPolicy: Forbid` + a `FOR UPDATE` row lock serialise overlap.
# No wait-for-db initContainer (unlike the hourly crons): at this cadence a
# DB-unavailable run just fails fast and the next minute retries.
#
# JWT: the poller signs command-service calls with the fleet-shared DS secret
# (VSO -> `onlyoffice-jwt`, see 04-vso-bindings.yaml). Unset URL => no-op.
# Same image + env discipline as the API Deployment — only the CLI entrypoint
# differs. Bump the digest in lockstep with 09-backend-deployment.yaml.

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: control-onlyoffice-usage
  namespace: control
  labels:
    app.kubernetes.io/name: control
    secforge.platform/component: control
    secforge.platform/role: onlyoffice-usage-watch
spec:
  schedule: "* * * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # backoffLimit: 2 (not 0) absorbs the ambient-mesh startup race. This is a
      # fresh short-lived pod every 60s; iptables redirection is committed at pod
      # start but ztunnel occasionally hasn't finished enrolling the workload when
      # the poller opens its first connections, so a minority of runs get their
      # outbound sockets reset (`UND_ERR_SOCKET: other side closed` to the DS
      # command service AND `ECONNRESET` to control-db, both at ~1-2s pod age).
      # With backoffLimit: 0 each such reset marked the whole Job Failed -> a
      # steady drip of KubeJobFailed alerts for a purely transient, self-healing
      # condition. Two retries let the Job re-run once ztunnel is warm (~10s
      # later) and complete cleanly. Safe under concurrencyPolicy: Forbid +
      # startingDeadlineSeconds: 50 (3 attempts of a ~1-2s poll finish well
      # inside the minute) and the DB-side FOR UPDATE row lock keeps retries
      # idempotent. Deeper follow-up: app-level connect retry in
      # ecosystem-control src/cli/onlyoffice-usage.ts.
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: control
            secforge.platform/component: control
            secforge.platform/role: onlyoffice-usage-watch
        spec:
          restartPolicy: Never
          serviceAccountName: control
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: poll
              # Digest-pinned. Same image as the backend Deployment.
              # Bump in lockstep with 09-backend-deployment.yaml.
              image: ghcr.io/jaupole/control@sha256:5317275453665a12c710e3f8e976f2b32e56812768923ac407b6629fe36bb296
              imagePullPolicy: IfNotPresent
              command: ["/nodejs/bin/node", "dist/cli/index.js", "onlyoffice:poll-usage"]
              env:
                - { name: NODE_ENV,                         value: production }
                - { name: API_PORT,                         value: "4000" }
                - { name: API_HOST,                         value: "0.0.0.0" }
                - { name: TRUST_PROXY,                      value: "1" }
                - { name: PORTAL_ORIGIN,                    value: "https://control.${DOMAIN}" }
                - { name: NODE_EXTRA_CA_CERTS,              value: /etc/secforge/openbao-ca.crt }
                - { name: KEYCLOAK_URL,                     value: "https://auth.${DOMAIN}" }
                - { name: KEYCLOAK_REALM,                   value: platform }
                - { name: KEYCLOAK_ADMIN_CLIENT_ID,         value: control-admin }
                - { name: SPICEDB_ENDPOINT,                 value: "spicedb.spicedb.svc.cluster.local:50051" }
                # ONLYOFFICE Document Server (in-cluster). The fleet-shared JWT
                # arrives via envFrom (onlyoffice-jwt renders the key as
                # ONLYOFFICE_JWT_SECRET) — never as a named env var, which the
                # Kyverno no-secret-shaped-env-vars policy (ADR-0013) rejects.
                - { name: ONLYOFFICE_INTERNAL_URL, value: "http://onlyoffice.onlyoffice.svc.cluster.local" }
                # Runtime `control` role (control-db-app).
                - { name: PGHOST,     valueFrom: { secretKeyRef: { name: control-db-app, key: host } } }
                - { name: PGPORT,     valueFrom: { secretKeyRef: { name: control-db-app, key: port } } }
                - { name: PGUSER,     valueFrom: { secretKeyRef: { name: control-db-app, key: username } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: control-db-app, key: password } } }
                - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: control-db-app, key: dbname } } }
              envFrom:
                - secretRef:
                    name: control-app-secrets
                # Fleet-shared DS JWT: key ONLYOFFICE_JWT_SECRET (VSO-rendered,
                # 04-vso-bindings.yaml) becomes the env var of the same name.
                - secretRef:
                    name: onlyoffice-jwt
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: openbao-ca
                  mountPath: /etc/secforge
                  readOnly: true
          volumes:
            - name: openbao-ca
              configMap:
                name: openbao-internal-ca-cert
                items:
                  - { key: ca.crt, path: openbao-ca.crt }
