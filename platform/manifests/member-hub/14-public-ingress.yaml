# Public ingress for member-hub — members.${DOMAIN}.
#
# WHY A SEPARATE PUBLIC HOST: member-hub.${DOMAIN} (11-ingress.yaml) is
# deliberately tailnet-only — the admin/UI surface stays private. But
# some Member Hub routes are inherently public:
#   - Stripe webhooks: api.stripe.com POSTs payment events to
#     /api/webhooks/stripe/<orgId>.
#   - Future: per-org public websites (Public Websites epic),
#     public Contact-Us submissions, etc.
#
# Those land on a separate public host: members.${DOMAIN}, with a public
# DNS A/AAAA record → the node IP.
#
# SCOPE: deliberately path-restricted to /api/webhooks for now. Add
# additional Prefix paths here as the Public Websites epic / new
# public routes need exposing; anything not matched falls through to
# nginx-ingress's default backend (404), keeping the rest of Member
# Hub tailnet-private.
#
# Webhook safety: handlers verify each provider's signature (Stripe's
# whsec_… signing secret against the body) — they don't rely on
# transport-level auth, so a public-by-design endpoint is correct.
#
# TLS: per-host Let's Encrypt via DNS01 (Cloudflare), same cluster
# issuer as the rest of the platform.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: member-hub-public
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    secforge.platform/component: member-hub
  annotations:
    cert-manager.io/cluster-issuer: ${LE_ISSUER}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # No rewrite — the public path is the same as the internal route on
    # Member Hub, so nginx passes it through unchanged. (Unlike the
    # qbo-callback ingress, which rewrites /callback → an internal path.)
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    # Stripe retries failed webhooks with exponential backoff, so a
    # tight rate limit is safe.
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - members.${DOMAIN}
      secretName: members-tls
  rules:
    - host: members.${DOMAIN}
      http:
        paths:
          # Stripe (and future) webhooks. Path lives at this prefix in
          # the Member Hub app, so no rewrite needed.
          - path: /api/webhooks
            pathType: Prefix
            backend:
              service:
                name: member-hub
                port:
                  number: 80
