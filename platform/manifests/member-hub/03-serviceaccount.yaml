# Service accounts for the member-hub namespace.
#
# Two roles, distinct SPIFFE identities:
#   1. `member-hub` — the API backend pod + portal SPA pod + migration Job.
#      Bound to SPIFFE-ID spiffe://${SPIFFE_TRUST_DOMAIN}/ns/member-hub/sa/member-hub
#      via SPIRE's ClusterSPIFFEID (kept in components/05-spire.sh).
#   2. `member-hub-vso` — the VSO consumer SA. Used only by VaultStaticSecret /
#      VaultAuth CRs in 05-vso-bindings.yaml to fetch app secrets from
#      OpenBao and render them as K8s Secrets.
#
# Neither SA auto-mounts its token by default; the workloads that need a
# projected service-account token explicitly request one via
# `serviceAccountToken` volume mount + the SPIFFE CSI driver.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-hub
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    secforge.platform/component: member-hub
    secforge.platform/role: app-identity
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-hub-vso
  namespace: member-hub
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true
