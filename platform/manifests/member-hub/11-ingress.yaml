# Single public ingress for Member Hub — members.${DOMAIN}.
#
# Consolidated 2026-05-23: previously split into a tailnet-only admin
# host (member-hub.${DOMAIN}, this file's original purpose) and a
# public webhook host (members.${DOMAIN}, old 14-public-ingress.yaml).
# Per operator decision, the split is gone — Member Hub lives on
# ONE public host that serves admin UI + webhooks + everything else.
#
# Security posture:
#   - Admin UI is fronted by Keycloak OIDC (AuthCode+PKCE), passkeys
#     mandatory on the platform realm. Brute-force risk is bounded
#     by passkey auth + Kyverno-enforced password policy at the IdP.
#   - Webhook handlers verify each provider's signature (Stripe's
#     whsec_… HMAC against the body) — they don't rely on transport
#     auth, so the public exposure is correct by design.
#   - Cluster-wide `secforge-default-headers` ConfigMap injects nosniff
#     + Referrer-Policy on every response. Per-app CSP/CORS/etc. are
#     served by the Hono `secureHeaders()` middleware inside the app.
#
# TLS: per-host LE via DNS01 (Cloudflare).

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: member-hub
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    secforge.platform/component: member-hub
  annotations:
    cert-manager.io/cluster-issuer: ${LE_ISSUER}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    # Rate limits — relaxed for SPA traffic. The previous tight values
    # (rps:10, burst:3, connections:20) tripped on dashboard/members
    # page loads because the SPA fires 20+ parallel chunk fetches over
    # HTTP/2 multiplexing → nginx 503'd asset requests past the limit.
    # Stripe webhooks tolerate this easily; the limit was sized for the
    # tight webhook-only era of this ingress and is now too tight.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "200"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - members.${DOMAIN}
      secretName: members-tls
  rules:
    - host: members.${DOMAIN}
      http:
        paths:
          # All paths → Hono app (single backend; SPA bundle is served
          # via Hono's serveStatic from the same image).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: member-hub
                port:
                  number: 80
