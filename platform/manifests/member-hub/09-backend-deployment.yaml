# Member Hub app (Hono + TS, distroless nodejs22).
#
# SCAFFOLD STATUS: This manifest was derived from platform/manifests/control/
# on 2026-05-16 as part of Phase 2 deploy scaffolding. The image reference
# `ghcr.io/jaupole/member-hub:${MEMBER_HUB_TAG}` is a placeholder —
# the Member Hub repo doesn't have source/Dockerfile/GHA pipeline yet.
# When the Member Hub source materializes, verify: (1) Hono listening port
# (default 3000, not 4000), (2) /healthz + /readyz endpoint paths,
# (3) env var names matching src/lib/secrets/index.ts loader, (4) any
# additional volume mounts.
#
# Image built from the Member Hub repo's Dockerfile and tagged
# `ghcr.io/jaupole/member-hub:${MEMBER_HUB_TAG}`. Cosign-keyless signed
# via GHA OIDC (Kyverno verify-secforge rule enforces).
#
# Listens on :3000 (Hono default). Reverse-proxied by ingress-nginx via
# the member-hub Service (10-services.yaml). Single deployment — Hono
# serves both /api/* (JSON handlers) and the React+Vite SPA built to
# client/dist, with SPA-fallback to index.html. No separate portal/SPA
# Deployment.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-hub
  namespace: member-hub
  annotations:
    # The main container is fully probed; only the spiffe-helper sidecar
    # (a token-refresher daemon) lacks probes — it exposes no HTTP health
    # surface, and pod liveness is governed by the main container.
    checkov.io/skip1: "CKV_K8S_8=spiffe-helper sidecar has no HTTP liveness endpoint; the app container is probed"
    checkov.io/skip2: "CKV_K8S_9=spiffe-helper sidecar has no HTTP readiness endpoint; the app container is probed"
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/component: app
    secforge.platform/component: member-hub
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: member-hub
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: member-hub
        app.kubernetes.io/component: app
        secforge.platform/component: member-hub
        spiffe.io/spire-managed-identity: "true"
        # Required by MinIO chart's NetworkPolicy + the cross-ns
        # extension (minio/03-allow-cross-ns-clients.yaml) — both
        # gate ingress on a `minio-client=true` source label. Used
        # by the member-documents API to upload member file
        # attachments to the member-hub-documents bucket.
        minio-client: "true"
    spec:
      serviceAccountName: member-hub
      automountServiceAccountToken: false
      # GHCR pull credential — VSO-rendered dockerconfigjson Secret
      # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/jaupole/member-hub@sha256:a8fb1899f72099a79f55a0403e644a2e741d54dbb9ded022b5d1f795189cfde2
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 3000, name: http, protocol: TCP }
          env:
            # Static config
            - { name: NODE_ENV, value: production }
            - { name: API_PORT, value: "3000" }
            - { name: API_HOST, value: "0.0.0.0" }
            - { name: TRUST_PROXY, value: "1" }
            # Note: PORTAL_ORIGIN was set here historically pointing at
            # the old tailnet host (member-hub.${DOMAIN}); removed during
            # 2026-05-23 single-host consolidation. No app code reads it;
            # public origin is derived from request headers at runtime
            # (see src/lib/public-url.ts publicOrigin + src/modules/auth/
            # routes.ts callbackUri).
            # In-cluster DNS rewrites auth.${DOMAIN} → keycloak ClusterIP,
            # which presents its INTERNAL cert (signed by secforge-internal-ca,
            # not Let's Encrypt). Point NODE_EXTRA_CA_CERTS at the
            # internal CA so jose's createRemoteJWKSet (and any other
            # global-fetch caller) can verify the chain. Node's built-in
            # Mozilla CA bundle is still loaded — NODE_EXTRA_CA_CERTS is
            # additive, not a replacement.
            - { name: NODE_EXTRA_CA_CERTS, value: "/etc/secforge/openbao-ca.crt" }
            # Keycloak — config.ts wants KEYCLOAK_URL (the base; it builds
            # /realms/<realm> internally), KEYCLOAK_REALM, and a SEPARATE
            # admin-API client (NOT the OIDC user-login client).
            #
            # KEYCLOAK_TENANTS_REALM (Shape B) — when set, the token
            # verifier accepts tokens from BOTH realms. The sign-in
            # flow still targets KEYCLOAK_REALM only. The same
            # clientIds are registered in both realms (the realm is
            # the issuer-layer discriminator). See
            # docs/01-architecture/01a-realm-to-app-matrix.md.
            - { name: KEYCLOAK_URL, value: "https://auth.${DOMAIN}" }
            - { name: KEYCLOAK_REALM, value: platform }
            - { name: KEYCLOAK_TENANTS_REALM, value: secforge-tenants }
            # User-login OIDC client (AuthCode + PKCE). Confidential, with
            # an oidc-audience-mapper adding `member-hub` to access-token
            # `aud`. OIDC_CLIENT_SECRET comes from VSO-rendered
            # member-hub-app-secrets via envFrom below.
            - { name: OIDC_CLIENT_ID, value: member-hub }
            # Admin-API client (created 2026-05-15). Service-account-only,
            # confidential, with realm-management roles: manage-users,
            # view-users, query-users, view-clients, view-realm.
            # KEYCLOAK_ADMIN_CLIENT_SECRET comes from VSO-rendered
            # member-hub-app-secrets via envFrom below.
            - { name: KEYCLOAK_ADMIN_CLIENT_ID, value: member-hub-admin }
            # Ecosystem Control — in-cluster Service in the `control` ns.
            # lib/ecosystem-control.ts calls getMe() to fetch the active-org
            # context after OIDC sign-in. HTTP (TLS is at ingress edge).
            - { name: ECOSYSTEM_CONTROL_API_URL, value: "http://control.control.svc.cluster.local" }
            # SpiceDB — in-cluster Service.
            - { name: SPICEDB_ENDPOINT, value: "spicedb.spicedb.svc.cluster.local:50051" }
            # CNPG-rendered DB credentials. The member-hub-db-app Secret has
            # discrete fields per CNPG convention; config.ts wants them
            # as discrete env vars rather than a single URL.
            - { name: PGHOST, valueFrom: { secretKeyRef: { name: member-hub-db-app, key: host } } }
            - { name: PGPORT, valueFrom: { secretKeyRef: { name: member-hub-db-app, key: port } } }
            - { name: PGUSER, valueFrom: { secretKeyRef: { name: member-hub-db-app, key: username } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: member-hub-db-app, key: password } } }
            - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: member-hub-db-app, key: dbname } } }
            # Member Hub's env validator requires DATABASE_URL specifically
            # (Control composes its own from PG* vars; member-hub doesn't).
            # CNPG renders the full postgresql:// URI in the `uri` field of
            # member-hub-db-app. The URI's password segment will rotate with
            # CNPG password rotation, picked up on next pod restart.
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: member-hub-db-app, key: uri } } }
            # OTLP exporter (Wazuh / Tempo collection point).
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://opentelemetry-collector.observability.svc.cluster.local:4318" }
            - { name: OTEL_SERVICE_NAME, value: member-hub }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=member-hub,deployment.environment=prod" }
            # PII encryption (rule 38). Transit client uses SPIFFE
            # JWT-SVID written by the spiffe-helper sidecar to a shared
            # tmpfs volume, exchanges it for an OpenBao token via
            # auth/jwt/login (role: member-hub), then encrypts/decrypts via
            # transit/pii-encryption.
            - { name: OPENBAO_ADDR, value: "https://openbao.openbao.svc.cluster.local:8200" }
            - { name: OPENBAO_CA_CERT_PATH, value: "/etc/secforge/openbao-ca.crt" }
            - { name: OPENBAO_JWT_AUTH_ROLE, value: member-hub }
            # TRANSIT_KEYNAME (no underscore before NAME) is deliberate: the
            # no-secret-shaped-env Kyverno policy flags a bare `_KEY_` token,
            # and this holds a Transit key *name*, not key material.
            - { name: TRANSIT_KEYNAME, value: pii-encryption }
            - { name: SPIFFE_JWT_SVID_PATH, value: "/run/spiffe/jwt-svid.token" }
            # ─── Object storage (member document attachments) ─────────
            # MinIO is in-cluster; HTTP (no TLS) — the mesh + namespace
            # NetworkPolicy keep traffic on the cluster network. SSE-S3
            # encryption-at-rest is set on the bucket itself, so the
            # app uploads plaintext and MinIO encrypts.
            # MINIO_ACCESS_KEY + MINIO_SECRET_KEY come from the
            # member-hub-documents-minio Secret via envFrom below.
            - { name: MINIO_ENDPOINT, value: "minio.minio.svc.cluster.local" }
            - { name: MINIO_PORT,     value: "9000" }
            - { name: MINIO_USE_SSL,  value: "false" }
            - { name: MINIO_BUCKET,   value: member-hub-documents }
          envFrom:
            # Adds OIDC_CLIENT_SECRET, KEYCLOAK_ADMIN_CLIENT_SECRET,
            # SPICEDB_PRESHARED_KEY, SESSION_KEY, EMAIL_HMAC_KEY from
            # the VSO-rendered Secret. All five come from
            # secret/apps/member-hub/runtime in OpenBao via the
            # VaultStaticSecret in 04-vso-bindings.yaml.
            - secretRef:
                name: member-hub-app-secrets
            # Adds MINIO_ACCESS_KEY + MINIO_SECRET_KEY rendered from
            # secret/minio/member-hub-documents (bucket-scoped svc
            # account; rw on member-hub-documents only).
            - secretRef:
                name: member-hub-documents-minio
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            # Distroless nodejs22 needs /tmp writable for sourcemaps + V8
            # cache; everything else stays read-only.
            - { name: tmp, mountPath: /tmp }
            # OpenBao internal CA cert (signed by secforge-internal-ca).
            # Used by Transit client for HTTPS verification — see CLAUDE.md
            # bright-line on no-cert-bypass.
            - { name: openbao-ca, mountPath: /etc/secforge, readOnly: true }
            # JWT-SVID written by the spiffe-helper sidecar; Transit
            # client reads from /run/spiffe/jwt-svid.token.
            - { name: spiffe-jwt, mountPath: /run/spiffe, readOnly: true }
        # spiffe-helper sidecar — fetches a JWT-SVID via the SPIFFE
        # workload API every TTL/2 seconds and writes it to the shared
        # spiffe-jwt volume. Audience: openbao (matches the OpenBao
        # JWT auth role's bound_audiences). Sidecar runs in daemon
        # mode; on cert/SVID expiry it re-fetches and overwrites the file.
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0@sha256:1c92e5998ad3621e3323f25aabe40f5a88ba730ee0edb248aa8c943ca504e8a2
          imagePullPolicy: IfNotPresent
          args:
            - "-config"
            - "/etc/spiffe-helper/helper.conf"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /etc/spiffe-helper, readOnly: true }
            - { name: spiffe-jwt, mountPath: /run/spiffe }
            - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: openbao-ca
          configMap:
            name: openbao-internal-ca-cert
            items:
              - key: ca.crt
                path: openbao-ca.crt
        - name: spiffe-jwt
          emptyDir:
            sizeLimit: 1Mi
            medium: Memory
        - name: spiffe-helper-config
          configMap:
            name: member-hub-spiffe-helper-config
            items:
              - key: helper.conf
                path: helper.conf
        # SPIFFE workload API — provided by the SPIRE CSI driver
        # (spire-spiffe-csi-driver DaemonSet). Mounts the spire-agent
        # unix socket so the spiffe-helper can request JWT-SVIDs.
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
      # Spread across nodes is moot on a single-node cluster, but the
      # podAntiAffinity reads correctly once we add a second node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: member-hub
              app.kubernetes.io/component: app
