# One-shot Job that applies migrations 001-021 to member-hub-db.
#
# Run BEFORE the API Deployment so the schema (incl. RLS at 019, audit-log
# hash chain at 020, idempotency keys at 021) is in place when the first
# server.js starts answering requests.
#
# Re-runs are safe — migrate.ts is idempotent (records applied versions in
# a schema_migrations table; re-applying a migration is a no-op).
#
# CNPG auto-renders the `member-hub-db-app` Secret with:
#   - username, password, dbname, host, port, jdbc-uri, uri, pgpass
# We feed DATABASE_URL from the `uri` key directly (pg connection string).

---
apiVersion: batch/v1
kind: Job
metadata:
  name: member-hub-db-migrate
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    secforge.platform/component: member-hub
    secforge.platform/role: db-migration
spec:
  # Don't auto-retry on app errors — a migration failure needs operator
  # eyes, not blind re-runs.
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400     # GC after 24h so the Job artefact persists for inspection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: member-hub
        secforge.platform/component: member-hub
        secforge.platform/role: db-migration
    spec:
      restartPolicy: Never
      serviceAccountName: member-hub
      automountServiceAccountToken: false
      # GHCR pull credential — VSO-rendered dockerconfigjson Secret
      # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Wait for member-hub-db to be Ready before starting the migration
      # container. The CNPG operator marks Ready once the primary is
      # accepting connections.
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h member-hub-db-rw.member-hub.svc.cluster.local -p 5432 -U member_hub -d member_hub -t 3; do
                echo "waiting for member-hub-db..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
      containers:
        - name: migrate
          # Lockstep with the Deployment (09). 2026-06-09: bump to a61dc63
          # (ADR-0038 Phase 3b email-from-blocks). Applies migration 099
          # (blocks JSONB column on email_templates).
          # 2026-06-12: commit d583bde — shared PeriodChip (ecosystem-ui 0.1.9) +
          # period-aware /dashboard windowing (+ pre-existing test fix). No new
          # migration. Restores 08/09 lockstep (08 had lagged at 9e38316).
          image: ghcr.io/jaupole/member-hub@sha256:cb7119d6911a559f436896494052f2475baa8052579bc0f271e3e0d0104bf666
          imagePullPolicy: IfNotPresent
          command: ["/nodejs/bin/node", "dist/db/migrate.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: member-hub-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
