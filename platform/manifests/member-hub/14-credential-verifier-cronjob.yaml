# Member Hub — periodic credential-chain verifier CronJob.
# app-optimization MH-04.
#
# Runs every 15 min. Walks the credentials hash chain:
#   - checks prev_hash linkage for ALL credential rows, and
#   - fully recomputes the payload hash for rows AFTER the cutover recorded
#     in credential_chain_config (migration 127). Pre-cutover rows (if any)
#     get linkage-only verification, since their hashed issued_at predates
#     the fix. On prod the cutover is NULL — every credential is fully
#     verifiable.
#   - On a break it logs the offending credential id + expected/actual
#     hashes (non-zero exit) so the run shows red; it does not mutate the
#     ledger (the immutability trigger + FORCE-RLS already protect writes).
#
# Reuses the dedicated `audit_verifier` Postgres role (migration 040 +
# grants in migration 127: SELECT on credentials + credential_chain_config,
# plus a role-scoped RLS read policy so FORCE-RLS org-isolation doesn't hide
# rows from it). No INSERT/UPDATE/DELETE — a compromised verifier can read
# the chain, nothing more. SA + VSO secret are shared with the audit
# verifier (13-audit-verifier-cronjob.yaml owns both).

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: credential-verifier
  namespace: member-hub
  annotations:
    # seccompProfile RuntimeDefault is set at pod + container level;
    # checkov CKV_K8S_31 does not detect it inside a CronJob jobTemplate.
    checkov.io/skip1: "CKV_K8S_31=seccompProfile RuntimeDefault is set at pod + container level; checkov does not detect it inside a CronJob jobTemplate"
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/component: credential-verifier
    secforge.platform/component: audit-anchors
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      # 1 retry — Cilium/CNI cold-start delay can cause the FIRST connect
      # from a fresh pod to ECONNREFUSED before endpoint maps are
      # programmed. backoffLimit:1 plus the wait-for-db init container
      # below makes this self-healing. (Mirrors the audit verifier.)
      backoffLimit: 1
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: member-hub
            app.kubernetes.io/component: credential-verifier
        spec:
          # Shared with the audit verifier (13-audit-verifier-cronjob.yaml
          # defines the SA + the audit-verifier-db VSO secret).
          serviceAccountName: member-hub-audit-verifier
          # Reads the DB only (creds via the VSO-rendered Secret) — calls
          # neither the Kubernetes API nor OpenBao, so the default SA token
          # is not mounted (checkov CKV_K8S_38).
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull-secret
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: wait-for-db
              image: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  until pg_isready -h ecosystem-db-rw.ecosystem-db.svc.cluster.local -p 5432 -U audit_verifier -d member_hub -t 3; do
                    echo "waiting for member-hub-db-rw..."
                    sleep 2
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 128Mi }
          containers:
            - name: verify
              # The verifier ships in the member-hub backend image —
              # workers/credential-verifier/verify.ts as a tsx entrypoint.
              # This digest is kept current by deploy-app (it bumps every
              # manifest pinning ghcr.io/jaupole/member-hub@).
              image: ghcr.io/jaupole/member-hub@sha256:ad35c5413ca18296ec6e3f1c740fdc547e22f9cd3829934b90606099a6fc2ae5
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
              command:
                # distroless nodejs22 has no PATH-resolved `node`; the binary
                # lives at /nodejs/bin/node (matches the backend's migrate Job).
                - /nodejs/bin/node
                - --import
                - tsx
                - /app/workers/credential-verifier/verify.ts
              env:
                - name: PGHOST
                  value: ecosystem-db-rw.ecosystem-db.svc.cluster.local
                - name: PGDATABASE
                  value: member_hub
                - name: PGUSER
                  value: audit_verifier
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: audit-verifier-db
                      key: password
                - name: VERIFY_BATCH
                  value: "5000"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
