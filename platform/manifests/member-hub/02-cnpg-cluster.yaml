# Postgres cluster for the member-hub-plane API.
#
# Migrations 001-021 (incl. RLS at 019, audit-log hash chain at 020,
# idempotency keys at 021) run from the `member-hub` repo via the
# migration Job in 07-migration-job.yaml. CNPG operator manages the
# rest of the lifecycle: failover, WAL archiving, base backups via
# barman-cloud plugin → MinIO.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: member-hub-db
  namespace: member-hub
  labels:
    secforge.platform/component: member-hub
    secforge.platform/edition: prod
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
  primaryUpdateStrategy: unsupervised

  enableSuperuserAccess: false

  storage:
    size: 10Gi
    storageClass: ${STORAGE_CLASS}

  bootstrap:
    initdb:
      database: member_hub
      owner: member_hub
      encoding: UTF8
      localeCollate: C
      localeCType: C
      # SECURITY DEFINER functions (pg_event_checkin_meta,
      # pg_checkin_public, pg_rsvp_event_public, pg_submit_enrollment,
      # pg_*_invitation, etc.) are owned by member_hub and must read
      # RLS-protected tables WITHOUT an active-org context. They rely
      # on the function owner having BYPASSRLS. The runtime app role
      # (`member_hub_app`, used after `SET LOCAL ROLE` in every withTx
      # transaction) does NOT have BYPASSRLS, so day-to-day handlers
      # still get RLS-scoped reads. Discovered 2026-05-28 when the
      # first QR check-in scan in prod returned no rows from the meta
      # function despite the row existing in events.
      postInitSQL:
        - ALTER ROLE member_hub BYPASSRLS

  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
      # RLS uses session-local GUCs (app.user_id, app.org_id). These
      # are set via `SET LOCAL` in src/api/db-tx.ts and propagated by
      # the txnContext() helper. No special postgresql.conf entries
      # needed — `SET LOCAL` works on standard configs.

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1Gi }

  monitoring:
    enablePodMonitor: false

  # WAL archiving + base backups to MinIO via barman-cloud plugin.
  # ObjectStore CR lives in 06-objectstore.yaml; ScheduledBackup CR
  # in 07-cnpg-scheduled-backup.yaml. Plugin install + operator
  # wiring is in component 09h-cnpg-barman-plugin.sh.
  #
  # `parameters.barmanObjectName` is REQUIRED — it links the cluster to
  # the ObjectStore CR by name. Without it, the operator can't load the
  # plugin connection and the instance-manager loops on
  # "Unknown plugin: barman-cloud.cloudnative-pg.io". Discovered the
  # hard way during the 2026-05-14 member-hub rollout.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-backup
