# member-hub namespace — single Hono Deployment plus a CNPG cluster
# (member-hub-db). The Hono process serves both the JSON API (/api/*)
# and the React+Vite SPA built to client/dist — no separate SPA
# Deployment. Tailnet-only access for now: no public DNS record;
# operator's hosts file → tailnet IP per the deferred-DNS-exposure
# decision. PSS restricted across all three modes — no exemption.
apiVersion: v1
kind: Namespace
metadata:
  name: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/part-of: secforge-platform
    secforge.platform/component: member-hub
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
