# Control namespace — houses the member-hub-plane API backend + portal SPA
# Deployments behind a single Ingress (path-routing: / → portal, /api/* →
# member-hub). One CNPG cluster per ADR-0029. Tailnet-only access for now
# (no public DNS record; operator's hosts file → tailnet IP).
apiVersion: v1
kind: Namespace
metadata:
  name: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/part-of: secforge-platform
    secforge.platform/component: member-hub
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
