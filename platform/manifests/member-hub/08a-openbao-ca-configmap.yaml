# Internal-CA trust bundle consumed by the Member Hub backend
# (09-backend-deployment.yaml mounts this at /etc/secforge/openbao-ca.crt).
#
# Member Hub makes outbound in-cluster TLS calls to:
#   - Keycloak  (auth.${DOMAIN} → keycloak ClusterIP)  → "SecForge Internal CA"
#   - OpenBao   (openbao.openbao.svc:8200, Transit)    → "SecForge OpenBao Internal CA"
#
# Both Deployment env vars point at the single rendered file:
#   NODE_EXTRA_CA_CERTS   — jose's createRemoteJWKSet / global fetch (Keycloak)
#   OPENBAO_CA_CERT_PATH  — the Transit client's https.Agent (OpenBao)
# so this ConfigMap must carry BOTH CA certs.
#
# Source of truth: control/08a-openbao-ca-configmap.yaml — the CAs are
# cluster-wide so the cert blob is identical, only the namespace differs.
# On CA rotation, refresh both manifests together.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-internal-ca-cert
  namespace: member-hub
  labels:
    secforge.platform/component: member-hub
data:
