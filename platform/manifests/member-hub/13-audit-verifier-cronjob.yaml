# Member Hub — periodic audit-verifier CronJob.
# operator-backlog #33 Part 3.
#
# Runs every 5 min. On chain break:
#   - UPDATE audit.tamper_flag SET tamper_detected = true, first_bad_id = ...
#   - lib/audit.ts in the api pods reads that flag on every record() and
#     refuses to write new audit rows while it's set.
#   - Operator investigates + clears via
#       pnpm tsx src/scripts/clear-audit-tamper-flag.ts --confirm
#     (records the clearing action as its own audit.event).
#
# DB connection uses the dedicated `audit_verifier` Postgres role
# (migration 040). Has SELECT on audit.event + SELECT/UPDATE on
# audit.tamper_flag, nothing else. Compromised verifier cannot mutate
# the chain — only flag tampering.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-hub-audit-verifier
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/component: audit-verifier
    secforge.platform/component: audit-anchors

---
# VSO binding for the audit_verifier Postgres role password. The CNPG
# Cluster CR (or a one-off bootstrap SQL) creates the role and writes
# the password to OpenBao at this path; VSO renders it into a K8s Secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: audit-verifier-db
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/component: audit-verifier
spec:
  type: kv-v2
  mount: secret
  path: apps/member-hub/audit-verifier-db
  refreshAfter: 1h
  vaultAuthRef: member-hub-vso
  destination:
    create: true
    name: audit-verifier-db
    type: Opaque

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-verifier
  namespace: member-hub
  annotations:
    # seccompProfile RuntimeDefault is set at pod + container level;
    # checkov CKV_K8S_31 does not detect it inside a CronJob jobTemplate.
    checkov.io/skip1: "CKV_K8S_31=seccompProfile RuntimeDefault is set at pod + container level; checkov does not detect it inside a CronJob jobTemplate"
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/component: audit-verifier
    secforge.platform/component: audit-anchors
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      # 1 retry — Cilium/CNI cold-start delay can cause the FIRST
      # connect from a fresh pod to ECONNREFUSED before endpoint maps
      # are programmed. backoffLimit:1 plus the wait-for-db init
      # container below makes this self-healing.
      backoffLimit: 1
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: member-hub
            app.kubernetes.io/component: audit-verifier
        spec:
          serviceAccountName: member-hub-audit-verifier
          # The verifier only reads the audit DB (creds via a VSO-rendered
          # Secret) — it calls neither the Kubernetes API nor OpenBao, so the
          # default SA token is not mounted (checkov CKV_K8S_38).
          automountServiceAccountToken: false
          # GHCR pull credential — VSO-rendered dockerconfigjson Secret
          # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
          imagePullSecrets:
            - name: ghcr-pull-secret
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # Mirrors 08-migration-job.yaml's wait-for-db pattern: hold
          # the main container until the rw Service actually answers,
          # so transient Cilium endpoint propagation hiccups during pod
          # spawn don't fail the job. Uses the cnpg postgres image (same
          # one the db pod runs) — has pg_isready, already cached on node.
          initContainers:
            - name: wait-for-db
              image: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  until pg_isready -h ecosystem-db-rw.ecosystem-db.svc.cluster.local -p 5432 -U audit_verifier -d member_hub -t 3; do
                    echo "waiting for member-hub-db-rw..."
                    sleep 2
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 128Mi }
          containers:
            - name: verify
              # The verifier is part of the member-hub backend image —
              # ships workers/audit-verifier/verify.ts as a tsx entrypoint.
              # Same image, smaller resource shape.
              image: ghcr.io/jaupole/member-hub@sha256:ad35c5413ca18296ec6e3f1c740fdc547e22f9cd3829934b90606099a6fc2ae5
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
              command:
                # distroless nodejs22 has no PATH-resolved `node`; the binary
                # lives at /nodejs/bin/node (matches the backend's migrate Job).
                - /nodejs/bin/node
                - --import
                - tsx
                - /app/workers/audit-verifier/verify.ts
              env:
                - name: PGHOST
                  value: ecosystem-db-rw.ecosystem-db.svc.cluster.local
                - name: PGDATABASE
                  value: member_hub
                - name: PGUSER
                  value: audit_verifier
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: audit-verifier-db
                      key: password
                - name: VERIFY_BATCH
                  value: "5000"
                # MH-06: arm enforcement — on a real per-org chain mismatch the
                # verifier sets audit.tamper_flag, which lib/audit.ts record()
                # reads to refuse further audit writes until an operator clears
                # it. Armed 2026-07-12 after a dry-run window confirmed
                # `status: ok` (570/570) on prod. Set to "false" to revert to
                # log-only dry-run.
                - name: AUDIT_VERIFY_ENFORCE
                  value: "true"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
