# VSO bindings for the member-hub namespace.
#
# Three rendered K8s Secrets:
#   - member-hub-app-secrets       → app-level keys (session-signing,
#                                 SpiceDB PSK, Keycloak client_secret)
#   - member-hub-db-superuser-app  → CNPG application user credentials
#                                 (CNPG operator creates this automatically;
#                                 listed here for the network-policy reference)
#   - cnpg-minio-credentials    → barman-cloud → MinIO bucket credentials
#
# The OpenBao policy that grants reads on these paths lives at
# `platform/manifests/openbao/policies/member-hub.hcl`. The K8s auth role
# binding (k8s SA `member-hub-vso` → policy `member-hub`) is created by the
# openbao bootstrap; ongoing role changes go via kcadm-style direct API.

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: member-hub-vso
  namespace: member-hub
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: member-hub-vso
    serviceAccount: member-hub-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
# Aggregates app-level secrets (Keycloak client, SpiceDB, session key)
# into a single K8s Secret consumed via envFrom in the backend Deployment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: member-hub-app-secrets
  namespace: member-hub
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: member-hub-vso
  mount: secret
  type: kv-v2
  path: apps/member-hub/runtime
  refreshAfter: 1h
  destination:
    name: member-hub-app-secrets
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        # Keycloak OIDC client_secret (user-login `member-hub` client).
        # App reads as OIDC_CLIENT_SECRET.
        OIDC_CLIENT_SECRET:
          text: '{{ .Secrets.oidc_client_secret }}'
        # Same `member-hub` user-login client, but in the TENANTS realm —
        # a separate confidential client with its own secret. Drives the
        # members→tenants-realm sign-in flow. App reads as
        # OIDC_CLIENT_SECRET_TENANTS. Optional in OpenBao: when the
        # `oidc_client_secret_tenants` key is absent the template renders
        # empty and the app keeps platform-only sign-in.
        OIDC_CLIENT_SECRET_TENANTS:
          text: '{{ if .Secrets.oidc_client_secret_tenants }}{{ .Secrets.oidc_client_secret_tenants }}{{ end }}'
        # Keycloak admin-API client_secret (`member-hub-admin` service-account
        # client — separate from the user-login OIDC client). Used by
        # @keycloak/keycloak-admin-client for member-create / role-mgmt
        # / etc. Realm-management roles assigned to this client's
        # service account: manage-users, view-users, query-users,
        # view-clients, view-realm.
        KEYCLOAK_ADMIN_CLIENT_SECRET:
          text: '{{ .Secrets.admin_client_secret }}'
        # SpiceDB pre-shared key for gRPC auth (same value also rendered
        # into the spicedb pod from its own VSO binding — we just
        # consume it here, not own it).
        SPICEDB_PRESHARED_KEY:
          text: '{{ .Secrets.spicedb_psk }}'
        # @fastify/secure-session signing key (raw 32-byte base64). The
        # bootstrap script generates this once via `openssl rand -base64 32`
        # and stores in OpenBao; rotate via OpenBao + Pod restart.
        SESSION_KEY:
          text: '{{ .Secrets.session_signing_key }}'
        # HMAC-SHA256 key (32 bytes base64) for indexed lookup of
        # encrypted email columns (e.g. pending_invitations.invited_email_hmac).
        # See src/lib/secrets/hmac.ts for rationale on HMAC vs convergent
        # encryption (HMAC chosen so DB readers can't recover plaintext).
        # Rotation: bump the key in OpenBao + rebuild HMAC column for
        # every row that needs to remain searchable.
        EMAIL_HMAC_KEY:
          text: '{{ .Secrets.email_hmac_key }}'
        # Keycloak `member-hub-system` client_credentials grant — a
        # third Keycloak client (separate from `member-hub` user-login
        # and `member-hub-admin` admin-API). Service-account-only; the
        # backend mints a short-lived access token via
        # `lib/service-token.ts` and uses it to call Control's
        # /api/v1/system/* endpoints (stripe-config, accounting-config,
        # email-config, etc.) when there's no user session behind the
        # request (Stripe webhooks, automation rule dispatcher, etc.).
        # WITHOUT THIS the Stripe checkout-session-create endpoint
        # 500s with StripeNotConfiguredError. The secret is published
        # to OpenBao by platform/components/05l-keycloak-secret-publish.sh.
        MH_SYSTEM_CLIENT_ID:
          text: 'member-hub-system'
        MH_SYSTEM_CLIENT_SECRET:
          text: '{{ .Secrets.system_client_secret }}'
        # Stripe Connect (ADR-0034). The RESTRICTED platform key Member Hub
        # uses to transact on behalf of Connect-linked accounts (via the
        # Stripe-Account header), plus the single platform Connect webhook
        # signing secret. Both live in this `runtime` blob — the only path
        # the member-hub OpenBao policy reads — and the app consumes them as
        # STRIPE_PLATFORM_SECRET_KEY + STRIPE_CONNECT_WEBHOOK_SECRET via this
        # Secret's envFrom (so the secret-shaped names never appear in the
        # Pod spec — no Kyverno no-secret-shaped-env conflict). Conditional
        # so they render empty until the operator writes the keys; until
        # then the app degrades cleanly to "Stripe Connect not configured".
        STRIPE_PLATFORM_SECRET_KEY:
          text: '{{ if .Secrets.stripe_platform_key }}{{ .Secrets.stripe_platform_key }}{{ end }}'
        STRIPE_CONNECT_WEBHOOK_SECRET:
          text: '{{ if .Secrets.stripe_connect_webhook_secret }}{{ .Secrets.stripe_connect_webhook_secret }}{{ end }}'

---
# GHCR image-pull credential. Renders into a kubernetes.io/dockerconfigjson
# Secret consumed via `imagePullSecrets:` on 08-migration-job.yaml,
# 09-backend-deployment.yaml, and 13-audit-verifier-cronjob.yaml. Token is
# a fine-grained PAT scoped to read:packages on jaupole/member-hub.
#
# OpenBao path: secret/data/apps/member-hub/ghcr-pull
#   - username: GitHub user (jaupole)
#   - password: PAT (rotate via OpenBao + 90-day expiry on the GH token)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull-secret
  namespace: member-hub
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: member-hub-vso
  mount: secret
  type: kv-v2
  path: apps/member-hub/ghcr-pull
  refreshAfter: 5m
  destination:
    name: ghcr-pull-secret
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ".dockerconfigjson":
          text: |-
            {"auths":{"ghcr.io":{"username":"{{ .Secrets.username }}","password":"{{ .Secrets.password }}","auth":"{{ printf "%s:%s" .Secrets.username .Secrets.password | b64enc }}"}}}

---
# App-level MinIO credentials for the member-hub-documents bucket.
# Distinct from the CNPG barman creds below — those grant access to
# the shared `backups` bucket for WAL archive; this set grants rw on
# the per-app `member-hub-documents` bucket only, used by the
# member-documents API to store member file attachments.
#
# Rendered as MINIO_ACCESS_KEY + MINIO_SECRET_KEY, consumed via
# envFrom on the backend Deployment (09-backend-deployment.yaml).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: member-hub-documents-minio-vso
  namespace: member-hub
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: member-hub-vso
  mount: secret
  type: kv-v2
  path: minio/member-hub-documents
  refreshAfter: 1h
  destination:
    name: member-hub-documents-minio
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        MINIO_ACCESS_KEY:
          text: '{{ .Secrets.access_key }}'
        MINIO_SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'

---
# barman-cloud → MinIO credentials for CNPG WAL archiving + base backups.
# Same VSO consumer SA, same OpenBao path as keycloak's CNPG cluster.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cnpg-minio-credentials-vso
  namespace: member-hub
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: member-hub-vso
  mount: secret
  type: kv-v2
  path: minio/cnpg/credentials
  refreshAfter: 1h
  destination:
    name: cnpg-minio-credentials
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ACCESS_KEY_ID:
          text: '{{ .Secrets.access_key }}'
        ACCESS_SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'

---
# Shared ONLYOFFICE Document Server JWT secret, synced into this namespace for
# the staff document viewer (FLEET-MH1). SAME OpenBao path as the onlyoffice
# namespace's own sync (onlyoffice/04-vso-bindings.yaml) — one secret, N
# namespaces, VSO-managed; rotation = rotate in OpenBao, every sync follows.
# MH's VSO role (member-hub-vso) binds ONLY the `member-hub` policy, so the read
# grant lives in openbao/policies/member-hub.hcl. Rendered as
# ONLYOFFICE_JWT_SECRET, consumed via envFrom on 09-backend-deployment.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: onlyoffice-jwt
  namespace: member-hub
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: member-hub-vso
  mount: secret
  type: kv-v2
  path: apps/onlyoffice/jwt
  refreshAfter: 1h
  destination:
    name: onlyoffice-jwt
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ONLYOFFICE_JWT_SECRET:
          text: '{{ .Secrets.jwt_secret }}'
