# Member Hub — nightly audit anchor CronJob.
# operator-backlog #33 Part 2 (initial deploy) + #61 (ADR-0013 escape hatch
# removed) + #62 (rewritten from anchor.sh to TS worker in the Member Hub
# image).
#
# Each run:
#   1. Reads the last anchored row ID from secforge-audit-anchors:member-hub/
#      via the GitHub Contents API (no working directory / git clone).
#   2. Queries audit.event for MAX(id), encode(full_hash) WHERE id > last.
#   3. Signs the full_hash hex via OpenBao Transit (transit/sign/audit-signing,
#      Ed25519, key version 1+).
#   4. PUTs `member-hub/YYYY-MM-DD.json` with the anchor payload + signature
#      via the GitHub Contents API — creates a commit on `main` in one
#      request.
#
# The PAT is in OpenBao at `secret/data/apps/member-hub/audit-anchors-push-token`
# (key `token`). VSO renders it into `audit-anchors-push-token` k8s Secret;
# this CronJob mounts that Secret as a file (not env — see #61).
#
# Failure modes (any of these halts THIS run; next night's run tries again):
#   - DB unreachable → exit 2, no commit.
#   - OpenBao unreachable → exit 1, no commit.
#   - audit.event empty / no new rows → exit 0 with "no new rows" log.
#   - GitHub API auth/conflict → exit 1, no commit; next run picks up.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-hub-audit-signer
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/component: audit-signer
    secforge.platform/component: audit-anchors

---
# VSO binding: GitHub push token (operator-provisioned in OpenBao).
# Path: secret/apps/member-hub/audit-anchors-push-token
# Key:  token (fine-grained PAT with contents:write on
#       jaupole/secforge-audit-anchors only)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: audit-anchors-push-token
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/component: audit-signer
    secforge.platform/component: audit-anchors
spec:
  type: kv-v2
  mount: secret
  path: apps/member-hub/audit-anchors-push-token
  refreshAfter: 1h
  vaultAuthRef: member-hub-vso
  destination:
    create: true
    name: audit-anchors-push-token
    type: Opaque

---
# VaultAuth: lets the audit-signer SA log into OpenBao under its
# own role (member-hub-audit-signer, policy `audit-signer`) so it can
# call transit/sign/audit-signing without needing the broader
# member-hub-vso scope.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: member-hub-audit-signer
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/component: audit-signer
    secforge.platform/component: audit-anchors
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: member-hub-audit-signer
    serviceAccount: member-hub-audit-signer
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-anchor
  namespace: member-hub
  annotations:
    # Authenticates to OpenBao Transit with the pod SA token (Kubernetes
    # auth) to sign audit roots — the token is required; CKV_K8S_38 N/A.
    checkov.io/skip1: "CKV_K8S_38=authenticates to OpenBao Transit via the pod ServiceAccount token; required"
    checkov.io/skip2: "CKV_K8S_31=seccompProfile RuntimeDefault is set at pod + container level; checkov does not detect it inside a CronJob jobTemplate"
  labels:
    app.kubernetes.io/name: member-hub
    app.kubernetes.io/component: audit-signer
    secforge.platform/component: audit-anchors
spec:
  # Daily at 00:17 UTC. Staggered 17 min past the hour to avoid
  # contention with backup schedules at top-of-hour.
  schedule: "17 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          # ADR-0013 escape hatch was removed in #61 — the pod spec env
          # block carries only non-credential vars; PG password + GH token
          # are mounted as files (see volumes below).
          labels:
            app.kubernetes.io/name: member-hub
            app.kubernetes.io/component: audit-signer
            # Allow the egress NetPol to permit this pod → openbao + minio +
            # github. NetworkPolicy is in 05-network-policies.yaml.
            audit-signer: "true"
        spec:
          serviceAccountName: member-hub-audit-signer
          # GHCR pull credential — VSO-rendered dockerconfigjson Secret
          # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
          imagePullSecrets:
            - name: ghcr-pull-secret
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # Wait for DB rw service to actually answer — same pattern as
          # 13-audit-verifier-cronjob.yaml. Avoids Cilium endpoint cold-start
          # ECONNREFUSED on the very first attempt.
          initContainers:
            - name: wait-for-db
              image: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  until pg_isready -h member-hub-db-rw.member-hub.svc.cluster.local -p 5432 -U member_hub -d member_hub -t 3; do
                    echo "waiting for member-hub-db-rw..."
                    sleep 2
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 128Mi }
          containers:
            - name: anchor
              # The anchor is part of the member-hub backend image — same
              # one audit-verifier (13-...yaml) uses. Ships
              # workers/audit-anchor/anchor.ts as a tsx entrypoint.
              # Renovate / digest-bump cadence: in lockstep with the backend
              # image bumps.
              image: ghcr.io/jaupole/member-hub@sha256:4958886e1edbd776c3b7fe226c9e8bc6a431ab04441b6364a4129edeebf56c9a
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests: { cpu: 50m, memory: 96Mi }
                limits:   { cpu: 500m, memory: 320Mi }
              # distroless nodejs22 has no PATH-resolved `node`; binary
              # lives at /nodejs/bin/node. --import tsx loads TypeScript
              # source via the tsx loader at runtime; matches the
              # audit-verifier invocation in 13-audit-verifier-cronjob.yaml.
              command:
                - /nodejs/bin/node
                - --import
                - tsx
                - /app/workers/audit-anchor/anchor.ts
              env:
                # No credential-named env vars (Kyverno outbound-secrets
                # policy). PG password + GH token + SA token are read from
                # file mounts at runtime by anchor.ts.
                - name: OPENBAO_ADDR
                  value: https://openbao.openbao.svc.cluster.local:8200
                - name: PGHOST
                  value: member-hub-db-rw.member-hub.svc.cluster.local
                - name: PGDATABASE
                  value: member_hub
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: member-hub-db-app
                      key: username
                # Node trusts the OpenBao internal CA via this env (read
                # at process startup, before any TLS). The CA cert lives
                # at /etc/ssl/openbao-ca/ca.crt — same path the original
                # shell script's curl --cacert read from.
                - name: NODE_EXTRA_CA_CERTS
                  value: /etc/ssl/openbao-ca/ca.crt
                # Hard-coded slug + repo for the canonical anchors path.
                - name: APP_SLUG
                  value: member-hub
                - name: ANCHORS_REPO
                  value: jaupole/secforge-audit-anchors
                - name: ANCHORS_BRANCH
                  value: main
              volumeMounts:
                - name: openbao-ca
                  mountPath: /etc/ssl/openbao-ca
                  readOnly: true
                # File-mounted credentials (per #61). tmpfs-backed by
                # kubelet; readOnlyRootFilesystem above doesn't conflict.
                - name: db-creds
                  mountPath: /run/secrets/db
                  readOnly: true
                - name: gh-creds
                  mountPath: /run/secrets/gh
                  readOnly: true
                # readOnlyRootFilesystem=true on distroless means /tmp must
                # be a writable emptyDir. tsx writes its source-map cache
                # here.
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: openbao-ca
              configMap:
                # CM is `openbao-internal-ca-cert` per 08a-openbao-ca-configmap.yaml.
                name: openbao-internal-ca-cert
            - name: db-creds
              secret:
                secretName: member-hub-db-app
                items:
                  - key: password
                    path: password
                defaultMode: 0400
            - name: gh-creds
              secret:
                secretName: audit-anchors-push-token
                items:
                  - key: token
                    path: token
                defaultMode: 0400
            - name: tmp
              emptyDir: {}
