## Public-internet Stripe webhook ingress for Member Hub.
##
## Shares the `billing.${DOMAIN}` host with Control's platform-billing
## webhook (control/14-billing-webhook-ingress.yaml). ingress-nginx
## merges Ingress resources for the same host across namespaces as
## long as their paths don't conflict — Control owns
## `/api/v1/webhooks/stripe-platform`, this Ingress owns
## `/member-hub/<orgId>`, so they coexist cleanly.
##
## URL shape (single host across all apps):
##   https://billing.${DOMAIN}/member-hub/<orgId>
##
## Rewrites to the backend's existing handler at:
##   /api/webhooks/stripe/<orgId>
##
## So the app code does not change — only the operator-facing URL
## advertised to Stripe Dashboards moves to a stable, ecosystem-wide
## hostname. Future apps (Proposal Forge, Project Tracker) follow the
## same `/app-slug/<orgId>` pattern under the same host.
##
## Defense-in-depth (mirrors control/14-billing-webhook-ingress.yaml):
##   1. nginx whitelist-source-range — Stripe's published outbound
##      webhook IPs + tailnet CIDRs (so operators can curl-test the
##      endpoint over Tailscale). Refresh annually from
##      https://stripe.com/files/ips/ips_webhooks.json (as of 2026-05-26).
##   2. Body limit 64KB at ingress + per-route in Hono.
##   3. HMAC signature verification (Stripe's standard whsec_ check)
##      against the per-org webhook signing secret stored in
##      organization_stripe_config.stripe_webhook_secret_enc.
##   4. Event-id idempotency via stripe_webhook_events PK.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: member-hub-billing-webhook
  namespace: member-hub
  labels:
    app.kubernetes.io/name: member-hub
    secforge.platform/component: member-hub
    secforge.platform/role: stripe-webhook
  annotations:
    # NB: no cert-manager annotation here — TLS for billing.${DOMAIN}
    # is already owned by control/14-billing-webhook-ingress.yaml
    # (secretName: billing-tls in the control namespace). ingress-nginx
    # serves merged Ingress rules for a shared host with one TLS cert.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

    # Capture the trailing UUID and forward it to the existing handler
    # at /api/webhooks/stripe/<orgId>. Without this rewrite the app
    # 404s because it doesn't expose `/member-hub/...`.
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/webhooks/stripe/$1

    # Restrict ingress to Stripe's published webhook source IPs plus
    # our tailnet CIDRs (operator curl-testing) and cluster pod CIDR
    # (in-cluster smoke tests). Same list as
    # control/14-billing-webhook-ingress.yaml — refresh in lockstep
    # when Stripe publishes a new set.
    nginx.ingress.kubernetes.io/whitelist-source-range: "100.64.0.0/10,10.42.0.0/16,3.18.12.63/32,3.69.109.8/32,3.120.168.93/32,3.130.192.231/32,13.235.14.237/32,13.235.122.149/32,18.211.135.69/32,35.154.171.200/32,35.157.207.129/32,52.15.183.38/32,54.88.130.119/32,54.88.130.237/32,54.187.174.169/32,54.187.205.235/32,54.187.216.72/32"

    # Webhook cadence is bursty (Stripe retries on 5xx, dunning storms)
    # but bounded. 30 rps + 3× burst matches the Control billing
    # ingress and gives Stripe room without inviting bypass-the-allowlist
    # abuse.
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "50"

    # Defense-in-depth: cap body at ingress too, so junk dies before
    # reaching Hono. Stripe events are typically <16KB; 64KB cap.
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"

spec:
  ingressClassName: nginx
  # No `tls:` block — TLS termination for billing.${DOMAIN} is set up
  # by control/14-billing-webhook-ingress.yaml using the billing-tls
  # secret in the control namespace. nginx serves the cert for any
  # Ingress that targets this host, so we just declare the routing.
  rules:
    - host: billing.${DOMAIN}
      http:
        paths:
          # `/member-hub/<UUID>` → app's `/api/webhooks/stripe/<UUID>`.
          # The regex group captures the UUID for the rewrite-target.
          # No anchor on the orgId — Hono's zod validator + the route's
          # idParam regex still strictly enforce UUID shape.
          - path: /member-hub/(.+)
            pathType: ImplementationSpecific
            backend:
              service:
                name: member-hub
                port:
                  number: 80
