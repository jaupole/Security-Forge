# Phase 7.2 — Wazuh NetworkPolicies.
#
# Pattern matches Phase 7's observability namespace: default-deny ingress
# plus explicit allows per flow. The chart's own networkPolicy template
# is disabled in our values.yaml — we manage policies here so they live
# alongside the rest of the platform's pattern.

# ──────────────────────────────────────────────────────────────────────
# Default-deny ingress for the wazuh namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: wazuh
  labels:
    secforge.platform/component: wazuh
spec:
  podSelector: {}
  policyTypes:
    - Ingress


# ──────────────────────────────────────────────────────────────────────
# Allow Prometheus / observability ns → Wazuh metrics endpoints.
#   - manager: 55000/api (set via dashboard.metrics + manager.metrics in
#     chart values.yaml — chart exposes them on the same ports the
#     services already publish)
#   - indexer: 9200 (Wazuh indexer Prometheus metrics on /_prometheus/metrics)
#   - dashboard: 5601 (chart exposes /api/status)
# Tracked separately from the ingress-nginx ALLOW so each flow can be
# tightened independently later.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-to-wazuh-metrics
  namespace: wazuh
  labels:
    secforge.platform/component: wazuh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9200      # indexer
        - protocol: TCP
          port: 55000     # manager API
        - protocol: TCP
          port: 5601      # dashboard

# ──────────────────────────────────────────────────────────────────────
# Allow keycloak + openbao namespaces to send syslog events to the Wazuh
# manager on TCP 1514. This is the agent-deferred replacement: events
# arrive via syslog from the source applications instead of being scraped
# off the host filesystem by an agent. Activated when the source
# components are configured to forward (Phase 7.2 follow-up; not a
# precondition for chart install).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-syslog-to-wazuh-manager
  namespace: wazuh
  labels:
    secforge.platform/component: wazuh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh
      app.kubernetes.io/component: manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 1514

# ──────────────────────────────────────────────────────────────────────
# Phase 7d Item 5 — wazuh-agent ns DaemonSet → manager:1514 (events)
# and 1515 (registration). Cross-ns ingress allow.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wazuh-agent-to-manager
  namespace: wazuh
  labels:
    secforge.platform/component: wazuh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh
      app.kubernetes.io/component: manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wazuh-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: wazuh-agent
      ports:
        - { protocol: TCP, port: 1514 }
        - { protocol: TCP, port: 1515 }

# ──────────────────────────────────────────────────────────────────────
# Allow intra-namespace mesh: indexer ↔ manager ↔ dashboard ↔ certs-job
# ↔ cleanup CronJob all need to talk to each other on chart-internal
# ports. NetworkPolicy only restricts INGRESS for namespaces with at
# least one NP+podSelector — and our policies above all narrow on
# specific labels, so non-targeted pods would be unaffected. But to be
# explicit and match the rest of the project, allow same-ns traffic.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-wazuh
  namespace: wazuh
  labels:
    secforge.platform/component: wazuh
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wazuh

# ──────────────────────────────────────────────────────────────────────
# Allow kubelet probes (readiness/liveness) on the workload ports. CNI
# usually exempts kubelet but local-edition Docker Desktop's networking
# can be flaky on startup probes; explicit allow is portable.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probes
  namespace: wazuh
  labels:
    secforge.platform/component: wazuh
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5601      # dashboard
        - protocol: TCP
          port: 9200      # indexer REST
        - protocol: TCP
          port: 9300      # indexer transport (intra-cluster; benign)
        - protocol: TCP
          port: 55000     # manager API

# ──────────────────────────────────────────────────────────────────────
# Ingress: Istio ingress gateways (tailnet, istio-ingress ns) → Wazuh
# dashboard:5601 (the dashboard is exposed via the tailnet gateway).
# 15008 = Ambient HBONE. Two-plane gateway migration (2026-06-03, ADR-0032).
# Was live-patched; codified 2026-06-06 to close the rebuild-from-git DR gap.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-ingress-to-wazuh-dashboard
  namespace: wazuh
  labels:
    secforge.platform/component: istio-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh
      app.kubernetes.io/component: dashboard
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
      ports:
        - { protocol: TCP, port: 5601 }
        - { protocol: TCP, port: 15008 }
