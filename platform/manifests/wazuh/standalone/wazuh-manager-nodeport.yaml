# Stand-alone NodePort Service that exposes the wazuh-manager agent ports
# on the host so a native (non-pod) wazuh-agent can connect via
# 127.0.0.1:31514 (data) and 127.0.0.1:31515 (enrollment).
#
# Lives outside the vendored chart so helm upgrade can't drop it. Owned
# by component 11 (wazuh-host-agent).
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager-nodeport
  namespace: wazuh
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/managed-by: secforge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: manager
    app.kubernetes.io/instance: wazuh
    app.kubernetes.io/name: wazuh
  ports:
    - name: agents-events
      port: 1514
      targetPort: 1514
      nodePort: 31514
      protocol: TCP
    - name: agents-auth
      port: 1515
      targetPort: 1515
      nodePort: 31515
      protocol: TCP
