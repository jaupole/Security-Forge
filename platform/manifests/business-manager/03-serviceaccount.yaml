# Service accounts for the business-manager namespace.
#
#   1. `business-manager`     — the API backend pod + migration Job. Bound to
#      SPIFFE-ID spiffe://${SPIFFE_TRUST_DOMAIN}/ns/business-manager/sa/business-manager
#      via SPIRE's ClusterSPIFFEID (components/05-spire.sh).
#   2. `business-manager-vso` — the VSO consumer SA, used only by the
#      VaultStaticSecret / VaultAuth CRs in 04-vso-bindings.yaml to fetch app
#      secrets from OpenBao and render them as K8s Secrets.
#
# The app SA does not auto-mount its token.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: business-manager
  namespace: business-manager
  labels:
    app.kubernetes.io/name: business-manager
    secforge.platform/component: business-manager
    secforge.platform/role: app-identity
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: business-manager-vso
  namespace: business-manager
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true
