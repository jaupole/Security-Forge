# Business Manager app (Express + Prisma + React SPA). Ecosystem app `managerapp`.
#
# Single Deployment: the Express server serves /api/business-manager/* and the
# built React SPA (client/dist). Lean Node runtime — NO Chromium (PDF export is
# rendered by the Gotenberg document-render service, ADR-0037;
# PDF_RENDERER=gotenberg). The pod is the security boundary: runAsNonRoot 65532,
# drop ALL caps, seccomp RuntimeDefault, readOnlyRootFilesystem (writable /tmp).
#
# No spiffe-helper sidecar and no SpiceDB/MinIO egress: BM consumes VSO-rendered
# K8s Secrets via envFrom, authorizes via org-membership + Postgres RLS, and has
# no object storage day-1. The only in-cluster TLS to an internal-CA endpoint is
# Keycloak (auth.${DOMAIN} → ClusterIP, internal cert), so NODE_EXTRA_CA_CERTS
# points at the openbao-ca configmap.
#
# IMAGE: pin to the cosign-signed digest from the FIRST business-manager build.
# The placeholder below must be replaced before apply or Kyverno
# verify-image-signature rejects it; the migration Job (08) must use the SAME
# digest.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-manager
  namespace: business-manager
  labels:
    app.kubernetes.io/name: business-manager
    app.kubernetes.io/component: app
    secforge.platform/component: business-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: business-manager
      app.kubernetes.io/component: app
  template:
    metadata:
      annotations:
        # Exclude the ephemeral scratch volume from Velero fs-backup — no
        # recoverable data, and it races the pod lifecycle (a pod replaced
        # mid-backup fails the PodVolumeBackup -> PartiallyFailed -> trips
        # VeleroBackupTooOld). Real volumes still back up.
        backup.velero.io/backup-volumes-excludes: tmp
      labels:
        app.kubernetes.io/name: business-manager
        app.kubernetes.io/component: app
        secforge.platform/component: business-manager
        minio-client: "true"   # MinIO NetworkPolicy gates ingress on this label
    spec:
      serviceAccountName: business-manager
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # 2026-06-11: org brand-kit logo (logos.mark) — business-manager commit d281fb0
          # (frontend brand fix; no schema delta). MUST match 08-migration-job.yaml.
          image: ghcr.io/jaupole/business-manager@sha256:cbb2e60ebd1c3a1a5e70bcfb55110c33b56ae3f4b5da2b15c92666e72238e390
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 3001, name: http, protocol: TCP }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3001" }
            # General per-IP rate-limit ceiling (H-2). Raised 300->600 (2026-07-05).
            - { name: RL_GENERAL_MAX, value: "600" }
            # Bind off loopback (the API now has auth — see BM_AUTH_MODE).
            - { name: HOST, value: "0.0.0.0" }
            # Lifts the PTRK-001 loopback tripwire: auth is enabled.
            - { name: BM_AUTH_MODE, value: oidc }
            # B&L burn-tracking is now gated PER ORG at runtime (read from
            # Control /me; platform-admin sets it in admin → Platform Settings).
            # No app-side enable flag. Automated polling additionally needs the
            # business-manager-system service account: create the Keycloak
            # client-credentials client + add BM_SYSTEM_CLIENT_SECRET via VSO
            # (envFrom business-manager-app-secrets) to activate it.
            # Writable HOME under readOnlyRootFilesystem (lib caches).
            - { name: HOME, value: "/tmp" }
            # Keycloak presents its internal cert in-cluster (auth.${DOMAIN} →
            # ClusterIP); jose's createRemoteJWKSet must trust the internal CA.
            - { name: NODE_EXTRA_CA_CERTS, value: "/etc/secforge/openbao-ca.crt" }
            - { name: KEYCLOAK_URL, value: "https://auth.${DOMAIN}" }
            - { name: KEYCLOAK_REALM, value: platform }
            # Tenants realm — members sign in here; a bare /auth/login defaults to
            # tenants when OIDC_CLIENT_SECRET_TENANTS is present. Token
            # verification trusts both realms.
            - { name: KEYCLOAK_TENANTS_REALM, value: secforge-tenants }
            # Cross-app SYNC (P3): BM pulls per-org projects from Project Manager's
            # read-only feed using the dedicated `ecosystem-sync-system` client.
            # SYNC_SYSTEM_CLIENT_SECRET arrives via VSO (envFrom, 04-vso-bindings);
            # the Sync button no-ops cleanly until the secret is present.
            - { name: SYNC_SYSTEM_CLIENT_ID, value: ecosystem-sync-system }
            - { name: PROJECT_MANAGER_FEED_URL, value: "http://project-manager.project-manager.svc.cluster.local/api/v1/feed/business-manager" }
            - { name: PROPOSAL_FORGE_FEED_URL, value: "http://proposal-forge.proposal-forge.svc.cluster.local/api/v1/feed/business-manager" }
            - { name: OIDC_CLIENT_ID, value: business-manager }
            # Ecosystem Control — Service port 80 → pod 4000. BM calls /api/v1/me
            # for the active-org context (drives RLS) + app-activation flag.
            - { name: ECOSYSTEM_CONTROL_API_URL, value: "http://control.control.svc.cluster.local" }
            # Configurable workflow gate (WORKFLOW-ENGINE-PLAN). Inert until "true";
            # then a Control-unreachable check fails closed on budget-line changes.
            - { name: WORKFLOW_GATES_ENABLED, value: "true" }
            # Report PDF export via the shared Gotenberg document-render service.
            - { name: PDF_RENDERER, value: gotenberg }
            - { name: GOTENBERG_URL, value: "http://gotenberg.document-render.svc.cluster.local:3000" }
            # Same-origin SPA; the only cross-origin caller is the tailnet host.
            - { name: CORS_ALLOWED_ORIGINS, value: "https://bm.${DOMAIN}" }
            # Document Engine (fleet v1) — MinIO object store for document
            # attachments. The bucket-scoped creds (MINIO_ACCESS_KEY /
            # MINIO_SECRET_KEY) arrive via envFrom below (never as literal env,
            # per Kyverno no-secret-shaped-env-vars).
            - { name: MINIO_ENDPOINT, value: "minio.minio.svc.cluster.local" }
            - { name: MINIO_PORT, value: "9000" }
            - { name: MINIO_USE_SSL, value: "false" }
            - { name: MINIO_BUCKET, value: business-manager-documents }
            # ONLYOFFICE Document Server (DOCENG) — embed origin the browser
            # loads api.js from, in-cluster URL for ConvertService + SSRF host
            # validation, and the base the DS uses to fetch documents back
            # (one-time file-token URLs ride the mesh, not the gateway:
            # Service :80 → pod :3001). Fleet v1 is view-only (no save callback).
            # JWT secret is the fleet-shared DS secret (VSO-rendered from
            # secret/apps/onlyoffice/jwt — see 04-vso-bindings.yaml, envFrom below).
            - { name: ONLYOFFICE_PUBLIC_URL, value: "https://docs.secforge.dev" }
            - { name: ONLYOFFICE_INTERNAL_URL, value: "http://onlyoffice.onlyoffice.svc.cluster.local" }
            - { name: ONLYOFFICE_CALLBACK_BASE, value: "http://business-manager.business-manager.svc.cluster.local" }
            # CNPG-rendered DB connection string.
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: business-manager-db-app, key: uri } } }
          envFrom:
            # OIDC_CLIENT_SECRET, OIDC_CLIENT_SECRET_TENANTS, SESSION_KEY,
            # SAM_GOV_API_KEY (VSO → 04-vso-bindings.yaml).
            - secretRef:
                name: business-manager-app-secrets
            # MINIO_ACCESS_KEY + MINIO_SECRET_KEY (bucket-scoped; VSO →
            # 04-vso-bindings.yaml). Optional: the VSO binding stays unrendered
            # until the operator provisions the business-manager-documents MinIO
            # user, so the pod still starts (documents API returns a clean 503).
            - secretRef:
                name: business-manager-documents-minio
                optional: true
            # ONLYOFFICE_JWT_SECRET — fleet-shared DS JWT (VSO → 04-vso-bindings.yaml).
            - secretRef:
                name: onlyoffice-jwt
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 1,    memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: openbao-ca, mountPath: /etc/secforge, readOnly: true }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: openbao-ca
          configMap:
            name: openbao-internal-ca-cert
            items:
              - key: ca.crt
                path: openbao-ca.crt
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: business-manager
              app.kubernetes.io/component: app
