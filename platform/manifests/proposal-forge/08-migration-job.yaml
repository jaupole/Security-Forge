# One-shot Job that applies Prisma migrations to proposal-forge-db.
#
# Run BEFORE the API Deployment so the schema is in place when the first
# server starts. Re-runs are safe — `prisma migrate deploy` only applies
# pending migrations (tracked in _prisma_migrations) and is a no-op when
# the DB is already current.
#
# CNPG auto-renders `proposal-forge-db-app` with host/port/user/password/
# dbname/uri/jdbc-uri/pgpass. Prisma wants a single connection string, so
# DATABASE_URL is fed from the `uri` key.
#
# IMAGE: the digest below is a PLACEHOLDER. Pin it to the cosign-signed
# digest emitted by the first proposal-forge-image-build run (then the
# Kyverno verify-image-signature policy admits it). The Deployment +
# this Job must reference the SAME digest.

---
apiVersion: batch/v1
kind: Job
metadata:
  name: proposal-forge-db-migrate
  namespace: proposal-forge
  labels:
    app.kubernetes.io/name: proposal-forge
    secforge.platform/component: proposal-forge
    secforge.platform/role: db-migration
spec:
  # Don't auto-retry on app errors — a migration failure needs operator eyes.
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400     # GC after 24h; keep the artefact for inspection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proposal-forge
        secforge.platform/component: proposal-forge
        secforge.platform/role: db-migration
    spec:
      restartPolicy: Never
      serviceAccountName: proposal-forge
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h proposal-forge-db-rw.proposal-forge.svc.cluster.local -p 5432 -U proposal_forge -d proposal_forge -t 3; do
                echo "waiting for proposal-forge-db..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
      containers:
        - name: migrate
          # Digest kept in lockstep with the Deployment (09) per convention.
          # 2026-06-09: commit 22e103e (P1 org branding from Control; P0 MinIO NP fix);
          # no new migration (P1 uses existing export_config JSONB column).
          # 2026-06-09: commit ab32a82 (per-proposal cover logo picker); no new
          # migration (reuses export_config JSONB + PF Assets). Lockstep with 09.
          # 2026-06-10: commit 222d64a — shell-quote >=1.8.4 (CVE-2026-9277 RCE) + pnpm
          # 9.15->11 bump. Dependency-only; no new migration. Lockstep with 09.
          # 2026-06-12: commit 639a6cf — shared PeriodChip (ecosystem-ui 0.1.9) +
          # period-aware /stats. Query-logic only; no new migration. Lockstep with 09.
          # 2026-06-12: commit a8480e6 — bfcache logout hardening (auth; digest
          # 6e0f2dab, deployed separately). 06c717e — framed data-grid cover
          # (column-aware wrap + single-page flex clip). No migration. Lockstep with 09.
          # 2026-06-12: commit c065ce9 — cover polish (logo to top margin, un-clip
          # panel bottom, center UEI/CAGE/NAICS). No migration. Lockstep with 09.
          # 2026-06-12: commit 3718f85 — widen cover box to margins (POC fits),
          # panel out of clip so bottom border always shows, real bordered box in
          # the Word cover too. No migration. Lockstep with 09.
          # 2026-06-12: commit 291946a — cover footer pinned to page bottom +
          # Contract Number cell centered. No migration. Lockstep with 09.
          # 2026-06-12: commit 89af8fd — pin footer to TRUE page bottom (measured
          # via pdfjs) + trim spacing to widen the date gap. No migration. Lockstep with 09.
          # 2026-06-12: commit 7722937 — built-in cover rendered as its own page
          # so the legend is a TRUE page footer (in the bottom margin) + Contract
          # Number centered block. No migration. Lockstep with 09.
          # 2026-06-12: commit 87aa587 — equal contract columns so Contract Number
          # is centered between its neighbors. No migration. Lockstep with 09.
          # 2026-06-12: commit 1fa372e — Solicitation on its own full-width cover
          # row (long titles wrap wide). No migration. Lockstep with 09.
          image: ghcr.io/jaupole/proposal-forge@sha256:16614019a42aa159100ab10334c71535213b93b53543c66a72739a0bb79629b6
          imagePullPolicy: IfNotPresent
          # `prisma` is a runtime dependency; the CLI entry is build/index.js.
          # Overrides the image's tini ENTRYPOINT (no Chromium here).
          command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy", "--schema=./prisma/schema.prisma"]
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: proposal-forge-db-app
                  key: uri
            # Prisma's migration engine writes to a temp dir.
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
