# Service accounts for the proposal-forge namespace.
#
#   1. `proposal-forge`     — the API backend pod + migration Job. Bound to
#      SPIFFE-ID spiffe://${SPIFFE_TRUST_DOMAIN}/ns/proposal-forge/sa/proposal-forge
#      via SPIRE's ClusterSPIFFEID (components/05-spire.sh).
#   2. `proposal-forge-vso` — the VSO consumer SA, used only by the
#      VaultStaticSecret / VaultAuth CRs in 04-vso-bindings.yaml to fetch
#      app secrets from OpenBao and render them as K8s Secrets.
#
# The app SA does not auto-mount its token; the workload requests a projected
# token via the SPIFFE CSI driver (wired in 09-backend-deployment.yaml, P6).

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proposal-forge
  namespace: proposal-forge
  labels:
    app.kubernetes.io/name: proposal-forge
    secforge.platform/component: proposal-forge
    secforge.platform/role: app-identity
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proposal-forge-vso
  namespace: proposal-forge
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true
