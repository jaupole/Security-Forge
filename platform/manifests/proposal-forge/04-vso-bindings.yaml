# VSO bindings for the proposal-forge namespace.
#
# Rendered K8s Secrets (all consumed via envFrom / imagePullSecrets on the
# backend Deployment + migration Job in P6):
#   - proposal-forge-app-secrets  → OIDC client_secret, SpiceDB PSK, session
#                                   signing key, Gemini + GSA API keys
#   - ghcr-pull-secret            → GHCR dockerconfigjson (image pull)
#   - proposal-forge-files-minio  → rw creds for the proposal-forge-files bucket
#   - cnpg-minio-credentials      → barman-cloud → MinIO (CNPG backups)
#
# DEPLOY-TIME PREREQS (P6 — not applied by this manifest):
#   1. OpenBao policy `proposal-forge` + k8s-auth role `proposal-forge-vso`
#      (bind SA proposal-forge-vso → policy). Add a row to APP_ROLES in
#      platform/components/05j-app-vso-roles.sh + a proposal-forge.hcl policy,
#      per project_openbao_app_roles_codified.
#   2. Populate the OpenBao KV paths below (runtime/ghcr-pull/minio).
#   3. Create the proposal-forge-files MinIO bucket (versioned + SSE-S3) and a
#      bucket-scoped service account; write its keys to minio/proposal-forge-files.
#   4. Publish the proposal-forge Keycloak client_secret to apps/proposal-forge/
#      runtime via the 05l-keycloak-secret-publish.sh bridge.

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: proposal-forge-vso
  namespace: proposal-forge
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: proposal-forge-vso
    serviceAccount: proposal-forge-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
# App-level secrets → single Secret consumed via envFrom on the backend.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: proposal-forge-app-secrets
  namespace: proposal-forge
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: proposal-forge-vso
  mount: secret
  type: kv-v2
  path: apps/proposal-forge/runtime
  refreshAfter: 1h
  destination:
    name: proposal-forge-app-secrets
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        # Keycloak OIDC client_secret (user-login `proposal-forge` client).
        # Published by 05l-keycloak-secret-publish.sh.
        OIDC_CLIENT_SECRET:
          text: '{{ .Secrets.oidc_client_secret }}'
        # Same `proposal-forge` user-login client, but in the TENANTS realm — a
        # separate confidential client with its own secret. Drives the
        # members→tenants-realm sign-in flow. App reads as
        # OIDC_CLIENT_SECRET_TENANTS. Optional in OpenBao: when the
        # `oidc_client_secret_tenants` key is absent the template renders empty
        # and PF keeps platform-only sign-in.
        OIDC_CLIENT_SECRET_TENANTS:
          text: '{{ if .Secrets.oidc_client_secret_tenants }}{{ .Secrets.oidc_client_secret_tenants }}{{ end }}'
        # Keycloak client-credentials secret for the `proposal-forge-system`
        # service account — PF→Control system calls (the configurable workflow
        # gate at proposal submit). Minted from the PLATFORM realm (KEYCLOAK_REALM).
        # Published by 05l-keycloak-secret-publish.sh to `system_client_secret`.
        # App reads as PROPOSALAPP_SYSTEM_CLIENT_SECRET; the gate stays off until
        # WORKFLOW_GATES_ENABLED=true regardless of whether this is set. Optional:
        # absent key renders empty, leaving the gate fail-closed when enabled.
        PROPOSALAPP_SYSTEM_CLIENT_SECRET:
          text: '{{ if .Secrets.system_client_secret }}{{ .Secrets.system_client_secret }}{{ end }}'
        # SpiceDB pre-shared key for gRPC auth (consumed, not owned here).
        SPICEDB_PRESHARED_KEY:
          text: '{{ .Secrets.spicedb_psk }}'
        # OIDC session-cookie signing key (raw 32-byte base64). Generated
        # once at bootstrap via `openssl rand -base64 32`; rotate via OpenBao
        # + Pod restart.
        SESSION_KEY:
          text: '{{ .Secrets.session_signing_key }}'
        # Gemini API key (AI_PROVIDER=gemini). Rotated on cutover (the old
        # .env value moves here and is regenerated). ANTHROPIC_API_KEY /
        # OPENAI_API_KEY get added the same way when those providers land.
        GEMINI_API_KEY:
          text: '{{ .Secrets.gemini_api_key }}'
        # GSA per-diem API key (api.gsa.gov/travel/perdiem/v2).
        GSA_API_KEY:
          text: '{{ .Secrets.gsa_api_key }}'
        # DORMANT (DOCENG-A9, 2026-07-05): the Google/M365 provider round-trip
        # was removed from PF ("at least for now" — operator decision; restore =
        # git revert of PF d77aa6b + this hunk). The OAuth app registrations and
        # the OpenBao values at apps/proposal-forge/runtime (google_oauth_*,
        # microsoft_oauth_*, oauth_token_seal_key) stay in place — only the env
        # rendering is removed so the running pod carries no unused credentials
        # (least privilege). UserOAuthConnection rows rest AES-sealed under the
        # retained oauth_token_seal_key.

---
# GHCR image-pull credential (read:packages PAT on jaupole/proposal-forge).
# OpenBao path apps/proposal-forge/ghcr-pull: { username, password }.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull-secret
  namespace: proposal-forge
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: proposal-forge-vso
  mount: secret
  type: kv-v2
  path: apps/proposal-forge/ghcr-pull
  refreshAfter: 5m
  destination:
    name: ghcr-pull-secret
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ".dockerconfigjson":
          text: |-
            {"auths":{"ghcr.io":{"username":"{{ .Secrets.username }}","password":"{{ .Secrets.password }}","auth":"{{ printf "%s:%s" .Secrets.username .Secrets.password | b64enc }}"}}}

---
# App-level MinIO credentials for the proposal-forge-files bucket (uploads,
# assets, templates, exports). rw on that bucket only. Rendered as
# MINIO_ACCESS_KEY + MINIO_SECRET_KEY, consumed via envFrom on the backend.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: proposal-forge-files-minio-vso
  namespace: proposal-forge
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: proposal-forge-vso
  mount: secret
  type: kv-v2
  path: minio/proposal-forge-files
  refreshAfter: 1h
  destination:
    name: proposal-forge-files-minio
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        MINIO_ACCESS_KEY:
          text: '{{ .Secrets.access_key }}'
        MINIO_SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'

---
# barman-cloud → MinIO credentials for CNPG WAL archiving + base backups.
# Same shared OpenBao path as the other apps' CNPG clusters.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cnpg-minio-credentials-vso
  namespace: proposal-forge
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: proposal-forge-vso
  mount: secret
  type: kv-v2
  path: minio/cnpg/credentials
  refreshAfter: 1h
  destination:
    name: cnpg-minio-credentials
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ACCESS_KEY_ID:
          text: '{{ .Secrets.access_key }}'
        ACCESS_SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'

---
# ONLYOFFICE Document Server fleet-shared JWT secret (DOCENG Phase 1/2). PF
# signs editor embed configs + ConvertService calls and verifies the DS's save
# callbacks with it. SAME OpenBao path as the onlyoffice namespace's own sync
# (onlyoffice/04-vso-bindings.yaml) — one secret, N namespaces, VSO-managed;
# rotation = rotate in OpenBao, every sync follows. Read grant for the
# proposal-forge-vso role (`vso` policy) lives in openbao/policies/vso.hcl.
# Rendered as ONLYOFFICE_JWT_SECRET, consumed via envFrom on the backend.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: onlyoffice-jwt
  namespace: proposal-forge
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: proposal-forge-vso
  mount: secret
  type: kv-v2
  path: apps/onlyoffice/jwt
  refreshAfter: 1h
  destination:
    name: onlyoffice-jwt
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ONLYOFFICE_JWT_SECRET:
          text: '{{ .Secrets.jwt_secret }}'

---
# ecosystem-db consolidated-cluster connection secret (DB-unification P5).
# Renders `proposal-forge-ecodb` (host/port/username/password/dbname/uri for this app's
# role on the shared ecosystem-db CNPG cluster) from OpenBao apps/proposal-forge/ecodb.
# The deployment + migration Job + cronjobs reference `proposal-forge-ecodb` (SF#152).
# overwrite:true because this VSS ADOPTED the pre-existing hand-made secret at
# the P5 break-glass cutover (2026-07-08); VSO now owns + self-heals it.
# Populate the OpenBao path on a break-glass day — see
# docs/03-runbooks/ecosystem-db-operations.md §"ecodb connection secrets (DR)".
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: proposal-forge-ecodb-vso
  namespace: proposal-forge
  labels:
    secforge.platform/component: ecosystem-db
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: proposal-forge-vso
  mount: secret
  type: kv-v2
  path: apps/proposal-forge/ecodb
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: proposal-forge-ecodb
    create: true
    overwrite: true
    type: Opaque
