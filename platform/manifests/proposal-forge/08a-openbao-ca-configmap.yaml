# Internal-CA trust bundle for the Proposal Forge backend
# (09-deployment.yaml mounts this at /etc/secforge/openbao-ca.crt via
# NODE_EXTRA_CA_CERTS). PF's only in-cluster TLS to an internal-CA endpoint is
# Keycloak (auth.${DOMAIN} → keycloak ClusterIP, "SecForge Internal CA") for
# jose's createRemoteJWKSet. The OpenBao CA is included too (cluster-wide, same
# blob as control/member-hub) for parity / future use. On CA rotation, refresh
# all per-namespace copies together.
