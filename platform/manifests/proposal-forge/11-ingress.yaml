# Tailnet-only ingress for Proposal Forge — pf.${DOMAIN}.
#
# NO public access. The `whitelist-source-range: 100.64.0.0/10` annotation
# (Tailscale CGNAT) makes ingress-nginx 403 any request not sourced from the
# tailnet, before the upstream pod is contacted. There is NO public DNS A
# record — the operator's hosts file maps pf.${DOMAIN} → the
# host's tailnet IP. The Kyverno admin-ingress-must-be-tailnet-only policy
# (components/10a) enforces this annotation at admission for the
# `pf.` hostname prefix.
#
# TLS: per-host LE via DNS-01 (Cloudflare) — a real cert without a public A
# record (DNS-01 validates via a TXT record, no inbound exposure).
#
# Auth: the app is fronted by Keycloak OIDC (passkeys mandatory on the
# platform realm); the active-org gate + SpiceDB enforce per-request.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proposal-forge
  namespace: proposal-forge
  labels:
    app.kubernetes.io/name: proposal-forge
    secforge.platform/component: proposal-forge
  annotations:
    cert-manager.io/cluster-issuer: ${LE_ISSUER}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    # Tailnet-only (Tailscale CGNAT). Public internet → 403 at the edge.
    nginx.ingress.kubernetes.io/whitelist-source-range: "100.64.0.0/10"
    # Relaxed rate limits — the SPA is one bundle (route-split pending) and
    # fires many parallel chunk fetches over HTTP/2; tight limits 503 assets.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "200"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pf.${DOMAIN}
      secretName: pf-tls
  rules:
    - host: pf.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proposal-forge
                port:
                  number: 80
