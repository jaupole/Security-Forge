# Proposal Forge app (Express + Prisma + React SPA). Ecosystem app `proposalapp`.
#
# Single Deployment: the Express server serves /api/v1/* and the built React
# SPA (client/dist). NOT distroless — the PDF export path runs headless
# Chromium via Puppeteer (the image ships the distro chromium). The pod is the
# security boundary: runAsNonRoot 65532, drop ALL caps, seccomp RuntimeDefault,
# readOnlyRootFilesystem (writable /tmp only; HOME=/tmp for Chromium).
#
# No spiffe-helper sidecar (unlike member-hub): PF consumes VSO-rendered K8s
# Secrets via envFrom and does not call OpenBao Transit. The only in-cluster
# TLS to an internal-CA endpoint is Keycloak (auth.${DOMAIN} → ClusterIP,
# internal cert), so NODE_EXTRA_CA_CERTS points at the openbao-ca configmap.
#
# IMAGE: pin to the cosign-signed digest from the FIRST ecosystem build (after
# the feat/ecosystem-integration merge to master). The placeholder below must
# be replaced before apply or Kyverno verify-image-signature rejects it; the
# migration Job (08) must use the SAME digest.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: proposal-forge
  namespace: proposal-forge
  labels:
    app.kubernetes.io/name: proposal-forge
    app.kubernetes.io/component: app
    secforge.platform/component: proposal-forge
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: proposal-forge
      app.kubernetes.io/component: app
  template:
    metadata:
      annotations:
        # Exclude the ephemeral scratch volume from Velero fs-backup — no
        # recoverable data, and backing it up races the pod lifecycle (a pod
        # replaced mid-backup fails the PodVolumeBackup -> PartiallyFailed ->
        # trips VeleroBackupTooOld). Real volumes still back up.
        backup.velero.io/backup-volumes-excludes: tmp
      labels:
        app.kubernetes.io/name: proposal-forge
        app.kubernetes.io/component: app
        secforge.platform/component: proposal-forge
        minio-client: "true"   # MinIO NetworkPolicy gates ingress on this label
    spec:
      serviceAccountName: proposal-forge
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # PDF export now goes ONLY through the document-render service (Gotenberg,
          # ADR-0037) — Puppeteer/Chromium removed, image is lean. Adds the
          # per-proposal Formatting wizard step + export_config + cover-template
          # override. GOTENBERG_URL defaults to the mesh DNS; the PDF_RENDERER
          # flag was removed (no env needed). MUST match 08-migration-job.yaml.
          # 2026-06-09: commit 22e103e — P1 org branding from Control; P0 MinIO
          # NP + bucket/user fix. No new migration (uses existing export_config).
          # 2026-06-09: commit ab32a82 — per-proposal cover logo PICKER (choose an
          # org graphic from Control or a PF-uploaded image; PNG/JPEG embed in PDF
          # + Word, WebP/SVG are PDF-only). Reuses Control's public graphics API +
          # PF Assets; no new migration, no Control change. MUST match 08-migration-job.yaml.
          # 2026-06-10: commit 222d64a — shell-quote >=1.8.4 (CVE-2026-9277 RCE) + pnpm
          # 9.15->11 toolchain bump. Dependency-only; no new migration. (pentest)
          # 2026-06-12: commit 639a6cf — shared PeriodChip (ecosystem-ui 0.1.9) +
          # period-aware /stats. Query-logic only; no new migration. MUST match 08.
          # 2026-06-12: commit a8480e6 — bfcache logout hardening (auth; digest
          # 6e0f2dab, deployed separately). 06c717e — framed data-grid cover
          # (column-aware wrap + single-page flex clip). No migration. MUST match 08.
          # 2026-06-12: commit c065ce9 — cover polish (logo to top margin, un-clip
          # panel bottom, center UEI/CAGE/NAICS). No migration. MUST match 08.
          # 2026-06-12: commit 3718f85 — widen cover box to margins (POC fits),
          # panel out of clip so bottom border always shows, real bordered box in
          # the Word cover too. No migration. MUST match 08.
          # 2026-06-12: commit 291946a — cover footer pinned to page bottom +
          # Contract Number cell centered. No migration. MUST match 08.
          # 2026-06-12: commit 89af8fd — pin footer to TRUE page bottom (measured
          # via pdfjs) + trim spacing to widen the date gap. No migration. MUST match 08.
          # 2026-06-12: commit 7722937 — built-in cover rendered as its own page
          # so the legend is a TRUE page footer (in the bottom margin) + Contract
          # Number centered block. No migration. MUST match 08.
          # 2026-06-12: commit 87aa587 — equal contract columns so Contract Number
          # is centered between its neighbors. No migration. MUST match 08.
          # 2026-06-12: commit 1fa372e — Solicitation on its own full-width cover
          # row (long titles wrap wide). No migration. MUST match 08.
          image: ghcr.io/jaupole/proposal-forge@sha256:c5e47a2ce09c82018af139957ee5552e1d3a74bd6f0024094e7d085d7de8be0c
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 3001, name: http, protocol: TCP }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3001" }
            # General per-IP rate-limit ceiling (H-2). Raised 300->600 (2026-07-05).
            - { name: RATE_LIMIT_GENERAL_MAX, value: "600" }
            # Chromium (Puppeteer) writes config/cache under HOME; /tmp is the
            # only writable mount under readOnlyRootFilesystem.
            - { name: HOME, value: "/tmp" }
            # Keycloak presents its internal cert in-cluster (auth.${DOMAIN} →
            # ClusterIP); jose's createRemoteJWKSet must trust the internal CA.
            - { name: NODE_EXTRA_CA_CERTS, value: "/etc/secforge/openbao-ca.crt" }
            - { name: KEYCLOAK_URL, value: "https://auth.${DOMAIN}" }
            - { name: KEYCLOAK_REALM, value: platform }
            # Cross-app SYNC (P4): the BM→PF feed accepts a Keycloak token whose
            # azp is this client, serving the org named in ?org=. JWKS from
            # KEYCLOAK_URL (internal CA trusted via NODE_EXTRA_CA_CERTS above).
            - { name: SYNC_SYSTEM_CLIENT_ID, value: ecosystem-sync-system }
            # Tenants realm (Shape B). With its client secret in OpenBao
            # (OIDC_CLIENT_SECRET_TENANTS via 04-vso-bindings), a bare
            # /auth/login defaults to this realm (members); the "SecForge
            # staff?" link forces platform. Token verification trusts both.
            - { name: KEYCLOAK_TENANTS_REALM, value: secforge-tenants }
            - { name: OIDC_CLIENT_ID, value: proposal-forge }
            # Configurable workflow gate (WORKFLOW-ENGINE-PLAN §9). PF→Control
            # client-credentials identity (azp Control matches). Secret arrives
            # via VSO as PROPOSALAPP_SYSTEM_CLIENT_SECRET (04-vso-bindings).
            - { name: PROPOSALAPP_SYSTEM_CLIENT_ID, value: proposal-forge-system }
            # Master switch for the submit gate. Keep "false" until the
            # proposal-forge-system Keycloak client + secret are provisioned and
            # Control is deployed with the gate routes — then flip to "true".
            # While "true" a Control-unreachable check fails CLOSED (blocks submit).
            - { name: WORKFLOW_GATES_ENABLED, value: "true" }
            # Ecosystem Control — Service port 80 → pod 4000. PF calls /api/v1/me
            # for the active-org context (the org that drives RLS).
            - { name: ECOSYSTEM_CONTROL_API_URL, value: "http://control.control.svc.cluster.local" }
            - { name: SPICEDB_ENDPOINT, value: "spicedb.spicedb.svc.cluster.local:50051" }
            - { name: MINIO_ENDPOINT, value: "minio.minio.svc.cluster.local" }
            - { name: MINIO_PORT, value: "9000" }
            - { name: MINIO_USE_SSL, value: "false" }
            - { name: MINIO_BUCKET, value: proposal-forge-files }
            - { name: AI_PROVIDER, value: gemini }
            - { name: GEMINI_MODEL, value: gemini-2.5-flash }
            - { name: GSA_API_BASE, value: "https://api.gsa.gov/travel/perdiem/v2" }
            # ONLYOFFICE Document Server (DOCENG Phase 2+) — embed origin the
            # browser loads api.js from, in-cluster URL for ConvertService and
            # SSRF host validation, and the base DS uses to call PF back
            # (one-time file URLs + save callbacks ride the mesh, not the
            # gateway). JWT secret is the fleet-shared DS secret (VSO-rendered
            # from secret/apps/onlyoffice/jwt — see 04-vso-bindings.yaml).
            - { name: ONLYOFFICE_PUBLIC_URL, value: "https://docs.secforge.dev" }
            - { name: ONLYOFFICE_INTERNAL_URL, value: "http://onlyoffice.onlyoffice.svc.cluster.local" }
            - { name: ONLYOFFICE_CALLBACK_BASE, value: "http://proposal-forge.proposal-forge.svc.cluster.local" }
            # (the PF-side VSO binding templates the key to env-var shape)
            - { name: ONLYOFFICE_JWT_SECRET, valueFrom: { secretKeyRef: { name: onlyoffice-jwt, key: ONLYOFFICE_JWT_SECRET } } }
            # CNPG-rendered DB connection string.
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: proposal-forge-db-app, key: uri } } }
          envFrom:
            # OIDC_CLIENT_SECRET, SPICEDB_PRESHARED_KEY, SESSION_KEY,
            # GEMINI_API_KEY, GSA_API_KEY (VSO → 04-vso-bindings.yaml).
            - secretRef:
                name: proposal-forge-app-secrets
            # MINIO_ACCESS_KEY + MINIO_SECRET_KEY (bucket-scoped).
            - secretRef:
                name: proposal-forge-files-minio
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: 1,    memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            # Chromium temp + V8/sourcemap cache + HOME. --disable-dev-shm-usage
            # makes Chromium use /tmp instead of /dev/shm, so size it generously.
            - { name: tmp, mountPath: /tmp }
            - { name: openbao-ca, mountPath: /etc/secforge, readOnly: true }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: openbao-ca
          configMap:
            name: openbao-internal-ca-cert
            items:
              - key: ca.crt
                path: openbao-ca.crt
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: proposal-forge
              app.kubernetes.io/component: app
