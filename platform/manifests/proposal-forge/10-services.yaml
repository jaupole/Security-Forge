# In-cluster Service for the proposal-forge namespace. ClusterIP-only —
# external access is via ingress-nginx (11-ingress.yaml), tailnet-restricted.
# Single Service: the Express app serves both /api/v1/* and the React SPA.
# Port 80 forwards to the container's :3001 listening port.
---
apiVersion: v1
kind: Service
metadata:
  name: proposal-forge
  namespace: proposal-forge
  labels:
    app.kubernetes.io/name: proposal-forge
    app.kubernetes.io/component: app
    secforge.platform/component: proposal-forge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: proposal-forge
    app.kubernetes.io/component: app
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
