# VaultConnection — VSO's pointer to the OpenBao server.
# Phase 6.10b — Step 2. See ADR-0015.
#
# Address rationale:
#   Use the headless `openbao.openbao.svc.cluster.local` service rather
#   than `openbao-active.*`. The OpenBao TLS cert covers the headless
#   name in its SANs but NOT `openbao-active`. OpenBao internally
#   redirects writes to the leader, so VSO using the round-robin service
#   is correct.
#
# CA bundle:
#   `openbao-ca-bundle` Secret in this namespace is created by apply.sh
#   from the cert-manager `mkcert-ca-key-pair` Secret in the cert-manager
#   namespace. We do NOT use trust-manager (not installed); the apply
#   script's copy is idempotent.
#
# `skipTLSVerify: false` is the default; spelled out here so a future
# reader does not wonder whether it was forgotten.
#
# Audience binding note (lives in 03-vault-auth.yaml's `audiences:` and
# the symmetric `audience=` arg in configure-openbao-role.sh): we use
# `https://kubernetes.default.svc.cluster.local` — the K8s API server
# issuer URL — NOT the historical "vault" shorthand. Both sides must
# agree. If you change one, change all three (this file's connection
# context, 03's auth method, the OpenBao role).

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao
  namespace: vault-secrets-operator
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  address: https://openbao.openbao.svc.cluster.local:8200
  skipTLSVerify: false
  tlsServerName: openbao.openbao.svc.cluster.local
  caCertSecretRef: openbao-ca-bundle
