# NetworkPolicies for VSO.
# Phase 6.10b — Step 2. See ADR-0015.
#
# This file declares two policies:
#
#   1. Egress from the vault-secrets-operator pod (own ns) → openbao:8200
#      and → kube-apiserver:443 (for K8s Secret writes via the K8s API).
#   2. Ingress allow on the openbao namespace from
#      vault-secrets-operator → openbao:8200.
#
# Cross-namespace pattern — a NetworkPolicy logically owned by one
# component but applied to a different namespace. The reverse here: this
# file is logically VSO's, and the second
# policy is applied to the openbao namespace.

# ──────────────────────────────────────────────────────────────────────
# Default-deny ingress in vault-secrets-operator (no inbound traffic
# expected — VSO is a controller, not a service).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vault-secrets-operator
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  podSelector: {}
  policyTypes: [Ingress]

# ──────────────────────────────────────────────────────────────────────
# Egress: VSO controller → openbao:8200, kube-apiserver:443, kube-dns.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vso-egress
  namespace: vault-secrets-operator
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-secrets-operator
  policyTypes: [Egress]
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # OpenBao API
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: openbao
      ports:
        - protocol: TCP
          port: 8200
    # kube-apiserver (for TokenReview during K8s auth + Secret writes
    # to consumer namespaces).
    #
    # NOTE: on k3s, the `kubernetes` Service ClusterIP (10.43.0.1:443) is
    # NOT a kube-system pod — it's an iptables NAT to the host's :6443.
    # NetworkPolicy filters BEFORE NAT, so a `kube-system` namespaceSelector
    # rule alone leaves VSO unable to reach the API server (symptom:
    # "dial tcp 10.43.0.1:443: connect: connection refused" on startup,
    # CrashLoopBackOff). We add explicit ipBlock rules for the ClusterIP
    # AND the host's k3s-server endpoint at :6443. Same fix pattern as
    # OpenBao's `allow-openbao-to-kube-apiserver` NetworkPolicy.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32      # kubernetes Service ClusterIP
        - ipBlock:
            cidr: 65.21.25.40/32    # host IP — k3s-server endpoint at :6443
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Egress to consumer namespaces is implicit via kube-apiserver writes;
    # VSO does not open direct pod-to-pod connections to render Secrets.

# ──────────────────────────────────────────────────────────────────────
# Ingress allow on openbao ns: vault-secrets-operator → openbao:8200.
# Lives here (not in platform/manifests/openbao/06-networkpolicies-main.yaml)
# so VSO's NetworkPolicy footprint is colocated with VSO. apply.sh ships
# it; if VSO is uninstalled, removing this file removes the rule.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vso-to-openbao
  namespace: openbao
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: openbao
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-secrets-operator
      ports:
        - protocol: TCP
          port: 8200
