# TEMPORARY RBAC shim — REMOVE when values/vault-secrets-operator.yaml bumps the
# manager image to match the chart (chart 1.6.0 / image 1.4.0 as of 2026-10-30).
#
# Why: the 2026-10-13 chart roll (1.4.0 → 1.6.0) dropped the HCP Vault Secrets
# rules from vault-secrets-operator-manager-role because VSO 1.6 removed that
# feature — but the image is pinned at 1.4.0, which still starts the HCPAuth and
# HCPVaultSecretsApp controllers. Their informers get 403 Forbidden forever, and
# controller-runtime's per-source WaitForCacheSync waits on the whole shared
# cache, so EVERY controller times out after 2 min and the manager exits.
# The running pod predated the roll (pod template unchanged) and only hit this
# on its first restart, during the 2026-10-30 k3s-upgrade mount storm:
# CrashLoopBackOff "failed to wait for vaultconnection caches to sync".
#
# This grants read-only list/watch on the two unused HCP kinds so startup can
# complete. Debt-free path: bump the image tag to 1.6.0 (Renovate PR behind
# dashboard approval), verify, then delete this file + `kubectl delete -f` it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-secrets-operator-hcp-readonly-shim
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/temporary: "remove-after-image-1.6.0"
rules:
  - apiGroups: ["secrets.hashicorp.com"]
    resources: ["hcpauths", "hcpvaultsecretsapps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["secrets.hashicorp.com"]
    resources: ["hcpauths/status", "hcpvaultsecretsapps/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-secrets-operator-hcp-readonly-shim
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/temporary: "remove-after-image-1.6.0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-secrets-operator-hcp-readonly-shim
subjects:
  - kind: ServiceAccount
    name: vault-secrets-operator-controller-manager
    namespace: vault-secrets-operator
