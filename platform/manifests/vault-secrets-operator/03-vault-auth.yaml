# VaultAuth — how VSO authenticates to OpenBao.
# Phase 6.10b — Step 2. See ADR-0015.
#
# Method: Kubernetes auth (the same auth method enabled by the platform
# openbao-jwt-auth component). VSO presents its
# own ServiceAccount projected token to OpenBao, which validates it via
# the in-cluster TokenReview API.
#
# Why K8s auth (not JWT/SPIRE):
#   VSO is a platform-level operator that runs before SPIRE workload
#   attestation can attach a SPIFFE-ID to the controller pod. JWT/SPIRE
#   auth is the right choice for application workloads (BFF, future apps);
#   K8s auth via the operator's own ServiceAccount is the right choice
#   for platform operators that VSO itself is. ADR-0015 captures this.
#
# Role:
#   `vault-secrets-operator` — created in OpenBao by
#   configure-openbao-role.sh, bound to the SA below + the `vso` policy.

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: vault-secrets-operator
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vault-secrets-operator
    serviceAccount: vault-secrets-operator-controller-manager
    # Audience matches K8s API server issuer; both sides must agree.
    # Symmetric value lives in configure-openbao-role.sh's `audience=`
    # arg. Don't change one without the other. Using the issuer URL
    # rather than the historical "vault" shorthand for self-documenting
    # auth-failure debugging.
    audiences:
      - https://kubernetes.default.svc.cluster.local
