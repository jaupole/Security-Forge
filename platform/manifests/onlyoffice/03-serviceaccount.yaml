# Service accounts for the onlyoffice namespace.
#
# `onlyoffice` — the Document Server pod's identity. In the ambient mesh this
# SA is the basis for its mTLS workload identity
# (spiffe://cluster.local/ns/onlyoffice/sa/onlyoffice). It never talks to the
# kube-apiserver, so its token is not mounted.
#
# `onlyoffice-vso` — the identity VSO uses to authenticate to OpenBao on behalf
# of this namespace's secret consumers (renders the fleet-shared DS JWT secret,
# 04-vso-bindings.yaml). Distinct from the runtime SA so VSO's authorization
# scope and the DS's runtime identity can be reasoned about separately (same
# split as spicedb / the app namespaces). automount TRUE: VSO projects this
# SA's token to authenticate against OpenBao's kubernetes auth method.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: onlyoffice
  namespace: onlyoffice
  labels:
    app.kubernetes.io/name: onlyoffice
    secforge.platform/component: onlyoffice
    secforge.platform/role: app-identity
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: onlyoffice-vso
  namespace: onlyoffice
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true
