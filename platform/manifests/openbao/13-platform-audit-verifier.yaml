# Platform audit verifier — hourly tamper-detection for the OpenBao audit log.
# operator-backlog #85 Phase 1 / threat-model X-R1.
#
# For EACH Raft node (openbao-{0,1,2}): walks that node's off-node anchor chain
# (12-platform-audit-anchor.yaml output, platform/openbao/<node>/) from the
# committed head (_state.json) back to genesis via prev_file links, re-reads each
# anchored byte range from the LOCAL audit file, recomputes the segment + chain
# hashes, and compares to the committed values. Any rewrite/truncation of an
# anchored range -> hash mismatch -> the Job FAILS -> kube_job_status_failed ->
# PlatformAuditVerifierFailing (09-platform-alerts.yaml).
#
# Holds ZERO credentials: reads anchors UNAUTHENTICATED from raw.githubusercontent.com
# (the anchors repo is public) and never logs into OpenBao or the K8s API. A
# compromised verifier can only fail to detect — it cannot mutate the chain or the
# audit logs. Runs in the openbao ns to mount the three audit PVCs read-only.
#
# suspend:false is the operational state — re-enabled 2026-07-19 alongside the anchor (see
# docs/03-runbooks/platform-audit-anchor-activation.md).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-audit-verifier
  namespace: openbao
  labels:
    app.kubernetes.io/name: platform-audit-verifier
    secforge.platform/component: platform-audit
automountServiceAccountToken: false
---
# Egress for the verifier pod ONLY: DNS + the public internet on :443
# (raw.githubusercontent.com). No OpenBao, no in-cluster services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-audit-verifier-egress
  namespace: openbao
  labels:
    secforge.platform/component: platform-audit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-audit-verifier
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16     # k3s pod CIDR
              - 10.43.0.0/16     # k3s service CIDR
              - 169.254.0.0/16   # link-local
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-audit-verifier-script
  namespace: openbao
  labels:
    secforge.platform/component: platform-audit
data:
  verify.py: |
    #!/usr/bin/env python3
    """platform-audit-verifier — re-reads anchored byte ranges of each OpenBao Raft
    node's audit log and verifies them against the off-node signed anchors (X-R1).

    Exit 0 = all node chains intact. Exit 1 = TAMPER (rewrite/truncation of an
    anchored range). Exit 2-5 = operational/chain-integrity failure. All non-zero
    exits fail the Job -> PlatformAuditVerifierFailing."""
    import hashlib, json, os, sys, time, urllib.request, urllib.error

    REPO = os.environ["ANCHORS_REPO"]
    BRANCH = os.environ.get("ANCHORS_BRANCH", "main")
    ANCHOR_DIR = os.environ.get("ANCHOR_DIR", "platform/openbao")
    AUDIT_BASE = os.environ.get("AUDIT_BASE", "/openbao/audit")
    NODES = [n.strip() for n in os.environ.get(
        "OPENBAO_NODES", "openbao-0,openbao-1,openbao-2").split(",") if n.strip()]
    MAX_BYTES = int(os.environ.get("VERIFY_MAX_BYTES", str(512 * 1024 * 1024)))
    RAW = "https://raw.githubusercontent.com/{}/{}".format(REPO, BRANCH)

    class Tamper(Exception):
        pass

    def raw_get_json(path):
        # Retry on connection-level errors (fresh-pod Cilium cold-start / transient
        # CDN blip) AND on 429/5xx (2026-08-17: the box IP shares
        # raw.githubusercontent.com's unauthenticated quota with the self-hosted
        # CI runner — Renovate bursts starved the verifier). Honors Retry-After,
        # caps each wait at 120s. Design stays zero-credential: backoff, not a
        # token — a token able to lift the quota would also be a credential in
        # the one pod that must never hold one. Other HTTPError codes (e.g. 404)
        # are a real answer — return, don't retry.
        url = "{}/{}".format(RAW, path)
        last = None
        for attempt in range(8):
            req = urllib.request.Request(url, headers={
                "User-Agent": "secforge-platform-audit-verifier/1.0",
                "Cache-Control": "no-cache"})
            try:
                with urllib.request.urlopen(req, timeout=30) as r:
                    return r.status, r.read()
            except urllib.error.HTTPError as e:
                if e.code in (429, 500, 502, 503, 504) and attempt < 7:
                    ra = e.headers.get("Retry-After") or ""
                    delay = int(ra) if ra.isdigit() else 4 * (2 ** attempt)
                    time.sleep(min(delay, 120))
                    last = e
                    continue
                return e.code, e.read()
            except urllib.error.URLError as e:
                last = e
                if attempt < 7:
                    time.sleep(min(2 ** attempt, 10))
        raise last

    def get_json(path):
        status, body = raw_get_json(path)
        if status == 404:
            return None
        if status != 200:
            raise RuntimeError("raw GET {} -> {}".format(path, status))
        return json.loads(body)

    def verify_node(node):
        """Returns a human summary, or raises Tamper / RuntimeError."""
        state = get_json("{}/{}/_state.json".format(ANCHOR_DIR, node))
        if state is None:
            return "{}: no anchors yet — skip".format(node)
        audit_file = "{}/{}/audit.log".format(AUDIT_BASE, node)

        # Walk head -> genesis collecting anchors.
        anchors, seen, path = [], set(), state.get("head_file")
        while path:
            if path in seen:
                raise RuntimeError("{}: anchor chain loop at {}".format(node, path))
            seen.add(path)
            a = get_json(path)
            if a is None:
                raise RuntimeError("{}: anchor {} referenced but missing".format(node, path))
            anchors.append(a)
            path = a.get("prev_file") or ""
        anchors.reverse()   # genesis first

        if anchors[-1]["full_hash"] != state["full_hash"]:
            raise RuntimeError("{}: head anchor full_hash != _state.json".format(node))

        # Hash-link + offset continuity over the WHOLE chain (cheap, committed values).
        prev_full, expect_offset = "", 0
        for a in anchors:
            if a["prev_full_hash"] != prev_full:
                raise RuntimeError("{}: chain break at {}: prev_full_hash mismatch".format(
                    node, a.get("date")))
            if a["offset_from"] != expect_offset:
                raise RuntimeError("{}: offset gap/overlap at {}: from={} expected={}".format(
                    node, a.get("date"), a["offset_from"], expect_offset))
            prev_full, expect_offset = a["full_hash"], a["offset_to"]

        # Re-read LOCAL file ranges (newest-first, within byte budget) and compare.
        try:
            size = os.path.getsize(audit_file)
        except FileNotFoundError:
            raise Tamper("{}: anchored {} bytes but local audit file is MISSING".format(
                node, expect_offset))
        if size < expect_offset:
            raise Tamper("{}: local audit file ({} bytes) shorter than anchored offset {} "
                         "— audit log truncated".format(node, size, expect_offset))

        budget, checked = MAX_BYTES, 0
        with open(audit_file, "rb") as f:
            for a in reversed(anchors):
                length = a["offset_to"] - a["offset_from"]
                if checked > 0 and budget - length < 0:
                    break
                # Stream in 8MiB chunks — a whole-range read() OOMs the 256Mi pod
                # on large catch-up anchors (a 662MB range exists as of 2026-07-19).
                f.seek(a["offset_from"])
                h = hashlib.sha256()
                got, remaining = 0, length
                while remaining > 0:
                    chunk = f.read(min(8 * 1024 * 1024, remaining))
                    if not chunk:
                        break
                    h.update(chunk)
                    got += len(chunk)
                    remaining -= len(chunk)
                if got != length:
                    raise Tamper("{}: range [{}..{}] unreadable/short".format(
                        node, a["offset_from"], a["offset_to"]))
                seg_sha = h.hexdigest()
                if seg_sha != a["segment_sha256"]:
                    raise Tamper("{}: segment hash mismatch in [{}..{}] (date {}). "
                                 "committed={} local={}".format(node, a["offset_from"],
                                 a["offset_to"], a.get("date"), a["segment_sha256"], seg_sha))
                if hashlib.sha256((a["prev_full_hash"] + seg_sha).encode()).hexdigest() != a["full_hash"]:
                    raise Tamper("{}: full_hash mismatch at [{}..{}]".format(
                        node, a["offset_from"], a["offset_to"]))
                budget -= length
                checked += 1
        return "{}: chain intact ({} anchor(s), {} range(s) re-read, {} bytes)".format(
            node, len(anchors), checked, expect_offset)

    def main():
        tampers, errors, summaries = [], [], []
        for node in NODES:
            try:
                summaries.append(verify_node(node))
            except Tamper as t:
                tampers.append(str(t)); print("TAMPER: " + str(t), file=sys.stderr)
            except Exception as e:
                errors.append(str(e)); print("ERROR: " + str(e), file=sys.stderr)
        for s in summaries:
            print(s)
        if tampers:
            sys.exit(1)
        if errors:
            sys.exit(2)
        print("platform-audit: all node chains intact.")

    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-audit-verifier
  namespace: openbao
  annotations:
    checkov.io/skip1: "CKV_K8S_31=seccompProfile RuntimeDefault is set at pod + container level; checkov does not detect it inside a CronJob jobTemplate"
  labels:
    app.kubernetes.io/name: platform-audit-verifier
    secforge.platform/component: platform-audit
spec:
  suspend: false                    # re-enabled 2026-07-19 alongside the anchor
  schedule: "37 * * * *"            # hourly at :37
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: platform-audit-verifier
            secforge.platform/component: platform-audit
        spec:
          serviceAccountName: platform-audit-verifier
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            # Supplemental group 1000 = openbao pod fsGroup → read the audit PVCs.
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: verify
              image: mirror.gcr.io/library/python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
              command: ["python3", "/app/verify.py"]
              env:
                - {name: ANCHORS_REPO, value: "jaupole/secforge-audit-anchors"}
                - {name: ANCHORS_BRANCH, value: "main"}
                - {name: ANCHOR_DIR, value: "platform/openbao"}
                - {name: AUDIT_BASE, value: "/openbao/audit"}
                - {name: OPENBAO_NODES, value: "openbao-0,openbao-1,openbao-2"}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                - {name: HOME, value: "/tmp"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: "20m", memory: "64Mi"}
                limits: {cpu: "300m", memory: "256Mi"}
              volumeMounts:
                - {name: script, mountPath: /app, readOnly: true}
                - {name: audit-0, mountPath: /openbao/audit/openbao-0, readOnly: true}
                - {name: audit-1, mountPath: /openbao/audit/openbao-1, readOnly: true}
                - {name: audit-2, mountPath: /openbao/audit/openbao-2, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: platform-audit-verifier-script, defaultMode: 0444}
            - name: audit-0
              persistentVolumeClaim: {claimName: audit-openbao-0, readOnly: true}
            - name: audit-1
              persistentVolumeClaim: {claimName: audit-openbao-1, readOnly: true}
            - name: audit-2
              persistentVolumeClaim: {claimName: audit-openbao-2, readOnly: true}
            - name: tmp
              emptyDir: {}
