# Platform audit verifier — hourly tamper-detection for the OpenBao audit log.
# operator-backlog #85 Phase 1 / threat-model X-R1.
#
# Walks the off-node anchor chain (12-platform-audit-anchor.yaml output) from the
# committed head (_state.json) back to genesis via prev_file links, re-reads each
# anchored byte range from the LOCAL audit file, recomputes the segment + chain
# hashes, and compares to the committed values. Any rewrite/truncation of an
# anchored range -> hash mismatch -> the Job FAILS -> kube_job_status_failed ->
# PlatformAuditTamper / PlatformAuditVerifierFailed alert (09-platform-alerts.yaml).
#
# Holds ZERO credentials: reads anchors UNAUTHENTICATED from raw.githubusercontent.com
# (the anchors repo is public) and never logs into OpenBao or the K8s API. A
# compromised verifier can only fail to detect — it cannot mutate the chain or the
# audit log. Runs in the openbao ns to mount openbao-0's audit PVC read-only.
#
# SHIPS SUSPENDED — unsuspended alongside the anchor once anchors exist (see
# docs/03-runbooks/platform-audit-anchor-activation.md).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-audit-verifier
  namespace: openbao
  labels:
    app.kubernetes.io/name: platform-audit-verifier
    secforge.platform/component: platform-audit
automountServiceAccountToken: false
---
# Egress for the verifier pod ONLY: DNS + the public internet on :443
# (raw.githubusercontent.com). No OpenBao, no in-cluster services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-audit-verifier-egress
  namespace: openbao
  labels:
    secforge.platform/component: platform-audit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-audit-verifier
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16     # k3s pod CIDR
              - 10.43.0.0/16     # k3s service CIDR
              - 169.254.0.0/16   # link-local
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-audit-verifier-script
  namespace: openbao
  labels:
    secforge.platform/component: platform-audit
data:
  verify.py: |
    #!/usr/bin/env python3
    """platform-audit-verifier — re-reads anchored byte ranges of the OpenBao
    audit log and verifies them against the off-node signed anchors (X-R1).

    Exit 0 = chain intact. Exit 1 = TAMPER (rewrite/truncation of an anchored
    range). Exit 2-5 = operational/chain-integrity failure. All non-zero exits
    fail the Job -> PlatformAuditTamper / PlatformAuditVerifierFailed."""
    import hashlib, json, os, sys, urllib.request, urllib.error

    REPO = os.environ["ANCHORS_REPO"]
    BRANCH = os.environ.get("ANCHORS_BRANCH", "main")
    ANCHOR_DIR = os.environ.get("ANCHOR_DIR", "platform/openbao")
    STATE_PATH = ANCHOR_DIR + "/_state.json"
    AUDIT_FILE = os.environ.get("AUDIT_FILE", "/openbao/audit/audit.log")
    MAX_BYTES = int(os.environ.get("VERIFY_MAX_BYTES", str(512 * 1024 * 1024)))
    RAW = "https://raw.githubusercontent.com/{}/{}".format(REPO, BRANCH)

    def raw_get_json(path):
        url = "{}/{}".format(RAW, path)
        req = urllib.request.Request(url, headers={
            "User-Agent": "secforge-platform-audit-verifier/1.0",
            "Cache-Control": "no-cache"})
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                return r.status, r.read()
        except urllib.error.HTTPError as e:
            return e.code, e.read()

    def get_json(path):
        status, body = raw_get_json(path)
        if status == 404:
            return None
        if status != 200:
            raise RuntimeError("raw GET {} -> {}".format(path, status))
        return json.loads(body)

    def fail(code, msg):
        print(msg, file=sys.stderr)
        sys.exit(code)

    def main():
        state = get_json(STATE_PATH)
        if state is None:
            print("no anchor state yet (_state.json absent) — nothing to verify.")
            sys.exit(0)

        # Walk head -> genesis collecting anchors.
        anchors, seen, path = [], set(), state.get("head_file")
        while path:
            if path in seen:
                fail(4, "ERROR: anchor chain loop at {}".format(path))
            seen.add(path)
            a = get_json(path)
            if a is None:
                fail(4, "ERROR: anchor {} referenced but missing from repo".format(path))
            anchors.append(a)
            path = a.get("prev_file") or ""
        anchors.reverse()   # genesis first

        if anchors[-1]["full_hash"] != state["full_hash"]:
            fail(5, "ERROR: head anchor full_hash != _state.json full_hash")

        # Hash-link + offset continuity over the WHOLE chain (cheap, committed values).
        prev_full, expect_offset = "", 0
        for a in anchors:
            if a["prev_full_hash"] != prev_full:
                fail(5, "ERROR: chain break at {}: prev_full_hash mismatch".format(a.get("date")))
            if a["offset_from"] != expect_offset:
                fail(5, "ERROR: offset gap/overlap at {}: from={} expected={}".format(
                    a.get("date"), a["offset_from"], expect_offset))
            prev_full, expect_offset = a["full_hash"], a["offset_to"]

        # Re-read LOCAL file ranges (newest-first, within byte budget) and compare.
        try:
            size = os.path.getsize(AUDIT_FILE)
        except FileNotFoundError:
            fail(2, "ERROR: local audit file {} missing".format(AUDIT_FILE))
        if size < expect_offset:
            fail(1, "TAMPER: local audit file ({} bytes) shorter than anchored offset {} "
                    "— audit log was truncated.".format(size, expect_offset))

        budget, checked = MAX_BYTES, 0
        with open(AUDIT_FILE, "rb") as f:
            for a in reversed(anchors):
                length = a["offset_to"] - a["offset_from"]
                if checked > 0 and budget - length < 0:
                    print("note: byte budget reached; re-read newest {} range(s), older "
                          "ranges verified by hash-link only.".format(checked))
                    break
                f.seek(a["offset_from"])
                seg = f.read(length)
                if len(seg) != length:
                    fail(1, "TAMPER: range [{}..{}] unreadable/short in local file".format(
                        a["offset_from"], a["offset_to"]))
                seg_sha = hashlib.sha256(seg).hexdigest()
                if seg_sha != a["segment_sha256"]:
                    fail(1, "TAMPER: segment hash mismatch in [{}..{}] (date {}). committed={} "
                            "local={}".format(a["offset_from"], a["offset_to"], a.get("date"),
                                              a["segment_sha256"], seg_sha))
                if hashlib.sha256((a["prev_full_hash"] + seg_sha).encode()).hexdigest() != a["full_hash"]:
                    fail(1, "TAMPER: full_hash mismatch at [{}..{}]".format(
                        a["offset_from"], a["offset_to"]))
                budget -= length
                checked += 1

        print("platform-audit chain intact: {} anchor(s), {} range(s) re-read, {} audit "
              "bytes anchored, head full_hash={}.".format(
                  len(anchors), checked, expect_offset, state["full_hash"]))

    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-audit-verifier
  namespace: openbao
  annotations:
    checkov.io/skip1: "CKV_K8S_31=seccompProfile RuntimeDefault is set at pod + container level; checkov does not detect it inside a CronJob jobTemplate"
  labels:
    app.kubernetes.io/name: platform-audit-verifier
    secforge.platform/component: platform-audit
spec:
  suspend: true                     # unsuspended alongside the anchor (runbook)
  schedule: "37 * * * *"            # hourly at :37
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: platform-audit-verifier
            secforge.platform/component: platform-audit
        spec:
          serviceAccountName: platform-audit-verifier
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            # Supplemental group 1000 = openbao pod fsGroup → read the audit PVC.
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: verify
              image: mirror.gcr.io/library/python:3.13-slim
              command: ["python3", "/app/verify.py"]
              env:
                - {name: ANCHORS_REPO, value: "jaupole/secforge-audit-anchors"}
                - {name: ANCHORS_BRANCH, value: "main"}
                - {name: ANCHOR_DIR, value: "platform/openbao"}
                - {name: AUDIT_FILE, value: "/openbao/audit/audit.log"}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                - {name: HOME, value: "/tmp"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: "20m", memory: "64Mi"}
                limits: {cpu: "300m", memory: "256Mi"}
              volumeMounts:
                - {name: script, mountPath: /app, readOnly: true}
                - {name: audit, mountPath: /openbao/audit, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: platform-audit-verifier-script, defaultMode: 0444}
            - name: audit
              persistentVolumeClaim:
                claimName: audit-openbao-0
                readOnly: true
            - name: tmp
              emptyDir: {}
