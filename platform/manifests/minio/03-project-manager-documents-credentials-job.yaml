# MinIO credentials provisioning Job for the project-manager-documents bucket.
#
# Companion to 02-bucket-bootstrap-job.yaml, which creates the BUCKET
# (versioned + SSE-S3) but owns no credentials. This Job creates the
# per-app MinIO USER + a bucket-scoped rw POLICY so Project Manager's
# documents API can read/write the bucket.
#
# Mirror of 03-proposal-forge-files-credentials-job.yaml.
#
# Idempotent: re-runs update the policy/user in place.
#
# NOT auto-applied — depends on a one-time secret copy (the app's
# access/secret key live in the project-manager namespace). Steps
# (see docs/03-runbooks/project-manager-documents-bucket.md):
#   1. Confirm the OpenBao entry secret/minio/project-manager-documents
#      exists (access_key + secret_key) so VSO renders
#      project-manager-documents-minio in the project-manager namespace.
#   2. Copy that Secret into the minio namespace as tmp-pm-docs-app:
#        kubectl -n project-manager get secret project-manager-documents-minio -o json \
#          | jq '.metadata.namespace = "minio" | .metadata.name = "tmp-pm-docs-app"
#                | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp)' \
#          | kubectl apply -f -
#   3. Apply THIS Job:
#        bash lib/apply-manifest.sh manifests/minio/03-project-manager-documents-credentials-job.yaml
#   4. Wait for completion, then delete tmp-pm-docs-app:
#        kubectl -n minio delete secret tmp-pm-docs-app
#
# Root creds (minio-root-credentials) and the app creds (tmp-pm-docs-app)
# are both consumed via secretKeyRef — no secret value ever appears on a
# command line.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: project-manager-documents-credentials
  namespace: minio
  labels:
    app.kubernetes.io/name: project-manager-documents-credentials
    secforge.platform/component: minio
    secforge.platform/role: app-credentials
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-manager-documents-credentials
        # Required by the MinIO chart's NetworkPolicy (PodSelector: minio-client=true).
        minio-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio-root-credentials, key: rootUser }
            - name: ROOT_PASS
              valueFrom:
                secretKeyRef: { name: minio-root-credentials, key: rootPassword }
            - name: APP_ACCESS
              valueFrom:
                secretKeyRef: { name: tmp-pm-docs-app, key: MINIO_ACCESS_KEY }
            - name: APP_SECRET
              valueFrom:
                secretKeyRef: { name: tmp-pm-docs-app, key: MINIO_SECRET_KEY }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export MC_HOST_local="http://${ROOT_USER}:${ROOT_PASS}@minio.minio.svc.cluster.local:9000"
              for i in $(seq 1 30); do mc --quiet ready local 2>/dev/null && break; sleep 2; done
              # Defensive — the bucket is owned by the bootstrap Job; this
              # is a no-op if it already exists. Versioning + SSE-S3 stay
              # the bootstrap Job's responsibility.
              mc mb --ignore-existing local/project-manager-documents
              mc version enable local/project-manager-documents 2>/dev/null || true
              mc encrypt set sse-s3 local/project-manager-documents 2>/dev/null || true
              # rw policy scoped to this bucket only.
              printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::project-manager-documents"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::project-manager-documents/*"]}]}' > /tmp/policy.json
              mc admin policy create local project-manager-documents-rw /tmp/policy.json || echo "policy exists, continuing"
              mc admin user add local "${APP_ACCESS}" "${APP_SECRET}"
              mc admin policy attach local project-manager-documents-rw --user "${APP_ACCESS}" 2>/dev/null || echo "policy already attached, continuing"
              echo "--- user info ---"
              mc admin user info local "${APP_ACCESS}"
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
