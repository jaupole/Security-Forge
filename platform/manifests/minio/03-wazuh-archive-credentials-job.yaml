# MinIO credentials provisioning Job for the wazuh-archive bucket.
#
# Companion to 02-bucket-bootstrap-job.yaml, which created the BUCKET
# (versioned) back in Phase 7-rest — but the "will populate" half never
# happened: the bucket sat at 0 bytes while 09c-velero-tune.sh excluded
# the wazuh-manager PV from Velero on the assumption archives were
# "also shipped to the wazuh-archive MinIO bucket". This Job + the
# shipper CronJob (manifests/wazuh/03-archive-ship-cronjob.yaml) make
# that assumption true. Found by the 2026-07-05 infra sweep (opt-1 +
# backlog #99 item 3).
#
# Mirror of 03-proposal-forge-files-credentials-job.yaml, with one
# deliberate difference: the policy grants List/Get/Put but **NOT
# s3:DeleteObject** — the shipper is append-only, so a compromised
# wazuh-manager (or shipper pod) cannot erase already-shipped SIEM
# history. The bucket is versioned as a second layer.
#
# NOT auto-applied — one-time provisioning flow (rule 44: OpenBao is the
# authoritative store; the K8s Secret is a VSO-rendered copy):
#   1. Generate random creds and stage them in OpenBao (07e pattern —
#      root token from openbao/openbao-root-token-tmp):
#        bao kv put secret/wazuh/archive-minio \
#          MINIO_ACCESS_KEY=wazuh-archive-ship MINIO_SECRET_KEY=<random>
#   2. Apply manifests/wazuh/03-vso-binding.yaml — VSO renders Secret
#      `wazuh/wazuh-archive-minio` (vso.hcl already carries the path).
#   3. Copy the rendered Secret into the minio ns as `tmp-wazuh-archive-app`.
#   4. Apply THIS Job:
#        bash lib/apply-manifest.sh manifests/minio/03-wazuh-archive-credentials-job.yaml
#   5. Wait for Job completion, then delete `tmp-wazuh-archive-app`.
#   Rotation: repeat 1 (new secret key), wait for VSO re-render, repeat 3-5.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-archive-credentials
  namespace: minio
  labels:
    app.kubernetes.io/name: wazuh-archive-credentials
    secforge.platform/component: minio
    secforge.platform/role: app-credentials
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-archive-credentials
        # Required by the MinIO chart's NetworkPolicy (PodSelector: minio-client=true).
        minio-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio-root-credentials, key: rootUser }
            - name: ROOT_PASS
              valueFrom:
                secretKeyRef: { name: minio-root-credentials, key: rootPassword }
            - name: APP_ACCESS
              valueFrom:
                secretKeyRef: { name: tmp-wazuh-archive-app, key: MINIO_ACCESS_KEY }
            - name: APP_SECRET
              valueFrom:
                secretKeyRef: { name: tmp-wazuh-archive-app, key: MINIO_SECRET_KEY }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export MC_HOST_local="http://${ROOT_USER}:${ROOT_PASS}@minio.minio.svc.cluster.local:9000"
              for i in $(seq 1 30); do mc --quiet ready local 2>/dev/null && break; sleep 2; done
              # Bucket is owned by the bootstrap Job; no-op if present.
              mc mb --ignore-existing local/wazuh-archive
              mc version enable local/wazuh-archive 2>/dev/null || true
              # Append-only policy: List/Get/Put, deliberately NO DeleteObject
              # (see header). Get is needed by `mc mirror` remote comparison.
              printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::wazuh-archive"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::wazuh-archive/*"]}]}' > /tmp/policy.json
              mc admin policy create local wazuh-archive-append /tmp/policy.json || echo "policy exists, continuing"
              mc admin user add local "${APP_ACCESS}" "${APP_SECRET}"
              mc admin policy attach local wazuh-archive-append --user "${APP_ACCESS}" 2>/dev/null || echo "policy already attached, continuing"
              echo "--- user info ---"
              mc admin user info local "${APP_ACCESS}"
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
