# MinIO credentials provisioning Job for the k3s-datastore-backups bucket.
#
# Backs the host cron platform/scripts/k3s-datastore-backup.sh, which ships an
# online SQLite (kine) snapshot of the k3s datastore to MinIO. Velero's own
# credentials are least-privilege-scoped and cannot write here (by design), so
# this Job mints a DEDICATED user with a policy locked to this one bucket.
#
# The bucket gets SSE-S3 (encrypt at rest) + a 7-day ILM expiry so retention is
# automatic (no versioning -> expiry actually frees space).
#
# Idempotent: re-runs update policy/user in place.
#
# NOT auto-applied. Runbook: docs/03-runbooks/k3s-datastore-restore.md
#   1. generate the user's access/secret key,
#   2. create the persistent consumer Secret velero/k3s-datastore-backup-minio,
#   3. copy it into the minio namespace as tmp-k3s-db-backup,
#   4. apply THIS Job,
#   5. delete tmp-k3s-db-backup.
# Root creds + app creds are consumed via secretKeyRef — no secret on any cmdline.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k3s-datastore-backup-credentials
  namespace: minio
  labels:
    app.kubernetes.io/name: k3s-datastore-backup-credentials
    secforge.platform/component: minio
    secforge.platform/role: app-credentials
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k3s-datastore-backup-credentials
        minio-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio-root-credentials, key: rootUser }
            - name: ROOT_PASS
              valueFrom:
                secretKeyRef: { name: minio-root-credentials, key: rootPassword }
            - name: APP_ACCESS
              valueFrom:
                secretKeyRef: { name: tmp-k3s-db-backup, key: MINIO_ACCESS_KEY }
            - name: APP_SECRET
              valueFrom:
                secretKeyRef: { name: tmp-k3s-db-backup, key: MINIO_SECRET_KEY }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export MC_HOST_local="http://${ROOT_USER}:${ROOT_PASS}@minio.minio.svc.cluster.local:9000"
              for i in $(seq 1 30); do mc --quiet ready local 2>/dev/null && break; sleep 2; done
              mc mb --ignore-existing local/k3s-datastore-backups
              mc encrypt set sse-s3 local/k3s-datastore-backups || true
              mc ilm rule add --expire-days 7 local/k3s-datastore-backups 2>/dev/null \
                || mc ilm add --expiry-days 7 local/k3s-datastore-backups 2>/dev/null || true
              printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::k3s-datastore-backups"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::k3s-datastore-backups/*"]}]}' > /tmp/policy.json
              mc admin policy create local k3s-datastore-backup-rw /tmp/policy.json 2>/dev/null \
                || mc admin policy add local k3s-datastore-backup-rw /tmp/policy.json
              mc admin user add local "${APP_ACCESS}" "${APP_SECRET}"
              mc admin policy attach local k3s-datastore-backup-rw --user "${APP_ACCESS}" 2>/dev/null \
                || mc admin policy set local k3s-datastore-backup-rw user="${APP_ACCESS}"
              echo "--- user info ---"; mc admin user info local "${APP_ACCESS}"
              echo "--- bucket ilm ---"; mc ilm rule ls local/k3s-datastore-backups 2>/dev/null || mc ilm ls local/k3s-datastore-backups 2>/dev/null || true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
