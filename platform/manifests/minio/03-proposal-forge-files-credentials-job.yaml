# MinIO credentials provisioning Job for the proposal-forge-files bucket.
#
# Companion to 02-bucket-bootstrap-job.yaml, which creates the BUCKET
# (versioned + SSE-S3) but owns no credentials. This Job creates the
# per-app MinIO USER + a bucket-scoped rw POLICY so Proposal Forge's
# cover-page upload and export-asset endpoints can read/write the bucket.
#
# Mirror of 03-member-hub-documents-credentials-job.yaml. Closes the gap
# where the proposal-forge-files-minio Secret + backend env existed but
# the matching MinIO user was never created — cover uploads 500'd with
# ECONNRESET (blocked by the cross-ns NetworkPolicy, also fixed 2026-06-09)
# and then InvalidAccessKeyId once the NP was corrected.
#
# Idempotent: re-runs update the policy/user in place.
#
# NOT auto-applied — depends on a one-time secret copy (the app's
# access/secret key live in the proposal-forge namespace). Follow these
# steps:
#   1. Confirm the bucket exists (bootstrap Job).
#   2. Copy the proposal-forge `proposal-forge-files-minio` Secret into the
#      minio namespace as `tmp-pf-files-app` (base64 passthrough):
#        kubectl -n proposal-forge get secret proposal-forge-files-minio -o json \
#          | jq '.metadata.namespace = "minio" | .metadata.name = "tmp-pf-files-app"
#                | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp)' \
#          | kubectl apply -f -
#   3. Apply THIS Job:
#        bash lib/apply-manifest.sh manifests/minio/03-proposal-forge-files-credentials-job.yaml
#   4. Wait for Job completion, then delete `tmp-pf-files-app`:
#        kubectl -n minio delete secret tmp-pf-files-app
#
# Root creds (minio-root-credentials) and the app creds (tmp-pf-files-app)
# are both consumed via secretKeyRef — no secret value ever appears on a
# command line.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: proposal-forge-files-credentials
  namespace: minio
  labels:
    app.kubernetes.io/name: proposal-forge-files-credentials
    secforge.platform/component: minio
    secforge.platform/role: app-credentials
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proposal-forge-files-credentials
        # Required by the MinIO chart's NetworkPolicy (PodSelector: minio-client=true).
        minio-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio-root-credentials, key: rootUser }
            - name: ROOT_PASS
              valueFrom:
                secretKeyRef: { name: minio-root-credentials, key: rootPassword }
            - name: APP_ACCESS
              valueFrom:
                secretKeyRef: { name: tmp-pf-files-app, key: MINIO_ACCESS_KEY }
            - name: APP_SECRET
              valueFrom:
                secretKeyRef: { name: tmp-pf-files-app, key: MINIO_SECRET_KEY }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export MC_HOST_local="http://${ROOT_USER}:${ROOT_PASS}@minio.minio.svc.cluster.local:9000"
              for i in $(seq 1 30); do mc --quiet ready local 2>/dev/null && break; sleep 2; done
              # Defensive — the bucket is owned by the bootstrap Job; this
              # is a no-op if it already exists. Versioning + SSE-S3 stay
              # the bootstrap Job's responsibility.
              mc mb --ignore-existing local/proposal-forge-files
              mc version enable local/proposal-forge-files 2>/dev/null || true
              mc encrypt set sse-s3 local/proposal-forge-files 2>/dev/null || true
              # rw policy scoped to this bucket only.
              printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::proposal-forge-files"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::proposal-forge-files/*"]}]}' > /tmp/policy.json
              mc admin policy create local proposal-forge-files-rw /tmp/policy.json || echo "policy exists, continuing"
              mc admin user add local "${APP_ACCESS}" "${APP_SECRET}"
              mc admin policy attach local proposal-forge-files-rw --user "${APP_ACCESS}" 2>/dev/null || echo "policy already attached, continuing"
              echo "--- user info ---"
              mc admin user info local "${APP_ACCESS}"
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
