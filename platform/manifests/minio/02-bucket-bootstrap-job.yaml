# MinIO bucket bootstrap Job (production).
#
# Replaces the upstream chart's `makeBucketJob`, which can't satisfy
# `restricted` PSA. Same end result, our hardening.
#
# Buckets created (idempotent):
#   - tempo-traces             (no Object Lock; Tempo enforces 7d retention)
#   - loki-chunks              (no Object Lock; Loki enforces 14d retention)
#   - backups                  (versioned)
#   - wazuh-archive            (versioned)
#   - member-hub-documents     (versioned + SSE-S3; member file attachments)
#   - ecosystem-graphics       (versioned + SSE-S3; ADR-0001 graphics library)
#   - ecosystem-brand-kit      (versioned + SSE-S3; ADR-0002 brand-kit fonts)
#   - proposal-forge-files     (versioned + SSE-S3; PF cover + RFP + asset uploads)
#   - business-manager-documents (versioned + SSE-S3; BM engagement doc attachments + ONLYOFFICE view)
#
# Re-run safe: `mb --ignore-existing` and repeated `version enable` are no-ops.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-bootstrap
  namespace: minio
  labels:
    secforge.platform/component: minio
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bucket-bootstrap
        # Required by the chart's NetworkPolicy (PodSelector: minio-client=true)
        minio-client: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 250m, memory: 64Mi }
          env:
            - name: ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootUser
            - name: ROOT_PASS
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootPassword
          command: ["/bin/sh"]
          args:
            - -c
            - |
              set -eu
              export MC_HOST_local="http://${ROOT_USER}:${ROOT_PASS}@minio.minio.svc.cluster.local:9000"
              echo "Waiting for MinIO to be reachable..."
              for i in $(seq 1 60); do
                if mc --quiet ready local 2>/dev/null; then
                  echo "MinIO ready"
                  break
                fi
                sleep 2
              done

              # tempo-traces: plain bucket, no Object Lock.
              mc mb --ignore-existing local/tempo-traces

              # loki-chunks: plain bucket, no Object Lock.
              mc mb --ignore-existing local/loki-chunks

              # backups: versioned (CNPG / Velero target).
              mc mb --ignore-existing local/backups
              mc version enable local/backups

              # wazuh-archive: versioned (Phase 7-rest will populate).
              mc mb --ignore-existing local/wazuh-archive
              mc version enable local/wazuh-archive

              # member-hub-documents: versioned + SSE-S3 server-side encryption.
              # Holds member file attachments uploaded via Member Hub's
              # member-documents API. Versioning protects against accidental
              # operator DELETE; SSE-S3 encrypts at rest. The MinIO service
              # account that the app uses is provisioned out-of-band by
              # 03-member-hub-documents-credentials-job.yaml (see
              # docs/03-runbooks/member-hub-documents-bucket.md) — this Job
              # only owns bucket creation, never credentials.
              mc mb --ignore-existing local/member-hub-documents
              mc version enable local/member-hub-documents
              mc encrypt set sse-s3 local/member-hub-documents

              # project-manager-documents: versioned + SSE-S3 server-side
              # encryption. Holds per-project file attachments (subcontracts,
              # vendor quotes, drawings) uploaded via Project Manager's
              # documents API. The MinIO service account the app uses is
              # provisioned out-of-band by
              # 03-project-manager-documents-credentials-job.yaml (see
              # docs/03-runbooks/project-manager-documents-bucket.md) — this
              # Job only owns bucket creation, never credentials.
              mc mb --ignore-existing local/project-manager-documents
              mc version enable local/project-manager-documents
              mc encrypt set sse-s3 local/project-manager-documents

              # business-manager-documents: versioned + SSE-S3 server-side
              # encryption. Holds engagement document attachments (and the
              # ONLYOFFICE-rendered view copies) uploaded via Business
              # Manager's documents API. The MinIO service account the app
              # uses is provisioned out-of-band by
              # 03-business-manager-documents-credentials-job.yaml (see
              # docs/03-runbooks/business-manager-documents-bucket.md) — this
              # Job only owns bucket creation, never credentials.
              mc mb --ignore-existing local/business-manager-documents
              mc version enable local/business-manager-documents
              mc encrypt set sse-s3 local/business-manager-documents

              # ecosystem-graphics: per-org branded graphics library
              # (ADR-0001 Phase A in Member Hub/docs/02-decisions/).
              # Owned by Ecosystem Control; consumed cross-app by Member
              # Hub's invoice-PDF + email rendering and future ecosystem
              # apps. Versioned (operator DELETE protection) + SSE-S3.
              # Caps live at the app layer: 8 graphics/org, 512 KB each.
              mc mb --ignore-existing local/ecosystem-graphics
              mc version enable local/ecosystem-graphics
              mc encrypt set sse-s3 local/ecosystem-graphics

              # ecosystem-brand-kit: per-org public-website brand-kit
              # fonts (ADR-0002 Phase A in Member Hub/docs/02-decisions/).
              # Owned by Ecosystem Control; consumed cross-app by every
              # public-page renderer (Member Hub today; PT/PF future).
              # Stores ONLY uploaded font binaries — colours, logo data
              # URLs, and other brand-kit metadata live in
              # organizations.settings.branding JSONB. Versioned (operator
              # DELETE protection) + SSE-S3. Object key pattern:
              # {org_id}/fonts/{sha256}.{ext}. Caps at app layer: 3 fonts
              # per org (one per slot), 200 KB each.
              mc mb --ignore-existing local/ecosystem-brand-kit
              mc version enable local/ecosystem-brand-kit
              mc encrypt set sse-s3 local/ecosystem-brand-kit

              # proposal-forge-files: versioned + SSE-S3 (cover-page + RFP +
              # asset uploads via PF's export wizard). Service account is
              # provisioned out-of-band by
              # 03-proposal-forge-files-credentials-job.yaml.
              mc mb --ignore-existing local/proposal-forge-files
              mc version enable local/proposal-forge-files
              mc encrypt set sse-s3 local/proposal-forge-files

              # ---- backups bucket lifecycle (SF#162) ----------------------
              # The bucket is versioned, so barman/velero deletes only write
              # delete markers — noncurrent versions otherwise accumulate
              # forever. Bucket-wide: reclaim noncurrent versions 30 days
              # after they become noncurrent (keeps the accidental-delete
              # recovery window versioning exists for) and drop expired
              # delete markers. Per retired-CNPG prefix (SF#155 decommission,
              # 2026-07-13): expire current versions 90 days after creation —
              # the final <app>-db-final-sf155 backups age out 2026-10-11 —
              # and purge their noncurrent versions after 1 day. ILM deletes
              # by metadata, so it also cleans versions encrypted with the
              # retired KMS key that mc cannot list.  errors
              # on a duplicate rule definition —  keeps re-runs
              # idempotent (mc has no rule upsert).
              mc ilm rule add --noncurrent-expire-days 30 local/backups 2>/dev/null || true
              mc ilm rule add --expire-delete-marker local/backups 2>/dev/null || true
              for app in control member-hub proposal-forge business-manager project-manager; do
                mc ilm rule add --prefix "cnpg/${app}/" --expire-days 90 --noncurrent-expire-days 1 local/backups 2>/dev/null || true
              done
              echo "--- backups ilm ---"
              mc ilm rule ls local/backups || true

              echo "--- buckets ---"
              mc ls local/
              echo "Bootstrap complete."
          volumeMounts:
            - name: mc-config
              mountPath: /.mc
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mc-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
