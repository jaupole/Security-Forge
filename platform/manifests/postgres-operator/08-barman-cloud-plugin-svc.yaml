# ExternalName Service that registers the Barman Cloud Plugin with the CNPG operator.
#
# The CNPG operator discovers plugins by scanning Services with the
# cnpg.io/pluginName label ONLY within its own namespace (postgres-operator).
# The plugin itself runs in cnpg-system (hardcoded in the upstream manifest).
#
# This ExternalName Service acts as a pointer: the operator finds it in
# postgres-operator, reads the annotations for TLS secret names, then connects
# to barman-cloud.cnpg-system.svc.cluster.local:9090 for the actual gRPC+mTLS
# communication.
#
# The two TLS Secrets referenced in the annotations (barman-cloud-client-tls
# and barman-cloud-server-tls) are generated by cert-manager when the
# barman-cloud plugin manifest is applied. They must be copied from cnpg-system
# to postgres-operator by 09h-cnpg-barman-plugin.sh before this Service is
# applied (the operator reads them at startup — missing secrets → plugin ignored).

apiVersion: v1
kind: Service
metadata:
  name: barman-cloud
  namespace: postgres-operator
  labels:
    cnpg.io/pluginName: barman-cloud.cloudnative-pg.io
  annotations:
    cnpg.io/pluginClientSecret: barman-cloud-client-tls
    cnpg.io/pluginServerSecret: barman-cloud-server-tls
    cnpg.io/pluginPort: "9090"
spec:
  type: ExternalName
  externalName: barman-cloud.cnpg-system.svc.cluster.local
  ports:
    - port: 9090
      protocol: TCP
      targetPort: 9090
