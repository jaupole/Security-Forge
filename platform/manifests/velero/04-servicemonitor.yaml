# Scrape Velero's metrics (added 2026-05-30). Without this, velero_backup_*
# series don't exist and the backup alerts in
# observability/09-platform-alerts.yaml (secforge-backups group) can't fire.
# The velero namespace already has `allow-prometheus-to-velero-metrics`, so a
# ServiceMonitor is all that's needed. Picked up via serviceMonitorSelector={}.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: velero
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    secforge.platform/component: velero
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: velero
  endpoints:
    - port: http-monitoring
      interval: 30s
