# VSO binding for cert-manager's Cloudflare API token.
#
# Renders OpenBao secret/data/platform/cert-manager/cloudflare into
# K8s Secret `cloudflare-api-token-vso` in cert-manager ns. The
# letsencrypt-prod / -staging ClusterIssuers reference this Secret
# for DNS-01 challenge solving.
#
# The token is created out-of-band (operator-step in Cloudflare UI)
# with permissions: `Zone: DNS: Edit` scoped to the secforge.dev zone.
# Stashed in OpenBao by 00b-cert-manager.sh on first run (reads from
# the existing static `cloudflare-api-token` Secret if present).

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-vso
  namespace: cert-manager
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cert-manager-vso
  namespace: cert-manager
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: cert-manager-vso
    serviceAccount: cert-manager-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token-vso
  namespace: cert-manager
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: cert-manager-vso
  mount: secret
  type: kv-v2
  path: platform/cert-manager/cloudflare
  refreshAfter: 1h
  destination:
    name: cloudflare-api-token-vso
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        # ClusterIssuer expects key `api-token` per the cloudflare DNS-01
        # solver schema. Map OpenBao KV `token` field to that key.
        api-token:
          text: '{{ .Secrets.token }}'
