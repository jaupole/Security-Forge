# Let's Encrypt ClusterIssuers — staging + prod.
#
# Both use Cloudflare DNS-01 challenge against the secforge.dev zone.
# Token Secret is `cloudflare-api-token-vso` rendered by VSO from
# OpenBao at secret/data/platform/cert-manager/cloudflare.
#
# Staging issuer is for testing — Let's Encrypt rate-limits prod hard
# if you hammer it with failed renewals during config tuning.
# letsencrypt-staging certs are not browser-trusted but otherwise
# behave identically.

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    secforge.platform/component: cert-manager
spec:
  acme:
    email: ${LE_EMAIL}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-vso
              key: api-token
        selector:
          dnsZones:
            - ${DOMAIN}

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ${LE_ISSUER}
  labels:
    secforge.platform/component: cert-manager
spec:
  acme:
    email: ${LE_EMAIL}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-vso
              key: api-token
        selector:
          dnsZones:
            - ${DOMAIN}
