# Scrape cert-manager's metrics (added 2026-05-30) so the cert-expiry /
# cert-not-ready alerts (observability/09-platform-alerts.yaml, secforge-certs
# group) have data. cert-manager already ships
# `allow-prometheus-to-cert-manager-metrics`, so only the ServiceMonitor is
# missing. Picked up via serviceMonitorSelector={}.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    secforge.platform/component: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
    - port: tcp-prometheus-servicemonitor
      interval: 30s
