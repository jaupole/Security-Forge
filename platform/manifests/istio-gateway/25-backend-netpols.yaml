# Allow the Istio gateway (ns istio-ingress) to reach each backend it routes to.
# Mirrors the existing allow-ingress-nginx-to-<backend> policies (same pod
# selectors + pod ports); the nginx ones are removed at decommission. These live
# in the BACKEND namespaces.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-istio-ingress-to-grafana, namespace: observability, labels: { secforge.platform/component: istio-gateway } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-ingress } } }]
      ports: [{ port: 3000, protocol: TCP }]
---
# control ns hosts both control (8080) and portal (4000) pods; mirror the nginx
# all-pods + both-ports allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-istio-ingress-to-control, namespace: control, labels: { secforge.platform/component: istio-gateway } }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-ingress } } }]
      ports: [{ port: 4000, protocol: TCP }, { port: 8080, protocol: TCP }]
