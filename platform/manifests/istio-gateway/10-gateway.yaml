# The Istio ingress Gateway: terminates HTTPS for every *.secforge.dev host
# with the wildcard cert, and 301-redirects :80→:443. Per-host routing lives in
# 20-virtualservices.yaml. Selects the gateway proxy deployed by the
# istio/gateway chart (label istio: istio-ingress).
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: secforge-gateway
  namespace: istio-ingress
  labels:
    secforge.platform/component: istio-gateway
spec:
  # The istio/gateway chart strips the leading "istio-" from the release name
  # for the `istio` pod label, so release "istio-ingress" → label istio: ingress.
  selector:
    istio: ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts: ["*.secforge.dev", "secforge.dev"]
      tls:
        httpsRedirect: true   # mirrors nginx ssl-redirect
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts: ["*.secforge.dev", "secforge.dev"]
      tls:
        mode: SIMPLE
        credentialName: secforge-wildcard-tls
        minProtocolVersion: TLSV1_2   # nginx: "TLSv1.3 TLSv1.2"
        cipherSuites:                 # TLS1.2 PFS suites (TLS1.3 suites are fixed)
          - ECDHE-ECDSA-AES256-GCM-SHA384
          - ECDHE-RSA-AES256-GCM-SHA384
          - ECDHE-ECDSA-CHACHA20-POLY1305
          - ECDHE-RSA-CHACHA20-POLY1305
          - ECDHE-ECDSA-AES128-GCM-SHA256
          - ECDHE-RSA-AES128-GCM-SHA256
