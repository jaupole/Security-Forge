# ingress-nginx forwards every incoming request to an upstream Service
# in another namespace. Rather than enumerate every backend, allow
# all cluster-internal egress (pod-CIDR + service-CIDR) while
# default-deny-egress blocks external Internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cluster-internal
  namespace: ingress-nginx
  labels:
    secforge.platform/component: egress-baseline
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 10.43.0.0/16
