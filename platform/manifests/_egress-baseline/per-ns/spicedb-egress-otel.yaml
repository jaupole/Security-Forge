# Added 2026-05-12 — spicedb-operator emits OTLP traces to
# otel-collector.observability:4317/4318.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-otel-collector
  namespace: spicedb
  labels:
    secforge.platform/component: egress-baseline
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - {port: 4317, protocol: TCP}
        - {port: 4318, protocol: TCP}
