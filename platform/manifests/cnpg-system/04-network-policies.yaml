# Layer A NetworkPolicies for the cnpg-system namespace.
#
# Holds the barman-cloud plugin (CNPG's backup mechanism). It:
#   - Is reached by CNPG cluster pods (across keycloak/spicedb/etc ns)
#     on port 9090 for backup ops
#   - Reaches MinIO :9000 to upload backup blobs
#   - Reaches K8s API for status/leases
#
# Applied 2026-05-14.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cnpg-system
  labels:
    secforge.platform/component: cnpg-system
    secforge.platform/policy-tier: layer-a
spec:
  podSelector: {}
  policyTypes: [Ingress]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: cnpg-system
  labels:
    secforge.platform/component: cnpg-system
    secforge.platform/policy-tier: layer-a
spec:
  podSelector: {}
  policyTypes: [Egress]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-essentials
  namespace: cnpg-system
  labels:
    secforge.platform/component: cnpg-system
    secforge.platform/policy-tier: layer-a
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 65.21.25.40/32
    ports:
    - protocol: TCP
      port: 6443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-minio
  namespace: cnpg-system
  labels:
    secforge.platform/component: cnpg-system
    secforge.platform/policy-tier: layer-a
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: minio
    ports:
    - protocol: TCP
      port: 9000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-cluster-pods-to-barman
  namespace: cnpg-system
  labels:
    secforge.platform/component: cnpg-system
    secforge.platform/policy-tier: layer-a
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [keycloak, spicedb, verify-restore, postgres-operator]
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 15008   # ambient HBONE (7c-2 enrollment sweep)
