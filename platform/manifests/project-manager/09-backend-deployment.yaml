# Project Manager app (Hono + TS, distroless nodejs22).
#
# Listens on :3003. Reverse-proxied by the Istio tailnet gateway via
# the project-manager Service (10-services.yaml). Single deployment — Hono
# serves both /api/* (JSON handlers) and the React+Vite SPA built to
# client/dist, with SPA-fallback to index.html. No separate SPA Deployment.
#
# Tailnet-only: projects.${DOMAIN} has no public DNS A record. Operator
# reaches it via the tailnet gateway (projects.${DOMAIN} → ${TAILNET_IP}).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-manager
  namespace: project-manager
  labels:
    app.kubernetes.io/name: project-manager
    app.kubernetes.io/component: app
    secforge.platform/component: project-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: project-manager
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-manager
        app.kubernetes.io/component: app
        secforge.platform/component: project-manager
        # MinIO chart's cross-ns NetworkPolicy gates ingress on this label.
        minio-client: "true"
    spec:
      serviceAccountName: project-manager
      automountServiceAccountToken: false
      # GHCR pull credential — VSO-rendered dockerconfigjson Secret
      # (see 04-vso-bindings.yaml `ghcr-pull-secret`).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Bump to the signed digest after first image build.
          image: ghcr.io/jaupole/project-manager@sha256:20f4108e179262fa8cf9a88d202c228d104c50de0b07af5845229996873af4c5
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 3003, name: http, protocol: TCP }
          env:
            # Static config
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3003" }
            - { name: HOST, value: "0.0.0.0" }
            - { name: TRUST_PROXY, value: "1" }
            # In-cluster DNS rewrites auth.${DOMAIN} → keycloak ClusterIP,
            # which presents its INTERNAL cert. Point NODE_EXTRA_CA_CERTS at
            # the internal CA so Node's TLS stack can verify the chain.
            - { name: NODE_EXTRA_CA_CERTS, value: "/etc/secforge/openbao-ca.crt" }
            # Keycloak OIDC config. KEYCLOAK_TENANTS_REALM accepts tokens from
            # BOTH realms when set (same pattern as member-hub).
            - { name: KEYCLOAK_URL, value: "https://auth.${DOMAIN}" }
            - { name: KEYCLOAK_REALM, value: platform }
            - { name: KEYCLOAK_TENANTS_REALM, value: secforge-tenants }
            # Cross-app theme cookie: scope to the shared parent domain.
            - { name: THEME_COOKIE_DOMAIN, value: ".${DOMAIN}" }
            # User-login OIDC client. OIDC_CLIENT_SECRET + OIDC_CLIENT_SECRET_TENANTS
            # come from VSO-rendered project-manager-app-secrets via envFrom below.
            - { name: OIDC_CLIENT_ID, value: project-manager }
            # Ecosystem Control — in-cluster Service in the `control` ns.
            - { name: ECOSYSTEM_CONTROL_API_URL, value: "http://control.control.svc.cluster.local" }
            # SpiceDB — in-cluster Service.
            - { name: SPICEDB_ENDPOINT, value: "spicedb.spicedb.svc.cluster.local:50051" }
            # CNPG-rendered DB credentials. Feed DATABASE_URL from the `uri` key.
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: project-manager-db-app, key: uri } } }
            - { name: PGSSLMODE, value: "require" }
            # OTLP exporter.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318" }
            - { name: OTEL_SERVICE_NAME, value: project-manager }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=project-manager,deployment.environment=prod" }
            # NOTE: no OpenBao Transit / SPIFFE wiring — PROJECT_MANAGER Phase 1
            # does no field-level PII encryption (env.ts reads no OPENBAO_*/
            # TRANSIT_* vars). The spiffe-helper sidecar + JWT auth role were
            # removed to drop an unused dependency and a crashloop surface;
            # re-add them with the role when a PII-encryption phase lands.
            # Gotenberg document rendering service (Phase 5 — status-report PDF).
            # Service is named `gotenberg` in the document-render ns (10-services.yaml).
            - { name: GOTENBERG_URL, value: "http://gotenberg.document-render.svc.cluster.local:3000" }
            # ─── Object storage (project document attachments) ─────────
            # MinIO is in-cluster; HTTP (no TLS) — the mesh + namespace
            # NetworkPolicy keep traffic on the cluster network. SSE-S3
            # encryption-at-rest is set on the bucket itself. MINIO_ACCESS_KEY
            # + MINIO_SECRET_KEY come from the project-manager-documents-minio
            # Secret via envFrom below.
            - { name: MINIO_ENDPOINT, value: "minio.minio.svc.cluster.local" }
            - { name: MINIO_PORT,     value: "9000" }
            - { name: MINIO_USE_SSL,  value: "false" }
            - { name: MINIO_BUCKET,   value: project-manager-documents }
          envFrom:
            # Adds OIDC_CLIENT_SECRET, OIDC_CLIENT_SECRET_TENANTS,
            # SPICEDB_PRESHARED_KEY, SESSION_KEY from the VSO-rendered Secret.
            # All come from secret/apps/project-manager/runtime in OpenBao
            # via the VaultStaticSecret in 04-vso-bindings.yaml.
            - secretRef:
                name: project-manager-app-secrets
            # Adds MINIO_ACCESS_KEY + MINIO_SECRET_KEY rendered from
            # secret/minio/project-manager-documents (bucket-scoped svc
            # account; rw on project-manager-documents only). OPTIONAL so the
            # pod starts before the bucket/creds are provisioned — until then
            # the app has no MinIO env and document uploads return a clean 503.
            - secretRef:
                name: project-manager-documents-minio
                optional: true
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            # Distroless nodejs22 needs /tmp writable for sourcemaps + V8 cache.
            - { name: tmp, mountPath: /tmp }
            # OpenBao internal CA cert (signed by secforge-internal-ca) —
            # NODE_EXTRA_CA_CERTS uses it to verify Keycloak's + SpiceDB's
            # internal TLS chains. Not Transit-related.
            - { name: openbao-ca, mountPath: /etc/secforge, readOnly: true }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: openbao-ca
          configMap:
            name: openbao-internal-ca-cert
            items:
              - key: ca.crt
                path: openbao-ca.crt
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: project-manager
              app.kubernetes.io/component: app
