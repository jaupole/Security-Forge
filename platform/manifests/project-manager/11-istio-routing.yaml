# Istio routing for projects.${DOMAIN}.
#
# Public + tailnet since 2026-06-16 (operator decision): attached to both
# secforge-gateway (public) and secforge-gateway-tailnet. Reaching it over the
# internet requires a public DNS A record for projects.${DOMAIN} → ${PUBLIC_IP};
# the *.${DOMAIN} wildcard TLS cert already covers the host. The app enforces
# Keycloak OIDC + org-scoped authz + RLS + the app-activation gate. Mirrors the
# proposal-forge and business-manager VirtualServices in
# platform/manifests/istio-ingress/20-virtualservices.yaml.
#
# IMPORTANT: This VirtualService lives here in the project-manager dir for
# review convenience. When applying, it must be applied alongside (or after)
# the istio-ingress manifests. The `bash lib/apply-manifest.sh` step in
# DEPLOY.md handles this in the right order.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: project-manager
  namespace: istio-ingress
  labels:
    secforge.platform/component: istio-gateway
spec:
  gateways:
    - istio-ingress/secforge-gateway
    - istio-ingress/secforge-gateway-tailnet
  hosts:
    - projects.${DOMAIN}
  http:
    - name: project-manager
      route:
        - destination:
            host: project-manager.project-manager.svc.cluster.local
            port:
              number: 80
