# In-cluster Service for the project-manager namespace.
# ClusterIP-only — external access is via the Istio tailnet gateway
# VirtualService (11-istio-routing.yaml).
#
# Single Service: Project Manager is a single Hono app. The Service's
# port 80 forwards to the Hono container's :3003 listening port.

---
apiVersion: v1
kind: Service
metadata:
  name: project-manager
  namespace: project-manager
  labels:
    app.kubernetes.io/name: project-manager
    app.kubernetes.io/component: app
    secforge.platform/component: project-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: project-manager
    app.kubernetes.io/component: app
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
