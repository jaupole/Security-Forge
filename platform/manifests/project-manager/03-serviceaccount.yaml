# Service accounts for the project-manager namespace.
#
# Two roles, distinct SPIFFE identities:
#   1. `project-manager` — the API backend pod + migration Job.
#      Bound to SPIFFE-ID spiffe://${SPIFFE_TRUST_DOMAIN}/ns/project-manager/sa/project-manager
#      via SPIRE's ClusterSPIFFEID (kept in components/05-spire.sh).
#   2. `project-manager-vso` — the VSO consumer SA. Used only by VaultStaticSecret /
#      VaultAuth CRs in 04-vso-bindings.yaml to fetch app secrets from
#      OpenBao and render them as K8s Secrets.
#
# Neither SA auto-mounts its token by default; the workloads that need a
# projected service-account token explicitly request one via
# `serviceAccountToken` volume mount + the SPIFFE CSI driver.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-manager
  namespace: project-manager
  labels:
    app.kubernetes.io/name: project-manager
    secforge.platform/component: project-manager
    secforge.platform/role: app-identity
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-manager-vso
  namespace: project-manager
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true
