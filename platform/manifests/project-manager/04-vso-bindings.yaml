# VSO bindings for the project-manager namespace.
#
# Two rendered K8s Secrets:
#   - project-manager-app-secrets  → app-level keys (session-signing,
#                                    SpiceDB PSK, Keycloak client_secrets)
#   - ghcr-pull-secret             → GHCR image-pull dockerconfigjson
#   - cnpg-minio-credentials       → barman-cloud → MinIO bucket credentials
#
# The OpenBao policy that grants reads on these paths lives at
# `platform/manifests/openbao/policies/project-manager.hcl`. The K8s auth
# role binding (k8s SA `project-manager-vso` → policy `project-manager`) is
# created by the openbao bootstrap.

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: project-manager-vso
  namespace: project-manager
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: project-manager-vso
    serviceAccount: project-manager-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
# Aggregates app-level secrets (Keycloak client, SpiceDB, session key)
# into a single K8s Secret consumed via envFrom in the backend Deployment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: project-manager-app-secrets
  namespace: project-manager
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: project-manager-vso
  mount: secret
  type: kv-v2
  path: apps/project-manager/runtime
  refreshAfter: 1h
  destination:
    name: project-manager-app-secrets
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        # Keycloak OIDC client_secret (user-login `project-manager` client,
        # platform realm). App reads as OIDC_CLIENT_SECRET.
        OIDC_CLIENT_SECRET:
          text: '{{ .Secrets.oidc_client_secret }}'
        # Same `project-manager` client in the TENANTS realm — a separate
        # confidential client with its own secret. App reads as
        # OIDC_CLIENT_SECRET_TENANTS. Optional: when absent the template
        # renders empty and the app keeps platform-only sign-in.
        OIDC_CLIENT_SECRET_TENANTS:
          text: '{{ if .Secrets.oidc_client_secret_tenants }}{{ .Secrets.oidc_client_secret_tenants }}{{ end }}'
        # project-manager-system client-credentials secret for PM->Control
        # workflow gate/manifest calls. Published by 05l to system_client_secret.
        # Optional: absent renders empty (gate fails closed when enabled).
        PM_SYSTEM_CLIENT_SECRET:
          text: '{{ if .Secrets.system_client_secret }}{{ .Secrets.system_client_secret }}{{ end }}'
        # SpiceDB pre-shared key for gRPC auth (same value also rendered
        # into the spicedb pod from its own VSO binding — we just
        # consume it here, not own it).
        SPICEDB_PRESHARED_KEY:
          text: '{{ .Secrets.spicedb_psk }}'
        # Session signing key (raw 32-byte base64). Generate once via
        # `openssl rand -base64 32` and store in OpenBao; rotate via
        # OpenBao + Pod restart.
        SESSION_KEY:
          text: '{{ .Secrets.session_signing_key }}'

---
# GHCR image-pull credential. Renders into a kubernetes.io/dockerconfigjson
# Secret consumed via `imagePullSecrets:` on 08-migration-job.yaml and
# 09-backend-deployment.yaml. Token is a classic PAT scoped to read:packages
# on jaupole/project-manager.
#
# OpenBao path: secret/data/apps/project-manager/ghcr-pull
#   - username: GitHub user (jaupole)
#   - password: PAT (rotate via OpenBao + 90-day expiry on the GH token)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull-secret
  namespace: project-manager
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: project-manager-vso
  mount: secret
  type: kv-v2
  path: apps/project-manager/ghcr-pull
  refreshAfter: 5m
  destination:
    name: ghcr-pull-secret
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ".dockerconfigjson":
          text: |-
            {"auths":{"ghcr.io":{"username":"{{ .Secrets.username }}","password":"{{ .Secrets.password }}","auth":"{{ printf "%s:%s" .Secrets.username .Secrets.password | b64enc }}"}}}

---
# barman-cloud → MinIO credentials for CNPG WAL archiving + base backups.
# Same shared path as every other CNPG cluster's barman creds.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cnpg-minio-credentials-vso
  namespace: project-manager
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: project-manager-vso
  mount: secret
  type: kv-v2
  path: minio/cnpg/credentials
  refreshAfter: 1h
  destination:
    name: cnpg-minio-credentials
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ACCESS_KEY_ID:
          text: '{{ .Secrets.access_key }}'
        ACCESS_SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'

---
# App-level MinIO credentials for the project-manager-documents bucket.
# Distinct from the CNPG barman creds above (shared `backups` bucket); this
# set grants rw on the per-app `project-manager-documents` bucket only, used
# by the documents API (modules/documents) for project file attachments.
#
# Rendered as MINIO_ACCESS_KEY + MINIO_SECRET_KEY, consumed via envFrom on
# the backend Deployment (09-backend-deployment.yaml).
#
# OPERATOR PREREQUISITE: the OpenBao secret at secret/minio/project-manager-
# documents (keys: access_key, secret_key) must exist, created alongside the
# MinIO bucket + a bucket-scoped service account. Until then VSO leaves the
# Secret unrendered and uploads return a clean 503.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: project-manager-documents-minio-vso
  namespace: project-manager
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: project-manager-vso
  mount: secret
  type: kv-v2
  path: minio/project-manager-documents
  refreshAfter: 1h
  destination:
    name: project-manager-documents-minio
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        MINIO_ACCESS_KEY:
          text: '{{ .Secrets.access_key }}'
        MINIO_SECRET_KEY:
          text: '{{ .Secrets.secret_key }}'

---
# ONLYOFFICE Document Server fleet-shared JWT secret (DOCENG). PM signs editor
# embed configs + ConvertService (DOCX->PDF) calls and verifies the DS's save
# callbacks with it — editable project documents + awarded-proposal viewer.
# SAME OpenBao path as the onlyoffice namespace's own sync
# (onlyoffice/04-vso-bindings.yaml) — one secret, N namespaces, VSO-managed;
# rotation = rotate in OpenBao, every sync follows. PM's VSO role
# (project-manager-vso) binds ONLY the `project-manager` policy (not the shared
# `vso` policy PF rides), so the read grant lives in
# openbao/policies/project-manager.hcl. Rendered as ONLYOFFICE_JWT_SECRET,
# consumed via envFrom on the backend Deployment (09-backend-deployment.yaml).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: onlyoffice-jwt
  namespace: project-manager
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: project-manager-vso
  mount: secret
  type: kv-v2
  path: apps/onlyoffice/jwt
  refreshAfter: 1h
  destination:
    name: onlyoffice-jwt
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        ONLYOFFICE_JWT_SECRET:
          text: '{{ .Secrets.jwt_secret }}'
