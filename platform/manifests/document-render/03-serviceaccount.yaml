# Service account for the document-render namespace.
#
# `gotenberg` — the rendering pod's identity. In the ambient mesh this SA is the
# basis for its mTLS workload identity
# (spiffe://cluster.local/ns/document-render/sa/gotenberg).
#
# There is NO VSO consumer SA here: this service holds NO secrets. It calls
# nothing outbound (NetworkPolicy denies all egress but DNS), needs no DB, no
# OpenBao, no integration credentials. The image is pulled from a PUBLIC GHCR
# package (ghcr.io/jaupole/gotenberg — a thin signed build over the public
# upstream), so the pod needs no imagePullSecret either. Keeping this namespace
# secret-free is the
# point: the most exposed component (it renders user-authored HTML) has nothing
# worth stealing and nowhere to send it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gotenberg
  namespace: document-render
  labels:
    app.kubernetes.io/name: document-render
    secforge.platform/component: document-render
    secforge.platform/role: app-identity
automountServiceAccountToken: false
