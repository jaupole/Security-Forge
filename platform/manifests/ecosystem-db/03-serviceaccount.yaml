# Service account for the ecosystem-db namespace.
#
# Only the VSO consumer SA is needed here — this namespace runs the CNPG cluster,
# not an app. `ecosystem-db-vso` is used solely by the VaultAuth / VaultStaticSecret
# CRs in 04-vso-bindings.yaml to fetch the barman→MinIO backup credentials from
# OpenBao and render them as the `cnpg-minio-credentials` K8s Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecosystem-db-vso
  namespace: ecosystem-db
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true
