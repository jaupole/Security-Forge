# Barman Cloud Plugin ObjectStore for the consolidated ecosystem-db cluster.
# Credentials rendered into `cnpg-minio-credentials` by the VSO binding in
# 04-vso-bindings.yaml (OpenBao path secret/minio/cnpg/credentials — the SAME
# creds the app clusters use; it's one MinIO bucket namespace `backups/cnpg`).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: minio-backup
  namespace: ecosystem-db
  labels:
    secforge.platform/component: cloudnativepg
    secforge.platform/cluster: ecosystem-db
spec:
  configuration:
    destinationPath: s3://backups/cnpg/ecosystem-db
    endpointURL: http://minio.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: cnpg-minio-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-minio-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
