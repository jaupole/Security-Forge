# Tailnet ingress plane — Istio gateway bound to the node's TAILSCALE NIC only.
#
# Part of the two-plane ingress split (2026-06-03). See README.md in this dir.
#
# WHY: the public Istio gateway (`istio-ingress`, Helm-managed) binds hostPort
# 80/443 on 0.0.0.0 — i.e. the PUBLIC NIC. The CNI hostPort path SNATs every
# inbound request to the cni0 bridge IP (10.42.0.1) BEFORE Envoy sees it, so the
# real client IP is lost and source-IP AuthorizationPolicies cannot distinguish
# tailnet from public. The only robust way to make a host tailnet-only is L3:
# serve it from a listener that physically only exists on the tailscale
# interface. This gateway does that — hostPort bound to hostIP 100.77.117.112
# (the node's Tailscale IP). A request to the public IP for one of these hosts
# never reaches this listener.
#
# Operator-only hosts (pf, control, admin, grafana, bao, wazuh) have NO public
# DNS A record; the operator's hosts file maps them to 100.77.117.112. Public
# hosts (portal, auth, members, qbo, billing) stay on the public gateway.
#
# NODE-SPECIFIC LITERAL: the hostIP below is ${TAILNET_IP} (globals.env) — the
# node's stable Tailscale IP. If the node's tailnet IP ever changes, update
# globals.env (PUBLIC_IP / TAILNET_IP), not this file.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-ingress-tailnet
  namespace: istio-ingress
  labels: { app: istio-ingress-tailnet, istio: ingress-tailnet }
spec:
  replicas: 1
  # Recreate (not RollingUpdate): a surge pod can't bind the hostPort while the
  # old pod holds it, so a rolling update would hang.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: istio-ingress-tailnet, istio: ingress-tailnet }
  template:
    metadata:
      annotations:
        # Triggers Istio gateway injection (fills in the istio-proxy container).
        inject.istio.io/templates: gateway
        sidecar.istio.io/inject: "true"
        # Pin the proxy image to match the public gateway's istiod version.
        sidecar.istio.io/proxyImage: docker.io/istio/proxyv2:1.29.2@sha256:69ca4585993f4057861954f18be88df8268b713d114e7036bf9b185458c7a2c1
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: "15020"
        prometheus.io/scrape: "true"
      labels:
        app: istio-ingress-tailnet
        istio: ingress-tailnet            # selector for the Gateway CR below
        sidecar.istio.io/inject: "true"
        istio.io/dataplane-mode: none      # gateway Envoy, not ambient-captured
    spec:
      serviceAccountName: istio-ingress
      # Explicit securityContext: Kyverno (require-run-as-nonroot + PSS) validates
      # the Deployment template BEFORE Istio injection runs, so it must be set here.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1337
        runAsGroup: 1337
      containers:
        - name: istio-proxy
          image: auto                       # replaced by the gateway injector
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: [NET_BIND_SERVICE]       # bind 80/443 as uid 1337
              drop: [ALL]
          ports:
            - { name: http,  containerPort: 80,  hostPort: 80,  hostIP: "${TAILNET_IP}", protocol: TCP }
            - { name: https, containerPort: 443, hostPort: 443, hostIP: "${TAILNET_IP}", protocol: TCP }
            - { name: http-envoy-prom, containerPort: 15090, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: istio-ingress-tailnet
  namespace: istio-ingress
  labels: { app: istio-ingress-tailnet, istio: ingress-tailnet }
spec:
  type: ClusterIP
  selector: { app: istio-ingress-tailnet, istio: ingress-tailnet }
  ports:
    - { name: status-port, port: 15021, targetPort: 15021 }
    - { name: http2,       port: 80,    targetPort: 80 }
    - { name: https,       port: 443,   targetPort: 443 }
---
# The tailnet gateway serves ALL hosts (`*.${DOMAIN}`), not just the tailnet
# ones. It's bound to the tailscale NIC, so this is NOT public exposure — it
# just means an operator on the tailnet reaches EVERY host (public + tailnet)
# via the one tailnet IP. This avoids two client-side traps from a split where
# the tailnet gateway served only tailnet hosts:
#   - public hosts (members/portal) 404'd if the operator's box resolved them
#     to the tailnet IP;
#   - HTTP/2 connection coalescing (shared wildcard cert) sent public-host
#     requests onto the tailnet connection → 404.
# Public hosts stay reachable from the internet via the public gateway; tailnet
# hosts (no public DNS) remain reachable ONLY here. The public-host
# VirtualServices (member-hub, control-portal, keycloak, qbo, billing) are
# attached to BOTH gateways so they route here too — see README.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: secforge-gateway-tailnet
  namespace: istio-ingress
spec:
  selector: { istio: ingress-tailnet }
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: ["*.${DOMAIN}"]
    - port: { number: 443, name: https, protocol: HTTPS }
      tls: { mode: SIMPLE, credentialName: secforge-wildcard-tls }
      hosts: ["*.${DOMAIN}"]
---
# control + admin shells route through the tailnet plane (portal stays public).
# Mirror of the public control-portal VirtualService's routes.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: control-admin-tailnet
  namespace: istio-ingress
spec:
  hosts: ["control.${DOMAIN}", "admin.${DOMAIN}"]
  gateways: [istio-ingress/secforge-gateway-tailnet]
  http:
    - name: api
      match: [{ uri: { prefix: /api } }]
      route: [{ destination: { host: control.control.svc.cluster.local, port: { number: 80 } } }]
    - name: spa
      route: [{ destination: { host: portal.control.svc.cluster.local, port: { number: 80 } } }]
