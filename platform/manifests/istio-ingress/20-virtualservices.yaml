apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  labels:
    secforge.platform/component: istio-gateway
  name: qbo
  namespace: istio-ingress
spec:
  gateways:
  - istio-ingress/secforge-gateway
  - istio-ingress/secforge-gateway-tailnet
  hosts:
  - qbo.${DOMAIN}
  http:
  - match:
    - uri:
        prefix: /callback
    name: qbo-callback
    rewrite:
      uri: /api/v1/accounting/qbo/callback
    route:
    - destination:
        host: control.control.svc.cluster.local
        port:
          number: 80
  # Intuit/QuickBooks webhook — POST /webhook on the same dedicated public
  # QBO host as the OAuth /callback above. Routes to Member Hub (which owns
  # the invoices + the settlement tick that acts on the notification);
  # authority is rewritten to members.${DOMAIN} so the request reaches
  # member-hub identically to a direct hit (no Host-allowlist surprise).
  # The receiver verifies the intuit-signature HMAC and stays 503 until
  # QBO_WEBHOOK_VERIFIER_TOKEN is set. Register https://qbo.${DOMAIN}/webhook
  # in the Intuit app.
  - match:
    - uri:
        prefix: /webhook
    name: qbo-webhook
    rewrite:
      uri: /api/webhooks/qbo
      authority: members.${DOMAIN}
    route:
    - destination:
        host: member-hub.member-hub.svc.cluster.local
        port:
          number: 80
---
# Stripe Connect OAuth callback — dedicated PUBLIC host. The admin Portal
# origin (control/admin.${DOMAIN}) is tailnet-only and Stripe can't reach
# it, so the redirect URI registered in the Stripe Connect settings is
# https://stripe-connect.${DOMAIN}/callback; this rewrites /callback to
# Control's internal callback route. Mirrors the `qbo` VirtualService.
# See ADR-0034 + Ecosystem Control src/api/routes/stripe-connect.ts.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  labels:
    secforge.platform/component: istio-gateway
  name: stripe-connect
  namespace: istio-ingress
spec:
  gateways:
  - istio-ingress/secforge-gateway
  - istio-ingress/secforge-gateway-tailnet
  hosts:
  - stripe-connect.${DOMAIN}
  http:
  - match:
    - uri:
        prefix: /callback
    name: stripe-connect-callback
    rewrite:
      uri: /api/v1/stripe/callback
    route:
    - destination:
        host: control.control.svc.cluster.local
        port:
          number: 80
---
