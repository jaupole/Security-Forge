# Daily CNPG ScheduledBackup for the secforge-spicedb-db cluster.
# Runs at 02:35 UTC (slightly offset from the keycloak schedule).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: secforge-spicedb-db-daily
  namespace: spicedb
  labels:
    secforge.platform/component: cloudnativepg
    secforge.platform/cluster: secforge-spicedb-db
spec:
  schedule: "0 35 2 * * *"
  backupOwnerReference: self
  cluster:
    name: secforge-spicedb-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: false
