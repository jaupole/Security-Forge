# Validator: the four PF project-roles mapped onto proposalapp/proposal
# direct relations — OWNER/EDITOR/REVIEWER/VIEWER — and separation of duties.
#
#   owner    -> view, edit, review, delete         (NOT approve)
#   editor   -> view, edit, review                  (NOT approve, NOT delete)
#   reviewer -> view, review, approve               (NOT edit, NOT delete)
#   viewer   -> view                                (nothing else)
#
# `approve` deliberately requires the reviewer role (or app-admin): owners and
# editors draft, reviewers approve. This is the test that goes silently wrong
# if proposalapp/proposal's permission expressions in ecosystem-schema.zed are
# edited carelessly. Schema below is the verbatim ecosystem model.

schema: |
  definition user {}
  definition platform {
      relation administrator: user
      permission administer = administrator
  }
  definition organization {
      relation parent: organization
      relation platform: platform
      relation administrator: user
      relation local_administrator: user
      relation executive: user
      relation member_manager: user
      relation position_manager: user
      relation auditor: user
      relation member: user
      relation app: app
      permission cascading_administer = administrator + parent->cascading_administer + platform->administer
      permission administer = local_administrator + cascading_administer
      permission cascading_view = administrator + executive + parent->cascading_view + platform->administer
      permission view = local_administrator + member + cascading_view
      permission create_sub_org = administer
      permission delete_org = administrator + parent->delete_org + platform->administer
      permission cascading_manage_members = administrator + parent->cascading_manage_members + platform->administer
      permission manage_members = local_administrator + member_manager + cascading_manage_members
      permission cascading_manage_positions = administrator + parent->cascading_manage_positions + platform->administer
      permission manage_positions = local_administrator + position_manager + cascading_manage_positions
      permission read_audit = auditor + administer
  }
  definition app {
      relation organization: organization
      relation administrator: user
      relation creator: user
      relation editor: user
      relation viewer: user
      relation commenter: user
      relation approver: user
      relation finance: user
      relation exporter: user
      relation inviter: user
      relation invite_approver: user
      relation workflow_approver: user
      permission administer = administrator + organization->administer
      permission create = creator + administer
      permission view = viewer + editor + commenter + approver + finance + administer + organization->administer
      permission edit = editor + administer
      permission comment = commenter + approver + edit
      permission approve = approver + administer
      permission view_finance = finance + administer
      permission export = exporter + administer
      permission invite = inviter + administer
      permission approve_invite = invite_approver + administer
      permission approve_workflow = workflow_approver + administer
  }
  definition proposalapp/proposal {
      relation app: app
      relation owner: user
      relation editor: user
      relation reviewer: user
      relation viewer: user
      permission view = owner + editor + reviewer + viewer + app->view
      permission edit = owner + editor + app->administer
      permission review = owner + editor + reviewer + app->administer
      permission approve = reviewer + app->administer
      permission delete = owner + app->administer
  }

relationships: |
  proposalapp/proposal:p1#owner@user:owen
  proposalapp/proposal:p1#editor@user:eddie
  proposalapp/proposal:p1#reviewer@user:rita
  proposalapp/proposal:p1#viewer@user:vera

assertions:
  assertTrue:
    # OWNER
    - proposalapp/proposal:p1#view@user:owen
    - proposalapp/proposal:p1#edit@user:owen
    - proposalapp/proposal:p1#review@user:owen
    - proposalapp/proposal:p1#delete@user:owen
    # EDITOR
    - proposalapp/proposal:p1#view@user:eddie
    - proposalapp/proposal:p1#edit@user:eddie
    - proposalapp/proposal:p1#review@user:eddie
    # REVIEWER
    - proposalapp/proposal:p1#view@user:rita
    - proposalapp/proposal:p1#review@user:rita
    - proposalapp/proposal:p1#approve@user:rita
    # VIEWER
    - proposalapp/proposal:p1#view@user:vera
  assertFalse:
    # separation of duties: only reviewers (or app-admins) approve
    - proposalapp/proposal:p1#approve@user:owen
    - proposalapp/proposal:p1#approve@user:eddie
    # editor cannot delete; reviewer/viewer cannot edit or delete
    - proposalapp/proposal:p1#delete@user:eddie
    - proposalapp/proposal:p1#edit@user:rita
    - proposalapp/proposal:p1#delete@user:rita
    - proposalapp/proposal:p1#edit@user:vera
    - proposalapp/proposal:p1#review@user:vera
    - proposalapp/proposal:p1#approve@user:vera
    - proposalapp/proposal:p1#delete@user:vera
