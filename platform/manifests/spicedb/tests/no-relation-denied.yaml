# Validator: a user with no relationship to the document is denied
# every permission. This is the "default deny" property — without an
# explicit grant somewhere, no access.

schema: |
  definition user {}
  definition tenant {
      relation admin: user
      relation member: user
      permission administer = admin
      permission view = admin + member
  }
  definition app {
      relation tenant: tenant
      relation admin: user
      relation user: user
      permission administer = admin + tenant->admin
      permission use = admin + user + tenant->member
  }
  definition document {
      relation app: app
      relation owner: user
      relation editor: user
      relation viewer: user
      permission edit = owner + editor + app->administer
      permission view = owner + editor + viewer + app->administer + app->use
      permission delete = owner + app->administer
  }

relationships: |
  document:welcome#owner@user:jason
  document:welcome#viewer@user:alice
  document:welcome#app@app:helloworld-app
  app:helloworld-app#tenant@tenant:helloworld

assertions:
  assertFalse:
    - document:welcome#view@user:bob
    - document:welcome#edit@user:bob
    - document:welcome#delete@user:bob
