# Allow `member-hub` ns (Member Hub backend) → SpiceDB gRPC on 50051.
#
# Member Hub's membership-guard middleware + per-route requireOrgPermission
# checks call SpiceDB directly via the `@authzed/authzed-node` gRPC client.
# Same expedient-direct-call pattern as Control (see
# 06-allow-control-to-spicedb.yaml) until the AuthZEN façade in `app` ns
# becomes the routed path for ecosystem apps.
#
# Added 2026-05-23 as part of Member Hub Phase B sign-in unblock — without
# this, every /api/v1/* request 503'd with spicedb_unavailable
# (membership-guard.ts).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-member-hub-to-spicedb
  namespace: spicedb
  labels:
    secforge.platform/component: spicedb
    secforge.platform/expedient: 'direct-grpc-instead-of-authzen-facade'
spec:
  podSelector:
    matchLabels:
      authzed.com/cluster: spicedb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: member-hub
          podSelector:
            matchLabels:
              app.kubernetes.io/name: member-hub
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 15008   # ambient HBONE (7c-2 enrollment sweep)
