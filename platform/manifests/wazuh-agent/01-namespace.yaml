# Phase 7d Item 5 — dedicated namespace for the Wazuh agent DaemonSet.
#
# PSS=privileged (NOT baseline) because the agent NEEDS hostPath volumes
# of /etc, /var/log, /host/proc to do FIM and read host log files.
# Baseline blocks hostPath entirely. Trade-off: this ns has a privilege
# bubble; the rest of `wazuh` ns stays PSS=baseline-locked. Per-pod
# securityContext on the agent itself drops privileged + most caps;
# only DAC_OVERRIDE is added for read access to the host paths
# regardless of file ownership.
#
# Why a separate namespace rather than relaxing wazuh ns:
#   - The wazuh-manager + wazuh-indexer + wazuh-dashboard pods stay in
#     `wazuh` at PSS=baseline — defense-in-depth retained for them.
#   - Operator unfamiliar with the agent can't accidentally weaken the
#     manager's posture by editing one ns label.
#   - Cloud edition will likely keep this split (or merge into a
#     PSS=privileged Wazuh-dedicated VPC); either way, separating
#     concerns now eases that migration.

apiVersion: v1
kind: Namespace
metadata:
  name: wazuh-agent
  labels:
    secforge.platform/component: wazuh-agent
    secforge.platform/edition: prod
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
