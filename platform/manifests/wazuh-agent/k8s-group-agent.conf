<!--
  Centralized Wazuh agent.conf for the `k8s` group.

  Pushed to /var/ossec/etc/shared/k8s/agent.conf on the manager by
  platform/components/07k-wazuh-k8s-group.sh. Agents in this group
  (the wazuh-agent DaemonSet — secforge-prod-k8s and any future node
  agents) merge this into their effective configuration.

  Why disable SCA: the wazuh-agent container image is Amazon Linux 2023
  based, so the agent's SCA module auto-detects the *container's* OS and
  runs cis_amazon_linux_2023 against it. ~40 of the 183 checks fail
  because they audit things that don't exist in a container (bootloader,
  nftables, sshd, cron, auditd, etc.). The host-level systemd agent
  (secforge-prod) already runs the appropriate cis_ubuntu24-04 benchmark
  against the actual node OS. The pod agent's value is K8s-namespace
  observability via the `k8s` rule group; SCA on it is pure noise.

  This config disables SCA only — file integrity, log collection, rule
  group routing all continue to work.
-->
<agent_config>
  <sca>
    <enabled>no</enabled>
  </sca>
</agent_config>
