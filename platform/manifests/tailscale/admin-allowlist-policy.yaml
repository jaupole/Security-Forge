# Admin Ingresses must restrict source to the Tailscale CGNAT range.
#
# ValidatingPolicy (policies.kyverno.io) port of the former kyverno.io/v1
# ClusterPolicy admin-ingress-must-be-tailnet-only (2026-10-13; kyverno.io/v1
# is removed in Kyverno 1.20). Applied by 10a-ingress-tailnet-split.sh.
#
# Rationale: admin UIs (Wazuh, Grafana, OpenBao admin console, Keycloak admin
# console, Prometheus, Alertmanager) must never be reachable from the public
# internet. Component 10 (Tailscale) provides a stable operator-only mesh;
# admin Ingresses set nginx.ingress.kubernetes.io/whitelist-source-range to
# 100.64.0.0/10 (the Tailscale CGNAT range) so they only serve traffic sourced
# from inside the tailnet. This policy enforces the annotation at admission
# time so the rule can't be silently dropped during edits.
#
# Keep the admin-hostname prefix list in sync with ADMIN_HOST_PREFIXES in
# 10a-ingress-tailnet-split.sh.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: admin-ingress-must-be-tailnet-only
  annotations:
    policies.kyverno.io/title: Admin Ingresses must restrict source to Tailscale CGNAT
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Ingress
    secforge.platform/component: tailscale
    secforge.platform/origin: manifests/tailscale/admin-allowlist-policy.yaml
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
  matchConditions:
    - name: has-host-rules
      expression: "object.spec.?rules.orValue([]).exists(r, has(r.host))"
  variables:
    - name: firstHost
      expression: "object.spec.rules[0].?host.orValue('')"
    - name: adminHost
      expression: >-
        ['wazuh.', 'grafana.', 'openbao-admin.', 'auth-admin.', 'prometheus.', 'alertmanager.',
         'argocd.', 'kibana.', 'discover.'].exists(p, variables.firstHost.startsWith(p))
    - name: allowlist
      expression: "object.metadata.?annotations[?'nginx.ingress.kubernetes.io/whitelist-source-range'].orValue('')"
  validations:
    - message: |
        Admin Ingresses (hostnames starting with wazuh., grafana.,
        openbao-admin., auth-admin., prometheus., alertmanager.,
        argocd., kibana., or discover.) MUST set the annotation
        nginx.ingress.kubernetes.io/whitelist-source-range to a value
        that includes 100.64.0.0/10 (Tailscale CGNAT range).
        Add to your Ingress metadata.annotations:
          nginx.ingress.kubernetes.io/whitelist-source-range: "100.64.0.0/10"
        To intentionally expose a specific page publicly, split it into
        a separate Ingress with a non-admin-shaped hostname (e.g.
        status.secforge.dev) — this policy will not match it.
      expression: "!variables.adminHost || variables.allowlist.contains('100.64.0.0/10')"
