# Image signature verification — ImageValidatingPolicy ports of the two
# kyverno.io/v1 verifyImages ClusterPolicies (verify-image-signature-secforge,
# verify-image-signature-vendors). One policy per former rule.
#
# Shared notes:
#   - matchImageReferences globs are the former imageReferences.
#   - validationConfigurations: required=true (unmatched signature = reject),
#     mutateDigest=false, verifyDigest=false — unchanged from the v1 rules.
#   - Registry egress + credentials are wired by 12c-kyverno-image-verify-creds.sh;
#     the pull Secret must live in the kyverno namespace (it does).
#   - Vendor policies stay Audit + failurePolicy Ignore until keyless
#     verification is reliable for every vendor (operator-backlog #41).
---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signature-secforge
  annotations:
    policies.kyverno.io/title: "Verify SecForge image signatures"
    policies.kyverno.io/category: "Supply Chain"
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Deny]            # our CI signs every image — block unsigned
  failurePolicy: Fail                  # FAIL-CLOSED (backlog #97)
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false                   # admission-time only; Rekor lookups
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/secforge/*"
    - glob: "ghcr.io/jaupole/*"
  credentials:
    allowInsecureRegistry: false
    secrets: [ghcr-pull-secret]
  validationConfigurations:
    required: true
    mutateDigest: false
    verifyDigest: false
  attestors:
    - name: secforge
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/(secforge|jaupole)/"
          roots: |-
            -----BEGIN CERTIFICATE-----
            MIIB9zCCAXygAwIBAgIUALZNAPFdxHPwjeDloDwyYChAO/4wCgYIKoZIzj0EAwMw
            KjEVMBMGA1UEChMMc2lnc3RvcmUuZGV2MREwDwYDVQQDEwhzaWdzdG9yZTAeFw0y
            MTEwMDcxMzU2NTlaFw0zMTEwMDUxMzU2NThaMCoxFTATBgNVBAoTDHNpZ3N0b3Jl
            LmRldjERMA8GA1UEAxMIc2lnc3RvcmUwdjAQBgcqhkjOPQIBBgUrgQQAIgNiAAT7
            XeFT4rb3PQGwS4IajtLk3/OlnpgangaBclYpsYBr5i+4ynB07ceb3LP0OIOZdxex
            X69c5iVuyJRQ+Hz05yi+UF3uBWAlHpiS5sh0+H2GHE7SXrk1EC5m1Tr19L9gg92j
            YzBhMA4GA1UdDwEB/wQEAwIBBjAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBRY
            wB5fkUWlZql6zJChkyLQKsXF+jAfBgNVHSMEGDAWgBRYwB5fkUWlZql6zJChkyLQ
            KsXF+jAKBggqhkjOPQQDAwNpADBmAjEAj1nHeXZp+13NWBNa+EDsDP8G1WWg1tCM
            WP/WHPqpaVo0jhsweNFZgSs0eE7wYI4qAjEA2WB9ot98sIkoF3vZYdd3/VtWB5b9
            TNMea7Ix/stJ5TfcLLeABLE4BNJOsQ4vnBHJ
            -----END CERTIFICATE-----
        ctlog:
          url: "https://rekor.sigstore.dev"
          rekorPubKey: |-
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2G2Y+2tabdTV5BcGiBIx0a9fAFwr
            kBbmLSGtks4L3qX6yYY0zufBnhC8Ur/iy55GhWP/9A/bY2LhC30M9+RYtw==
            -----END PUBLIC KEY-----
          ctLogPubKey: |-
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEiPSlFi0CmFTfEjCUqF9HuCEcYXNK
            AaYalIJmBZ8yyezPjTqhxrKBpMnaocVtLJBI1eM3uXnQzQGAJdJ4gs9Fyw==
            -----END PUBLIC KEY-----
  validations:
    - message: "SecForge image signature verification failed (keyless, GitHub Actions OIDC)."
      expression: >-
        (images.containers + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([]))
          .map(image, verifyImageSignatures(image, [attestors.secforge])).all(e, e > 0)
---
