apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/category: "Best Practices"
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: exclude-namespaces
      expression: "!(object.metadata.namespace in ['kyverno', 'kube-system', 'kube-public', 'kube-node-lease'])"
    - name: exclude-cnpg-managed
      expression: "!('cnpg.io/cluster' in object.metadata.?labels.orValue({}))"
  validations:
    - message: >-
        Containers must declare both `resources.requests` and `resources.limits` for CPU and
        memory. This prevents a single pod from starving the node (no limits) or being OOMKilled
        erratically (no requests).
      expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c,
          has(c.resources) && has(c.resources.requests) && has(c.resources.limits) &&
          'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits)
