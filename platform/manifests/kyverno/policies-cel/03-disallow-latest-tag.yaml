apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/category: "Best Practices"
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: exclude-namespaces
      expression: "!(object.metadata.namespace in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno'])"
  validations:
    - message: "Container images must use a specific tag, not `:latest` or no tag."
      # image() resolves an untagged reference to the registry default tag
      # "latest", so this covers both the explicit and the implicit case.
      # A digest-pinned reference is always acceptable.
      expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c,
          image(c.image).containsDigest() || image(c.image).tag() != 'latest')
