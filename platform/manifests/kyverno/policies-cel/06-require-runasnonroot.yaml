apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/category: "Pod Security"
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        !(object.metadata.namespace in ['kyverno', 'kube-system', 'kube-public', 'kube-node-lease',
          'spire', 'observability', 'wazuh', 'wazuh-agent', 'velero', 'ingress-nginx', 'istio-system',
          'trivy-system', 'topolvm-system', 'onlyoffice'])
  validations:
    - message: |
        Containers must run as non-root. Set
          spec.securityContext.runAsNonRoot: true
        OR
          spec.containers[*].securityContext.runAsNonRoot: true
      expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false) ||
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c,
          c.?securityContext.?runAsNonRoot.orValue(false))
