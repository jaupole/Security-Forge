# ADR-0013 self-expiring escape hatch: the legacy-secret-env annotation pair is
# the only permitted bypass for no-secret-shaped-env-vars, and it must be
# time-bounded (≤90d) and tracked. Two policies (one per former rule).
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: legacy-secret-env-requires-expiry
  annotations:
    policies.kyverno.io/category: "Secrets"
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: app-namespaces
      expression: "object.metadata.namespace in ['control', 'member-hub']"
    - name: legacy-escape-hatch-set
      expression: "object.metadata.?annotations[?'secforge.local/legacy-secret-env'].orValue('') != ''"
  validations:
    - message: >-
        ADR-0013 violation — secforge.local/legacy-secret-env is set but
        secforge.local/legacy-secret-env-expires is missing. The escape hatch requires both: a
        ticket reference AND an expiry date (≤90 days from admission). See ADR-0013 §
        Self-expiring escape hatch.
      expression: "object.metadata.?annotations[?'secforge.local/legacy-secret-env-expires'].orValue('') != ''"
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: legacy-secret-env-expiry-window
  annotations:
    policies.kyverno.io/category: "Secrets"
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: app-namespaces
      expression: "object.metadata.namespace in ['control', 'member-hub']"
    - name: expiry-set
      expression: "object.metadata.?annotations[?'secforge.local/legacy-secret-env-expires'].orValue('') != ''"
  variables:
    - name: expires
      expression: "object.metadata.annotations['secforge.local/legacy-secret-env-expires']"
  validations:
    - messageExpression: >-
        "ADR-0013 violation — secforge.local/legacy-secret-env-expires ('" + variables.expires +
        "') must be a valid YYYY-MM-DD date, in the future, and no more than 90 days from now. See ADR-0013 § Self-expiring escape hatch."
      message: >-
        ADR-0013 violation — secforge.local/legacy-secret-env-expires must be a valid YYYY-MM-DD
        date, in the future, and no more than 90 days from now.
      expression: >-
        variables.expires.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}$') &&
        timestamp(variables.expires + 'T00:00:00Z') > time.now() &&
        timestamp(variables.expires + 'T00:00:00Z') - time.now() <= duration('2160h')
