apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-secret-shaped-env-vars
  annotations:
    policies.kyverno.io/title: "No secret-shaped env var names (ADR-0013)"
    policies.kyverno.io/category: "Secrets"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Reject Pods in the SecForge app namespaces whose env names match *KEY*, *SECRET*,
      *TOKEN*, *PASSWORD*, or *CREDENTIAL*. Outbound secrets must be fetched at runtime via
      apps/lib/secrets/ from OpenBao.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: app-namespaces
      expression: "object.metadata.namespace in ['control', 'member-hub']"
    - name: no-legacy-escape-hatch
      expression: "object.metadata.?annotations[?'secforge.local/legacy-secret-env'].orValue('') == ''"
  variables:
    - name: secretShaped
      expression: "'(?i)(^|_)(KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)($|_)'"
  validations:
    - message: >-
        ADR-0013 violation — a container env name matches the secret-shaped regex
        (KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL). Outbound secrets must be fetched at runtime via
        apps/lib/secrets/ from OpenBao. See templates/app-repo/README-secrets.md. If this is a
        vendor SDK that strictly requires an env var, use the time-bounded escape hatch — see
        ADR-0013 § Self-expiring escape hatch.
      expression: >-
        object.spec.containers.all(c, c.?env.orValue([]).all(e, !e.name.matches(variables.secretShaped)))
    - message: >-
        ADR-0013 violation — an initContainer env name matches the secret-shaped regex
        (KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL). See README-secrets.md.
      expression: >-
        object.spec.?initContainers.orValue([]).all(c, c.?env.orValue([]).all(e, !e.name.matches(variables.secretShaped)))
