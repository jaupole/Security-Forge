apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: trivy-scan-tmpdir-isolation
  annotations:
    policies.kyverno.io/title: "Trivy scan pods: per-container TMPDIR on an emptyDir"
    policies.kyverno.io/category: "Hardening"
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false                   # admission-time only (v1 background: false); no mutate-existing reports                    # admission-time only; scan pods are short-lived
  autogen:
    podControllers:
      controllers: []                  # explicit: pods only (see 02b/12 for why)
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    objectSelector:
      matchLabels:
        app.kubernetes.io/managed-by: trivy-operator
        vulnerabilityReport.scanner: Trivy
  matchConditions:
    - name: trivy-namespace
      expression: "object.metadata.namespace == 'trivy-system'"
  mutations:
    # Server-side-apply merge: env (keyed by name), volumeMounts (keyed by
    # mountPath) and volumes (keyed by name) are additive, so this appends
    # TMPDIR + a dedicated emptyDir per scan container without touching the
    # rest of the pod spec.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{
            containers: object.spec.containers.map(c, Object.spec.containers{
              name: c.name,
              env: [Object.spec.containers.env{name: "TMPDIR", value: "/trivytmp"}],
              volumeMounts: [Object.spec.containers.volumeMounts{name: "ttmp-" + c.name, mountPath: "/trivytmp"}]}),
            volumes: object.spec.containers.map(c, Object.spec.volumes{
              name: "ttmp-" + c.name,
              emptyDir: Object.spec.volumes.emptyDir{}})}}
