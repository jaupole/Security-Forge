apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: velero-exclude-spiffe-jwt-fsbackup
  annotations:
    policies.kyverno.io/title: "Velero: exclude the spiffe-jwt projected volume from fs-backup"
    policies.kyverno.io/category: "Backup"
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false                   # admission-time only (v1 background: false); no mutate-existing reports
  # Pod-level only: Velero's fs-backup reads the annotation from the Pod, so
  # mutating the Pod at admission is sufficient and keeps controller templates
  # untouched. The empty list is REQUIRED — Kyverno 1.19 defaults
  # pod-controller autogen ON for a pods-only policy when it is omitted.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: has-spiffe-jwt-volume
      expression: "object.spec.?volumes.orValue([]).exists(v, v.name == 'spiffe-jwt')"
  mutations:
    # Add-if-absent (the former `+()` anchor): an operator-set value wins.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          'backup.velero.io/backup-volumes-excludes' in object.metadata.?annotations.orValue({}) ?
            Object{} :
            Object{metadata: Object.metadata{annotations: {"backup.velero.io/backup-volumes-excludes": "spiffe-jwt"}}}
