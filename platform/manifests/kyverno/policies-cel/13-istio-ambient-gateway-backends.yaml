apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: istio-ambient-gateway-backends
  annotations:
    policies.kyverno.io/title: "Istio Ambient: enroll gateway-backend namespaces in the mesh dataplane"
    policies.kyverno.io/category: "Service Mesh"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
spec:
  evaluation:
    admission:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
        resourceNames:
          - control
          - member-hub
          - observability
          - wazuh
          - proposal-forge
          - project-manager
          - business-manager
          - document-render
          - onlyoffice
          - keycloak
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{metadata: Object.metadata{labels: {"istio.io/dataplane-mode": "ambient"}}}
