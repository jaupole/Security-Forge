# Kyverno ClusterPolicy: block secret-shaped environment variables in the
# SecForge application namespaces.
#
# ADR-0013 § Layer 4 — admission. Reject Pods whose container or
# initContainer env names match the secret-shaped regex (case-insensitive,
# on `_`-delimited token boundaries):
#   *KEY*  *SECRET*  *TOKEN*  *PASSWORD*  *CREDENTIAL*
# Outbound secrets must be fetched at runtime via apps/lib/secrets/ from
# OpenBao — never carried in env.
#
# Exception: Pods carrying `secforge.local/legacy-secret-env` bypass this
# rule (the escape hatch). The sister ClusterPolicy `legacy-secret-env-expiry`
# (10-legacy-secret-env-expiry.yaml) validates the expiry semantics.
#
# Scope: the SecForge application namespaces only. Platform-component
# namespaces (keycloak, minio, observability, spicedb, wazuh, ...) run
# vendored charts whose env legitimately carries secret-shaped names, so
# they are deliberately NOT covered. When a new SecForge app namespace is
# added (e.g. Project Tracker, Proposal Forge), add it to the `namespaces`
# lists below.
#
# Mode: Enforce — flipped from Audit 2026-05-22 (operator-backlog #39).
# Policies land in Audit and flip to Enforce after clean PolicyReport output
# (platform convention, 12b-kyverno-policies.sh). The 2026-05-20 pre-flight
# finding — control/TRANSIT_KEY_NAME, a false positive holding the *name* of
# an OpenBao Transit key (not key material) — was resolved by renaming it to
# TRANSIT_KEYNAME. The #39 pre-check (2026-05-22) confirmed the live control
# pods + Deployment templates carry no secret-shaped env, and no Pod uses the
# escape-hatch annotation, so the Enforce flip is admission-safe.
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: no-secret-shaped-env-vars
  labels:
    secforge.platform/component: kyverno
    secforge.platform/policy-tier: outbound-secrets
  annotations:
    policies.kyverno.io/title: "Block secret-shaped environment variables"
    policies.kyverno.io/category: "ADR-0013 — outbound secrets"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Reject Pods in the SecForge app namespaces whose env names match
      *KEY*, *SECRET*, *TOKEN*, *PASSWORD*, or *CREDENTIAL*. Outbound secrets
      must be fetched at runtime via apps/lib/secrets/ from OpenBao.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    # ─── containers ────────────────────────────────────────────────────
    - name: block-secret-shaped-env-names-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [control, member-hub]
      preconditions:
        all:
          # Skip if the legacy-secret-env escape-hatch annotation is set.
          # Sister policy validates expiry; a missing-pair case is denied
          # there. Combining both checks here would conflate two failure
          # modes into one error message.
          - key: "{{ request.object.metadata.annotations.\"secforge.local/legacy-secret-env\" || '' }}"
            operator: Equals
            value: ""
      validate:
        message: >-
          ADR-0013 violation — a container env name matches the secret-shaped
          regex (KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL). Outbound secrets must
          be fetched at runtime via apps/lib/secrets/ from OpenBao. See
          templates/app-repo/README-secrets.md. If this is a vendor SDK that
          strictly requires an env var, use the time-bounded escape hatch —
          see ADR-0013 § Self-expiring escape hatch.
        foreach:
          - list: "request.object.spec.containers[].env[]"
            deny:
              conditions:
                all:
                  # Match when the dangerous word is its own _-delimited
                  # token. Phase 7b.5 finding: a substring regex (.*KEY.*)
                  # false-positives on `BFF_KEYCLOAK_ISSUER` and
                  # `BFF_KEYCLOAK_CLIENT_ID` etc — KEY is part of KEYCLOAK,
                  # not a credential. Token-boundary keeps the rule firing
                  # on genuine cases (BFF_VALKEY_PASSWORD, AWS_ACCESS_KEY_ID,
                  # STRIPE_SECRET) while letting through the OIDC-issuer-
                  # and-related noise.
                  - key: "{{ regex_match('(?i)(^|_)(KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)($|_)', '{{ element.name }}') }}"
                    operator: Equals
                    value: true

    # ─── initContainers ────────────────────────────────────────────────
    - name: block-secret-shaped-env-names-initcontainers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [control, member-hub]
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"secforge.local/legacy-secret-env\" || '' }}"
            operator: Equals
            value: ""
      validate:
        message: >-
          ADR-0013 violation — an initContainer env name matches the
          secret-shaped regex (KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL).
          See README-secrets.md.
        foreach:
          - list: "request.object.spec.initContainers[].env[]"
            deny:
              conditions:
                all:
                  # Token-boundary match — see the containers rule above
                  # for the false-positive rationale.
                  - key: "{{ regex_match('(?i)(^|_)(KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)($|_)', '{{ element.name }}') }}"
                    operator: Equals
                    value: true
