# Image signature verification (cosign keyless via Sigstore Fulcio + Rekor).
#
# Split into TWO policies because the enforcement decision differs by who
# controls the signing:
#
#   verify-image-signature-secforge  — Enforce. SecForge-built images
#     (ghcr.io/{secforge,jaupole}/*). Our CI signs every image keyless via
#     GitHub Actions OIDC; portal + control are confirmed verifying. A
#     future unsigned or tampered SecForge image is blocked at admission.
#
#   verify-image-signature-vendors   — Audit. Third-party images
#     (CloudNativePG + SPIFFE). We cannot make vendors sign, and 6 of the
#     10 in-scope vendor images carry NO cosign signature (all 4
#     CloudNativePG — the operator ships SLSA attestations only; postgresql
#     + barman have nothing — plus spiffe-helper + spire-controller-manager;
#     confirmed 2026-05-21 via cosign verify / cosign tree). Enforcing would
#     block CloudNativePG and parts of SPIRE cluster-wide. Audit keeps
#     visibility into which vendor images are unsigned without the outage
#     risk. Tracked as operator-backlog #41.
#
# Registry auth: ghcr.io/{secforge,jaupole}/* packages are PRIVATE — the
# secforge rule pulls signatures with the kyverno-vso-rendered
# ghcr-pull-secret (imageRegistryCredentials, see 03-vso-binding.yaml).
# Vendor packages are public and pull anonymously. The network path
# (egress to ghcr.io + sigstore) is the NetworkPolicy in
# 06-egress-image-verification.yaml.
#
# Vetting a new vendor image before adding it to a rule:
#   cosign verify ghcr.io/<vendor>/<image>:<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/<vendor>/'
#
# References:
#   - https://kyverno.io/docs/writing-policies/verify-images/sigstore/
#   - https://docs.sigstore.dev/cosign/verifying/verify/

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature-secforge
  annotations:
    policies.kyverno.io/title: "Verify SecForge image signatures"
    policies.kyverno.io/category: "Supply Chain"
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  background: false                    # admission-time only; Rekor lookups
                                       # are too slow to scan every pod
  validationFailureAction: Enforce     # our CI signs every image — block unsigned
  webhookConfiguration:
    failurePolicy: Ignore              # STAYS FAIL-OPEN. Fail-closed was attempted live on
                                       # 2026-07-05 and REVERTED: a burst of concurrent
                                       # keyless verifications (what happens when every pod
                                       # reschedules on a node reboot) triggers Sigstore
                                       # TUF/Fulcio root-init failures inside Kyverno
                                       # ("failed to get roots from fulcio: initializing tuf").
                                       # With failurePolicy=Fail that would DENY our own app
                                       # pods and block cluster recovery — turning a reboot
                                       # into an outage. DO NOT set Fail until Kyverno keyless
                                       # verification is reliable under load (pin/mirror the
                                       # Sigstore TUF root + warm the image-verify cache).
                                       # Tracked in docs/04-security/image-supply-chain-verification.md.
    timeoutSeconds: 30                 # k8s max. The keyless verify (ghcr signature fetch
                                       # + Rekor/Fulcio) needs headroom under admission
                                       # bursts; with failurePolicy=Fail a timeout now
                                       # DENIES rather than silently admitting.
  rules:
    # SecForge-owned images: control + portal today (same keyless CI as the
    # keycloak overlay — see .github/workflows/*-image-build.yml). The
    # subject regex covers both the `secforge` org and `jaupole/` user repos
    # so additional SecForge-built images inherit verification automatically.
    # IMPORTANT: if you fork this repo to a different GitHub owner, update
    # the regex to match your own org/user.
    - name: verify-secforge
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/secforge/*"
            - "ghcr.io/jaupole/*"
          required: true
          mutateDigest: false
          verifyDigest: false
          # SecForge GHCR packages are PRIVATE. Kyverno pulls the cosign
          # signature artifact with this read-only credential (rendered by
          # the kyverno-vso VSO binding, 03-vso-binding.yaml).
          imageRegistryCredentials:
            allowInsecureRegistry: false
            secrets:
              - ghcr-pull-secret
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/(secforge|jaupole)/"
                    # OFFLINE-PINNED trust material (backlog #97, 2026-07-06).
                    # Prior fail-closed attempts (#95/#96) died on a TUF/Fulcio
                    # root-init race under reboot bursts, because Kyverno fetched
                    # the trust root from tuf-repo-cdn.sigstore.dev at admission.
                    # Our CI (cosign v2, #90) attaches a self-contained bundle
                    # (cert + SCT + Rekor inclusion proof), so verification can be
                    # fully OFFLINE: pin the Fulcio ROOT (root only — the
                    # intermediate rides in the signature bundle), the Rekor
                    # pubkey (verifies the attached inclusion proof, no
                    # rekor.sigstore.dev call), and the CT-log pubkey (verifies
                    # the SCT, no TUF). The only remaining network dep is the ghcr
                    # signature pull, which shares fate with the image pull.
                    # Proven 2026-07-06: 33 signed pods admitted with sigstore
                    # DNS-blackholed + failurePolicy:Fail; tampered digest denied;
                    # 64ms cache-cold. REFRESH: these rotate on a years cadence
                    # (Fulcio root valid to 2031-10-05); re-extract via
                    # `cosign initialize` if Sigstore rotates the root. See
                    # docs/04-security/image-supply-chain-verification.md.
                    roots: |-
                      -----BEGIN CERTIFICATE-----
                      MIIB9zCCAXygAwIBAgIUALZNAPFdxHPwjeDloDwyYChAO/4wCgYIKoZIzj0EAwMw
                      KjEVMBMGA1UEChMMc2lnc3RvcmUuZGV2MREwDwYDVQQDEwhzaWdzdG9yZTAeFw0y
                      MTEwMDcxMzU2NTlaFw0zMTEwMDUxMzU2NThaMCoxFTATBgNVBAoTDHNpZ3N0b3Jl
                      LmRldjERMA8GA1UEAxMIc2lnc3RvcmUwdjAQBgcqhkjOPQIBBgUrgQQAIgNiAAT7
                      XeFT4rb3PQGwS4IajtLk3/OlnpgangaBclYpsYBr5i+4ynB07ceb3LP0OIOZdxex
                      X69c5iVuyJRQ+Hz05yi+UF3uBWAlHpiS5sh0+H2GHE7SXrk1EC5m1Tr19L9gg92j
                      YzBhMA4GA1UdDwEB/wQEAwIBBjAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBRY
                      wB5fkUWlZql6zJChkyLQKsXF+jAfBgNVHSMEGDAWgBRYwB5fkUWlZql6zJChkyLQ
                      KsXF+jAKBggqhkjOPQQDAwNpADBmAjEAj1nHeXZp+13NWBNa+EDsDP8G1WWg1tCM
                      WP/WHPqpaVo0jhsweNFZgSs0eE7wYI4qAjEA2WB9ot98sIkoF3vZYdd3/VtWB5b9
                      TNMea7Ix/stJ5TfcLLeABLE4BNJOsQ4vnBHJ
                      -----END CERTIFICATE-----
                    rekor:
                      url: "https://rekor.sigstore.dev"
                      pubkey: |-
                        -----BEGIN PUBLIC KEY-----
                        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2G2Y+2tabdTV5BcGiBIx0a9fAFwr
                        kBbmLSGtks4L3qX6yYY0zufBnhC8Ur/iy55GhWP/9A/bY2LhC30M9+RYtw==
                        -----END PUBLIC KEY-----
                    ctlog:
                      pubkey: |-
                        -----BEGIN PUBLIC KEY-----
                        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEiPSlFi0CmFTfEjCUqF9HuCEcYXNK
                        AaYalIJmBZ8yyezPjTqhxrKBpMnaocVtLJBI1eM3uXnQzQGAJdJ4gs9Fyw==
                        -----END PUBLIC KEY-----

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature-vendors
  annotations:
    policies.kyverno.io/title: "Verify vendor image signatures"
    policies.kyverno.io/category: "Supply Chain"
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  background: false
  # TIER 1 ENFORCE — operator-backlog #41. A full cosign verify/tree survey of
  # ALL 65 vendor repos running in-cluster (2026-07-05) sorts them into:
  #   T1  cosign signature, keyless, verifiable  -> ENFORCED by the rules below.
  #   T2  cosign signature, STATIC KEY            -> cert-manager core
  #       (controller/webhook/cainjector); needs the published cosign pubkey via
  #       a `keys` attestor. Deferred to a follow-up.
  #   T3  ATTESTATIONS only, no signature         -> cloudnative-pg OPERATOR and
  #       kyverno ship SLSA `.att` provenance but no `.sig`; need an
  #       `attestations:` verify, not a signature attestor. Deferred.
  #   T4  UNSIGNED / mirror-stripped              -> the majority (grafana,
  #       prometheus/*, velero, wazuh, openbao, istio, rancher/k3s, minio,
  #       authzed, topolvm, hashicorp VSO, cloudnative-pg DATA plane
  #       [postgresql + barman], spiffe-helper, spire-controller-manager, and
  #       every mirror.gcr.io / public.ecr.aws image). No signature exists — to
  #       be handled by digest-pin + approved-digest allowlist and/or
  #       mirror-and-sign, NOT here. They match NO rule below, so this policy
  #       leaves them untouched.
  # Rules reference ONLY repos empirically proven to carry a verifiable keyless
  # signature — so Enforce can never block an unsigned image it was never meant
  # to check. This replaces the old whole-org ghcr.io/cloudnative-pg/* and
  # ghcr.io/spiffe/* rules, which pointed `required: true` at orgs whose images
  # are mostly unsigned (the source of the Audit-mode fail noise).
  # STAYS AUDIT (not Enforce) as of 2026-07-05. Enforce+Fail was applied live and
  # REVERTED within minutes: Kyverno logged real keyless-verify FAILURES for these
  # (correctly-signed) vendor images — "failed to get roots from fulcio: initializing
  # tuf" — under the burst of concurrent verifications the policy update triggered.
  # Host-side `cosign verify` passes all of them, so the signatures are fine; the
  # fault is Kyverno's Sigstore TUF/Fulcio init under load. In Enforce+Fail that
  # would deny these vendors (incl. SPIRE, registry.k8s.io, cert-manager) on any mass
  # reschedule. The 7 rules below are CORRECT and stay (Audit = report-only, no block);
  # flip to Enforce + failurePolicy: Fail ONLY after the TUF/keyless reliability fix.
  # See docs/04-security/image-supply-chain-verification.md.
  validationFailureAction: Audit
  webhookConfiguration:
    failurePolicy: Ignore              # fail-open until TUF/keyless verification is reliable
    timeoutSeconds: 30                 # k8s max; absorb keyless-verify latency bursts.
  rules:
    # --- SPIFFE / SPIRE: only the repos that actually sign (spire + spiffe-csi).
    #     spiffe-helper and spire-controller-manager are UNSIGNED (T4) -> excluded.
    - name: verify-spiffe-signed
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/spiffe/spire-server*"
            - "ghcr.io/spiffe/spire-agent*"
            - "ghcr.io/spiffe/oidc-discovery-provider*"
            - "ghcr.io/spiffe/spiffe-csi-driver*"
          required: true
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/spiffe/(spire|spiffe-csi)/"
                    rekor:
                      url: "https://rekor.sigstore.dev"
    # --- OpenTelemetry Collector (docker.io/otel/*).
    - name: verify-otel-collector
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "otel/opentelemetry-collector-contrib*"
            - "docker.io/otel/opentelemetry-collector-contrib*"
          required: true
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/open-telemetry/opentelemetry-collector-releases/"
                    rekor:
                      url: "https://rekor.sigstore.dev"
    # --- Aqua trivy-operator (signature served via the mirror.gcr.io referrer).
    #     Plain `trivy` via mirror.gcr.io is UNSIGNED (mirror strips it) -> excluded.
    - name: verify-aqua-trivy-operator
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "mirror.gcr.io/aquasec/trivy-operator*"
          required: true
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/aquasecurity/trivy-operator/"
                    rekor:
                      url: "https://rekor.sigstore.dev"
    # --- Chainguard images (cgr.dev/chainguard/*), all signed by chainguard-images/images.
    - name: verify-chainguard
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "cgr.dev/chainguard/*"
          required: true
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/chainguard-images/images/"
                    rekor:
                      url: "https://rekor.sigstore.dev"
    # --- cert-manager CORE (controller/webhook/cainjector/acmesolver/ctl/
    #     startupapicheck): TIER 2 — signed with cert-manager's STATIC cosign
    #     key (not keyless), SHA-512, and NOT logged to Rekor. Verified against
    #     the published key (cert-manager-pubkey-2021-09-20.pem) — confirmed
    #     v1.20.2 controller/webhook/cainjector all pass, 2026-07-05. Key rotation
    #     by cert-manager (rare) requires updating publicKeys here.
    - name: verify-cert-manager-core
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "quay.io/jetstack/cert-manager-controller*"
            - "quay.io/jetstack/cert-manager-webhook*"
            - "quay.io/jetstack/cert-manager-cainjector*"
            - "quay.io/jetstack/cert-manager-acmesolver*"
            - "quay.io/jetstack/cert-manager-ctl*"
            - "quay.io/jetstack/cert-manager-startupapicheck*"
          required: true
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAsZZKaaIRjOpzbiWYIDKO
                      yry9XGBqAfve1iOGmt5VO1jpjNoEseT6zewozHfWTM7osxayy2WjN8G+QV39MlT3
                      Vxo91/31g+Zcq8KcvxG+iB8GRaD9pNgLmghorv+eYDiPYMO/+fhsLImyG5WEoPct
                      MeCBD7umZ/A2t96U9DQxVDqQbTHlsNludno1p1wsgRnfUM3QHexNljDvJg5FcDMo
                      dCpVLpRNvbw0lbJVfybJ4siJ5o/MmXzy0QCJpw+yMIqvqMc8qgKJ1yooJtuTVF4t
                      4/luP+EG/oVIiSWCFeRMqYdbJ3R+CJi+4LN7vFNYQM1Q/NwOB52RteaR7wnqmcBz
                      qSYK32MM8xdPCQ5tioWwnPTRbPZuzsZsRmJsKBO9JUrBYdDntZX1xY5g4QNSufxi
                      QgJgJSU7E4VGMvagEzB1JzvOr6A/qNFCO1Z6JsA3jw3cJLV1rSHfxqfSXBACTLDf
                      6bOPWRILRKydTJA6uLKNKmo1/nFm3jvd5tHKOjy4VAQLJ/Vx9wBsAAiLa+06veun
                      Oz3AJ9sNh3wLp21RL11u9TuOKRBipE/TYsBYp8jpIyWPXDSV+JcD/TZqoT8y0Z6S
                      0damfUmspuK9DTQFL2crpeaqJSG9RA+OuPZLxGD1IMURTsPJB7kXhPtmceeirBnw
                      sVcRHHDitVt8oO/x4Wus1c0CAwEAAQ==
                      -----END PUBLIC KEY-----
                    signatureAlgorithm: sha512
                    # cert-manager does NOT publish these signatures to Rekor
                    # (signed with --insecure-ignore-tlog). Skip tlog lookup or
                    # verification always fails "no matching signatures".
                    rekor:
                      ignoreTlog: true
    # --- cert-manager trust-manager + trust package (quay.io/jetstack/trust-*):
    #     TIER 1 keyless (GitHub Actions), distinct from cert-manager core above.
    - name: verify-cert-manager-trust
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "quay.io/jetstack/trust-manager*"
            - "quay.io/jetstack/trust-pkg-*"
          required: true
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/cert-manager/trust-manager/"
                    rekor:
                      url: "https://rekor.sigstore.dev"
    # --- Kubernetes SIG images (registry.k8s.io/*): signed by the k8s release
    #     robot via GOOGLE OIDC, not GitHub. Exact subject + accounts.google.com.
    - name: verify-registry-k8s
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "registry.k8s.io/*"
          required: true
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://accounts.google.com"
                    subject: "krel-trust@k8s-releng-prod.iam.gserviceaccount.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
