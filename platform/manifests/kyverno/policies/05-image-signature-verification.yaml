# Image signature verification (cosign keyless via Sigstore Fulcio + Rekor).
#
# Split into TWO policies because the enforcement decision differs by who
# controls the signing:
#
#   verify-image-signature-secforge  — Enforce. SecForge-built images
#     (ghcr.io/{secforge,jaupole}/*). Our CI signs every image keyless via
#     GitHub Actions OIDC; portal + control are confirmed verifying. A
#     future unsigned or tampered SecForge image is blocked at admission.
#
#   verify-image-signature-vendors   — Audit. Third-party images
#     (CloudNativePG + SPIFFE). We cannot make vendors sign, and 6 of the
#     10 in-scope vendor images carry NO cosign signature (all 4
#     CloudNativePG — the operator ships SLSA attestations only; postgresql
#     + barman have nothing — plus spiffe-helper + spire-controller-manager;
#     confirmed 2026-05-21 via cosign verify / cosign tree). Enforcing would
#     block CloudNativePG and parts of SPIRE cluster-wide. Audit keeps
#     visibility into which vendor images are unsigned without the outage
#     risk. Tracked as operator-backlog #41.
#
# Registry auth: ghcr.io/{secforge,jaupole}/* packages are PRIVATE — the
# secforge rule pulls signatures with the kyverno-vso-rendered
# ghcr-pull-secret (imageRegistryCredentials, see 03-vso-binding.yaml).
# Vendor packages are public and pull anonymously. The network path
# (egress to ghcr.io + sigstore) is the NetworkPolicy in
# 06-egress-image-verification.yaml.
#
# Vetting a new vendor image before adding it to a rule:
#   cosign verify ghcr.io/<vendor>/<image>:<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/<vendor>/'
#
# References:
#   - https://kyverno.io/docs/writing-policies/verify-images/sigstore/
#   - https://docs.sigstore.dev/cosign/verifying/verify/

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature-secforge
  annotations:
    policies.kyverno.io/title: "Verify SecForge image signatures"
    policies.kyverno.io/category: "Supply Chain"
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  background: false                    # admission-time only; Rekor lookups
                                       # are too slow to scan every pod
  validationFailureAction: Enforce     # our CI signs every image — block unsigned
  webhookConfiguration:
    failurePolicy: Ignore              # don't wedge admission if Kyverno is down
    timeoutSeconds: 30                 # raised from the 10s default: the keyless verify
                                       # (ghcr signature fetch + Rekor/Fulcio) was blowing
                                       # the budget under admission bursts and — because
                                       # failurePolicy=Ignore — FAILING OPEN (pod admitted
                                       # unverified). 30s (k8s max) lets verify complete.
  rules:
    # SecForge-owned images: control + portal today (same keyless CI as the
    # keycloak overlay — see .github/workflows/*-image-build.yml). The
    # subject regex covers both the `secforge` org and `jaupole/` user repos
    # so additional SecForge-built images inherit verification automatically.
    # IMPORTANT: if you fork this repo to a different GitHub owner, update
    # the regex to match your own org/user.
    - name: verify-secforge
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/secforge/*"
            - "ghcr.io/jaupole/*"
          required: true
          mutateDigest: false
          verifyDigest: false
          # SecForge GHCR packages are PRIVATE. Kyverno pulls the cosign
          # signature artifact with this read-only credential (rendered by
          # the kyverno-vso VSO binding, 03-vso-binding.yaml).
          imageRegistryCredentials:
            allowInsecureRegistry: false
            secrets:
              - ghcr-pull-secret
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/(secforge|jaupole)/"
                    rekor:
                      url: "https://rekor.sigstore.dev"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature-vendors
  annotations:
    policies.kyverno.io/title: "Verify vendor image signatures"
    policies.kyverno.io/category: "Supply Chain"
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  background: false
  # Audit, NOT Enforce: 6 of 10 in-scope vendor images ship no cosign
  # signature (all CloudNativePG; spiffe-helper; spire-controller-manager).
  # Enforcing would block CloudNativePG + parts of SPIRE. See
  # operator-backlog #41 for the path to narrowing/enforcing a true subset.
  validationFailureAction: Audit
  webhookConfiguration:
    failurePolicy: Ignore
    timeoutSeconds: 30                 # match the secforge policy: same shared svc-ignore
                                       # webhook; absorb keyless-verify latency bursts.
  rules:
    - name: verify-cloudnative-pg
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/cloudnative-pg/*"
          required: true
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/cloudnative-pg/"
                    rekor:
                      url: "https://rekor.sigstore.dev"
    - name: verify-spiffe
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/spiffe/*"
          required: true
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/spiffe/"
                    rekor:
                      url: "https://rekor.sigstore.dev"
