# Exclude the ephemeral SPIFFE JWT-SVID volume from Velero file-system backup.
#
# The daily schedule uses defaultVolumesToFsBackup=true (opt-out), so Velero's
# node-agent tries to kopia-back-up EVERY pod volume — including the `spiffe-jwt`
# CSI ephemeral volume (a short-lived JWT-SVID the SPIFFE CSI driver delivers).
# For a TRANSIENT pod (e.g. the control-billing-usage-sync CronJob, which fires at
# 02:00 — the same minute as the backup) the pod terminates mid-backup, the host
# volume path vanishes, and the PodVolumeBackup fails:
#   "error identifying unique volume path on host for volume spiffe-jwt ... got 0"
# -> the whole backup goes PartiallyFailed -> it is not counted successful ->
# VeleroBackupTooOld fires. (Diagnosed 2026-06-03.)
#
# A SVID is regenerated by SPIRE on every pod start and would be expired/invalid on
# restore, so backing it up has ZERO recovery value AND races on ephemeral pods.
# This mutate adds `backup.velero.io/backup-volumes-excludes: spiffe-jwt` to any pod
# that mounts such a volume, so Velero skips it everywhere — removing both the waste
# and the race. Add-if-absent (`+()`) so it never clobbers an existing exclude list.
#
# Admission-only (background:false): the next 02:00 CronJob pod is born excluded.
# Long-lived spiffe pods (keycloak/openbao/spicedb/control/member-hub/spire) pick it
# up on their next restart; they don't race, so the timing is non-critical.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: velero-exclude-spiffe-jwt-fsbackup
  annotations:
    policies.kyverno.io/title: Skip SPIFFE SVID volume in Velero FS backup
    policies.kyverno.io/category: Backup/Reliability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
  labels:
    secforge.platform/component: kyverno-policy
spec:
  background: false
  rules:
    - name: exclude-spiffe-jwt-volume
      match:
        any:
          - resources:
              kinds: [Pod]
      preconditions:
        all:
          - key: "{{ request.object.spec.volumes[?name=='spiffe-jwt'] | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              +(backup.velero.io/backup-volumes-excludes): spiffe-jwt
