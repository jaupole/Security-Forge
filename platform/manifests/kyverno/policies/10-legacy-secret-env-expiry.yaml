# Kyverno ClusterPolicy: validate the legacy-secret-env escape hatch.
#
# ADR-0013 § Self-expiring escape hatch. The escape hatch is the ONLY
# acceptable way to deploy a secret-shaped env var. It is a tracked debt
# with a hard deadline, not a permanent home.
#
# Required annotation pair on the Pod:
#   secforge.local/legacy-secret-env:         "JIRA-1234"      # ticket ref
#   secforge.local/legacy-secret-env-expires: "2026-07-30"     # ISO date
#
# Validation rules:
#   1. If `legacy-secret-env` is present, `legacy-secret-env-expires` MUST
#      also be present.
#   2. `expires` MUST parse as ISO 8601 / RFC 3339.
#   3. `expires` MUST be in the future at admission time.
#   4. `expires` MUST be ≤ 90 days from admission time.
#
# Sister policy of `no-secret-shaped-env-vars` (09-no-secret-shaped-env.yaml);
# scoped to the same SecForge app namespaces. Add new app namespaces to both.
#
# Mode: Audit — per the platform convention (12b-kyverno-policies.sh). No
# production Pod currently carries the escape-hatch annotation, so the
# Enforce flip is zero-impact; flip it together with the sister policy.
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: legacy-secret-env-expiry
  labels:
    secforge.platform/component: kyverno
    secforge.platform/policy-tier: outbound-secrets
  annotations:
    policies.kyverno.io/title: "Validate legacy-secret-env escape-hatch annotations"
    policies.kyverno.io/category: "ADR-0013 — outbound secrets"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      The legacy-secret-env annotation pair is the only permitted bypass for
      no-secret-shaped-env-vars. This policy enforces that the bypass is
      time-bounded (≤90d) and tracked (ticket reference).
spec:
  validationFailureAction: Audit
  background: true
  rules:
    # ─── 1. Pair completeness ──────────────────────────────────────────
    - name: require-expires-when-legacy-secret-env-set
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [control, member-hub]
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"secforge.local/legacy-secret-env\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: >-
          ADR-0013 violation — secforge.local/legacy-secret-env is set but
          secforge.local/legacy-secret-env-expires is missing. The escape
          hatch requires both: a ticket reference AND an expiry date
          (≤90 days from admission). See ADR-0013 § Self-expiring escape
          hatch.
        deny:
          conditions:
            any:
              - key: "{{ request.object.metadata.annotations.\"secforge.local/legacy-secret-env-expires\" || '' }}"
                operator: Equals
                value: ""

    # ─── 2/3/4. Expiry parses as date, is in the future, ≤ 90d out ────
    - name: expires-must-be-future-iso-and-within-90d
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [control, member-hub]
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"secforge.local/legacy-secret-env-expires\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: >-
          ADR-0013 violation — secforge.local/legacy-secret-env-expires
          ('{{ request.object.metadata.annotations."secforge.local/legacy-secret-env-expires" }}')
          must be a valid ISO 8601 / RFC 3339 date, in the future, and no more
          than 90 days from now. See ADR-0013 § Self-expiring escape hatch.
        deny:
          conditions:
            any:
              # `time_since(layout, refTime, currentTime)` returns the
              # duration `currentTime - refTime`. Positive when refTime
              # (expires) is in the past; negative when in the future.
              # Layout "2006-01-02" is Go's date-only format; ADR-0013's
              # examples and operator usage standardize on date-only ISO
              # for these annotations.
              #
              # Past or present: time_since >= 0s.
              - key: "{{ time_since('2006-01-02', request.object.metadata.annotations.\"secforge.local/legacy-secret-env-expires\", '') }}"
                operator: GreaterThanOrEquals
                value: "0s"
              # More than 90 days in the future: time_since < -2160h
              # (equivalent: expires is more than 90 days from now).
              - key: "{{ time_since('2006-01-02', request.object.metadata.annotations.\"secforge.local/legacy-secret-env-expires\", '') }}"
                operator: LessThan
                value: "-2160h"
