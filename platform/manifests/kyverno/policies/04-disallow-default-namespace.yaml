# Forbid running anything in the `default` namespace.
#
# The default ns is for ad-hoc / human kubectl experiments. Any
# production workload should land in a named, policy-scoped namespace
# (created via the app-namespace template).

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-namespace
  annotations:
    policies.kyverno.io/category: "Multi-Tenancy"
    policies.kyverno.io/severity: medium
spec:
  background: true
  # Enforce (was Audit): 0 live violations (144 reports pass / 0 fail), applied live
  # 2026-05-31 and verified safe; blocks only future default-ns admissions (audit H-4.15).
  validationFailureAction: Enforce
  rules:
    - name: validate-namespace
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet, DaemonSet, Job, CronJob, Pod]
      validate:
        message: "Running in the `default` namespace is forbidden — use a named namespace."
        pattern:
          metadata:
            namespace: "!default"
