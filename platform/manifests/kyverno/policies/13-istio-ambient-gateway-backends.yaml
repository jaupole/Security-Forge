# Gateway HTTP backends stay ambient-enrolled.
#
# Mutates the listed namespaces to (re-)assert `istio.io/dataplane-mode: ambient`
# so a label wipe (namespace re-apply from a manifest that omits it) cannot
# silently drop a public-gateway backend out of the mesh — traffic would still
# flow, but without mTLS/ztunnel enforcement.
#
# Codified 2026-07-06 from the live object (originally kubectl-applied ad-hoc
# 2026-06-03 during the ambient-enrollment incident; flagged as live-only by
# the 06-07 doc-drift audit and the 07-05 infra sweep, debt-5).
#
# List trued-up 2026-07-06 (#74-3): the earlier NOTE claiming project-manager
# and business-manager are not ambient was stale — both (plus document-render
# and onlyoffice) have been ambient-enrolled gateway backends since their
# rollouts. keycloak added deliberately with its enrollment for the L4 client
# gate (keycloak/12-authorization-policy.yaml): a label wipe there would strip
# the gate's enforcement, so the assert is load-bearing. openbao is NOT listed
# and NOT ambient — its keycloak OIDC path rides its hostAlias → istio-ingress
# gateway (see openbao/06-networkpolicies-main.yaml), so it needs no mesh
# identity; enrolling it would put raft/seal traffic on ztunnel for no gain.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: istio-ambient-gateway-backends
  annotations:
    policies.kyverno.io/category: Istio
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/title: Gateway HTTP backends stay ambient-enrolled
spec:
  background: false
  rules:
    - name: ensure-ambient-label
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - control
                - member-hub
                - observability
                - wazuh
                - proposal-forge
                - project-manager
                - business-manager
                - document-render
                - onlyoffice
                - keycloak
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              istio.io/dataplane-mode: ambient
