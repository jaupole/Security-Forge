# Pod Security Standards — Baseline.
#
# Enforces baseline-level constraints cluster-wide except for a fixed
# namespace allowlist (kyverno itself, kube-system family, plus the
# specific platform namespaces that require host-namespaces /
# host-ports / privileged: spire, observability/node-exporter,
# wazuh-agent legacy, velero, ingress-nginx, cert-manager).
#
# Background: namespace-level PSS labels (pod-security.kubernetes.io/...)
# audit + warn but don't ENFORCE if a namespace's enforce label is missing
# or weaker. Kyverno makes the policy uniform regardless of how the
# namespace was created.
#
# Validation failure mode: Enforce (promoted 2026-05-13 hardening sprint).
#
# Exclusion shape: pure-namespace exemption (matches require-runasnonroot
# pattern). An earlier version of `baseline-host-namespaces` AND'd a
# selector `secforge.platform/policy-exempt: "true"`, which silently
# negated the ns exemption (legitimate hostNetwork pods like spire-agent
# and node-exporter generated PolicyViolation events every reconcile).
# Removed 2026-05-16 — see drift sweep report.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pss-baseline
  annotations:
    policies.kyverno.io/title: "Pod Security Standards — Baseline"
    policies.kyverno.io/category: "Pod Security"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: "Pod"
spec:
  background: true
  validationFailureAction: Enforce
  rules:
    - name: baseline-host-namespaces
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kyverno
                - kube-system
                - kube-public
                - kube-node-lease
                - spire
                - observability
                - wazuh-agent
                - velero
                - ingress-nginx
                - cert-manager
                - image-builds
                - topolvm-system
      validate:
        message: "Pods must not use host namespaces (hostNetwork, hostPID, hostIPC)."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false

    - name: baseline-host-ports
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kyverno
                - kube-system
                - kube-public
                - kube-node-lease
                - spire
                - observability
                - wazuh-agent
                - velero
                - ingress-nginx
                - istio-ingress
                - cert-manager
                - image-builds
                - topolvm-system
      validate:
        message: "Pods must not use hostPort."
        pattern:
          spec:
            =(containers):
              - =(ports):
                  - X(hostPort): 0
            =(initContainers):
              - =(ports):
                  - X(hostPort): 0

    - name: baseline-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kyverno
                - kube-system
                - kube-public
                - kube-node-lease
                - spire
                - observability
                - wazuh-agent
                - velero
                - image-builds
                - topolvm-system
      validate:
        message: "Pods must not run privileged containers."
        pattern:
          spec:
            =(containers):
              - =(securityContext):
                  =(privileged): false
            =(initContainers):
              - =(securityContext):
                  =(privileged): false
