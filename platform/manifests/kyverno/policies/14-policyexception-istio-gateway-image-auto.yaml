# PolicyException: istio gateway Deployments/ReplicaSets carry the literal
# image `auto` — istiod's injection template replaces it at POD creation, so
# the controller objects can never satisfy restrict-image-registries. The
# background scanner therefore logged ~264 enforce-mode fails/day against the
# two gateway Deployments + their ReplicaSets (found in the 2026-07-19 health
# check), polluting policy reports with permanent noise.
#
# Scope is deliberately MINIMAL: only Deployment/ReplicaSet named istio-ingress*
# in the istio-ingress namespace, only for restrict-image-registries. The PODS
# are NOT excepted — after injection they run the real image (docker.io/istio/*
# or registry.istio.io/release/*, both on the allowlist) and stay fully
# enforced, so a rogue image in the gateway namespace is still blocked at
# admission where it matters.
#
# PolicyExceptions are honored ONLY from the kyverno namespace
# (--exceptionNamespace=kyverno on all three controllers, values/kyverno.yaml
# features.policyExceptions.namespace). On kyverno v1.18+ that flag MUST be
# non-empty: the reports-controller engine hard-errors on "" and silently runs
# background scans WITHOUT exception support while admission still honors
# them (split-brain, found 2026-07-19).
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: istio-gateway-image-auto
  namespace: kyverno
  labels:
    secforge.platform/component: kyverno-policies
spec:
  exceptions:
    - policyName: restrict-image-registries
      ruleNames:
        - validate-container-images
        - autogen-validate-container-images
    # `auto` can never carry an @sha256 digest either — same structural
    # impossibility, same minimal Deployment/RS scope. Gateway PODS keep both
    # policies: post-injection they run the real image, and their (audit-mode)
    # digest finding stays visible — pinning the injected image by digest is an
    # istiod-config improvement, not report noise.
    - policyName: require-image-digest
      ruleNames:
        - require-digest
        - autogen-require-digest
  match:
    any:
      - resources:
          kinds:
            - Deployment
            - ReplicaSet
          namespaces:
            - istio-ingress
          names:
            - "istio-ingress*"
