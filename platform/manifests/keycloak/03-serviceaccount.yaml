apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: secforge-platform
    secforge.platform/component: keycloak
automountServiceAccountToken: true
# The keycloak pod runs the private ghcr.io/jaupole/keycloak image. The kubelet
# merges a pod's ServiceAccount imagePullSecrets at creation — this is the
# reliable place for them: the Keycloak Operator does NOT propagate
# imagePullSecrets set in the CR's unsupported.podTemplate (operator-backlog #48).
imagePullSecrets:
  - name: ghcr-pull-secret
