# Public Ingress for Keycloak (auth.${DOMAIN}).
#
# Cert-manager auto-issues a per-host LE cert via the cluster-issuer
# annotation, stored as Secret `keycloak-tls` in this namespace.
#
# BACKEND IS HTTPS, NOT HTTP. As of the 2026-05-13 hardening pass,
# Keycloak runs with http.httpEnabled=false — keycloak-service exposes
# only https:8443 (+ management:9000). The internal cert is issued by
# the secforge-internal-ca ClusterIssuer, which nginx doesn't trust, so
# proxy-ssl-verify is off (TLS to the backend is for transport, not
# identity — identity is the cluster network boundary).
#
# DRIFT WARNING: this file is the source of truth. If you change the
# backend protocol/port here, also confirm against the live ingress
# (`kubectl get ingress -n keycloak keycloak`) — a stale copy of this
# file re-applied on 2026-05-14 reverted backend HTTPS:8443 → HTTP:8080
# and 503'd every login for ~9h. Always diff before re-applying.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    secforge.platform/component: keycloak
  annotations:
    cert-manager.io/cluster-issuer: ${LE_ISSUER}
    # Keycloak backend speaks HTTPS only (httpEnabled=false since 2026-05-13).
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # Backend cert is issued by secforge-internal-ca (not publicly trusted);
    # skip verification — the trust boundary is the cluster network.
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    # Per-IP rate limiting (added 2026-05-14, checklist rule 31).
    # Keycloak login bursts are 2-3 req/s during interactive auth;
    # 5 rps + burst x3 is generous for humans, restrictive for
    # credential-stuffing robots. The admin path lives behind the
    # tailnet allowlist (see 06-ingress-admin.yaml) so its limits
    # can be looser.
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.${DOMAIN}
      secretName: keycloak-tls
  rules:
    - host: auth.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8443
