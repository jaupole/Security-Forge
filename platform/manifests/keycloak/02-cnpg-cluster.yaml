# Postgres cluster for Keycloak — managed by CloudNativePG.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: secforge-keycloak-db
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/edition: prod
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm
  primaryUpdateStrategy: unsupervised

  enableSuperuserAccess: false

  storage:
    size: 5Gi
    storageClass: ${STORAGE_CLASS}

  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      encoding: UTF8
      localeCollate: C
      localeCType: C

  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  monitoring:
    enablePodMonitor: false   # enabled in Phase 7 (observability)

  # Postgres physical backups + WAL archiving via the Barman Cloud Plugin
  # (replaces the deprecated inline barmanObjectStore config removed in CNPG 1.29+).
  # ObjectStore CR with MinIO credentials lives in 08-objectstore.yaml.
  # ScheduledBackup CR for daily base backups lives in 07-cnpg-scheduled-backup.yaml.
  # Plugin install + postgres-operator wiring lives in component 09h-cnpg-barman-plugin.sh.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        # barmanObjectName is REQUIRED — it links the cluster to the
        # ObjectStore CR; without it the instance-manager loops on
        # "Unknown plugin: barman-cloud.cloudnative-pg.io". It was live
        # on the cluster but missing from this manifest (drift, fixed
        # 2026-05-21 — see operator-backlog #47).
        barmanObjectName: minio-backup
        # Archive path separated from the pre-upgrade PG16 backups: the
        # 2026-05-21 16->17 major upgrade resets the WAL timeline, so PG17
        # archives under a fresh serverName.
        serverName: secforge-keycloak-db-pg17
