# Postgres cluster for Keycloak — managed by CloudNativePG.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: secforge-keycloak-db
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/edition: prod
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.10-bookworm
  primaryUpdateStrategy: unsupervised

  enableSuperuserAccess: false

  storage:
    size: 5Gi
    storageClass: ${STORAGE_CLASS}

  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      encoding: UTF8
      localeCollate: C
      localeCType: C

  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  monitoring:
    enablePodMonitor: false   # enabled in Phase 7 (observability)

  # Postgres physical backups + WAL archiving via the Barman Cloud Plugin
  # (replaces the deprecated inline barmanObjectStore config removed in CNPG 1.29+).
  # ObjectStore CR with MinIO credentials lives in 08-objectstore.yaml.
  # ScheduledBackup CR for daily base backups lives in 07-cnpg-scheduled-backup.yaml.
  # Plugin install + postgres-operator wiring lives in component 09h-cnpg-barman-plugin.sh.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
