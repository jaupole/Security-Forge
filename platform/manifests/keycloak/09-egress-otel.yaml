# Added 2026-05-12 alongside Layer A egress baseline rollout. Keycloak
# sends OTLP traces to otel-collector.observability:4318 via the
# tracing-endpoint additionalOption in its CR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-otel-collector
  namespace: keycloak
  labels:
    secforge.platform/component: egress-baseline
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - {port: 4317, protocol: TCP}
        - {port: 4318, protocol: TCP}
        - {port: 15008, protocol: TCP} # HBONE — ztunnel mesh tunnel (both ns ambient)
