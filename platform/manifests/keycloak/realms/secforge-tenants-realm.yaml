      # ─── control-portal (Ecosystem Portal SPA, PKCE) ─────────────
      # Tenant-facing Portal frontend. Public client with PKCE S256.
      # Tenant admins log in here to manage their org (activate apps,
      # define role bundles, configure integrations, etc.). The
      # equivalent SPA in the `platform` realm is the operator-facing
      # Admin Console — same clientId, the realm is the discriminator.
      #
      # rootUrl points at portal.${DOMAIN} (Shape B Track 3 — tenant
      # face has its own subdomain, distinct from the admin/legacy
      # control.${DOMAIN} URL operators use).
      #
      # Cross-audience mapper: Portal's tokens also carry `aud=control`
      # so Portal can call Control's API directly with the same token
      # (no token-exchange dance needed).
      - clientId: control-portal
        name: Ecosystem Portal SPA
        description: Ecosystem Portal SPA — tenant face — CONFIDENTIAL; Control is the Portal BFF.
        enabled: true
        protocol: openid-connect
        rootUrl: https://portal.${DOMAIN}
        baseUrl: https://portal.${DOMAIN}
        # Confidential: Control (the Portal BFF) holds the client secret and the
        # user's tokens server-side; the browser carries only a sealed session
        # cookie. The tenants-realm secret is published via 05l to Control's
        # CONTROL_PORTAL_CLIENT_SECRET_TENANTS env.
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          # BFF callback — handled server-side by Control (path-routed from the
          # tenant shell host). The old SPA /auth/callback + silent-callback
          # iframe targets are gone under the BFF.
          - https://portal.${DOMAIN}/api/auth/callback
          - https://control.${DOMAIN}/api/auth/callback
        webOrigins:
          - "+"
        attributes:
          pkce.code.challenge.method: S256
          # Back-channel logout → Control's BFF receiver (single-logout).
          backchannel.logout.url: https://portal.${DOMAIN}/api/auth/backchannel-logout
          post.logout.redirect.uris: https://portal.${DOMAIN}/
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"
          frontchannel.logout.session.required: "true"
          oauth2.device.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          standard.token.exchange.enabled: "false"
          client_credentials.use_refresh_token: "false"
          dpop.bound.access.tokens: "false"
          use.refresh.tokens: "true"
          access.token.header.type.rfc9068: "false"
          acr.loa.map: "{}"
          client.introspection.response.allow.jwt.claim.enabled: "false"
          client.use.lightweight.access.token.enabled: "false"
          display.on.consent.screen: "false"
          require.pushed.authorization.requests: "false"
          request.object.required: not required
          request.object.signature.alg: any
          request.object.encryption.alg: any
          request.object.encryption.enc: any
          realm_client: "false"
          tls.client.certificate.bound.access.tokens: "false"
          token.response.type.bearer.lower-case: "false"
        protocolMappers:
          # Cross-audience: Portal tokens also carry `aud=control` so
          # the Portal SPA can call Control's API directly with the
          # same session token (no separate exchange).
          - name: control-audience-for-portal
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.custom.audience: control
              access.token.claim: "true"
              id.token.claim: "false"
              introspection.token.claim: "true"
              lightweight.claim: "false"

      # ─── member-hub (browser auth-code + PKCE, tenant-facing) ────
      # Tenant users log into Member Hub here. Cross-audience mapper
      # to `control` so Member Hub can call Control's `/api/v1/me`
      # for active-org context (same pattern as the platform-realm
      # client).
      - clientId: member-hub
        name: Member Hub
        description: Member Hub user-facing OIDC (browser auth-code + PKCE).
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://members.${DOMAIN}/*
        webOrigins:
          - https://members.${DOMAIN}
        attributes:
          # Enforce PKCE S256 server-side (the BFF always sends it). Stops a
          # downgrade to a non-PKCE / plain-challenge auth-code exchange.
          pkce.code.challenge.method: S256
          # Back-channel logout receiver — the @jaupole/ecosystem-auth BFF
          # endpoint that revokes the app's server-side session when Keycloak
          # ends the SSO session (single-logout). Day-2 replay: 03d.
          backchannel.logout.url: https://members.${DOMAIN}/auth/backchannel-logout
          post.logout.redirect.uris: https://members.${DOMAIN}/*
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"
          frontchannel.logout.session.required: "true"
          oauth2.device.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          # CTRL-06: RFC-8693 standard token exchange — the app exchanges the
          # user token for one audienced to Control. Applied/owned day-2 by
          # 03f-keycloak-ctrl06-token-exchange.sh (realm import is one-shot).
          standard.token.exchange.enabled: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: member-hub-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: member-hub
              access.token.claim: "true"
              id.token.claim: "false"
              introspection.token.claim: "true"
              lightweight.claim: "false"
              userinfo.token.claim: "false"
          # CTRL-06: NO static control-audience mapper here — a raw app token
          # must NOT carry aud=control. The control audience is minted ONLY by
          # an RFC-8693 exchange that requests the OPTIONAL `control-aud` client
          # scope (owned by 03f-keycloak-ctrl06-token-exchange.sh, since a
          # partial clientScopes block in this one-shot import would clobber
          # Keycloak's built-in default scopes).

