# KeycloakRealmImport for the `secforge-tenants` realm.
#
# Architecture: docs/01-architecture/01-iam-platform.md  (three-tier realm
#               model: platform / secforge-tenants / enterprise-{name})
# Sibling file: platform-realm.yaml  (staff realm — read it first for full
#               rationale on every shared policy field; this file documents
#               only the per-realm differences from that baseline)
#
# REALM PURPOSE — every SaaS customer (organization + its end-users) lives
# here. Operators / staff do NOT. The two-realm split enforces the
# staff↔tenant boundary at the IdP layer (not just in app code), so a
# misconfigured client redirect or role mapper in one realm cannot leak
# access into the other.
#
# IMPORT BEHAVIOR — same as platform-realm.yaml: realm-import is ONE-SHOT
# (operator skips re-apply if realm already exists). Day-2 drift recovery
# goes through the equivalent of 03a-keycloak-realm-hardening.sh — see
# follow-up: extend that script (or add 03b-…) to also harden this realm.
#
# DIFFERENCES FROM PLATFORM REALM (cross-reference with platform-realm.yaml):
#   - organizationsEnabled: true                — Keycloak Organizations is
#                                                 the first-class tenant-org
#                                                 entity within this realm
#                                                 (per-org IdP federation,
#                                                 branding, themes scope
#                                                 cleanly to one org)
#   - ssoSessionIdleTimeout: 1800 (30 min)      — tenants get a longer
#     ssoSessionMaxLifespan: 43200 (12 h)         working session than
#                                                 staff (per the architecture
#                                                 doc; staff is 15 min / 8 h)
#   - verifyEmail: true                          — tenant accounts must
#                                                 prove email ownership;
#                                                 staff accounts trust own
#                                                 email
#   - resetPasswordAllowed: true                 — tenants need self-service
#                                                 password reset; the
#                                                 "Forgot password" link
#                                                 is surfaced on the
#                                                 tenant login page
#   - VERIFY_EMAIL requiredAction defaultAction  — flows from the
#                                                 verifyEmail flip above
#   - browserFlow: browser-FLEXIBLE              — password OR passkey at
#                                                 first factor (tenant's
#                                                 choice each sign-in).
#                                                 2FA is optional, fires
#                                                 only when the user has
#                                                 enrolled a 2FA factor.
#                                                 Diverges from platform's
#                                                 strict "password +
#                                                 mandatory passkey 2FA"
#                                                 posture. Final shape
#                                                 landed 2026-05-27 (third
#                                                 pass of the day — see
#                                                 03b-keycloak-tenants-
#                                                 flexible-flow.sh for the
#                                                 live replay; previous
#                                                 passes mistakenly
#                                                 mirrored platform's
#                                                 "mandatory passkey at
#                                                 first login" posture
#                                                 before the operator's
#                                                 intended UX model was
#                                                 confirmed).
#   - webauthn-register-passwordless             — opt-in. First-factor
#     enabled=true, defaultAction=false            passkey enrollment via
#                                                 Account Console; the
#                                                 result is a credential
#                                                 of type
#                                                 `webauthn-passwordless`
#                                                 usable on the passkey
#                                                 branch of First-factor.
#   - webauthn-register requiredAction           — opt-in (was forced
#     enabled=true, defaultAction=false            briefly 2026-05-27;
#                                                 reverted same day).
#                                                 Enrolls a 2FA-typed
#                                                 webauthn credential
#                                                 used inside Conditional
#                                                 2FA. Tenants choose
#                                                 whether to harden their
#                                                 account this way.
#   - CONFIGURE_TOTP enabled=true, defaultAction=false
#                                                — opt-in. TOTP is one of
#                                                 the ALTERNATIVE 2FA
#                                                 factors in Conditional
#                                                 2FA, available to
#                                                 tenants who prefer TOTP
#                                                 over a 2FA passkey.
#   - CONFIGURE_RECOVERY_AUTHN_CODES enabled=false
#                                                — disabled. Recovery
#                                                 path is email password-
#                                                 reset (always available
#                                                 via resetPasswordAllowed)
#                                                 with operator help-desk
#                                                 ticket as fallback.
# Org-admin enforced 2FA (future): Keycloak required-actions are realm-
# scoped, not org-scoped. Plan to add per-org enforcement — likely a
# Portal feature that calls Keycloak Admin API to add CONFIGURE_TOTP /
# webauthn-register / webauthn-register-passwordless to the targeted
# tenant user's required-actions — is tracked separately.
#   - default realm role: default-roles-secforge-tenants
#   - Tenant-facing app clients only             — control-portal, control,
#                                                 member-hub, plus the
#                                                 service-account clients
#                                                 that manage tenant users
#                                                 (member-hub-admin,
#                                                 member-hub-system,
#                                                 control-admin). The
#                                                 platform-component
#                                                 clients (openbao, grafana,
#                                                 wazuh-dashboard) stay in
#                                                 the platform realm
#                                                 because only operators
#                                                 sign into those
#
# CLIENT-ID CONVENTION — clients share the SAME clientId across both realms
# (e.g. `member-hub` exists in both `platform` and `secforge-tenants`).
# The issuer URL is the realm discriminator; the clientId is the app
# identifier. App backends decide which (issuer, clientId) pairs they
# trust. This keeps app code's OIDC_CLIENT_ID env-var realm-agnostic.

apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: secforge-tenants-realm-import
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    secforge.platform/component: keycloak
    secforge.platform/realm: secforge-tenants
spec:
  keycloakCRName: keycloak
  realm:
    realm: secforge-tenants
    displayName: SecForge
    displayNameHtml: "<strong>SecForge</strong>"
    enabled: true

    # ─── Keycloak Organizations ────────────────────────────────────
    # First-class tenant-org entity inside this realm. Each SaaS
    # customer is a Keycloak Organization with its own optional IdP
    # federation, branding/themes, and member scope. See
    # docs/01-architecture/01-iam-platform.md §"Realm architecture"
    # and the three-layer org identity model (Keycloak Organization ↔
    # SpiceDB org ↔ control_db.organizations, all sharing org_id).
    organizationsEnabled: true

    # ─── Session and token lifetimes ───────────────────────────────
    # Tenants: 30 min idle / 12 h absolute (longer than staff's 15 min /
    # 8 h — see architecture doc). Remember-me still capped to 8 h idle
    # / 24 h absolute (a passkey re-tap is cheap, multi-day session is
    # not). Offline tokens disabled (we don't issue them).
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 43200
    ssoSessionIdleTimeoutRememberMe: 28800
    ssoSessionMaxLifespanRememberMe: 86400
    offlineSessionIdleTimeout: 0
    offlineSessionMaxLifespan: 0
    offlineSessionMaxLifespanEnabled: false
    accessTokenLifespan: 300
    accessTokenLifespanForImplicitFlow: 0
    accessCodeLifespan: 60
    accessCodeLifespanUserAction: 1800
    accessCodeLifespanLogin: 1800
    actionTokenGeneratedByAdminLifespan: 43200
    actionTokenGeneratedByUserLifespan: 300

    # ─── Refresh-token rotation with reuse detection ───────────────
    revokeRefreshToken: true
    refreshTokenMaxReuse: 0

    # ─── Sign-in policy ────────────────────────────────────────────
    # registrationAllowed: false — tenant org creation goes through
    # the Portal signup wizard (calls Keycloak Admin API via
    # control-admin / member-hub-admin service accounts); we do NOT
    # surface Keycloak's built-in self-registration page. Same for
    # new-member onboarding into an existing org — invite-driven.
    #
    # verifyEmail: true — tenant accounts must prove email
    # ownership. Admin-created users (via invite link) can be marked
    # emailVerified=true at creation time to skip the verify step.
    #
    # resetPasswordAllowed: true — the "Forgot password" link is
    # surfaced on the tenant login page so customers can recover
    # their own accounts without operator support. Staff in the
    # platform realm do not get this (operators have admin recovery
    # paths).
    registrationAllowed: false
    registrationEmailAsUsername: false
    rememberMe: true
    verifyEmail: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    editUsernameAllowed: false

    # ─── Brute-force protection ────────────────────────────────────
    # Same values as platform realm — tenants get identical
    # brute-force defenses. See platform-realm.yaml for tuning
    # rationale (2026-05-14 hardening sprint).
    bruteForceProtected: true
    permanentLockout: false
    maxFailureWaitSeconds: 3600
    minimumQuickLoginWaitSeconds: 60
    waitIncrementSeconds: 120
    quickLoginCheckMilliSeconds: 1000
    maxDeltaTimeSeconds: 43200
    failureFactor: 10

    # ─── Password policy (NIST SP 800-63B / CLAUDE.md rule 3) ──────
    # Same NIST-aligned policy as platform realm: length + breach-check
    # ONLY (see platform-realm.yaml for full rationale). Composition,
    # forced rotation and history(5) were removed 2026-06-02 per rule 3.
    # The breach blacklist (Pwdb_top-100000.txt) is baked into the custom
    # Keycloak image — a fresh cluster on the stock upstream image would
    # throw at evaluation time. Build invariant: 03a-...-hardening.sh:87.
    passwordPolicy: "length(14) and notUsername(undefined) and notEmail(undefined) and passwordBlacklist(Pwdb_top-100000.txt)"

    # ─── OTP policy (TOTP, RFC 6238) ───────────────────────────────
    # Same TOTP config as platform realm. Used by the auth-otp-form
    # alternative under Conditional 2FA — TOTP is one of the optional
    # 2FA factors a tenant can choose to enrol via Account Console.
    otpPolicyType: totp
    otpPolicyAlgorithm: HmacSHA1
    otpPolicyDigits: 6
    otpPolicyPeriod: 30
    otpPolicyLookAheadWindow: 1
    otpPolicyInitialCounter: 0
    otpSupportedApplications:
      - totpAppFreeOTPName
      - totpAppGoogleName
      - totpAppMicrosoftAuthenticatorName

    # ─── Required actions ──────────────────────────────────────────
    # Tenant model: FLEXIBLE first factor, OPTIONAL 2FA, NO RECOVERY CODES.
    # Both passkey-type required actions are registered and enabled, but
    # neither is defaultAction — tenants choose to enrol via Account
    # Console (see also `project_keycloak_tenants_passkey_required` memo).
    #
    # Final shape decided 2026-05-27 — final pass of the day. See realm-
    # level comment block at the top of this file for the full
    # architectural rationale (password OR passkey, optional 2FA,
    # email-only recovery path with operator help-desk fallback).
    requiredActions:
      - alias: CONFIGURE_TOTP
        name: Configure OTP
        providerId: CONFIGURE_TOTP
        enabled: true
        defaultAction: false
        priority: 10
        config: {}
      # webauthn-register: enrols a 2FA-typed `webauthn` credential.
      # Opt-in via Account Console — used inside Conditional 2FA when
      # the tenant chooses to harden their account with a 2FA passkey.
      - alias: webauthn-register
        name: Webauthn Register
        providerId: webauthn-register
        enabled: true
        defaultAction: false
        priority: 70
        config: {}
      # webauthn-register-passwordless: enrols a `webauthn-passwordless`
      # credential, usable on the First-factor branch as an alternative
      # to password. Opt-in via Account Console.
      - alias: webauthn-register-passwordless
        name: Webauthn Register Passwordless
        providerId: webauthn-register-passwordless
        enabled: true
        defaultAction: false
        priority: 80
        config: {}
      # Recovery codes: disabled on this realm. Email password-reset is
      # the recovery primary path; operator-driven help-desk ticket is
      # the fallback if email access is also lost. Row is kept so the
      # action stays registered, but no flow path triggers it.
      - alias: CONFIGURE_RECOVERY_AUTHN_CODES
        name: Recovery Authentication Codes
        providerId: CONFIGURE_RECOVERY_AUTHN_CODES
        enabled: false
        defaultAction: false
        priority: 20
        config: {}
      - alias: UPDATE_PASSWORD
        name: Update Password
        providerId: UPDATE_PASSWORD
        enabled: true
        defaultAction: false
        priority: 30
        config: {}
      - alias: VERIFY_PROFILE
        name: Verify Profile
        providerId: VERIFY_PROFILE
        enabled: true
        defaultAction: false
        priority: 90
        config: {}
      - alias: TERMS_AND_CONDITIONS
        name: Terms and Conditions
        providerId: TERMS_AND_CONDITIONS
        enabled: false
        defaultAction: false
        priority: 100
        config: {}
      - alias: VERIFY_EMAIL
        name: Verify Email
        providerId: VERIFY_EMAIL
        enabled: true
        defaultAction: true   # DIFFERENCE FROM PLATFORM — tenant accounts verify email
        priority: 50
        config: {}

    # ─── Custom authentication flow: browser-flexible ──────────────
    # Tenant-specific flow — password OR passkey as first-factor
    # alternatives, optional 2FA layered on top.
    #
    # Hierarchy:
    #   browser-flexible (top-level)
    #     ├── auth-cookie (ALTERNATIVE)
    #     ├── auth-spnego (DISABLED)
    #     ├── identity-provider-redirector (ALTERNATIVE)
    #     ├── Organization subflow (ALTERNATIVE)
    #     │   └── Conditional Organization (CONDITIONAL)
    #     │       ├── conditional-user-configured (REQUIRED)
    #     │       └── organization (ALTERNATIVE)
    #     └── forms subflow (ALTERNATIVE)
    #         ├── auth-username-form (REQUIRED)            ← username only
    #         ├── First-factor subflow (REQUIRED)
    #         │   ├── auth-password-form (ALTERNATIVE)         ← password
    #         │   └── webauthn-authenticator-passwordless (ALT)← passkey
    #         └── Conditional 2FA subflow (CONDITIONAL)
    #             ├── conditional-user-configured (REQUIRED)
    #             ├── auth-otp-form (ALTERNATIVE)             ← TOTP 2FA
    #             └── webauthn-authenticator (ALTERNATIVE)    ← 2FA passkey
    #
    # Conditional 2FA's `conditional-user-configured` gate means the 2FA
    # step only fires for users who have enrolled at least one 2FA
    # factor (TOTP or `webauthn`-typed credential). Users with neither
    # complete sign-in at the First-factor step.
    #
    # Each realm has its own independent copy of the flow — Keycloak
    # does not share flows across realms. The platform realm uses
    # `browser-webauthn-required` (strict). Do not mirror this flow
    # to platform; they target different audiences.
    #
    # Day-2 drift recovery: 03b-keycloak-tenants-flexible-flow.sh
    # (DB-write idempotent replay — kcadm is a non-starter per
    # project_keycloak_admin_db_only).
    browserFlow: browser-flexible
    authenticationFlows:
      - alias: browser-flexible
        description: Browser based authentication
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - authenticator: auth-cookie
            authenticatorFlow: false
            requirement: ALTERNATIVE
            priority: 10
            userSetupAllowed: false
          - authenticator: auth-spnego
            authenticatorFlow: false
            requirement: DISABLED
            priority: 20
            userSetupAllowed: false
          - authenticator: identity-provider-redirector
            authenticatorFlow: false
            requirement: ALTERNATIVE
            priority: 25
            userSetupAllowed: false
          - flowAlias: browser-flexible Organization
            authenticatorFlow: true
            requirement: ALTERNATIVE
            priority: 26
            userSetupAllowed: false
          - flowAlias: browser-flexible forms
            authenticatorFlow: true
            requirement: ALTERNATIVE
            priority: 30
            userSetupAllowed: false
      - alias: browser-flexible forms
        description: Username, then password or passkey, optional 2FA.
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - authenticator: auth-username-form
            authenticatorFlow: false
            requirement: REQUIRED
            priority: 10
            userSetupAllowed: false
          - flowAlias: browser-flexible First-factor
            authenticatorFlow: true
            requirement: REQUIRED
            priority: 20
            userSetupAllowed: false
          - flowAlias: browser-flexible Browser - Conditional 2FA
            authenticatorFlow: true
            requirement: CONDITIONAL
            priority: 30
            userSetupAllowed: false
      - alias: browser-flexible First-factor
        description: Password OR passkey as first factor (tenant choice)
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - authenticator: auth-password-form
            authenticatorFlow: false
            requirement: ALTERNATIVE
            priority: 10
            userSetupAllowed: false
          - authenticator: webauthn-authenticator-passwordless
            authenticatorFlow: false
            requirement: ALTERNATIVE
            priority: 20
            userSetupAllowed: false
      - alias: browser-flexible Browser - Conditional 2FA
        description: Flow to determine if any 2FA is required for the authentication
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - authenticator: conditional-user-configured
            authenticatorFlow: false
            requirement: REQUIRED
            priority: 10
            userSetupAllowed: false
          - authenticator: auth-otp-form
            authenticatorFlow: false
            requirement: ALTERNATIVE
            priority: 20
            userSetupAllowed: false
          - authenticator: webauthn-authenticator
            authenticatorFlow: false
            requirement: ALTERNATIVE
            priority: 30
            userSetupAllowed: false
      - alias: browser-flexible Organization
        description: ""
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - flowAlias: browser-flexible Browser - Conditional Organization
            authenticatorFlow: true
            requirement: CONDITIONAL
            priority: 10
            userSetupAllowed: false
      - alias: browser-flexible Browser - Conditional Organization
        description: Flow to determine if the organization identity-first login is to be used
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - authenticator: conditional-user-configured
            authenticatorFlow: false
            requirement: REQUIRED
            priority: 10
            userSetupAllowed: false
          - authenticator: organization
            authenticatorFlow: false
            requirement: ALTERNATIVE
            priority: 20
            userSetupAllowed: false

    # ─── WebAuthn policy ───────────────────────────────────────────
    # Same RpId (eTLD+1) as platform — a passkey enrolled at
    # auth.${DOMAIN} for one realm can NOT cross-validate to the other
    # (Keycloak scopes WebAuthn credentials per realm + user). RpId
    # just controls which subdomains may submit assertions, not
    # cross-realm sharing.
    #
    # Two parallel policy blocks: the "regular" policy applies to
    # `webauthn-authenticator` (2FA) and `webauthn-register`; the
    # "Passwordless" policy applies to `webauthn-authenticator-
    # passwordless` (first-factor) and `webauthn-register-passwordless`.
    # Both are aligned: same RpId, same UV=required, same algs. The
    # Passwordless block sets `requireResidentKey: Yes` so passkey
    # autofill / cross-device QR sign-in works on supporting browsers.
    webAuthnPolicyRpId: ${DOMAIN}
    webAuthnPolicyRpEntityName: SecForge
    webAuthnPolicyUserVerificationRequirement: required
    webAuthnPolicyAttestationConveyancePreference: none
    webAuthnPolicyCreateTimeout: 60
    webAuthnPolicySignatureAlgorithms:
      - ES256
      - RS256
    webAuthnPolicyPasswordlessRpId: ${DOMAIN}
    webAuthnPolicyPasswordlessRpEntityName: SecForge
    webAuthnPolicyPasswordlessUserVerificationRequirement: required
    webAuthnPolicyPasswordlessAttestationConveyancePreference: none
    webAuthnPolicyPasswordlessCreateTimeout: 60
    webAuthnPolicyPasswordlessRequireResidentKey: "Yes"
    webAuthnPolicyPasswordlessSignatureAlgorithms:
      - ES256
      - RS256

    # ─── Events / audit logging ────────────────────────────────────
    # Same event list as platform — every tenant authentication event
    # is logged + streamed via jboss-logging → STDOUT → Loki/Wazuh.
    # 7-day DB retention; durable copy in Loki.
    eventsEnabled: true
    eventsExpiration: 604800
    eventsListeners:
      - jboss-logging
    enabledEventTypes:
      - LOGIN
      - LOGIN_ERROR
      - LOGOUT
      - LOGOUT_ERROR
      - CODE_TO_TOKEN
      - CODE_TO_TOKEN_ERROR
      - CLIENT_LOGIN
      - CLIENT_LOGIN_ERROR
      - REFRESH_TOKEN
      - REFRESH_TOKEN_ERROR
      - INTROSPECT_TOKEN
      - INTROSPECT_TOKEN_ERROR
      - VALIDATE_ACCESS_TOKEN
      - USER_INFO_REQUEST
      - REVOKE_GRANT
      - REVOKE_GRANT_ERROR
      - UPDATE_TOTP
      - UPDATE_TOTP_ERROR
      - REMOVE_TOTP
      - REMOVE_TOTP_ERROR
      - UPDATE_PASSWORD
      - UPDATE_PASSWORD_ERROR
      - RESET_PASSWORD
      - RESET_PASSWORD_ERROR
      - SEND_RESET_PASSWORD
      - GRANT_CONSENT
      - REVOKE_GRANT
      - IDENTITY_PROVIDER_LOGIN
      - IDENTITY_PROVIDER_LOGIN_ERROR
      - IDENTITY_PROVIDER_FIRST_LOGIN
      - IDENTITY_PROVIDER_LINK_ACCOUNT
      - REMOVE_FEDERATED_IDENTITY
      - FEDERATED_IDENTITY_OVERRIDE_LINK
      - IMPERSONATE
      - EXECUTE_ACTIONS
      - EXECUTE_ACTION_TOKEN
      - CUSTOM_REQUIRED_ACTION
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true

    # ─── Realm signing keys (ADR-0006) ─────────────────────────────
    # Each realm has its own independently-generated key material —
    # a token issued by platform CANNOT be validated against
    # secforge-tenants' JWKS and vice versa. This is the realm
    # boundary at the cryptographic layer.
    components:
      org.keycloak.keys.KeyProvider:
        - name: rsa-generated
          providerId: rsa-generated
          subComponents: {}
          config:
            priority: ["100"]
            active: ["true"]
            enabled: ["true"]
            algorithm: ["RS256"]
            keySize: ["2048"]
        - name: rsa-enc-generated
          providerId: rsa-enc-generated
          subComponents: {}
          config:
            priority: ["100"]
            active: ["true"]
            enabled: ["true"]
            algorithm: ["RSA-OAEP"]
            keySize: ["2048"]
        - name: hmac-generated-hs512
          providerId: hmac-generated
          subComponents: {}
          config:
            priority: ["100"]
            active: ["true"]
            enabled: ["true"]
            algorithm: ["HS512"]
        - name: aes-generated
          providerId: aes-generated
          subComponents: {}
          config:
            priority: ["100"]
            active: ["true"]
            enabled: ["true"]

    defaultSignatureAlgorithm: RS256

    # ─── Realm attributes ──────────────────────────────────────────
    attributes:
      cibaBackchannelTokenDeliveryMode: poll
      cibaExpiresIn: "120"
      cibaInterval: "5"
      cibaAuthRequestedUserHint: login_hint
      parRequestUriLifespan: "60"
      "frontendUrl": "https://auth.${DOMAIN}"
      "acr.loa.map": "{}"

    # ─── Internationalization ──────────────────────────────────────
    # English-only for now; per-org locale customization is a future
    # Keycloak-Organizations feature once we have international
    # customers.
    internationalizationEnabled: false
    supportedLocales:
      - en
    defaultLocale: en

    # ─── Realm role hygiene ────────────────────────────────────────
    defaultRoles:
      - default-roles-secforge-tenants

    # ─── Service-account users for confidential clients ────────────
    #
    # Each confidential client with `serviceAccounts.enabled=true`
    # needs a backing USER_ENTITY row named `service-account-<clientId>`.
    # Same pattern as platform-realm.yaml. The realm-management roles
    # here grant the service account permission to manage users WITHIN
    # secforge-tenants — so member-hub-admin and control-admin can
    # create/manage tenant users (NOT staff users in platform).
    users:
      - username: service-account-control-admin
        enabled: true
        serviceAccountClientId: control-admin
        clientRoles:
          realm-management:
            - manage-users
            - view-users
            - query-users
            - view-clients
            - view-realm
            # manage-organizations enables Control to provision new
            # tenant Keycloak Organizations at signup time (the
            # Portal signup wizard's first write of the three-layer
            # org identity model).
            - manage-organizations
            - view-organizations
            # GOTCHA: The Keycloak v26 Organizations REST endpoint
            # ALSO requires the `realm-admin` composite role — the
            # finer-grained `manage-organizations`/`view-organizations`
            # roles alone return 403. Caught live 2026-05-23 + 26
            # debugging the signup wizard V2. Until upstream tightens
            # the check, the service account needs the broader
            # composite. Adding here keeps fresh imports working
            # without the post-import DB-write fix.
            - realm-admin
      - username: service-account-member-hub-admin
        enabled: true
        serviceAccountClientId: member-hub-admin
        clientRoles:
          realm-management:
            - manage-users
            - view-users
            - query-users
            - view-clients
            - view-realm
            - view-organizations
      - username: service-account-member-hub-system
        enabled: true
        serviceAccountClientId: member-hub-system
        # No clientRoles — Control gates this by the JWT's `azp`
        # claim, not by realm roles. Default-roles-secforge-tenants
        # is auto-applied.

    # ─── Custom realm clients ──────────────────────────────────────
    #
    # Tenant-facing app clients only. The platform-component clients
    # (openbao, grafana, wazuh-dashboard) intentionally do NOT exist
    # here — they are operator tools, accessed only from `platform`.
    #
    # Client secrets for every confidential client are auto-generated
    # by the operator on realm-import. After fresh-cluster install,
    # run the rotation pattern
    # (project_keycloak_client_secret_rotation_pattern) to sync
    # OpenBao kv / consumer k8s Secrets with the operator-generated
    # values. Backlog #60 tracks the proper secret-injection refactor.
    clients:
      # ─── control (Ecosystem Control backend, audience target) ────
      # Tenant tokens from Portal / Member Hub carry `aud=control` via
      # the cross-audience mappers below — Control's API can then
      # strict-audience-check incoming tokens regardless of which
      # client requested them. `control` exists here primarily as a
      # registered audience, but also supports direct sign-in if a
      # future tenant-facing surface needs it.
      - clientId: control
        name: Ecosystem Control
        description: Ecosystem Control backend OIDC client (server-side, auth-code).
        enabled: true
        protocol: openid-connect
        rootUrl: https://control.${DOMAIN}
        baseUrl: https://control.${DOMAIN}
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://control.${DOMAIN}/api/auth/callback
        webOrigins:
          - "+"
        attributes:
          post.logout.redirect.uris: https://control.${DOMAIN}/
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"
          oauth2.device.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          standard.token.exchange.enabled: "false"
        protocolMappers:
          - name: control-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: control
