# KeycloakRealmImport for the `platform` realm.
#
# Architecture: docs/01-architecture/01-iam-platform.md
# ADR-0006:    docs/02-decisions/0006-keycloak-keys-local.md (signing keys)
# ADR-0007:    docs/02-decisions/0007-totp-instead-of-passkeys-locally.md
#
# IMPORT BEHAVIOR — the operator's import job runs `kc.sh import` against
# the running Keycloak. It is idempotent on the realm name: if the realm
# already exists, the operator skips the import (no destructive override).
# To re-apply changes after first creation, use the runbook
# (keycloak-operations.md → "update an existing realm via kcadm.sh").

apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: platform-realm-import
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    secforge.platform/component: keycloak
    secforge.platform/realm: platform
spec:
  keycloakCRName: keycloak
  realm:
    realm: platform
    displayName: SecForge Platform
    displayNameHtml: "<strong>SecForge</strong> Platform"
    enabled: true

    # ─── Session and token lifetimes ───────────────────────────────
    # Idle 15 min, absolute 8h. Remember-me capped to 24h absolute /
    # 8h idle (2026-05-19 — production session hygiene; was 30d / 7d
    # idle). A ticked "Remember Me" now survives an overnight gap but
    # not a multi-day one. With mandatory passkeys, re-login is a
    # biometric tap. Replayed live by 03a-keycloak-realm-hardening.sh
    # since KeycloakRealmImport is one-shot.
    ssoSessionIdleTimeout: 900
    ssoSessionMaxLifespan: 28800
    ssoSessionIdleTimeoutRememberMe: 28800
    ssoSessionMaxLifespanRememberMe: 86400
    # Offline tokens disabled (we don't issue them).
    offlineSessionIdleTimeout: 0
    offlineSessionMaxLifespan: 0
    offlineSessionMaxLifespanEnabled: false
    # Access-token TTL: 5 min. Implicit flow zeroed out (and disabled per OAuth 2.1).
    accessTokenLifespan: 300
    accessTokenLifespanForImplicitFlow: 0
    # Authorization code TTL: 60s (one-shot, short window).
    accessCodeLifespan: 60
    accessCodeLifespanUserAction: 1800
    accessCodeLifespanLogin: 1800
    # Action token TTL (verify-email links etc.): 12h
    actionTokenGeneratedByAdminLifespan: 43200
    actionTokenGeneratedByUserLifespan: 300

    # ─── Refresh-token rotation with reuse detection ───────────────
    # revokeRefreshToken=true forces rotation; refreshTokenMaxReuse=0
    # forbids any reuse — second presentation revokes the entire grant.
    revokeRefreshToken: true
    refreshTokenMaxReuse: 0

    # ─── Sign-in policy ────────────────────────────────────────────
    registrationAllowed: false
    registrationEmailAsUsername: false
    rememberMe: true
    verifyEmail: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: false
    editUsernameAllowed: false

    # ─── Brute-force protection ────────────────────────────────────
    # Tuned 2026-05-14 per checklist-auditor rule 5: failureFactor raised
    # from 5 → 10 (rule requires ≥10), maxFailureWaitSeconds raised from
    # 15min → 60min so repeat offenders sit out longer, waitIncrement
    # raised from 60s → 120s for steeper backoff curve. Wait-based
    # (permanentLockout=false) — never a hard lockout, so a legitimate
    # user typo storm doesn't brick the account.
    bruteForceProtected: true
    permanentLockout: false
    maxFailureWaitSeconds: 3600
    minimumQuickLoginWaitSeconds: 60
    waitIncrementSeconds: 120
    quickLoginCheckMilliSeconds: 1000
    maxDeltaTimeSeconds: 43200
    failureFactor: 10

    # ─── Password policy ───────────────────────────────────────────
    # length(14)                    Per NIST SP 800-63B Vol B §5.1.1.2.
    # digits/lower/upper/special    Composition rules (defense-in-depth
    #                               vs basic dictionary attacks).
    # notUsername / notEmail        Block trivially-derivable choices.
    # passwordHistory(5)            User can't recycle the last 5.
    # forceExpiredPasswordChange    Conservative; modern NIST guidance
    #   (365)                       discourages forced rotation but
    #                               compliance frameworks still want it.
    # passwordBlacklist(...)        Rejects any password in the HIBP
    #                               top-100K compromised list. The list
    #                               is mounted into the pod via the
    #                               keycloak-password-blacklist
    #                               ConfigMap at
    #                               /opt/keycloak/data/password-blacklists.
    #                               Source: SecLists Pwdb_top-100000.txt.
    #                               Closes checklist-auditor rule 4
    #                               (2026-05-14).
    #
    # NOTE: KeycloakRealmImport is one-shot — this block documents what
    # is currently live, applied via kcadm. To replay onto a fresh
    # realm, copy the passwordPolicy value into the Keycloak admin or
    # use kcadm with `kcadm.sh update realms/platform -s passwordPolicy=...`.
    passwordPolicy: "length(14) and digits(1) and lowerCase(1) and upperCase(1) and specialChars(1) and notUsername(undefined) and notEmail(undefined) and passwordHistory(5) and forceExpiredPasswordChange(365) and passwordBlacklist(Pwdb_top-100000.txt)"

    # ─── OTP policy (TOTP, RFC 6238) ───────────────────────────────
    # SHA-1 chosen for broad authenticator-app compatibility (1Password,
    # Bitwarden, Google Authenticator, Authy, FreeOTP, Aegis).
    otpPolicyType: totp
    otpPolicyAlgorithm: HmacSHA1
    otpPolicyDigits: 6
    otpPolicyPeriod: 30
    otpPolicyLookAheadWindow: 1
    otpPolicyInitialCounter: 0
    otpSupportedApplications:
      - totpAppFreeOTPName
      - totpAppGoogleName
      - totpAppMicrosoftAuthenticatorName

    # ─── Required actions ──────────────────────────────────────────
    # CONFIGURE_TOTP and CONFIGURE_RECOVERY_AUTHN_CODES are both
    # default-actions, meaning every newly-created user is required to
    # complete them at first login. Order is enforced by `priority`
    # (lower number runs first): TOTP first, then recovery codes.
    requiredActions:
      # CONFIGURE_TOTP — enabled (existing TOTP users still resolve) but
      # NO LONGER defaultAction since the 2026-05-14 hardening (passkeys
      # are mandatory, TOTP is opt-in only). Realm-import is one-shot so
      # for the LIVE cluster, 03a-keycloak-realm-hardening.sh did the flip;
      # this declaration is the source-of-truth for greenfield rebuild.
      - alias: CONFIGURE_TOTP
        name: Configure OTP
        providerId: CONFIGURE_TOTP
        enabled: true
        defaultAction: false
        priority: 10
        config: {}
      # webauthn-register — DEFAULT action for all new users. Combined
      # with the custom browser-webauthn-required authentication flow
      # (still in 03a-keycloak-realm-hardening.sh — flow declarations
      # are too complex for this YAML for now), this enforces passkey
      # enrollment at first login. Reference: project_keycloak_passkeys_mandatory.
      - alias: webauthn-register
        name: Webauthn Register
        providerId: webauthn-register
        enabled: true
        defaultAction: true
        priority: 70
        config: {}
      - alias: CONFIGURE_RECOVERY_AUTHN_CODES
        name: Recovery Authentication Codes
        providerId: CONFIGURE_RECOVERY_AUTHN_CODES
        enabled: true
        defaultAction: true
        priority: 20
        config: {}
      - alias: UPDATE_PASSWORD
        name: Update Password
        providerId: UPDATE_PASSWORD
        enabled: true
        defaultAction: false
        priority: 30
        config: {}
      - alias: VERIFY_PROFILE
        name: Verify Profile
        providerId: VERIFY_PROFILE
        enabled: true
        defaultAction: false
        priority: 90
        config: {}
      - alias: TERMS_AND_CONDITIONS
        name: Terms and Conditions
        providerId: TERMS_AND_CONDITIONS
        enabled: false
        defaultAction: false
        priority: 100
        config: {}
      - alias: VERIFY_EMAIL
        name: Verify Email
        providerId: VERIFY_EMAIL
        enabled: false      # platform realm: project owner trusts own email
        defaultAction: false
        priority: 50
        config: {}

    # ─── WebAuthn policy ───────────────────────────────────────────
    # Hardening landed 2026-05-14 (cross-reference:
    # project_keycloak_passkeys_mandatory). RpId is the eTLD+1 so
    # any *.secforge.dev subdomain can complete the WebAuthn assertion
    # against credentials enrolled at auth.secforge.dev. User-verification
    # required = the authenticator MUST verify the user locally (PIN,
    # biometric, etc.); attestation conveyance "none" because we don't
    # care which authenticator vendor (yubikey vs platform auth vs
    # whatever) — only that user verification happened.
    webAuthnPolicyRpId: ${DOMAIN}
    webAuthnPolicyRpEntityName: SecForge Platform
    webAuthnPolicyUserVerificationRequirement: required
    webAuthnPolicyAttestationConveyancePreference: none
    webAuthnPolicyCreateTimeout: 60
    webAuthnPolicySignatureAlgorithms:
      - ES256
      - RS256

    # ─── Events / audit logging ────────────────────────────────────
    # All login, token, and admin events stream to STDOUT as JSON via
    # the jboss-logging listener (Keycloak's default) plus our
    # log-console-output=json server option. Phase 7 routes STDOUT
    # to Loki/Wazuh.
    eventsEnabled: true
    eventsExpiration: 604800   # 7 days in DB; durable copy in Loki
    eventsListeners:
      - jboss-logging
    enabledEventTypes:
      - LOGIN
      - LOGIN_ERROR
      - LOGOUT
      - LOGOUT_ERROR
      - CODE_TO_TOKEN
      - CODE_TO_TOKEN_ERROR
      - CLIENT_LOGIN
      - CLIENT_LOGIN_ERROR
      - REFRESH_TOKEN
      - REFRESH_TOKEN_ERROR
      - INTROSPECT_TOKEN
      - INTROSPECT_TOKEN_ERROR
      - VALIDATE_ACCESS_TOKEN
      - USER_INFO_REQUEST
      - REVOKE_GRANT
      - REVOKE_GRANT_ERROR
      - UPDATE_TOTP
      - UPDATE_TOTP_ERROR
      - REMOVE_TOTP
      - REMOVE_TOTP_ERROR
      - UPDATE_PASSWORD
      - UPDATE_PASSWORD_ERROR
      - RESET_PASSWORD
      - RESET_PASSWORD_ERROR
      - SEND_RESET_PASSWORD
      - GRANT_CONSENT
      - REVOKE_GRANT
      - IDENTITY_PROVIDER_LOGIN
      - IDENTITY_PROVIDER_LOGIN_ERROR
      - IDENTITY_PROVIDER_FIRST_LOGIN
      - IDENTITY_PROVIDER_LINK_ACCOUNT
      - REMOVE_FEDERATED_IDENTITY
      - FEDERATED_IDENTITY_OVERRIDE_LINK
      - IMPERSONATE
      - EXECUTE_ACTIONS
      - EXECUTE_ACTION_TOKEN
      - CUSTOM_REQUIRED_ACTION
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true

    # ─── Realm signing keys (ADR-0006) ─────────────────────────────
    # RS256 active (priority 100). PS256 advertised in JWKS. RSA-OAEP
    # for encryption. HS512 HMAC for internal cookie/session signing
    # (NOT for client-bound tokens). AES for component-internal use.
    components:
      org.keycloak.keys.KeyProvider:
        - name: rsa-generated
          providerId: rsa-generated
          subComponents: {}
          config:
            priority: ["100"]
            active: ["true"]
            enabled: ["true"]
            algorithm: ["RS256"]
            keySize: ["2048"]
        - name: rsa-enc-generated
          providerId: rsa-enc-generated
          subComponents: {}
          config:
            priority: ["100"]
            active: ["true"]
            enabled: ["true"]
            algorithm: ["RSA-OAEP"]
            keySize: ["2048"]
        - name: hmac-generated-hs512
          providerId: hmac-generated
          subComponents: {}
          config:
            priority: ["100"]
            active: ["true"]
            enabled: ["true"]
            algorithm: ["HS512"]
        - name: aes-generated
          providerId: aes-generated
          subComponents: {}
          config:
            priority: ["100"]
            active: ["true"]
            enabled: ["true"]

    # ─── Default token signing algorithm ───────────────────────────
    defaultSignatureAlgorithm: RS256

    # ─── Realm attributes ──────────────────────────────────────────
    attributes:
      # Tighten the access-code single-use window (default 60s).
      cibaBackchannelTokenDeliveryMode: poll
      cibaExpiresIn: "120"
      cibaInterval: "5"
      cibaAuthRequestedUserHint: login_hint
      # PAR + DPoP advertised at the realm; per-client enforcement
      # is set on the BFF clients (Phase 3.5).
      parRequestUriLifespan: "60"
      # Lock down implicit/ROPC at the realm level via client policies
      # (managed in Phase 3.5 via admin REST). Realm-level setting:
      "frontendUrl": "https://auth.${DOMAIN}"
      # Disallow client-initiated account linking (security tightening).
      "acr.loa.map": "{}"

    # ─── Internationalization ──────────────────────────────────────
    internationalizationEnabled: false
    supportedLocales:
      - en
    defaultLocale: en

    # ─── Realm role hygiene ────────────────────────────────────────
    # Default realm-level roles (offline_access, uma_authorization)
    # remain available; we don't auto-assign them.
    defaultRoles:
      - default-roles-platform

    # ─── Service-account users for confidential clients ────────────
    #
    # Each confidential client with `serviceAccounts.enabled=true` needs
    # a backing USER_ENTITY row named `service-account-<clientId>`.
    # The Keycloak Operator's realm-import does NOT auto-create these
    # the way kcadm does — they must be declared explicitly here. The
    # `clientRoles` block then attaches the realm-management roles
    # required for the admin-API client_credentials flow.
    #
    # No regular human users are seeded — admin user(s) live in the
    # master realm, and platform-realm users are created via Portal /
    # ecosystem-control sign-up + invitation flows.
    users:
      - username: service-account-control-admin
        enabled: true
        serviceAccountClientId: control-admin
        clientRoles:
          realm-management:
            - manage-users
            - view-users
            - query-users
            - view-clients
            - view-realm
      - username: service-account-member-hub-admin
        enabled: true
        serviceAccountClientId: member-hub-admin
        clientRoles:
          realm-management:
            - manage-users
            - view-users
            - query-users
            - view-clients
            - view-realm
      - username: service-account-member-hub-system
        enabled: true
        serviceAccountClientId: member-hub-system
        # Control gates by the JWT's `azp` claim, not by realm roles —
        # so this service account only needs default-roles-platform
        # (automatically applied), no explicit clientRoles required.

    # ─── Custom realm clients ──────────────────────────────────────
    #
    # All non-built-in `platform` realm clients live here. The realm-
    # import is ONE-SHOT: on existing clusters the operator detects the
    # realm already exists and skips re-applying these definitions. So
    # day-2 edits to live clients still flow through admin UI / direct DB
    # — AND must be back-ported here so cluster rebuild stays accurate.
    #
    # Backlog history:
    #   #57 (2026-05-23 ✅) — member-hub × 3
    #   #59 (2026-05-23 ✅) — openbao, grafana, wazuh-dashboard,
    #                         control × 3
    #
    # IMPORTANT: client secrets for every confidential client are auto-
    # generated by the operator on import. After fresh-cluster install,
    # run the rotation pattern (project_keycloak_client_secret_rotation_pattern)
    # to sync OpenBao kv / consumer k8s Secrets with the operator-
    # generated values (or vice versa if Velero restored that state
    # first). Backlog #60 tracks the proper "secret-injection" refactor
    # — pre-populate consumer Secrets, reference them here via the
    # operator's `placeholders` feature — so greenfield install doesn't
    # need the manual rotation step.
    #
    # Ordering convention: platform-component clients first (openbao,
    # grafana, wazuh-dashboard), then ecosystem control trio
    # (control, control-admin, control-portal), then ecosystem apps
    # (member-hub trio). Within each group, user-facing browser clients
    # before service-account-only clients.
    clients:
      # ─── openbao (OIDC auth for the OpenBao UI/CLI) ──────────────
      - clientId: openbao
        name: OpenBao
        description: >-
          OpenBao OIDC auth for the platform realm. Confidential client
          used by operators signing into the bao UI and CLI helper.
          Secret is rendered into K8s Secret `openbao/keycloak-openbao-client-secret`
          (key `client_secret`); consumed by `05i-openbao-oidc-auth.sh`.
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://bao.${DOMAIN}/oidc/callback
          - https://bao.${DOMAIN}/ui/vault/auth/oidc/oidc/callback
          # localhost callback supports `bao login -method=oidc` (CLI
          # launches a browser to localhost:8250 for the callback).
          - http://localhost:8250/oidc/callback
        webOrigins:
          - "+"
        attributes:
          post.logout.redirect.uris: "+"

      # ─── grafana (OIDC for Grafana UI) ───────────────────────────
      - clientId: grafana
        name: Grafana
        description: >-
          OIDC client for Grafana UI sign-in. Secret rendered into K8s
          Secret `observability/grafana-oidc-client-secret` (consumed by
          Grafana as `GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET` via envFrom).
        enabled: true
        protocol: openid-connect
        rootUrl: https://grafana.${DOMAIN}
        baseUrl: https://grafana.${DOMAIN}
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://grafana.${DOMAIN}/login/generic_oauth
        webOrigins:
          - https://grafana.${DOMAIN}
        attributes:
          post.logout.redirect.uris: https://grafana.${DOMAIN}
          # Explicit JWS algorithms — Grafana strict-verifies all three
          # token classes; keep aligned with realm's defaultSignatureAlgorithm.
          access.token.signed.response.alg: RS256
          id.token.signed.response.alg: RS256
          user.info.signed.response.alg: RS256
          pkce.code.challenge.method: S256
          use.refresh.tokens: "true"
          use.jwks.url: "false"
          client_credentials.use_refresh_token: "false"
          dpop.bound.access.tokens: "false"
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"

      # ─── wazuh-dashboard (OIDC for OpenSearch Dashboards) ────────
      - clientId: wazuh-dashboard
        name: Wazuh Dashboard
        description: >-
          OIDC client for Wazuh's OpenSearch Dashboards UI. Secret is
          template-substituted into ConfigMap
          `wazuh/wazuh-dashboard-config` at pod start (placeholder
          `__OIDC_CLIENT_SECRET__` in `opensearch_dashboards.yml`).
          See `07i-keycloak-wazuh-client.sh` (deprecated) for the
          historical creation flow.
        enabled: true
        protocol: openid-connect
        rootUrl: https://wazuh.${DOMAIN}
        baseUrl: https://wazuh.${DOMAIN}
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://wazuh.${DOMAIN}/auth/openid/login
        webOrigins:
          - https://wazuh.${DOMAIN}
        attributes:
          post.logout.redirect.uris: https://wazuh.${DOMAIN}
          access.token.signed.response.alg: RS256
          id.token.signed.response.alg: RS256
          user.info.signed.response.alg: RS256
          use.refresh.tokens: "true"
          use.jwks.url: "false"
          client_credentials.use_refresh_token: "false"
          dpop.bound.access.tokens: "false"
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"

      # ─── control (Ecosystem Control backend, server-side OIDC) ───
      - clientId: control
        name: Ecosystem Control
        description: >-
          Server-side confidential OIDC client backing Ecosystem
          Control's user sign-in (Portal proxies the auth code through
          to Control's /api/auth/callback). Secret rendered into K8s
          Secret `control/control-app-secrets` (key OIDC_CLIENT_SECRET)
          via VSO from OpenBao kv `apps/control/runtime`.
        enabled: true
        protocol: openid-connect
        rootUrl: https://control.${DOMAIN}
        baseUrl: https://control.${DOMAIN}
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://control.${DOMAIN}/api/auth/callback
        webOrigins:
          - "+"
        attributes:
          post.logout.redirect.uris: https://control.${DOMAIN}/
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"
          oauth2.device.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          standard.token.exchange.enabled: "false"
        protocolMappers:
          # Self-audience: every access token issued for this client
          # carries `aud=control` so Control's API can strict-audience-
          # check incoming tokens. (Live has TWO mappers with identical
          # config — "Audience Mapper" + "Strict Mapper" — drift from
          # UI clicks during initial setup. Codified as one; clean up
          # the live duplicate via admin UI when convenient.)
          - name: control-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: control
              access.token.claim: "true"
              id.token.claim: "false"
              introspection.token.claim: "true"
              lightweight.claim: "true"

      # ─── control-admin (Keycloak Admin API service-account) ──────
      - clientId: control-admin
        name: Ecosystem Control Admin API Client
        description: >-
          Service-account-only confidential client. Control's backend
          uses client_credentials to mint a token and call Keycloak's
          admin REST API (member create, role mgmt, etc.). Matches the
          member-hub-admin pattern. Secret rendered into K8s Secret
          `control/control-app-secrets` (key KEYCLOAK_ADMIN_CLIENT_SECRET).
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        # NO redirectUris / webOrigins — service-account-only clients
        # don't use auth-code flow. Live has vestigial `/*` from UI
        # auto-populate which should be cleaned via DB DELETE (same as
        # the member-hub-admin/-system cleanup did on 2026-05-23).
        attributes:
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"
          oauth2.device.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          standard.token.exchange.enabled: "false"

      # ─── control-portal (Ecosystem Portal SPA, PKCE) ─────────────
      - clientId: control-portal
        name: Ecosystem Portal SPA
        description: >-
          Public client (NO client_secret) for the Ecosystem Portal
          SPA. Uses Authorization Code + PKCE (S256). Confidential
          ChannelType marked NON-confidential by publicClient=true.
          Both production (https://control.${DOMAIN}/auth/callback)
          and local hybrid-dev (http://portal.localhost:5173/auth/callback)
          redirects are allowed.
        enabled: true
        protocol: openid-connect
        rootUrl: https://control.${DOMAIN}
        baseUrl: https://control.${DOMAIN}
        publicClient: true
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://control.${DOMAIN}/auth/callback
          - http://portal.localhost:5173/auth/callback
        webOrigins:
          - "+"
        attributes:
          # PKCE S256 mandatory — public clients with no client_secret
          # need PKCE to be safe.
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://control.${DOMAIN}/##http://portal.localhost:5173
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"
          frontchannel.logout.session.required: "true"
          oauth2.device.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          standard.token.exchange.enabled: "false"
          client_credentials.use_refresh_token: "false"
          dpop.bound.access.tokens: "false"
          use.refresh.tokens: "true"
          access.token.header.type.rfc9068: "false"
          acr.loa.map: "{}"
          client.introspection.response.allow.jwt.claim.enabled: "false"
          client.use.lightweight.access.token.enabled: "false"
          display.on.consent.screen: "false"
          require.pushed.authorization.requests: "false"
          request.object.required: not required
          request.object.signature.alg: any
          request.object.encryption.alg: any
          request.object.encryption.enc: any
          realm_client: "false"
          tls.client.certificate.bound.access.tokens: "false"
          token.response.type.bearer.lower-case: "false"

      # ─── member-hub (browser auth-code + PKCE, user-facing) ──────
      - clientId: member-hub
        name: Member Hub
        description: >-
          User-facing OIDC client. Browser auth-code + PKCE flow against
          the platform realm. Confidential (has client_secret, stored in
          OpenBao at apps/member-hub/runtime#oidc_client_secret and
          rendered by VSO into the member-hub-app-secrets K8s Secret
          as OIDC_CLIENT_SECRET).
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://members.${DOMAIN}/*
        webOrigins:
          - https://members.${DOMAIN}
        attributes:
          post.logout.redirect.uris: https://members.${DOMAIN}/*
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"
          frontchannel.logout.session.required: "true"
          oauth2.device.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          standard.token.exchange.enabled: "false"
          display.on.consent.screen: "false"
        protocolMappers:
          # Self-audience: every access token issued for this client
          # carries `aud=member-hub` so the member-hub backend can
          # strict-audience-check (per project_keycloak_audience_mappers).
          - name: member-hub-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: member-hub
              access.token.claim: "true"
              id.token.claim: "false"
              introspection.token.claim: "true"
              lightweight.claim: "false"
              userinfo.token.claim: "false"
          # Cross-audience: tokens for member-hub also carry `aud=control`
          # so member-hub can call Ecosystem Control's `/api/v1/me` to
          # fetch the active-org context on sign-in (no separate token
          # exchange needed — the user's session JWT already names
          # Control as an audience).
          - name: control-audience-for-getme
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.custom.audience: control
              access.token.claim: "true"
              id.token.claim: "false"
              introspection.token.claim: "true"
              lightweight.claim: "false"

      # ─── member-hub-admin (Keycloak Admin API service-account) ───
      - clientId: member-hub-admin
        name: Member Hub Admin API Client
        description: >-
          Service-account-only confidential client. The Member Hub
          backend uses client_credentials to mint a token and call
          Keycloak's admin REST API (member create, role mgmt). Roles
          attached to the service-account user above grant the
          minimum realm-management scope needed.
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        # NO redirectUris / webOrigins — service-account-only clients
        # don't use auth-code flow. Operator-UI tends to auto-populate
        # `/*` if these are missing on UI-created clients, but that's
        # cosmetic noise; with standard_flow=false, they're never
        # consulted by Keycloak. See project_keycloak_member_hub_clients_uncodified
        # for why we explicitly leave these empty.
        attributes:
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"
          oauth2.device.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          standard.token.exchange.enabled: "false"

      # ─── member-hub-system (Ecosystem Control service-account) ───
      - clientId: member-hub-system
        name: Member Hub → Control System Client
        description: >-
          Service-account-only confidential client for backend-to-backend
          calls from member-hub to Ecosystem Control's /api/v1/system/*
          endpoints (anonymous public enrollment submit path). Control
          gates by inspecting the JWT's `azp` claim equals
          "member-hub-system" — no realm roles needed beyond
          default-roles-platform.
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        attributes:
          backchannel.logout.session.required: "true"
          backchannel.logout.revoke.offline.tokens: "false"
          oauth2.device.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          standard.token.exchange.enabled: "false"
        protocolMappers:
          # Self-audience so member-hub-system tokens advertise
          # `aud=member-hub-system` (Control trusts azp not aud, but
          # this keeps the audience-discipline consistent across all
          # platform clients).
          - name: aud-self
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: member-hub-system
              access.token.claim: "true"
              id.token.claim: "false"
              introspection.token.claim: "false"
              lightweight.claim: "false"
