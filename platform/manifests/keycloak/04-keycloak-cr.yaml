# Keycloak custom resource — managed by the Keycloak Operator.
#
# Differences from the retired local edition:
#   - hostname: auth.${DOMAIN} (was auth.secforge.local)
#   - admin/public split removed (single host for now; admin gating is by
#     Keycloak's own auth + the BFF pattern; we can re-add the split with
#     Cloudflare Access or a network ACL later)
#   - edition label: prod (was local)

apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: secforge-platform
    secforge.platform/component: keycloak
    secforge.platform/edition: prod
spec:
  instances: 1
  # Production uses the SecForge custom Keycloak image which bakes in:
  #   - HIBP top-100k password blacklist at /opt/keycloak/data/password-blacklists/
  #   - `kc.sh build --features=recovery-codes,dpop --db=postgres` augmentation
  # Built + Cosign-keyless-signed by .github/workflows/keycloak-image-build.yml.
  # Verified at admission by the Kyverno verify-image-signature-secforge
  # policy (rule: verify-secforge).
  #
  # Refresh procedure: bump platform/manifests/keycloak/image/Dockerfile, merge,
  # GHA outputs the new digest in its run summary, then replace the digest
  # below and `kubectl apply`. The Keycloak Operator handles the rollout.
  #
  # operator-backlog #48 cutover (2026-05-22): moved the IdP off the unsigned
  # in-cluster build localhost/secforge/keycloak:26.3.3-optimized onto this
  # GHA-built, cosign-v2-signed image (base 6a7217a — CVE-refreshed).
  image: ghcr.io/jaupole/keycloak@sha256:90bbcd9dd270372f2899c8400dddf779a8c6a440af97bf1cc8dabdf103a8bfa3
  startOptimized: true    # using the pre-built optimized image

  db:
    vendor: postgres
    host: secforge-keycloak-db-rw.keycloak.svc
    port: 5432
    database: keycloak
    usernameSecret:
      name: secforge-keycloak-db-app
      key: username
    passwordSecret:
      name: secforge-keycloak-db-app
      key: password

  hostname:
    hostname: https://auth.${DOMAIN}
    strict: true

  http:
    # Internal listener is HTTPS-only. The public edge terminates TLS at the
    # Ingress; this keeps the in-cluster hop encrypted too, served from the
    # internal-CA cert in keycloak-internal-tls (05-internal-tls-cert.yaml).
    # httpEnabled:true would regress the internal listener to plaintext.
    httpEnabled: false
    tlsSecret: keycloak-internal-tls
  proxy:
    headers: xforwarded

  ingress:
    enabled: false   # we manage our own Ingress

  features:
    enabled:
      - recovery-codes
      - dpop

  truststores:
    pg-ca:
      secret:
        name: secforge-keycloak-db-ca

  additionalOptions:
    - name: log-console-output
      value: json
    - name: log-level
      value: INFO
    - name: health-enabled
      value: "true"
    - name: metrics-enabled
      value: "true"
    # OpenTelemetry tracing → otel-collector in observability ns.
    # Endpoint must be the OTLP HTTP base URL (Quarkus Keycloak doesn't
    # support gRPC OTLP without extra config). The OTel collector forwards
    # traces to Tempo via the cluster-internal pipeline.
    - name: tracing-enabled
      value: "true"
    - name: tracing-endpoint
      value: "http://otel-collector.observability.svc.cluster.local:4318"
    - name: tracing-protocol
      value: "http/protobuf"
    - name: tracing-service-name
      value: "keycloak"
    - name: tracing-resource-attributes
      value: "service.namespace=keycloak"
    - name: db-url-properties
      value: "?sslmode=require"
    - name: spi-events-listener-jboss-logging-success-level
      value: info
    - name: spi-events-listener-jboss-logging-error-level
      value: warn
    # Theme/static-resource caching (operator-backlog #35). These match
    # Keycloak's production-mode defaults — pinned here so the intent is
    # declarative and survives a future upstream default change:
    #   - static-max-age: how long the browser caches /resources/<ver>/*
    #     assets. 30d. Safe because the <ver> path segment is content-
    #     versioned — a Keycloak upgrade serves assets under a new path.
    #   - cache-themes / cache-templates: Keycloak keeps theme files +
    #     FreeMarker templates in memory rather than re-reading from disk.
    #     true in production; pinned so a dev-mode default flip doesn't
    #     silently change admin-console asset behaviour.
    - name: spi-theme-static-max-age
      value: "2592000"
    - name: spi-theme-cache-themes
      value: "true"
    - name: spi-theme-cache-templates
      value: "true"

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  unsupported:
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: keycloak
          app.kubernetes.io/component: identity-provider
          app.kubernetes.io/part-of: secforge-platform
          secforge.platform/component: keycloak
          spiffe.io/spire-managed-identity: "true"
      spec:
        serviceAccountName: keycloak
        automountServiceAccountToken: true
        # imagePullSecrets for the private GHCR image are on the keycloak
        # ServiceAccount (03-serviceaccount.yaml), NOT here — the Keycloak
        # Operator does not propagate imagePullSecrets from this podTemplate.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: keycloak
            # Digest-pinned image — no re-pull needed on restart.
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false   # Quarkus build writes JARs at startup with startOptimized:false
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: spiffe-workload-api
                mountPath: /spiffe-workload-api
                readOnly: true
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: spiffe-workload-api
            csi:
              driver: csi.spiffe.io
              readOnly: true
          - name: tmp
            emptyDir: {}
