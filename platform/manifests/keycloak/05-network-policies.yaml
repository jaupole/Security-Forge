# Layer A NetworkPolicies for the keycloak namespace.
#
# Applied 2026-05-14 alongside default-deny-ingress. The chart-managed
# `keycloak-network-policy` (intra-pod gossip 7800/57800) stays in place.
# Adds explicit allow rules so default-deny-ingress doesn't break:
#   - User-facing HTTPS via ingress-nginx (ingress-nginx ns → 8443)
#   - In-cluster OIDC server-to-server clients (mostly travel via ingress
#     hostAlias in current setup, but rule supports direct pod→keycloak
#     for future hardening that drops the public-DNS detour)
#   - Prometheus metrics scrape (observability/prometheus → 9000)
#   - keycloak-operator → keycloak-0 (CR reconciliation)
#
# Note: openbao, observability, wazuh currently call keycloak via
# `auth.secforge.dev` hostAlias → ingress-nginx ClusterIP. So those flows
# are actually covered by `allow-ingress-nginx-to-keycloak`. The
# `allow-cluster-oidc-clients-to-keycloak` rule below is for the eventual
# hardening that drops the public-DNS round-trip in favour of in-cluster
# service-name resolution.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector: {}
  policyTypes: [Ingress]


---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-oidc-clients-to-keycloak
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [openbao, observability, wazuh, app, ecosystem, vault-secrets-operator]
    ports:
    - protocol: TCP
      port: 8443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-keycloak-metrics
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-operator-to-keycloak
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: keycloak-operator
    ports:
    - protocol: TCP
      port: 8443

---
# CRITICAL: the keycloak-ns CNPG cluster pods (secforge-keycloak-db-*) live
# in the same namespace and are also covered by default-deny-ingress. Without
# this rule, keycloak pods cannot connect to their own database after any
# pod recycle. The intra-ns egress allow rule lets keycloak SEND traffic;
# this rule lets the DB pod RECEIVE it.
#
# Discovered the hard way on 2026-05-14 when a keycloak STS rollout brought
# the pod into CrashLoopBackOff because the old TCP connection was lost and
# the new pod couldn't establish a fresh one.
#
# The `from` selector uses `app.kubernetes.io/name=keycloak` (operator-set on
# every keycloak-managed pod) rather than `app=keycloak` (which is only on
# the server pod, NOT on realm-import Job pods which use
# app=keycloak-realm-import). Without this, realm-import Jobs never reach
# the DB and the operator burns through backoffLimit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-to-postgres
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: secforge-keycloak-db
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: keycloak
    ports:
    - protocol: TCP
      port: 5432

---
# CNPG operator (in postgres-operator ns) needs reachable to the DB pod for
# reconciliation, health checks, and barman-cloud metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator-to-postgres
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: secforge-keycloak-db
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [postgres-operator, cnpg-system]
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9187
    - protocol: TCP
      port: 9090

---
# Ingress: Istio ingress gateways (public + tailnet, istio-ingress ns) →
# keycloak:8443. auth.secforge.dev terminates at the gateway and routes here.
# The two-plane gateway migration (2026-06-03, ADR-0032) replaced the old
# ingress-nginx → keycloak:8443 path referenced in this file's header.
# Was live-patched; codified 2026-06-06 to close the rebuild-from-git DR gap.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-ingress-to-keycloak
  namespace: keycloak
  labels:
    secforge.platform/component: istio-gateway
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-ingress
    ports:
    - protocol: TCP
      port: 8443
