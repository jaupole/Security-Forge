# Layer A NetworkPolicies for the keycloak namespace.
#
# Applied 2026-05-14 alongside default-deny-ingress. The chart-managed
# `keycloak-network-policy` (intra-pod gossip 7800/57800) stays in place.
# Adds explicit allow rules so default-deny-ingress doesn't break:
#   - Istio ingress gateways (public + tailnet) → 8443  (user-facing HTTPS)
#   - In-cluster OIDC / admin-REST server-to-server clients → 8443
#   - Prometheus metrics scrape (observability/prometheus → 9000)
#   - keycloak-operator → keycloak-0 (CR reconciliation)
#   - keycloak → its own CNPG database (5432); CNPG operator → DB
#
# In-cluster client path (current, ADR-0032 + CoreDNS rewrite): clients keep
# `KEYCLOAK_URL=https://auth.secforge.dev`, but in-cluster that hostname
# resolves to the `keycloak-auth-internal` ClusterIP via the CoreDNS
# `rewrite name exact` rule (keycloak/05b-internal-port443-service.yaml),
# so their OIDC/admin back-channel is pod → ClusterIP → keycloak:8443 and
# never traverses the ingress gateway. This replaced the ingress-nginx /
# hostAlias detour referenced in earlier revisions of this file.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector: {}
  policyTypes: [Ingress]


---
# In-cluster OIDC / admin-REST clients allowed to reach keycloak:8443.
#
# Enforcement reality (verified live 2026-07-06 — backlog #74 follow-up #1):
#   * NON-AMBIENT clients (openbao, vault-secrets-operator) have no
#     `istio.io/dataplane-mode=ambient` ns label, so their traffic is plain
#     pod→pod and THIS kube-router L4 rule genuinely gates them. They must
#     stay listed or their keycloak calls break under default-deny-ingress.
#   * AMBIENT clients (observability, wazuh, control, member-hub,
#     proposal-forge, project-manager, business-manager, onlyoffice) have
#     their egress captured by ztunnel. keycloak is not in the mesh (no
#     waypoint), so ambient→keycloak bypasses this ingress netpol at L4
#     (proven: a `control` grant-sweep reached the admin REST API while
#     `control` was absent from this list). They are listed here for
#     defense-in-depth / intent-documentation — the rule becomes real
#     enforcement for them if keycloak ever joins the ambient mesh. Their
#     effective L4 gate today is the mesh; L7 auth (client creds / JWT) is
#     the primary control regardless. See backlog for the "no L4 client
#     allow-list on the un-meshed keycloak ingress" follow-up.
#
# Removed dead entries `app`/`ecosystem` (Local-Edition namespaces that do
# not exist in prod). NetworkPolicy ingress is allow-only, so this edit can
# only widen or no-op — it cannot introduce a new drop.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-oidc-clients-to-keycloak
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          # non-ambient (real L4 enforcement here):
          values: [openbao, vault-secrets-operator,
          # ambient (documented; effective L4 gate is the mesh):
                    observability, wazuh, control, member-hub,
                    proposal-forge, project-manager, business-manager, onlyoffice]
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 15008  # HBONE — ztunnel mesh tunnel (ambient mesh peers)

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-keycloak-metrics
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 15008  # HBONE — ztunnel mesh tunnel (ambient mesh peers)

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-operator-to-keycloak
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: keycloak-operator
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 15008  # HBONE — ztunnel mesh tunnel (ambient mesh peers)

---
# CRITICAL: the keycloak-ns CNPG cluster pods (secforge-keycloak-db-*) live
# in the same namespace and are also covered by default-deny-ingress. Without
# this rule, keycloak pods cannot connect to their own database after any
# pod recycle. The intra-ns egress allow rule lets keycloak SEND traffic;
# this rule lets the DB pod RECEIVE it.
#
# Discovered the hard way on 2026-05-14 when a keycloak STS rollout brought
# the pod into CrashLoopBackOff because the old TCP connection was lost and
# the new pod couldn't establish a fresh one.
#
# The `from` selector uses `app.kubernetes.io/name=keycloak` (operator-set on
# every keycloak-managed pod) rather than `app=keycloak` (which is only on
# the server pod, NOT on realm-import Job pods which use
# app=keycloak-realm-import). Without this, realm-import Jobs never reach
# the DB and the operator burns through backoffLimit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-to-postgres
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: secforge-keycloak-db
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: keycloak
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 15008  # HBONE — ztunnel mesh tunnel (ambient mesh peers)

---
# CNPG operator (in postgres-operator ns) needs reachable to the DB pod for
# reconciliation, health checks, and barman-cloud metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator-to-postgres
  namespace: keycloak
  labels:
    secforge.platform/component: keycloak
    secforge.platform/policy-tier: layer-a
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: secforge-keycloak-db
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [postgres-operator, cnpg-system]
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9187
    - protocol: TCP
      port: 15008  # ambient HBONE (operator ns enrolled, 7c-2)
    - protocol: TCP
      port: 9090

---
# Ingress: Istio ingress gateways (public + tailnet, istio-ingress ns) →
# keycloak:8443. auth.secforge.dev terminates at the gateway and routes here.
# The two-plane gateway migration (2026-06-03, ADR-0032) replaced the old
# ingress-nginx → keycloak:8443 path referenced in this file's header.
# Was live-patched; codified 2026-06-06 to close the rebuild-from-git DR gap.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-ingress-to-keycloak
  namespace: keycloak
  labels:
    secforge.platform/component: istio-gateway
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-ingress
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 15008  # HBONE — ztunnel mesh tunnel (ambient mesh peers)
