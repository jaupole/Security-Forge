# Kustomize overlay for the upstream Keycloak Operator manifest.
#
# Why we need this: the upstream `operator.yaml` ships without a pod or
# container securityContext. The `keycloak` namespace enforces Pod Security
# Standards `restricted`, and Kyverno additionally enforces
# `enforce-pod-security-restricted`. Both reject Pods that don't set:
#   - runAsNonRoot
#   - allowPrivilegeEscalation: false
#   - capabilities.drop: ["ALL"]
#   - seccompProfile
#
# The patch below adds those without modifying upstream image / args /
# probes, so re-syncing operator.yaml from a future Keycloak release
# remains a clean overwrite.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

resources:
  - operator.yaml

patches:
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keycloak-operator
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: keycloak-operator
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 1000
                  capabilities:
                    drop:
                      - ALL
                  seccompProfile:
                    type: RuntimeDefault
                # Quarkus / Vert.x needs a writable /tmp for its
                # file cache. With readOnlyRootFilesystem=true, an
                # emptyDir at /tmp restores writability without
                # giving up the rest of the root FS guarantee.
                volumeMounts:
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: tmp
                emptyDir: {}
