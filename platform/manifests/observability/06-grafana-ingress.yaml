# Grafana ingress + Certificate + scoped allow-from-ingress-nginx NP.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: observability
  labels:
    secforge.platform/component: observability
spec:
  secretName: grafana-tls
  issuerRef:
    name: ${LE_ISSUER}
    kind: ClusterIssuer
  commonName: grafana.${DOMAIN}
  dnsNames:
    - grafana.${DOMAIN}
  duration: 2160h    # 90 days
  renewBefore: 720h  # 30 days

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  labels:
    secforge.platform/component: observability
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Grafana 13 uses WebSockets at /api/live/ws for live updates; long
    # timeouts so ingress-nginx doesn't tear them down.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.${DOMAIN}
      secretName: grafana-tls
  rules:
    - host: grafana.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kps-grafana
                port:
                  number: 80

---
# Allow ingress-nginx to reach Grafana on port 3000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-grafana
  namespace: observability
  labels:
    secforge.platform/component: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
