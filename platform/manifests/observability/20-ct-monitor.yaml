# Certificate Transparency monitor — detective control for threat-model P2/P3
# (DNS-account / ACME compromise → fraudulent cert on *.${DOMAIN}).
#
# A daily CronJob queries crt.sh for every cert ever logged for ${DOMAIN} and
# *.${DOMAIN} and asserts the issuer is Let's Encrypt (our only legitimate CA —
# cert-manager + LE per manifests/cert-manager/03-cluster-issuers.yaml). Any cert
# from a different issuer = someone obtained a cert for our domain we didn't ask
# for → the job exits non-zero, which surfaces as `kube_job_status_failed` and
# fires the `CTMonitorAnomalyOrFailure` alert (09-platform-alerts.yaml) → email.
#
# No secret, no inbound, no cluster-API access. Only new network path is
# egress to the public internet on :443 (crt.sh) — the dedicated egress NP below.
# Alerting reuses kube-state-metrics + the existing Alertmanager email route, so
# the job needs NO egress to Alertmanager.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ct-monitor-script
  namespace: observability
  labels:
    secforge.platform/component: ct-monitor
data:
  ct_monitor.py: |
    #!/usr/bin/env python3
    """Certificate Transparency monitor for the SecForge domain.
    Exit 0 = all logged certs issued by Let's Encrypt.
    Exit 1 = at least one cert from an unexpected issuer (ANOMALY — investigate).
    Exit 2 = could not reach/parse crt.sh (operational failure).
    Both 1 and 2 trip the CTMonitorAnomalyOrFailure alert by design."""
    import json, os, sys, urllib.request

    DOMAIN = os.environ.get("DOMAIN", "secforge.dev")
    # Our only legitimate issuer. crt.sh reports issuer_name like
    # "C=US, O=Let's Encrypt, CN=R11". Substring match on the org is robust to
    # LE rotating its intermediate CNs (R10/R11/E5/E6/...).
    ALLOWED_ISSUER = "Let's Encrypt"
    UA = "secforge-ct-monitor/1.0 (+https://secforge.dev)"

    def fetch(query):
        url = "https://crt.sh/?q={}&output=json&exclude=expired".format(query)
        req = urllib.request.Request(url, headers={"User-Agent": UA})
        with urllib.request.urlopen(req, timeout=45) as r:
            return json.load(r)

    seen, anomalies = 0, []
    for q in ("%25.{}".format(DOMAIN), DOMAIN):   # %25 == urlencoded '%'
        try:
            certs = fetch(q)
        except Exception as e:
            print("ERROR: crt.sh fetch failed for {!r}: {}".format(q, e), file=sys.stderr)
            sys.exit(2)
        for c in certs:
            seen += 1
            issuer = c.get("issuer_name", "") or ""
            if ALLOWED_ISSUER not in issuer:
                anomalies.append({
                    "reason": "unexpected_issuer",
                    "issuer": issuer,
                    "name_value": c.get("name_value"),
                    "crtsh_id": c.get("id"),
                    "not_before": c.get("not_before"),
                })

    if anomalies:
        print("CT ANOMALY: {} cert(s) for {} from a non-Let's-Encrypt issuer "
              "(possible mis-issuance — investigate via https://crt.sh/?q={}):"
              .format(len(anomalies), DOMAIN, DOMAIN), file=sys.stderr)
        for a in anomalies:
            print(json.dumps(a, sort_keys=True), file=sys.stderr)
        sys.exit(1)
    print("ct-monitor OK: checked {} logged cert(s) for {} and *.{} — "
          "all Let's Encrypt-issued.".format(seen, DOMAIN, DOMAIN))
---
# Egress: this pod only — to the public internet on :443 (crt.sh). Excludes the
# k3s pod + service CIDRs so it cannot reach in-cluster services on 443. DNS and
# in-cluster egress are already granted namespace-wide by 11-egress-cluster-internal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ct-monitor-egress-internet-443
  namespace: observability
  labels:
    secforge.platform/component: ct-monitor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ct-monitor
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16     # k3s pod CIDR
              - 10.43.0.0/16     # k3s service CIDR
              - 169.254.0.0/16   # link-local
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ct-monitor
  namespace: observability
  labels:
    secforge.platform/component: ct-monitor
spec:
  schedule: "17 6 * * *"          # daily 06:17
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0             # one shot — a failure is the alert signal
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ct-monitor
            secforge.platform/component: ct-monitor
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ct-monitor
              # mirror.gcr.io/library/* is on the restrict-image-registries
              # allow-list; pin to a digest at deploy (require-image-digest).
              image: mirror.gcr.io/library/python:3.13-slim
              command: ["python3", "/app/ct_monitor.py"]
              env:
                - {name: DOMAIN, value: "${DOMAIN}"}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                - {name: HOME, value: "/tmp"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: "20m", memory: "48Mi"}
                limits: {cpu: "200m", memory: "128Mi"}
              volumeMounts:
                - {name: script, mountPath: /app, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: ct-monitor-script, defaultMode: 0444}
            - name: tmp
              emptyDir: {}
