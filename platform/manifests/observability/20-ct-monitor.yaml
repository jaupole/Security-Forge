# Certificate Transparency monitor — detective control for threat-model P2/P3
# (DNS-account / ACME compromise → fraudulent cert on *.${DOMAIN}).
#
# Twice-daily CronJob: pulls every cert ever logged for ${DOMAIN} (+ subdomains)
# from Certificate Transparency and asserts each was issued by an ALLOWED CA —
# Let's Encrypt (cert-manager, manifests/cert-manager/03-cluster-issuers.yaml) OR
# Cloudflare (auto Universal SSL for the Cloudflare-managed zone; cert-manager uses
# the Cloudflare DNS-01 solver). A cert from any OTHER issuer = possible
# mis-issuance → the job exits 1 → `kube_job_status_failed` → `CTMonitorMisissuance`
# (critical, 09-platform-alerts.yaml) → email.
#
# Source: Cert Spotter (api.certspotter.com — reliable, purpose-built) PRIMARY,
# crt.sh FALLBACK (crt.sh is a single flaky instance that frequently 502s). CT logs
# are HISTORICAL/append-only, so a transient source outage just delays detection to
# the next run — the job exits 0 (logs a WARN), it is NOT an alertable failure.
# `CTMonitorNotRunning` (warning) catches the monitor being broken/unscheduled.
#
# No secret, no inbound, no cluster-API access. Only network path is egress to the
# public internet on :443 (both CT sources) — the dedicated egress NP below.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ct-monitor-script
  namespace: observability
  labels:
    secforge.platform/component: ct-monitor
data:
  ct_monitor.py: |
    #!/usr/bin/env python3
    """Certificate Transparency monitor for the SecForge domain (v2).

    Asserts every logged cert for the domain (+subdomains) was issued by an ALLOWED
    issuer (default: Let's Encrypt + Cloudflare). Primary source Cert Spotter,
    fallback crt.sh. CT is historical, so a transient source outage is NOT a failure.

    Exit 0 = checked OK (all allowed) OR every source unreachable (logged WARN).
    Exit 1 = ANOMALY: a cert from a non-allowed issuer (possible mis-issuance) → page."""
    import json, os, sys, time, urllib.request, urllib.error
    from urllib.parse import urlencode

    DOMAIN = os.environ.get("DOMAIN", "secforge.dev")
    ALLOWED = [s.strip() for s in os.environ.get(
        "ALLOWED_ISSUERS", "Let's Encrypt,Cloudflare").split(",") if s.strip()]
    UA = "secforge-ct-monitor/2.0 (+https://secforge.dev)"
    CERTSPOTTER = "https://api.certspotter.com/v1/issuances"
    CRTSH = "https://crt.sh/"

    def http_json(url, tmo=45, retries=3):
        last = None
        for attempt in range(retries):
            try:
                req = urllib.request.Request(url, headers={"User-Agent": UA})
                with urllib.request.urlopen(req, timeout=tmo) as r:
                    return json.load(r)
            except Exception as e:
                last = e
                if attempt < retries - 1:
                    time.sleep(10 * (attempt + 1))   # 10s, 20s
        raise last

    def from_certspotter():
        # Returns [(issuer_name, dns_names), ...] across all issuances (paginated).
        out, after = [], None
        for _ in range(20):   # safety cap on pages
            # Built explicitly because the API takes repeated 'expand' params
            # (urlencode would collapse them).
            url = (CERTSPOTTER + "?domain=" + DOMAIN +
                   "&include_subdomains=true&expand=issuer&expand=dns_names&limit=100")
            if after:
                url += "&after=" + str(after)
            page = http_json(url)
            if not page:
                break
            for c in page:
                out.append(((c.get("issuer") or {}).get("name", ""), c.get("dns_names")))
            if len(page) < 100:
                break
            after = page[-1].get("id")
            if not after:
                break
        return out

    def from_crtsh():
        url = CRTSH + "?" + urlencode({"q": DOMAIN, "output": "json"})
        return [(c.get("issuer_name", ""), c.get("name_value")) for c in http_json(url)]

    def main():
        certs, src = None, None
        for name, fn in (("certspotter", from_certspotter), ("crt.sh", from_crtsh)):
            try:
                certs, src = fn(), name
                break
            except Exception as e:
                print("WARN: CT source {} unreachable: {}".format(name, e), file=sys.stderr)
        if certs is None:
            # Every source down. CT is historical → next run catches up. Not an anomaly.
            print("WARN: all CT sources unreachable this run — skipping (will retry; "
                  "NOT an anomaly).", file=sys.stderr)
            sys.exit(0)

        anomalies = [{"issuer": iss, "dns_names": names} for iss, names in certs
                     if not any(a in (iss or "") for a in ALLOWED)]
        if anomalies:
            print("CT ANOMALY: {} cert(s) for {} from a NON-ALLOWED issuer (allowed: {}). "
                  "Possible mis-issuance — investigate.".format(
                      len(anomalies), DOMAIN, ALLOWED), file=sys.stderr)
            for a in anomalies:
                print(json.dumps(a, sort_keys=True), file=sys.stderr)
            sys.exit(1)
        print("ct-monitor OK [{}]: {} logged cert(s) for {} (+subdomains) — all from "
              "allowed issuers {}.".format(src, len(certs), DOMAIN, ALLOWED))

    if __name__ == "__main__":
        main()
---
# Egress: this pod only — to the public internet on :443 (Cert Spotter + crt.sh).
# Excludes the k3s pod + service CIDRs so it cannot reach in-cluster services on 443.
# DNS + in-cluster egress are granted namespace-wide by 11-egress-cluster-internal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ct-monitor-egress-internet-443
  namespace: observability
  labels:
    secforge.platform/component: ct-monitor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ct-monitor
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16     # k3s pod CIDR
              - 10.43.0.0/16     # k3s service CIDR
              - 169.254.0.0/16   # link-local
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ct-monitor
  namespace: observability
  labels:
    secforge.platform/component: ct-monitor
spec:
  schedule: "17 6,18 * * *"       # twice daily 06:17 + 18:17 (more coverage; unreachable is non-fatal)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0             # one shot — exit 1 (anomaly) is the alert signal
      activeDeadlineSeconds: 300  # Cert Spotter is fast; the crt.sh fallback retries fit
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ct-monitor
            secforge.platform/component: ct-monitor
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ct-monitor
              # mirror.gcr.io/library/* is on the restrict-image-registries
              # allow-list; pin to a digest at deploy (require-image-digest).
              image: mirror.gcr.io/library/python:3.13-slim
              command: ["python3", "/app/ct_monitor.py"]
              env:
                - {name: DOMAIN, value: "${DOMAIN}"}
                - {name: ALLOWED_ISSUERS, value: "Let's Encrypt,Cloudflare"}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                - {name: HOME, value: "/tmp"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: "20m", memory: "48Mi"}
                limits: {cpu: "200m", memory: "128Mi"}
              volumeMounts:
                - {name: script, mountPath: /app, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: ct-monitor-script, defaultMode: 0444}
            - name: tmp
              emptyDir: {}
