# Allow OTLP ingress (4317/4318) to otel-collector pods from the
# trace-emitting namespaces. Cluster-wide tracing fan-in deliberately
# does NOT use a wildcard — the allow list grows per-component as new
# tracing producers come online.
#
# Producers split by mesh membership (see 07-service-mesh.md
# "Ambient + Kubernetes NetworkPolicy"):
#   - control, member-hub, keycloak: Ambient (so is observability) → traffic
#     arrives over HBONE 15008. They are configured with
#     OTEL_EXPORTER_OTLP_ENDPOINT=…:4318; without 15008 here their traces
#     were silently dropped at this ingress (2026-06-03; keycloak hit the
#     same on its ambient enrollment 2026-07-06 — moved into this rule).
# Not yet added: proposal-forge (no OTEL env / not exporting), spicedb,
# istio-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-ingress-to-otel-collector
  namespace: observability
  labels:
    secforge.platform/component: otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes:
    - Ingress
  ingress:
    # Ambient producers: traffic is tunnelled ztunnel→ztunnel over HBONE
    # (15008). App ports kept for the pre/non-Ambient path.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [control, member-hub, keycloak]
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
        - { protocol: TCP, port: 15008 }   # HBONE — Istio Ambient ztunnel mesh tunnel
