# Alertmanager → email notifications (added 2026-05-30).
#
# Routes all non-Watchdog alerts to the operator's inbox. Wired as a
# namespaced AlertmanagerConfig (no Helm upgrade needed) — picked up
# because the Alertmanager CR has alertmanagerConfigSelector/NamespaceSelector
# = {} (matches all). Catch-all routing requires
# alertmanagerConfigMatcherStrategy.type=None, set in
# platform/values/kube-prometheus-stack.yaml (alertmanagerSpec).
#
# SECRET: the SMTP password is a Resend sending-only API key, stored in
# OpenBao at secret/observability/alertmanager-smtp and rendered into the
# `alertmanager-smtp-resend` Secret by 16-alertmanager-smtp-vso-binding.yaml.
# Migration from the manual Gmail app-password Secret is one-shot via
# 07r-alertmanager-email-resend.sh (2026-07-20). DO NOT apply this file
# before that script has rendered the Secret — a missing authPassword
# Secret invalidates the AlertmanagerConfig and drops email routing.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: secforge-email
  namespace: observability
  labels:
    secforge.platform/component: observability
spec:
  route:
    receiver: email-ops
    groupBy: [alertname, namespace, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h            # was 4h — cut re-nag frequency (2026-05-30 storm)
    routes:
      # Blackhole the ephemeral trivy vulnerability-scan Jobs (2026-06-03,
      # ADR-0033). ClientServer mode eliminated the dominant DB/cache-lock race
      # that flooded the inbox all night, but a residual INTERMITTENT
      # trivy-operator limitation remains: the heaviest multi-image pods (the
      # CNPG DBs, control-billing-usage-sync) collide on the scan Job's shared
      # /tmp and fail on some intervals. That's known-flaky operator churn on
      # stock CNPG/topolvm images — NOT a security event — and it is not
      # values-fixable (no within-Job serialization knob; the shared /tmp exists
      # because the scan containers run readOnlyRootFilesystem:true). The earlier
      # throttle-to-email still flooded because the job_name hash set churns each
      # interval (group membership changes re-notify regardless of repeatInterval).
      # Route to blackhole: stays visible+firing in Alertmanager, just off email.
      # Scoped to trivy-system scan Jobs ONLY — real app-namespace Job failures
      # (control, keycloak, member-hub, …) fall through to the normal email
      # schedule, and a trivy-SERVER outage surfaces as its own StatefulSet alert,
      # not as a scan-Job KubeJobFailed, so server health is NOT silenced.
      - receiver: blackhole
        matchers:
          - name: alertname
            matchType: '='
            value: KubeJobFailed
          - name: namespace
            matchType: '='
            value: trivy-system
          - name: job_name
            matchType: =~
            value: "scan-vulnerabilityreport-.*"
      # Dead-man's-switch + inhibitor are pure signal noise for email.
      - receiver: blackhole
        matchers:
          - name: alertname
            matchType: =~
            value: "Watchdog|InfoInhibitor"
  receivers:
    - name: email-ops
      emailConfigs:
        - to: jaupole@googlemail.com
          # Resend platform sender (same verified secforge.dev domain as
          # Control's noreply@ default; distinct local part so alert mail is
          # filterable). Username is literally `resend`; the password is a
          # dedicated sending-only API key — never Control's platform key.
          from: alerts@secforge.dev
          smarthost: smtp.resend.com:587
          authUsername: resend
          authPassword:
            name: alertmanager-smtp-resend
            key: password
          requireTLS: true
          # firing-only: with sendResolved:true every flap cost a 2nd (RESOLVED)
          # email — the dominant multiplier in the 2026-05-30 storm. Resolutions
          # remain visible in the Alertmanager UI + Grafana Alerting.
          sendResolved: false
    - name: blackhole
