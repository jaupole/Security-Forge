# Alertmanager → email notifications (added 2026-05-30).
#
# Routes all non-Watchdog alerts to the operator's inbox. Wired as a
# namespaced AlertmanagerConfig (no Helm upgrade needed) — picked up
# because the Alertmanager CR has alertmanagerConfigSelector/NamespaceSelector
# = {} (matches all). Catch-all routing requires
# alertmanagerConfigMatcherStrategy.type=None, set in
# platform/values/kube-prometheus-stack.yaml (alertmanagerSpec).
#
# SECRET: the SMTP password (Gmail app password) is NOT in git. It lives in
# the `alertmanager-smtp-gmail` Secret (key: password) in this namespace.
# TODO: migrate it to OpenBao + a VSO binding (see README-alerting.md).
#   Create manually (until VSO):
#     printf '%s' '<app-password>' | kubectl create secret generic \
#       alertmanager-smtp-gmail -n observability \
#       --from-file=password=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: secforge-email
  namespace: observability
  labels:
    secforge.platform/component: observability
spec:
  route:
    receiver: email-ops
    groupBy: [alertname, namespace, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h            # was 4h — cut re-nag frequency (2026-05-30 storm)
    routes:
      # Throttle (NOT blackhole) the ephemeral trivy vulnerability-scan Jobs.
      # They churn by design (scan-vulnerabilityreport-<hash>, 10-22s each); the
      # vendored kps KubeJobFailed rule flaps on them whenever the trivy-operator
      # hiccups. First failure STILL emails; repeats coalesce to ~12h. Scoped to
      # trivy-system scan jobs ONLY — real app-namespace job failures (control,
      # keycloak, member-hub, …) fall through to the normal email schedule.
      - receiver: email-ops
        matchers:
          - name: alertname
            matchType: =
            value: KubeJobFailed
          - name: namespace
            matchType: =
            value: trivy-system
          - name: job_name
            matchType: =~
            value: "scan-vulnerabilityreport-.*"
        groupInterval: 30m
        repeatInterval: 12h
      # Dead-man's-switch + inhibitor are pure signal noise for email.
      - receiver: blackhole
        matchers:
          - name: alertname
            matchType: =~
            value: "Watchdog|InfoInhibitor"
  receivers:
    - name: email-ops
      emailConfigs:
        - to: jaupole@googlemail.com
          from: jaupole@googlemail.com
          smarthost: smtp.gmail.com:587
          authUsername: jaupole@googlemail.com
          authPassword:
            name: alertmanager-smtp-gmail
            key: password
          requireTLS: true
          # firing-only: with sendResolved:true every flap cost a 2nd (RESOLVED)
          # email — the dominant multiplier in the 2026-05-30 storm. Resolutions
          # remain visible in the Alertmanager UI + Grafana Alerting.
          sendResolved: false
    - name: blackhole
