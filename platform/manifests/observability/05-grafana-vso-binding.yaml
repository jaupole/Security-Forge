# VSO binding for Grafana OIDC client_secret.
#
# Renders OpenBao secret/data/grafana/oidc into K8s Secret
# `grafana-oidc-client-secret` in observability ns. The kube-prometheus-stack
# Helm chart's grafana subchart references it via envFromSecret in
# values/kube-prometheus-stack.yaml, mapping to env var
# GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
#
# Per ADR-0015, Grafana is operator-shaped (the chart owns the Deployment),
# so it consumes secrets through VSO rather than the direct-API path.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: vso-consumer-binding
automountServiceAccountToken: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
spec:
  vaultConnectionRef: vault-secrets-operator/openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: grafana-vso
    serviceAccount: grafana-vso
    audiences:
      - https://kubernetes.default.svc.cluster.local

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-oidc-client-secret-vso
  namespace: observability
  labels:
    secforge.platform/component: vault-secrets-operator
    secforge.platform/role: rendered-secret-source
spec:
  vaultAuthRef: grafana-vso
  mount: secret
  type: kv-v2
  path: grafana/oidc
  refreshAfter: 60s
  destination:
    name: grafana-oidc-client-secret
    create: true
    type: Opaque
    # Chart injects via envFromSecret; the env var Grafana reads is
    # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET. Map KV key client_secret →
    # env-var-shaped key.
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          text: '{{ .Secrets.client_secret }}'
