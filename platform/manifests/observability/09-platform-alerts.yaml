# SecForge platform PrometheusRules — early-warning detection.
#
# Each rule fires WELL before the cascade-failure point so we get a chance
# to react. Rules land in the kube-prometheus-stack Prometheus via the
# `release: kps` label selector.
#
# Notification: WIRED to email (2026-05-30). Alertmanager routes all
# non-Watchdog alerts to jaupole@googlemail.com via the namespaced
# AlertmanagerConfig `secforge-email` (see 13-alertmanager-email.yaml).
# Also visible in:
#   - Alertmanager UI:  kubectl -n observability port-forward svc/kps-alertmanager 9093:9093
#   - Grafana → Alerting → Alert rules
# Future: migrate SMTP secret to OpenBao/VSO; add Discord/Wazuh-relay if desired.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secforge-platform-alerts
  namespace: observability
  labels:
    secforge.platform/component: observability
    release: kps
spec:
  groups:
    - name: container-resource-pressure
      interval: 30s
      rules:
        # Fires well BEFORE OOMKill — gives us a chance to bump the limit
        # or investigate a real leak.
        - alert: ContainerMemoryNearLimit
          # Hysteresis (2026-05-30, anti-flap): ARM at >0.85, stay firing until the
          # ratio drops below 0.80 (5-pt deadband). The ALERTS self-reference latches
          # the series in the 0.80–0.85 band so a workload parked near a correctly-
          # sized limit can't oscillate FIRING/RESOLVED. Primary fix is right-sizing;
          # this stops residual boundary flapping without hiding genuine OOM creep.
          expr: |
            (
              (sum by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD"})
               / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory",unit="byte"}))
              > 0.85
            )
            or
            (
              (sum by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD"})
               / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory",unit="byte"}))
              > 0.80
              and on (namespace, pod, container)
              (ALERTS{alertname="ContainerMemoryNearLimit",alertstate="firing"} == 1)
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Container memory >85% of limit ({{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }})"
            description: |
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has held
              >85% of its memory limit for >30m (clears only below 80%). OOM approaches unless the limit is
              raised or the workload changes. Backstops: ContainerMemoryAtLimit (>0.95) + ContainerOOMKilled.
              Current value: {{ $value | humanizePercentage }}

        - alert: ContainerMemoryAtLimit
          expr: |
            (sum by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD"})
             / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory",unit="byte"}))
            > 0.95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Container at memory limit ({{ $labels.namespace }}/{{ $labels.pod }})"
            description: |
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is at
              >95% of its memory limit. OOMKill imminent.

    - name: container-stability
      interval: 30s
      rules:
        # Catches the spire-csi-driver scenario at restart 3-4 instead of 23.
        - alert: ContainerRestartingTooOften
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Container restarting frequently ({{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }})"
            description: |
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has
              restarted {{ $value }} times in the last 15 minutes. Investigate before it becomes a
              cascade failure.

        - alert: ContainerOOMKilled
          # Fire ONCE per real OOM and auto-resolve (2026-05-30, anti-flap). The bare
          # last_terminated_reason==1 latches for the pod's WHOLE life after a single
          # OOM, so it re-nagged until rollout. Gating on the terminated TIMESTAMP
          # (<15m ago) fires for any recent OOM — including a one-shot OOM on a
          # restartPolicy:Never pod (scan jobs) — and clears ~15m later. NB: a
          # changes(restarts_total) gate would MISS those single-shot OOMs (no
          # restart), so the timestamp is the non-masking choice.
          expr: |
            (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
            and on (namespace, pod, container)
            ((time() - kube_pod_container_status_last_terminated_timestamp) < 900)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Container OOMKilled ({{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }})"
            description: |
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was
              OOMKilled in the last 15m. Raise the memory limit, or fix the leak if it recurs.

        - alert: PodCrashLoopBackOff
          expr: |
            max by (namespace, pod) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod in CrashLoopBackOff ({{ $labels.namespace }}/{{ $labels.pod }})"

    - name: node-resource-health
      interval: 60s
      rules:
        # Kernel mount table saturation — direct read from /proc/sys/fs/mount-max.
        # Exposed via node-exporter textfile collector by /usr/local/sbin/mount-count-exporter.sh
        # (cron every 60s → /var/lib/node_exporter/textfile_collector/mount_count.prom).
        # At 60% of 1M = 600,000 mounts, fire warning. fs.mount-max exhaustion at 100k
        # brought down SPIFFE CSI driver and cascaded to Keycloak (2026-05-09 incident).
        - alert: NodeMountTableSaturation
          expr: |
            node_mount_count / node_mount_max_limit > 0.60
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Kernel mount table >60% full ({{ $value | humanizePercentage }})"
            description: |
              The kernel mount table on {{ $labels.instance }} is {{ $value | humanizePercentage }} full.
              At 100%, the SPIFFE CSI driver will fail with ENOSPC, causing stuck-terminating pods.
              Current count: {{ with printf "node_mount_count{instance='%s'}" $labels.instance | query }}{{ . | first | value | humanize }}{{ end }} /
              Limit: {{ with printf "node_mount_max_limit{instance='%s'}" $labels.instance | query }}{{ . | first | value | humanize }}{{ end }}.
              Check for leaked tmpfs mounts: wc -l /proc/mounts | sort -rn | head -20

        - alert: NodeMountTableCritical
          expr: |
            node_mount_count / node_mount_max_limit > 0.85
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Kernel mount table >85% full — SPIFFE CSI failure imminent"
            description: |
              Mount table is critically full. SPIFFE CSI driver will crash imminently.
              Immediate action: sysctl -w fs.mount-max=1048576 if not already at 1M.
              Then investigate leaked mounts via: awk '{print $3}' /proc/mounts | sort | uniq -c | sort -rn

        - alert: NodeMemoryHigh
          expr: |
            (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node memory >85% used"

        # Two-tier disk-space alerting (added 2026-06-09; backlog #87).
        # Covers /, /var/lib/rancher, MinIO/Wazuh dedicated partitions.
        # Warn at 25% free (75% full) → time to investigate before the cron fires.
        # Critical at 15% free (85% full) → act now; root/rancher at this level
        # degrades k3s scheduling and Velero backups within minutes.
        - alert: NodeDiskSpaceWarn
          expr: |
            (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
             / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Filesystem <25% free ({{ $labels.mountpoint }})"
            description: |
              {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} free
              (>75% used). Root cause candidates: CI runner _work/caches (runner-cleanup cron),
              containerd stale images (crictl rmi --prune), Docker volumes (docker volume prune -f).
              Check: df -h / /var/lib/rancher /var/lib/docker

        - alert: NodeDiskSpaceCritical
          expr: |
            (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
             / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Filesystem <15% free — act now ({{ $labels.mountpoint }})"
            description: |
              {{ $labels.mountpoint }} on {{ $labels.instance }} has <15% free space. At this level,
              k3s pod scheduling and Velero backups degrade rapidly. Immediate action:
                docker volume prune -f && crictl rmi --prune
                bash ~/secforge/platform/scripts/runner-cleanup.sh
              Then investigate root cause (see NodeDiskSpaceWarn description).

    - name: platform-services
      interval: 60s
      rules:
        # Specifically watch SPIFFE CSI driver since it was the culprit.
        - alert: SpiffeCsiDriverNotReady
          expr: |
            sum(kube_pod_container_status_ready{namespace="spire",container="spiffe-csi-driver"}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SPIFFE CSI driver pod not ready"
            description: |
              spire-spiffe-csi-driver is not ready. Pods needing SVIDs cannot mount the
              spiffe-workload-api volume. Cascading failures expected if this persists.

        - alert: KeycloakDown
          expr: |
            sum(kube_pod_container_status_ready{namespace="keycloak",container="keycloak"}) == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Keycloak not ready"
            description: |
              Keycloak pod is not ready. ALL OIDC logins (OpenBao, Grafana, Wazuh) are
              broken until this recovers.

        - alert: OpenBaoDown
          expr: |
            sum(kube_pod_container_status_ready{namespace="openbao",pod=~"openbao-[0-9]+",container="openbao"}) < 1
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "All OpenBao replicas down"
            description: |
              No OpenBao replica is ready. Secret access and platform identity are
              broken until at least one replica recovers.

    # ─── Backups (added 2026-05-30; needs ServiceMonitor velero) ──────────
    # So the 2026-05-28 SSE-rotation backup outage (stale BackupRepository CRs
    # → "repository not initialized") can never silently recur again.
    - name: secforge-backups
      interval: 30s
      rules:
        - alert: VeleroBackupFailed
          # velero_backup_last_status is 1=success, 0=FAILURE (per its own HELP text).
          # The original expr `!= 0` was INVERTED — it matched success (=1), so it
          # nagged non-stop on HEALTHY backups and could never clear (this was a real
          # contributor to the 2026-05-30 alert storm). Correct semantics: fire on ==0.
          # NB: velero reports PartiallyFailed as last_status=1 ("it ran"), so partial
          # failures are caught by VeleroBackupPartial (below) + VeleroBackupTooOld
          # (no success in 26h), NOT by this hard-failure rule.
          expr: min by (schedule) (velero_backup_last_status{schedule!=""}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Velero schedule {{ $labels.schedule }} last backup hard-FAILED (status=0)"
            description: |
              The most recent backup for this schedule hard-failed (velero_backup_last_status==0)
              — data is not protected. Check BackupRepository CRs
              (kubectl -n velero get backuprepositories) and node-agent logs for
              'repository not initialized' / data-path errors.
        - alert: VeleroBackupPartial
          # PartiallyFailed reports last_status=1, so VeleroBackupFailed can't see it.
          # Edge-triggered off the partial-failure counter; auto-resolves ~90m after
          # the last partial. Catches "some PodVolumeBackups failed" promptly.
          expr: max by (schedule) (increase(velero_backup_partial_failure_total{schedule!=""}[90m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero schedule {{ $labels.schedule }} had a PARTIAL backup failure"
            description: |
              A backup for this schedule partially failed in the last ~90m (one or more
              PodVolumeBackups failed). Inspect: kubectl -n velero get podvolumebackups
              -l velero.io/backup-name=<latest> | grep -vi Completed.
        # Cadence-aware. A single flat 26h threshold fired ~6 of every 7 days for
        # the WEEKLY schedule by design (weekly-platform, cron '0 3 * * 0'): a
        # weekly backup is legitimately up to 168h old between runs. Split by
        # cadence. The daily rule is ALSO the fail-CLOSED default — any non-weekly
        # or future/unknown schedule is held to >27h, so a new schedule can never
        # go silently un-alerted. VeleroBackupFailed/Partial only catch a backup
        # that RAN-and-failed; a fully SKIPPED run is caught only here, hence the
        # weekly bound is one cadence + slack (7d12h), not a loose multi-day window.
        - alert: VeleroBackupTooOld
          expr: (time() - max by (schedule) (velero_backup_last_successful_timestamp{schedule!="",schedule!~".*weekly.*"})) > 97200
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "No successful Velero backup for {{ $labels.schedule }} in >27h"
        - alert: VeleroBackupTooOld
          expr: (time() - max by (schedule) (velero_backup_last_successful_timestamp{schedule=~".*weekly.*"})) > 648000
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "No successful Velero backup for weekly schedule {{ $labels.schedule }} in >7.5d (cadence 7d)"
        - alert: VeleroMetricsDown
          expr: absent(velero_backup_last_status)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Velero metrics not scraping (ServiceMonitor velero may be broken)"

    # ─── Certificates (added 2026-05-30; needs ServiceMonitor cert-manager) ─
    - name: secforge-certs
      interval: 60s
      rules:
        - alert: CertExpiringSoon
          expr: (min by (name, namespace) (certmanager_certificate_expiration_timestamp_seconds) - time()) < 1209600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <14d"
        - alert: CertNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} not Ready"

    # ─── Image trust (added 2026-05-30; needs ServiceMonitor kyverno) ─────
    # Closes the blind spot behind the 2026-05-30 deploy-block: the ghcr-pull
    # PAT (used by Kyverno to pull + verify cosign signatures) expired and
    # every deploy was DENIED at admission with no alert. Now we see it.
    # Scoped to ENFORCE mode only — the Audit `verify-image-signature-vendors`
    # policy records benign fails for non-matching vendor images by design.
    - name: secforge-image-trust
      interval: 30s
      rules:
        - alert: ImageSignatureVerificationFailing
          expr: |
            sum by (policy_name) (
              increase(kyverno_policy_results_total{
                policy_name=~"verify-image-signature.*",
                rule_result="fail",
                policy_validation_mode="enforce"}[15m])
            ) > 1.5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Image signature verification FAILING for {{ $labels.policy_name }} (enforce)"
            description: |
              Kyverno ENFORCE policy {{ $labels.policy_name }} recorded {{ $value }} cosign
              verification FAILURE(s) in the last 15m.
              Threshold >1.5 (2026-07-18): a single isolated verify blip (transient ghcr
              signature fetch on Kyverno 1h cache refresh; the Job/Pod controller retry
              self-heals it) no longer pages. >=2 failures in 15m still pages -- a real
              incident (unsigned image, expired ghcr-pull PAT) fails repeatedly.
              FAILURE SEMANTICS DIFFER BY POLICY (as of 2026-07-06, backlog #97):
                - verify-image-signature-secforge: failurePolicy=Fail (FAIL-CLOSED). A verify
                  failure DENIES the pod — deploys ARE blocked. Under fail-closed, a sustained
                  firing is page-worthy. Break-glass to flip back to Ignore:
                  docs/03-runbooks/kyverno-signature-fail-closed.md.
                - verify-image-signature-vendors: failurePolicy=Ignore (report-only) — a failure
                  admits the pod UNVERIFIED; enforcement was merely bypassed.
              Trust material is pinned OFFLINE (Fulcio root + Rekor/CT-log pubkeys), so a verify
              failure is NOT a Sigstore/TUF-latency timeout anymore. Likely causes now:
                1. EXPECTED test noise — the guardrail-selftest CronJob and any deliberate
                   unsigned/tampered-image test increment this counter; it self-clears in ~15m.
                2. ghcr signature-pull auth (401/403): the ghcr-pull PAT expired. The pull cred is
                   OpenBao secret/data/{control,member-hub}/ghcr-pull, VSO-rendered to
                   ghcr-pull-secret in each ns. Rotate the PAT in OpenBao, then RE-CREATE the
                   VaultStaticSecret CRs (force-sync is INEFFECTIVE for the #77 VSO-wedge — a
                   VSO roll / OpenBao restart wedges some VSS in SecretSynced=False; delete+apply
                   the CR fixes it, synced in ~5s):
                     for ns in control keycloak kyverno member-hub proposal-forge; do
                       f=$(grep -rl "name: ghcr-pull-secret" /home/ops/secforge/platform/manifests/$ns/ \
                             | xargs grep -l VaultStaticSecret | head -1)
                       kubectl delete vaultstaticsecret -n $ns ghcr-pull-secret
                       bash /home/ops/secforge/platform/lib/apply-manifest.sh "$f"
                     done
                3. A genuinely unsigned/tampered image was pushed, or the cosign subject/issuer
                   identity regex drifted out of sync with the signing workflow.
        # Scrape-gap guard so image-trust monitoring can't silently go blind
        # the way velero/cert-manager metrics did before their ServiceMonitors.
        - alert: KyvernoMetricsDown
          expr: absent(kyverno_policy_results_total)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Kyverno metrics not scraping (ServiceMonitor kyverno may be broken)"
            description: |
              kyverno_policy_results_total has been absent for 30m. Image-signature
              verification alerts are blind. Check the kyverno ServiceMonitor and the
              allow-prometheus-to-kyverno-metrics NetworkPolicy.
    - name: security-detective-controls
      interval: 1h
      rules:
        # CT-log monitor (manifests/observability/20-ct-monitor.yaml). It exits 1 ONLY
        # when a cert for secforge.dev is logged from a NON-ALLOWED issuer (allowed =
        # Let's Encrypt + Cloudflare). Source outages exit 0 (CT is historical), so this
        # alert is accurate — a failed ct-monitor job means a real possible mis-issuance.
        # Current-state (not max_over_time[26h]) so the alert CLEARS as soon as the
        # failed job is deleted/rotated — a stale failure wouldn't keep paging for 26h.
        # A real mis-issuance is persistent (the bad cert stays in CT → every run fails
        # → a failed job always exists), so nothing is missed.
        - alert: CTMonitorMisissuance
          expr: kube_job_status_failed{namespace="observability", job_name=~"ct-monitor.*"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CT monitor found a cert for secforge.dev from a NON-ALLOWED issuer"
            description: |
              The ct-monitor CronJob FAILED — it found a certificate for secforge.dev (or a
              subdomain) issued by a CA outside the allowed set (Let's Encrypt + Cloudflare).
              Possible mis-issuance / DNS-account or ACME compromise (threat-model P2/P3).
              Investigate NOW (the log lists the issuer + dns_names):
                kubectl -n observability logs job/<latest ct-monitor job>
                https://api.certspotter.com/v1/issuances?domain=secforge.dev&include_subdomains=true&expand=issuer
              NOTE: a transient CT-source outage is NOT this alert — the monitor exits 0 on
              unreachable (CT logs are historical; the next run catches up).
        # Liveness: the monitor going dark (broken/stuck/unscheduled) — NOT a source
        # outage (those exit 0, so last_successful_time keeps advancing). Fires only if
        # no ct-monitor job has completed in >2 days (schedule is twice daily).
        - alert: CTMonitorNotRunning
          expr: (time() - max(kube_cronjob_status_last_successful_time{namespace="observability", cronjob="ct-monitor"})) > 172800
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CT monitor has not completed successfully in >2 days"
            description: |
              No ct-monitor job has completed in >2 days — the monitor may be broken, stuck, or
              unscheduled (this is NOT a transient CT-source outage; those exit 0). Cert
              mis-issuance monitoring is degraded. Check:
                kubectl -n observability get cronjob,jobs -l secforge.platform/component=ct-monitor

    # ─── Platform audit anchoring (operator-backlog #85 / threat-model X-R1) ──
    # Tamper-evidence for the OpenBao audit log. The anchor (daily) hash-chains +
    # Transit-signs the audit-log byte stream off-node; the verifier (hourly)
    # re-reads the anchored ranges from the local file and fails the Job on any
    # mismatch. Both are in the openbao ns (12/13-platform-audit-*.yaml).
    # NB: exprs are current-state (kube_job_status_failed > 0), NOT
    # max_over_time[..h] — the latter keeps firing for the whole window even after a
    # failed (e.g. test) job is deleted/resolved. Current-state clears the moment no
    # failed job exists; a real failure persists (failedJobsHistoryLimit) until the
    # operator deletes the resolved job to acknowledge.
    - name: platform-audit-anchoring
      interval: 1m
      rules:
        # Verifier non-zero exit = an anchored byte range no longer matches the
        # local audit log (rewrite/truncation), OR an operational failure. Either
        # is high-signal — treat as critical and inspect the job log to classify.
        - alert: PlatformAuditVerifierFailing
          expr: kube_job_status_failed{namespace="openbao", job_name=~"platform-audit-verifier.*"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OpenBao audit-log tamper check FAILED (platform-audit-verifier)"
            description: |
              The platform-audit-verifier CronJob exited non-zero. A "TAMPER:" log line means
              an anchored byte range of /openbao/audit/audit.log no longer matches the signed
              off-node anchor (jaupole/secforge-audit-anchors, platform/openbao/) — the OpenBao
              audit log was rewritten or truncated. Any other non-zero exit is operational
              (raw.githubusercontent unreachable, chain-integrity error). CLASSIFY via:
                kubectl -n openbao logs job/<latest platform-audit-verifier job>
              On confirmed tamper, treat as an active node compromise (threat-model X-R1/P1).
        # Anchor failing for >26h means the audit log is no longer being committed
        # off-node — tamper-evidence is degrading. Warning (next run self-heals;
        # the chain is gapless via byte offset), escalate if it persists.
        - alert: PlatformAuditAnchorFailing
          expr: kube_job_status_failed{namespace="openbao", job_name=~"platform-audit-anchor.*"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenBao audit-log anchor failed to run (platform-audit-anchor)"
            description: |
              The daily platform-audit-anchor CronJob exited non-zero — the OpenBao audit log
              has not been signed + committed off-node this cycle. Tamper-evidence is degrading
              until it succeeds. Inspect: kubectl -n openbao logs job/<latest platform-audit-anchor job>.
              Common causes: OpenBao login/sign failure, GitHub PAT expired
              (secret/platform/audit-anchors-push-token), or the file audit device disabled.
        # The file audit device is fail-CLOSED: if its dedicated PVC fills, OpenBao
        # REJECTS requests. Warn early (75%), page before the wall (90%).
        - alert: OpenBaoAuditVolumeFilling
          expr: |
            max by (persistentvolumeclaim) (
              kubelet_volume_stats_used_bytes{namespace="openbao", persistentvolumeclaim=~"audit-openbao-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace="openbao", persistentvolumeclaim=~"audit-openbao-.*"}
            ) > 0.75
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "OpenBao audit PVC {{ $labels.persistentvolumeclaim }} >75% full"
            description: |
              The dedicated OpenBao audit volume is >75% full. The `file` audit device fails
              CLOSED — if this PVC reaches 100%, OpenBao REJECTS all requests. Rotate the audit
              log (see the platform-audit-anchor rotation runbook) or grow the PVC well before then.
        - alert: OpenBaoAuditVolumeCritical
          expr: |
            max by (persistentvolumeclaim) (
              kubelet_volume_stats_used_bytes{namespace="openbao", persistentvolumeclaim=~"audit-openbao-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace="openbao", persistentvolumeclaim=~"audit-openbao-.*"}
            ) > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OpenBao audit PVC {{ $labels.persistentvolumeclaim }} >90% full — OpenBao will reject requests at 100%"
            description: |
              The OpenBao audit volume is critically full. The file audit device fails CLOSED;
              at 100% OpenBao stops serving (secret access + platform identity break). Act now:
              rotate/truncate the anchored audit log or expand the PVC.

    # ─── Loki log-sink anchoring (operator-backlog #85 Phase 2 / X-R1) ────────
    # Tamper-evidence for the platform's OTHER security-critical audit streams
    # (keycloak/spicedb/kyverno/spire/... → Loki). The anchor (daily) content-set-
    # hashes + Transit-signs each settled window off-node; the verifier (daily)
    # re-queries the last few in-retention windows and fails on any mismatch. Both
    # in the observability ns (manifests/observability/21/22).
    - name: platform-loki-audit-anchoring
      interval: 1m
      rules:
        # Verifier non-zero exit = a within-retention Loki window's content no longer
        # matches its signed off-node anchor (rewrite in MinIO), OR an operational
        # failure. High-signal — classify via the job log (TAMPER: vs other).
        - alert: PlatformLokiVerifierFailing
          expr: kube_job_status_failed{namespace="observability", job_name=~"platform-loki-audit-verifier.*"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Loki log-sink tamper check FAILED (platform-loki-audit-verifier)"
            description: |
              The platform-loki-audit-verifier CronJob exited non-zero. A "TAMPER:" log line means a
              still-in-retention Loki window no longer matches the signed anchor in
              jaupole/secforge-audit-anchors (platform/loki/<ns>/) — security-critical logs were rewritten.
              A non-TAMPER non-zero is operational (Loki/raw.githubusercontent unreachable) OR a benign
              late-arrival drift (rare; a >48h-late log replay). CLASSIFY via:
                kubectl -n observability logs job/<latest platform-loki-audit-verifier job>
              On confirmed tamper, treat as an active node compromise (threat-model X-R1/P1).
        - alert: PlatformLokiAnchorFailing
          expr: kube_job_status_failed{namespace="observability", job_name=~"platform-loki-audit-anchor.*"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Loki log-sink anchor failed to run (platform-loki-audit-anchor)"
            description: |
              The daily platform-loki-audit-anchor CronJob exited non-zero — one or more namespaces'
              settled Loki windows were not signed + committed off-node this cycle. Tamper-evidence is
              degrading until it succeeds. Inspect: kubectl -n observability logs job/<latest job>.
              Common causes: Loki query failure, OpenBao login/sign failure, or GitHub PAT expired
              (secret/platform/audit-anchors-push-token).
    - name: secforge-drift
      rules:
        # Fed by the k8s-drift-check host timer (platform/host/drift-check/,
        # daily 05:41 UTC) via the node-exporter textfile collector. This is
        # the merge-without-apply detector — the 2026-07-05 infra sweep found
        # five findings in this class (see operator-backlog #99 item 4).
        - alert: SecforgeManifestDrift
          expr: secforge_manifest_drift_files > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} repo manifest(s) differ from the live cluster (merge-without-apply drift)"
            description: |
              The daily k8s-drift-check found manifests under platform/manifests/ whose rendered
              content does not match the live cluster — a merged commit was never applied, or a
              live object was hand-edited. Per-file diffs:
                journalctl -u k8s-drift-check --since "-24h"
              Reconcile via the deploy path (apply-manifest.sh from /home/ops/secforge), or codify
              the live state back into the repo. Do NOT blind-apply DB-touching manifests — CNPG
              Cluster spec changes can roll single-instance databases (backlog #99 item 1 history).
        - alert: SecforgeHelmValuesDrift
          expr: secforge_helm_values_drift_releases > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} helm release(s) run values that differ from the repo values file"
            description: |
              helm get values != rendered platform/values/<file> for one or more pinned releases —
              a values change was merged but never `helm upgrade`d (the debug-1 failure mode:
              VSO/trust-manager digest pins sat unapplied for a day). Identify via
              journalctl -u k8s-drift-check, then roll with platform/lib/install-helm.sh using the
              owning component script's exact arguments.
        - alert: SecforgeDriftCheckStale
          expr: time() - secforge_drift_check_last_run_timestamp_seconds > 172800
          labels:
            severity: warning
          annotations:
            summary: "k8s-drift-check has not completed in >48h"
            description: |
              The drift detector itself is not running (timer disabled, script erroring, or
              node-exporter textfile collector broken). Silence from it is NOT "no drift".
              Check: systemctl status k8s-drift-check.timer && journalctl -u k8s-drift-check.
