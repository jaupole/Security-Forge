# Loki ruler alert rules — log-derived alerts that have no metric to key on.
#
# Delivery path: Loki ruler → kps Alertmanager (v2 API) → email-ops receiver
# (13-alertmanager-email.yaml). The loki chart's rules sidecar watches for
# ConfigMaps labelled `loki_rule` in this namespace and mounts each data key
# as a rule file under /rules/fake ("fake" = the single-tenant id when
# auth_enabled=false); ruler storage is configured in values/loki.yaml.
#
# Added 2026-07-20 per RCA-sso-switcher §6.1: the 2026-07-15 authz outage
# (102 AuthzUnavailableError in 3 min) was invisible until a user hit it.
# With ecosystem-authz 0.1.2's 5s backoff cap, any recurrence of the network
# trigger shows up as a short burst — this alert is what makes it visible.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-ruler-alerts
  namespace: observability
  labels:
    loki_rule: "true"
    secforge.platform/component: observability
data:
  secforge-log-alerts.yaml: |
    groups:
      - name: secforge.logs.authz
        rules:
          - alert: AuthzUnavailableBurst
            # Any occurrence alerts: 21 days of logs showed zero hits outside
            # the incident window, so >0 is signal, not noise. No `for:` —
            # post-fix bursts self-heal in seconds and must still notify.
            expr: |
              sum by (namespace) (
                count_over_time(
                  {namespace=~"control|member-hub|proposal-forge|project-manager|business-manager"}
                    |= "AuthzUnavailableError" [5m]
                )
              ) > 0
            labels:
              severity: critical
              component: authz
            annotations:
              summary: "AuthzUnavailableError burst in {{ $labels.namespace }} ({{ $value }} hits / 5m)"
              description: "SpiceDB was unreachable from {{ $labels.namespace }} — authz is fail-closed, so affected requests 500. Short burst = transient network reset (see RCA-sso-switcher 2026-07-15); sustained = SpiceDB or NetworkPolicy outage. Runbook: alerts.md#authzunavailableburst"
      - name: secforge.logs.audit
        rules:
          - alert: AuditChainBroken
            # Each app verifies its tamper-evident audit log once a day and
            # logs this marker only when a hash chain does not verify. Any
            # occurrence alerts; the app repeats it daily until a person has
            # looked, so the alert re-fires daily rather than staying open.
            expr: |
              sum by (namespace) (
                count_over_time(
                  {namespace=~"control|proposal-forge|project-manager|business-manager"}
                    |= "AUDIT_CHAIN_BROKEN" [15m]
                )
              ) > 0
            labels:
              severity: critical
              component: audit
            annotations:
              summary: "Audit log hash chain does not verify in {{ $labels.namespace }}"
              description: "An audit row in {{ $labels.namespace }} was changed or removed outside the retention purge. Nothing is repaired or blocked automatically. Treat as a possible tampering incident until explained. Runbook: alerts.md#auditchainbroken"
      - name: secforge.logs.documents
        rules:
          - alert: ProposalDocumentSaveFailing
            # Proposal Forge's document is the ONLY place a proposal's text
            # lives (one-place model, 2026-10-07), so a save that does not
            # land in the app is lost text. The app logs this marker on every
            # failure path: the Document Server reporting a save error, a
            # callback whose signature PF rejects (shared-secret drift), and a
            # PF-side download/store failure (SSRF lock, MinIO). Zero-baseline
            # by design; any occurrence alerts. The 2026-07..10 callback bug
            # (every editor save rejected 400) would have fired this within a
            # minute instead of going unnoticed for three months.
            expr: |
              sum by (namespace) (
                count_over_time(
                  {namespace="proposal-forge"} |= "DOCUMENT_SAVE_FAILED" [10m]
                )
              ) > 0
            labels:
              severity: critical
              component: document-engine
            annotations:
              summary: "Proposal Forge document saves are failing ({{ $value }} in 10m)"
              description: "An editor save did not land in Proposal Forge — with the document as the single source of the proposal's text, each one is lost work until fixed. The Document step shows the affected proposal a save-error banner; the editor keeps its own copy until the next successful save. Runbook: alerts.md#proposaldocumentsavefailing"
